{{template "head" (dict "Lang" .Lang "Title" .Title "Frame" .Frame)}}
  <h1>{{.Connection.Username}}</h1>
  {{template "offlineNote" .OutNote}}
  {{template "facts" .Facts}}
  <h2>{{t "outside.onbox"}}</h2>
  <p class="hint">{{t "outside.onbox.hint"}}</p>
  <ul class="calsum">
    {{range .Calendars}}<li><b>{{.Name}}</b><small>{{.Line}}</small></li>
    {{end}}
  </ul>
{{template "foot"}}
