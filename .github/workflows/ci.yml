name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        env:
          # A missing container runtime fails the Radicale tests instead of skipping them.
          HEJMO_REQUIRE_RADICALE: "1"
          # The service worker is tested with node's test runner (web/test).
          HEJMO_REQUIRE_NODE: "1"
        run: go test -race -count=1 ./...

  container:
    name: Container (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Acceptance (Platform): docker compose up -> web UI reachable within 60 s.
      - name: Start box with Docker Compose
        run: |
          start=$(date +%s)
          docker compose up -d --build --wait --wait-timeout 60
          curl -fsS http://localhost/healthz
          curl -fsS -o /dev/null -w "setup page: %{http_code}\n" -L http://localhost/
          echo "ready after $(( $(date +%s) - start ))s (including image build)"
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  resources:
    name: Resources (arm64)
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build image
        run: docker build -t hejmo:measure .
      # ADR 0018: memory, CPU and start time in a container limited like a
      # Raspberry Pi (1 CPU, 1 GB) with a seeded example household; fails above
      # ci/resource-thresholds.json.
      - name: Measure
        run: go run ./cmd/hejmo-measure -image hejmo:measure -report "$RUNNER_TEMP/resources.md" -json "$RUNNER_TEMP/resources.json"
      - name: Report
        if: always()
        run: test ! -f "$RUNNER_TEMP/resources.md" || cat "$RUNNER_TEMP/resources.md" >> "$GITHUB_STEP_SUMMARY"

  # Acceptance (ticket #100): on a Raspberry Pi OS 64-bit stand-in (Debian
  # bookworm arm64 with Raspberry Pi's archive, systemd as PID 1) the install
  # command makes the setup wizard reachable, and running it again changes
  # nothing. Containers only; see .github/install-test/run.sh.
  install:
    name: Install script (Raspberry Pi OS 64-bit stand-in)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh .github/install-test/run.sh
      - name: Install on the stand-in, twice
        run: ./.github/install-test/run.sh

  # Security checks (ADR 0018, Measurement). Tools run in CI only; none is part of the binary.
  # Thresholds: govulncheck fails on any vulnerability the code calls; gosec fails on
  # findings of high severity; Trivy fails on fixable HIGH or CRITICAL findings in the image.
  # Medium and low gosec findings are triaged in docs/security/threat-model.md; the gosec job
  # prints the medium ones in a non-failing step so reviewers see them.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities in called dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gosec:
    name: gosec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Static analysis, high severity fails
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -severity high ./...
      - name: Medium findings for reviewers (never fails)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -severity medium -no-fail ./...

  image-scan:
    name: Container image scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hejmo:scan .
      - name: Trivy scan, fixable HIGH and CRITICAL fail
        # Pinned to the commit of v0.36.0.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: hejmo:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          fail=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c has no Signed-off-by line (use git commit -s)"
              fail=1
            fi
          done
          exit $fail
