{{template "head" (dict "Lang" .Lang "Title" (t "display.pair.title"))}}
  <div class="display pairing" data-display data-state="pairing" data-code="{{.Code}}" data-poll-seconds="{{.PollSeconds}}" data-pair-url="{{.PairURL}}">
    <h1>{{t "display.pair.title"}}</h1>
    <div class="qr">{{.QR}}</div>
    <p class="lead">{{t "display.pair.scan"}}</p>
    <p class="lead">{{t "display.pair.or"}}</p>
    <p class="pairing-code" data-pairing-code="{{.Code}}">{{.Code}}</p>
  </div>
  <script src="/static/display.js" defer></script>
{{template "foot"}}
