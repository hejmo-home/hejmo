openapi: 3.0.3
info:
  title: Hejmo box API
  version: 0.5.0
  description: |
    The REST API is the single interface for the web UI, displays, personal devices and
    integrations. Authenticate with a bearer token (`Authorization: Bearer hejmo_…`)
    or a browser session. A token acts on behalf of a person and is limited by
    its scopes: `read`, `write`, `<resource>` or `<resource>:<action>`
    (resources: people, events, calendars, tasks, lists, meals, displays, settings, tokens, health, contacts, numbers;
    actions: read, write, delete, complete). The resource `numbers` is the children's page of important numbers; children read it
    (`read` and `numbers:read` include it). The resource `health` (diet and
    allergies) is reached only by its own scope: `read` and `write` never include it.
    The address book (`contacts`) is for parents only: a child's session gets 403 even to read it.

    The scopes `calendars` and `tasks` are for a personal device's calendar and
    reminders apps: they open the box's CalDAV server at `/dav/` (HTTP Basic
    with the person's username and the token as password, HTTPS only) and
    nothing in this REST API. `calendars` opens the calendars (VEVENT),
    `tasks` one task list per person (VTODO); a device token holds both. A
    task list shows a once task as it is and a repeating task as today's
    occurrence. Clients may change a task's title, notes, the day of a once
    task and its completion (which credits or deducts its stars once);
    creating and deleting tasks from a client is refused with 403. Create
    one token per device and revoke it on its own.

    The box also speaks MCP (Model Context Protocol, streamable HTTP, stateless)
    at `/mcp`, for AI assistants (ADR 0018). It is off by default (`GET` and `PUT`
    `/mcp` below), served over HTTPS only, and takes only a bearer token that was
    created for MCP (`POST /mcp/tokens`). Its tools are the functions of this API
    for events, lists, tasks (with routines, templates and stars) and the meal
    plan, except managing calendars (`POST /calendars`, `PATCH` and `DELETE`
    `/calendars/{id}`, `POST /calendars/{id}/sync` are no tools), run as the parent who made the token and with the token's scopes;
    tools the scopes do not allow are not offered. Tokens, settings, people,
    displays and personal devices are never tools. A token made for MCP works there only:
    this REST API and CalDAV refuse it, and MCP refuses every other token.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in person
      responses:
        "200":
          description: Current person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/recovery-codes:
    post:
      operationId: createRecoveryCodes
      summary: Create a new set of 10 recovery codes for the caller (parents only, scope people:write)
      description: |
        A recovery code replaces the one-time code at sign-in, never the
        password, and is valid once. The new set voids the old one. The codes
        are returned once and stored only as Argon2id hashes.
        Refused with 403 while the caller's new one-time codes are not yet
        confirmed (after a reset).
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes:
                    type: array
                    items: { type: string, example: K7QD2-M9XPA }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/recovery-codes/saved:
    post:
      operationId: confirmRecoveryCodesSaved
      summary: Say that the caller saved their current recovery codes (parents only, scope people:write)
      description: |
        The web page asks for a tick before it continues ("I have saved my
        recovery codes"); this is the same confirmation for API clients. The
        box cannot know how the codes were kept and does not ask. Send it only
        once the codes of the last `POST /me/recovery-codes` are saved: the web
        page "My account" says "not confirmed as saved" until it arrives. A new
        set clears the confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [saved]
              properties:
                saved: { type: boolean, description: Must be true; false is refused. }
      responses:
        "204": { description: Confirmed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /me/passkeys:
    get:
      operationId: listPasskeys
      summary: The caller's passkeys (scope people:read)
      description: |
        A passkey replaces password and one-time code at sign-in (ADR 0018). It is
        valid only for the box name it was created under (`box_name`); `works` is
        false once the box has another name. Only parents have passkeys.
      responses:
        "200":
          description: The caller's passkeys, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPasskey
      summary: Finish creating a passkey (browser session, scope people:write)
      description: |
        Second step of creating a passkey: send what the browser's credentials
        API answered to the options of `POST /me/passkeys/registration`. Only a
        signed-in browser session may create a passkey, never a token and never a
        paired personal device's session: a passkey
        signs in for good, so a stolen token must not be able to make one. The
        box checks the answer: the authenticator must have verified the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: { type: string, description: "The `ceremony` of the first step. It works once, for two minutes." }
                credential: { type: object, description: "The credential the browser created (`PublicKeyCredential`, as JSON)" }
                name: { type: string, maxLength: 80, description: "Name of the passkey; the device it was made on when empty" }
      responses:
        "201":
          description: The passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PasskeyName" }
        "422": { $ref: "#/components/responses/Invalid" }
  /me/passkeys/registration:
    post:
      operationId: beginPasskey
      summary: Start creating a passkey (browser session, scope people:write)
      description: |
        First step of creating a passkey. The answer holds the options for
        `navigator.credentials.create`. The request must come to the box under its
        box name (GLOSSARY): over an IP address or another name it is refused with
        409, because a passkey could not work there. A token and a paired personal device's session
        are refused with 403.
      responses:
        "200":
          description: The ceremony to finish with `POST /me/passkeys`
          content:
            application/json:
              schema:
                type: object
                required: [ceremony, options]
                properties:
                  ceremony: { type: string }
                  options: { type: object, description: "WebAuthn PublicKeyCredentialCreationOptions as an object with the member publicKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PasskeyName" }
  /me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename a passkey of the caller (scope people:write)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: The passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: removePasskey
      summary: Remove a passkey of the caller for good (scope people:delete)
      description: Nobody can sign in with it afterwards. The caller's sessions stay.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /people/{id}/invitation:
    get:
      operationId: getInvitation
      summary: The newest invitation of an adult (scope tokens:read)
      description: |
        The state of the newest invitation made for this person: `open`, `used`
        (the person created their account), `expired` or `withdrawn`. The link
        itself is not in the answer: the box keeps only a hash of it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createInvitation
      summary: Invite an adult who has no account (scope tokens:write)
      description: |
        Creates an invitation link, valid once and for 7 days, and returns its
        address once: show it as a QR code or send it to that person. A link
        that is still open for the person is withdrawn, because a new link
        replaces the old one. The invited person opens the address on their own
        device and chooses username and password themselves, then sets up
        one-time codes. With the box's own certificate authority the address
        leads over the plain-HTTP trust page first (ADR 0014). Children cannot
        be invited (422), and neither can a person who has an account (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The new invitation, with its address (only in this answer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The person has an account already }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: withdrawInvitation
      summary: Withdraw the open invitation of an adult (scope tokens:delete)
      description: The link stops working at once. 404 when no invitation is open.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}/reset-otp:
    post:
      operationId: resetOneTimeCodes
      summary: Reset another parent's one-time codes (parents only, scope people:write)
      description: |
        Removes the parent's one-time code secret and recovery codes and ends
        their browser sessions. Device sessions and tokens stay. At the next
        sign-in the parent sets up new one-time codes before anything else is
        reachable. The caller confirms with their own password and one-time
        code (or an unused recovery code). A parent cannot reset their own
        codes this way.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, description: The caller's own password }
                code: { type: string, description: The caller's own one-time code or an unused recovery code }
                remove_passkeys:
                  type: array
                  items: { type: string, format: uuid }
                  description: |
                    Passkeys of the parent whose codes are reset to remove in the same
                    step (ADR 0018): one that was on the lost device could keep signing
                    in. Ids of other people's passkeys are ignored. None are removed by
                    default.
      responses:
        "204": { description: Reset }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { description: Too many failed confirmations. Wait 15 minutes. }
  /people:
    get:
      operationId: listPeople
      summary: Household members in display order
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPerson
      summary: Add a household member (parents only, scope people:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPerson" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}:
    get:
      operationId: getPerson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePerson
      summary: Change a person's name, colour or marker (parents only, scope people:write)
      description: |
        Only the fields sent change. The colour is one of the eight palette colours
        (`Person.color`), the marker one of the eight shapes. No two people may have
        the same colour and the same marker: such a request gets 422.
        `streaks_shown` switches the week count and badges of the person on or off.
        `nutrition_shown` switches the nutrition values at recipes on or off for a
        child (off at first; parents always see them, so a request for a parent gets 422).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /food:
    get:
      operationId: listFood
      summary: Diet and allergies of every person (scope health:read, parents only)
      description: |
        Health data (ADR 0019). Only the explicit scope `health` or `health:read`
        reaches it: the broad scopes `read` and `write` do not, and children
        never do (403). Every answer says that free-text allergies are not
        checked automatically and cannot be filtered by.
      responses:
        "200":
          description: One entry per person, in the order of the family view
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Food" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /people/{id}/food:
    get:
      operationId: getFood
      summary: Diet and allergies of a person (scope health:read, parents only)
      description: |
        A person nobody has edited eats everything (`omnivore`) and has no
        allergies. Health data: see `/food` for who may read it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Diet and allergies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setFood
      summary: Set diet and allergies of a person (scope health:write, parents only)
      description: |
        Replaces everything. `allergens` are keys of the 14 main EU allergens
        (once each, stored in the order of the schema). `other` is the free text,
        one entry per item without commas, 200 characters at most in all; an
        entry that names one of the 14 (or a common word for one: Laktose,
        Gluten, Nüsse, Ei) is refused with 422 and the key to send in
        `allergens` instead. MCP tokens can never change them: the MCP area
        `health` is read only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FoodUpdate" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}/list-view:
    get:
      operationId: getListView
      summary: How a person sees lists, as tiles or as a list (scope lists:read)
      description: |
        One choice per person for all lists, on every device (ADR 0019). A
        person who never chose has the default of the role (`default: true`):
        children see tiles, adults the list.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setListView
      summary: Choose how you see lists (scope lists:complete)
      description: |
        Everyone, children included, chooses their own view; nobody changes
        another person's (403, not even a parent). It is not a change of any
        list, so the scope is the one for ticking entries off. The view of a
        display is `list_view` of `PATCH /displays/{id}`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListViewChange" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /contacts:
    get:
      operationId: listContacts
      summary: The address book, parents only (scope contacts:read)
      description: |
        Every contact of the household: the people (one contact each, always in the
        group Familie) and everyone else. `q` searches Hejmo name, full name, numbers, the words of relations
        and e-mail addresses; `group` keeps the contacts of one group.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: group, in: query, required: false, schema: { type: string }, description: "Id of a contact group" }
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createContact
      summary: Add a contact (parents only, scope contacts:write)
      description: |
        Only `name` (the Hejmo name) is required. Numbers and e-mail addresses are kept
        exactly as typed; lines with an empty value and an address of empty parts are
        not stored. A number holds digits, a + at the start, spaces and - / ( ) and
        dots, at least 3 digits. An e-mail address has one @ and a dot in the domain.
        A birthday needs day and month and may lack the year (then there is no age);
        dates that do not exist and future dates are refused. At most 10 numbers and
        10 e-mail addresses. The name is unique in the household, ignoring case,
        among contacts and people.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /contacts/{id}:
    get:
      operationId: getContact
      summary: One contact (parents only, scope contacts:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateContact
      summary: Replace everything a parent can set on a contact (scope contacts:write)
      description: |
        Everything not sent becomes empty. The name and the group Familie of a person's
        contact stay as they are: the name changes on the person (`PATCH /people/{id}`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: The contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteContact
      summary: Delete a contact (parents only, scope contacts:delete)
      description: The contact of a person goes with the person only, so this answers 422 for it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /contacts/{id}/photo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getContactPhoto
      summary: The photo of a contact (parents only, scope contacts:read)
      description: |
        A square JPEG of at most 512 by 512 pixels without metadata. 404 when the contact has no photo.
        The web interface adds `?v=` (the time the photo was set) to the address so a changed photo is
        fetched again; the answer is `Cache-Control: private`.
      responses:
        "200":
          description: A JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setContactPhoto
      summary: Set or replace the photo of a contact (parents only, scope contacts:write)
      description: |
        Send a JPEG, PNG, WebP or GIF as `multipart/form-data` in the part `file`; the web interface
        converts HEIC to JPEG in the browser first and HEIC sent here is refused with 422. The box cuts
        the picture to a square (landscape from the centre, portrait with a quarter of the excess taken
        from the top), shrinks it to at most 512 by 512 pixels and stores it as a JPEG without location
        or camera data. A file over 15 MB is refused with 413, one that is no picture or has more than
        24 million pixels with 422. The last change wins, whether it came from here, the web interface
        or contact sync. Also works for the contact of a person.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The contact, with its photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The file is over 15 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteContactPhoto
      summary: Remove the photo of a contact (parents only, scope contacts:delete)
      description: Answers 204 also when there was no photo. Hejmo then shows the initials of the name.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contact-imports:
    post:
      operationId: createContactImport
      summary: Upload a contact file and see what it brings (parents only, scope contacts:write)
      description: |
        Send a vCard file (2.1 with quoted-printable and a charset, 3.0 or 4.0) as `multipart/form-data` in the
        part `file`, at most 25 MB. Nothing is saved. The answer says which cards look like contacts Hejmo has
        (`duplicates`: the same number read with the household's home country, the same e-mail address
        without regard to case, or only the same name; empty values never match), which are new (`new`, with the
        name the contact would get), which are already exactly in Hejmo (`same`) and which Hejmo cannot read
        (`unreadable`). Embedded photos are made under the picture rules (512 px, no location or camera data); a
        photo given as a web link is never fetched. The file stays on the box for the parent who uploaded it, for
        an hour at most, and is deleted after the import. A file that is no contact file or holds no card Hejmo
        can read is refused with 422, one over 25 MB with 413.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: What the file brings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: The file is over 25 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /contact-imports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getContactImport
      summary: What an uploaded contact file brings now (parents only, scope contacts:read)
      description: |
        Worked out again from the file and from what Hejmo holds at the moment. Only the parent who uploaded
        the file can read it (404 for everyone else). 410 when the hour is over and the file is deleted.
      responses:
        "200":
          description: What the file brings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactImport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The file waited longer than an hour and was deleted; nothing was taken over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteContactImport
      summary: Cancel an import and delete the file (parents only, scope contacts:delete)
      responses:
        "204": { description: "Deleted; nothing was taken over" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The file was deleted already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /contact-imports/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmContactImport
      summary: Take over the contacts of an uploaded file (parents only, scope contacts:write)
      description: |
        Writes everything in one step or nothing, then deletes the file. A possible duplicate is answered with
        `merge` (new numbers and e-mail addresses are added, empty fields are filled, a missing birth year is
        added; nothing is deleted or overwritten, the Hejmo name, the relations and the groups stay; for a
        person of the household the file never changes the name, the birthday or the e-mail addresses),
        `new` (an own contact; not for a person of the household) or `skip`. A match by number or e-mail
        address is merged when nothing is said (`preselect`); a duplicate with no answer and no preselection
        is refused with 422 and the keys are named. Two cards of the file that look the same are one duplicate
        with `in_file`: `merge` makes one contact of them, `new` one each. When both sides have a photo, `photos`
        chooses `file` or `keep` (the default). New contacts are taken unless their key is in `skip`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duplicates:
                  type: object
                  description: "The choice for each duplicate by its key, for example {\"d3\": \"merge\"}"
                  additionalProperties: { type: string, enum: [merge, new, skip] }
                photos:
                  type: object
                  additionalProperties: { type: string, enum: [keep, file] }
                skip:
                  type: array
                  description: Keys of new contacts that are not taken over
                  items: { type: string }
                groups:
                  type: array
                  description: The groups the new contacts come into (none by default)
                  items: { type: string }
      responses:
        "200":
          description: The contacts that were made and completed
          content:
            application/json:
              schema:
                type: object
                required: [file_name, created, completed]
                properties:
                  file_name: { type: string }
                  created: { type: array, items: { $ref: "#/components/schemas/Contact" } }
                  completed: { type: array, items: { $ref: "#/components/schemas/Contact" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A contact was given a name this import needs while the file waited; read the file again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The file waited longer than an hour and was deleted; nothing was taken over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /numbers:
    get:
      operationId: listNumbers
      summary: The important numbers for children (scope numbers:read; a child's device session, parents and tokens with read)
      description: |
        What the web page "Wichtige Nummern" (`/numbers`) shows: the contacts a parent switched on (`for_children`)
        that have at least one number, in up to three sections in this order: `emergency` (the group Notfall,
        in the order the contacts were made), `family` (the people of the household in the order of the people, then
        the contacts of the group Familie A to Z) and `other` (A to Z by Hejmo name, in the language of the request).
        A contact is in the first section that fits and only once; empty sections are left out. A child never gets
        their own contact; parents get every contact on the list, the children included. A contact holds nothing but
        its name, whether it has a photo (`GET /numbers/{id}/photo`) and its numbers: never address, e-mail
        addresses, birthday, groups or note. The address book (`/contacts`) stays closed to children.
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      required: [key, contacts]
                      properties:
                        key: { type: string, enum: [emergency, family, other] }
                        contacts:
                          type: array
                          items: { $ref: "#/components/schemas/ChildContact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /numbers/{id}/photo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getNumbersPhoto
      summary: The photo of a contact on the children's page (scope numbers:read)
      description: |
        The same JPEG as `GET /contacts/{id}/photo`, for a child's device session. 404 when the contact has no photo
        or is not on the children's page (not switched on, or no number); a token that may read the address book (parents, a token with `read`) gets the photo of every contact; a token with only `numbers` gets what the children get.
      responses:
        "200":
          description: A JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contact-groups:
    get:
      operationId: listContactGroups
      summary: The contact groups with their contacts (parents only, scope contacts:read)
      description: The five groups of Hejmo (`shipped_key` set, no name, the name is in the language of the page) and the household's own.
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createContactGroup
      summary: Add an own group (parents only, scope contacts:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 1 to 40 characters }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /contact-groups/{id}:
    patch:
      operationId: renameContactGroup
      summary: Rename an own group (parents only, scope contacts:write)
      description: The groups of Hejmo keep their names (422).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 1 to 40 characters }
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteContactGroup
      summary: Delete an own group (parents only, scope contacts:delete)
      description: Its contacts stay, without the group. The groups of Hejmo cannot be deleted (422).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/order:
    put:
      operationId: orderPeople
      summary: Set the order of the people, which is the order of the columns on the displays (parents only, scope people:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  description: Every person of the household exactly once
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The people in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tokens:
    get:
      operationId: listTokens
      summary: Active API tokens of the household, without their values (scope tokens:read)
      responses:
        "200":
          description: Tokens, oldest first. Revoked tokens are not listed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      summary: Create an API token for the caller (scope tokens:write)
      description: The token value is returned once and stored only as a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, example: Assistant }
                scopes: { type: string, example: read }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, name, scopes, token]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  scopes: { type: string }
                  token: { type: string, example: hejmo_… }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /mcp:
    get:
      operationId: getMCP
      summary: Whether the MCP server is on, and its address (scope settings:read)
      description: |
        The address always starts with `https://`: MCP is served over HTTPS
        only. A browser session may open the page of the web interface at the
        same address.
      responses:
        "200":
          description: State of the MCP server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setMCP
      summary: Switch the MCP server on or off (scope settings:write)
      description: |
        Off by default. Switching off needs no confirmation: tokens made for MCP
        stay stored and work again once it is switched on; an open MCP session
        stops at its next request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPState" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /mcp/tokens:
    post:
      operationId: createMCPToken
      summary: Create an API token for MCP, for the caller (scope tokens:write)
      description: |
        The areas events, lists, tasks (with routines, templates and stars) and
        meals each get `none`, `read` (scope `<area>:read`) or `write` (scope
        `<area>`, every action including adding, ticking off and deleting). The
        area `health` (diet and allergies) takes only `none` (default) or `read`.
        An
        area left out counts as `none`; at least one area needs `read` or
        `write` (else 422). The token acts as the caller, who has to be a parent,
        and never holds `read`, `write`, `tokens` or `settings`. The name is
        unique among MCP tokens (not case-sensitive, else 422). The token value
        is returned once and stored only as a hash. Creating one works while MCP
        is off too; it works as soon as MCP is on. Revoke it with
        `DELETE /tokens/{id}`; `GET /tokens` lists it with `mcp: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, areas]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, example: Claude on Mama's laptop }
                areas: { $ref: "#/components/schemas/MCPAreas" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, name, scopes, areas, token, address]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  scopes: { type: string, example: "events lists:read" }
                  areas: { $ref: "#/components/schemas/MCPAreas" }
                  token: { type: string, example: hejmo_… }
                  address: { type: string, example: "https://hejmo.local/mcp" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /caldav-profile:
    post:
      operationId: createCalDAVProfile
      summary: Download an iOS profile that sets up the caller's CalDAV account (scope tokens:write)
      description: |
        Creates a new device token (scope `calendars`) for the caller, named
        after the device, and answers with an iOS configuration profile
        (`com.apple.caldav.account`) that holds the box address, the caller's
        user name and that token. For the caller's own account only. The box
        keeps no copy: the profile is the answer to this request; asking again
        creates another profile and another token. The token is listed and
        revoked like any other (`/tokens`). Served over HTTPS only, because
        the file holds the token in plain text; a plain HTTP request gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, example: iPhone Mama }
      responses:
        "200":
          description: The profile, as a download
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/x-apple-aspen-config:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token for good (scope tokens:delete)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /day-notes:
    get:
      operationId: listDayNotes
      summary: Notes for days, oldest day first (scope displays:read)
      description: Notes of days that are over are deleted by the box when the list is read, so only today and later are listed. Children are refused (403).
      responses:
        "200":
          description: The notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DayNote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /day-notes/{day}:
    parameters:
      - { name: day, in: path, required: true, schema: { type: string, format: date, example: "2026-11-16" } }
    put:
      operationId: setDayNote
      summary: Set the note of a day, replacing an earlier one (scope displays:write)
      description: |
        A free-text note of up to 120 characters for one day (`YYYY-MM-DD`, household time). The family
        view's tomorrow tile shows it as its last line from 18:00 the evening before until the end of that
        day; before 18:00 it shows the note of today. A day that is not a date, or a text that is empty after
        trimming spaces, answers 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayNote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteDayNote
      summary: Remove the note of a day (scope displays:delete)
      responses:
        "204": { description: Removed (also when the day had no note) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /displays:
    get:
      operationId: listDisplays
      summary: Paired displays of the household (scope displays:read)
      description: Children, including a child's personal device, are refused (403). Device management is for parents.
      responses:
        "200":
          description: Displays, oldest first. Unpaired displays are not listed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: pairDisplay
      summary: Pair a waiting display by the six-digit code it shows (scope displays:write)
      description: |
        A new display opens the box's display address (`/display`) and shows a
        QR code and a six-digit code, valid for ten minutes. Confirming the
        code names the display and gives it its own revocable token, which it
        keeps in its browser. A wrong or expired code is refused with 404;
        after five wrong codes in 15 minutes the person gets 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairDisplay" }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /display/pairing:
    post:
      operationId: openDisplayPairing
      summary: Open a pairing as a new display (no credentials)
      security: []
      description: |
        A display without a token asks the box for a six-digit pairing code,
        valid for ten minutes, and its own token. The token is in this answer
        only; the display keeps it and sends it as bearer token to
        `GET /display/state` and to its page routes under `/display`. A parent
        confirms the code with `POST /displays`, or by scanning the QR code
        behind `pair_url`. This is what `GET /display` does for a browser.
        Opening is limited per client address (10 in 10 minutes, shared with
        `GET /display`; 429 with `Retry-After`), and the box keeps at most 20
        waiting displays: opening one more drops the oldest.
      responses:
        "201":
          description: A waiting display with its code and token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisplayPairing" }
        "409":
          description: The box is not set up yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /display/state:
    get:
      operationId: getDisplayState
      summary: A display reads its state (its own token as bearer token)
      security:
        - displayBearer: []
      description: |
        `paired`, `pairing` (with its `code`) or `unpaired`: the token is
        revoked or unknown, or its code ran out. An unpaired display opens a
        new pairing. A paired display also gets the `theme` it shows now and, for its photo screensaver, `saver` and `saver_seconds`.
        Poll it about every 30 seconds: a revoked display notices within a
        minute. A request without a bearer token is refused with 401.
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisplayState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /display/wake:
    post:
      operationId: wakeDisplay
      summary: A touch on a quiet display wakes it (its own token as bearer token)
      security:
        - displayBearer: []
      description: |
        Ticket 179. In quiet mode a display whose kiosk app switched it off (quiet
        mode `off` in `brightness.quiet.mode`) is woken by a touch: the display's
        page posts here, and the box keeps it awake for `brightness.quiet.wake_minutes`
        at evening brightness with the night page, then switches it off again.
        The answer is 204 whether or not it woke anything: outside quiet mode, while
        quiet mode only dims, and on a display without a kiosk app nothing changes.
        An `Authorization` header that is not a bearer token is refused with 401, the
        token of a display that is not paired with 403.
      responses:
        "204":
          description: Noted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /displays/{id}:
    patch:
      operationId: updateDisplay
      summary: Change the settings of a paired display (scope displays:write)
      description: |
        Only the fields sent are changed. `name` (1 to 80 characters after trimming) and `type` (`eink_bw`, `eink_color` or `screen`) rename and retype the display; an empty or too long name, or an unknown type, is refused with 422. `show_tomorrow` switches the tomorrow block of the family view (ADR 0016).
        `theme` and the two offsets set the display's theme (ADR 0015); an unknown theme or an offset outside -180..180 is refused with 422.
        `quiet_mode` sets the daily window in which the display shows the night page (ADR 0015). Quiet mode takes precedence over the theme. What it does to the light depends on `brightness.quiet.mode`: with `off` the front light goes off (E-Ink) or the screen goes off (normal screen, the page is black meanwhile); with `dim` the night page stays visible and the display is only dimmed to `brightness.quiet.level`. See `Brightness`.
        `list_view` (`tiles` or `list`) is how the display shows lists; the display keeps its own view, tiles until it is switched (ADR 0019).
        `kiosk` sets the address and API key of the kiosk app (FreeKiosk, ADR 0005) the box uses to set the brightness; an empty `url` removes it. Times and addresses that are not valid are refused with 422.
        `brightness` sets the brightness values by time of day and in quiet mode (ticket 179); see `Brightness`.
        `layout` sets the people, their order and the layout blocks (ticket 180); see `DisplayLayout`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDisplay" }
      responses:
        "200":
          description: The display with its settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: unpairDisplay
      summary: Unpair a display and revoke its token (scope displays:delete)
      description: The display shows the pairing screen again within a minute.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unpaired }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /displays/{id}/layout:
    post:
      operationId: copyDisplayLayout
      summary: Copy the layout of another display onto this one (scope displays:write)
      description: |
        Takes the people, their order, the daily rotation and the layout blocks of the display
        `from` and saves them on this display (ticket 180, Q84). Name, brightness, quiet mode and
        everything else of this display stay. The layouts are separate afterwards: there are no
        shared templates. Refused with 422 when `from` is this display; 404 when this display or
        the display `from` does not exist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from: { type: string, format: uuid, description: "The display to copy the layout from" }
      responses:
        "200":
          description: This display with its new layout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /albums:
    get:
      operationId: listAlbums
      summary: Albums of screensaver photos (scope displays:read)
      description: |
        The default album comes first. Each album says which displays show it
        (a display that chose no album shows all albums). Children are refused (403).
      responses:
        "200":
          description: Albums
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAlbum
      summary: Make an album (scope displays:write)
      description: The name is trimmed, 1 to 80 characters and unique in any letter case, else 422 with `field` `album_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumName" }
      responses:
        "201":
          description: The new album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAlbum
      summary: One album (scope displays:read)
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameAlbum
      summary: Rename an uploaded album (scope displays:write)
      description: A folder album is renamed in the folder on the box and is refused with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumName" }
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteAlbum
      summary: Delete an uploaded album with its photos (scope displays:delete)
      description: |
        The photos of the album are deleted from the box. A display that showed
        only this album shows all albums afterwards. The default album and folder
        albums cannot be deleted (422).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /albums/{id}/photos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAlbumPhotos
      summary: The photos of an album, newest first (scope displays:read)
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: uploadPhoto
      summary: Add one photo to an uploaded album (scope displays:write)
      description: |
        Send a JPEG or PNG as `multipart/form-data` in the part `file`. The web
        interface converts HEIC photos to JPEG in the browser first; HEIC sent here
        is refused with 422. The box keeps only a copy shrunk to display size, without
        location data or any other metadata. A file over 64 MB is refused with 413;
        when the photo does not fit in the space for photos the box answers 507 and
        deletes nothing. A folder album takes no uploads (422).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "507": { $ref: "#/components/responses/PhotosFull" }
  /photos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePhoto
      summary: Hide or show a photo on displays, or move it to another album (scope displays:write)
      description: |
        `hidden` switches "don't show on displays". `album_id` moves an uploaded photo
        to another uploaded album; photos and albums that come from the box's folder
        are changed in the folder (422), but their photos can be hidden.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePhoto" }
      responses:
        "200":
          description: The photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deletePhoto
      summary: Delete an uploaded photo from the box (scope displays:delete)
      description: A photo from the box's folder is deleted in the folder (422).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /photos/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: size, in: query, required: false, schema: { type: string, enum: [display, thumbnail], default: display }, description: "`thumbnail` is 400 pixels on the long edge" }
    get:
      operationId: getPhotoImage
      summary: The stored copy of a photo (scope displays:read)
      responses:
        "200":
          description: A JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /photo-storage:
    get:
      operationId: getPhotoStorage
      summary: The space for photos (scope displays:read)
      responses:
        "200":
          description: Space used and the limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoStorage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: setPhotoLimit
      summary: Set the limit for photos (scope displays:write)
      description: At least 1 GB, else 422. Lowering it below what is used deletes nothing; the box only refuses new photos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit_gb]
              properties:
                limit_gb: { type: integer, description: "1 to 100000, else 422" }
      responses:
        "200":
          description: The space for photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoStorage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /display/saver:
    get:
      operationId: getDisplaySaver
      summary: A display reads what its screensaver shows (its own token as bearer token)
      security:
        - displayBearer: []
      description: |
        `active` is false when the display has the screensaver off, is in quiet
        mode or is not paired: it then shows the day. `photos` are the photos to
        show, in no particular order (the display shuffles them and shows each
        once before any repeats); hidden photos and photos of albums the display
        does not show are left out. Fetch each with `GET /display/photos/{id}`.
      responses:
        "200":
          description: The screensaver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisplaySaver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /display/photos/{id}:
    get:
      operationId: getDisplayPhoto
      summary: A display fetches a photo (its own token as bearer token)
      security:
        - displayBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /personal-devices:
    get:
      operationId: listPersonalDevices
      summary: Paired personal devices of the household (scope tokens:read)
      description: Each personal device has a long-lived device session for the person it was paired for (ADR 0015).
      responses:
        "200":
          description: Personal devices, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonalDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /personal-devices/{id}:
    delete:
      operationId: revokePersonalDevice
      summary: Remove a personal device and end its device session (scope tokens:delete)
      description: The personal device is signed out the next time it opens the app.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /personal-devices/{id}/repair:
    post:
      operationId: repairPersonalDevice
      summary: Give a personal device to another person in one step (scope tokens:write)
      description: |
        Removes the personal device, ends its device session at once and returns a new
        pairing code that says whom the personal device is for next. The code follows the
        usual rules of `createPersonalDevicePairing` (valid once, ten minutes, the
        household's limit of open codes). The personal device opens it, the waiting personal device
        shows the person, and a parent confirms it with `confirmPersonalDevicePairing`
        (the waiting list names the person in `for_person_id`). `person_id` must
        be another member of the household than the personal device's current person (422
        otherwise, and nothing changes). Nothing of the person the personal device had
        (events, tasks, stars) is touched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairPersonalDevice" }
      responses:
        "201":
          description: The new pairing code, for the chosen person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewPersonalDevicePairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /personal-devices/pairings:
    get:
      operationId: listPersonalDevicePairings
      summary: Personal devices that opened a pairing code and wait for confirmation (scope tokens:read)
      responses:
        "200":
          description: Waiting personal devices, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonalDevicePairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPersonalDevicePairing
      summary: Create a pairing code for a personal device (scope tokens:write)
      description: |
        Returns the address a personal device opens, valid once and for ten minutes; show
        it as a QR code. The box keeps only a hash of the code, so the address
        is only in this answer. With the box's own certificate authority the
        address leads over the plain-HTTP trust page first, which then leads on
        to the pairing (ADR 0014). The personal device opens the address, waits, and a
        parent confirms it with `confirmPersonalDevicePairing`.
      responses:
        "201":
          description: The pairing code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewPersonalDevicePairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /personal-devices/pairings/{id}/confirm:
    post:
      operationId: confirmPersonalDevicePairing
      summary: Confirm the personal device that opened a pairing code (scope tokens:write)
      description: |
        Chooses whom the personal device is for (an account or a child) and names it. The
        personal device gets its device session at its next request. The personal device acts with
        the role of that person. A pairing that no personal device opened, or that
        expired or was confirmed already, is 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPersonalDevice" }
      responses:
        "201":
          description: The personal device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks:
    get:
      operationId: listTasks
      summary: Simple tasks of the household with their state on one day (scope tasks:read)
      description: |
        All tasks, oldest first. `due` says whether a task is due on `date`
        (default today in the household's time zone) and `done` whether it is
        ticked off that day. A repeating task is open again on the next day it
        is due. Everyone, children included, may read all tasks.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createTask
      summary: Create a task for a person (scope tasks:write, parents only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTask" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/pauses:
    get:
      operationId: listPauses
      summary: Pause days of the household (scope tasks:read)
      description: |
        Pause days are spans of days (first and last included) on which routines
        do not count: a pause day that is not done drops out of the week count
        and does not end the best streak; one that is done anyway counts like a
        normal day. Earliest first. A pause without `person_ids` is for the whole
        family (`whole_family`). Everyone, children included, may read them.
      responses:
        "200":
          description: Pauses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pause" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPause
      summary: Enter pause days (scope tasks:write, parents only)
      description: |
        Past days are allowed; the counts recalculate. A pause that overlaps
        pauses of exactly the same people is merged with them, and the merged
        pause is returned. `to` before `from` and a span over 366 days give 422
        with `field: to`; an unknown person gives 422 with `field: people`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPause" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pause" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/pauses/{id}:
    patch:
      operationId: updatePause
      summary: Change the days or the people of a pause (scope tasks:write, parents only)
      description: |
        Only the fields sent change; an empty `person_ids` makes it a pause of
        the whole family. Merged with overlapping pauses of the same people like
        a new one; the pause keeps its id.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PauseUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pause" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deletePause
      summary: Remove a pause (scope tasks:delete, parents only)
      description: The days count normally again; what was ticked off stays.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}:
    patch:
      operationId: updateTask
      summary: Change a task's star value (scope tasks:write, parents only)
      description: |
        Only `stars` can be changed so far; any other or unknown field is
        refused with 400. The new value counts from the next tick. Ticks that
        are already credited keep their value: the star log and the stars
        credited for done days stay as they are, and unticking deducts what was
        credited. A missing value, a value that is not a whole number and a value
        outside 0 to 100 give 422 with `field: stars`, as on POST /tasks.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                `stars` is a whole number from 0 to 100. The range is checked by
                the box, so a value outside it gets the 422 below with a field
                error. Any other field is refused with 400.
              additionalProperties: false
              properties:
                stars: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: The updated task with its state today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: Not valid JSON or an unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteTask
      summary: Delete a task with its history (scope tasks:delete, parents only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/done:
    put:
      operationId: setTaskDone
      summary: Tick a task off or back open for today (scope tasks:complete)
      description: |
        Parents may do this for every task, a child only for its own (else
        403). The task must be due today, else 422. Ticking twice changes
        nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The task with its state today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}/subtasks:
    post:
      operationId: addSubtask
      summary: Add a subtask to a task (scope tasks:write, parents only)
      description: |
        A subtask is a title with an optional emoji (ADR 0018). It is added at
        the end. A task has at most 10 subtasks, one level only: an 11th gives
        422 with `field: subtasks`. If the task is already ticked off today,
        the new subtask counts as done today, so the person loses no stars.
        Answers with the task and its state today.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSubtask" }
      responses:
        "201":
          description: The task with its subtasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}/subtasks/{sub_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sub_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSubtask
      summary: Change the title or emoji of a subtask (scope tasks:write, parents only)
      description: Any other or unknown field is refused with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                emoji: { type: string, maxLength: 16 }
      responses:
        "200":
          description: The task with its subtasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: Not valid JSON or an unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteSubtask
      summary: Remove a subtask (scope tasks:write, parents only)
      description: |
        Removing the last open subtask completes the task for today and
        credits its stars, because everything that is left is ticked. Removing
        the only subtask leaves a plain task as it was. Answers with the task
        and its state today.
      responses:
        "200":
          description: The task with its remaining subtasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/subtasks/{sub_id}/move:
    post:
      operationId: moveSubtask
      summary: Move a subtask one place up or down (scope tasks:write, parents only)
      description: Moving the first one up or the last one down changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sub_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: string, enum: [up, down] }
      responses:
        "200":
          description: The task with its subtasks in the new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}/subtasks/{sub_id}/done:
    put:
      operationId: setSubtaskDone
      summary: Tick a subtask off or back open for today (scope tasks:complete)
      description: |
        Parents may do this for every task, a child only for its own (else
        403). The task must be due today, else 422. Ticks belong to today's
        occurrence and start open again with the next one. Ticking the last
        open subtask completes the task and credits its stars once; unticking
        a subtask of a done task reopens the task and deducts them, the other
        subtasks stay ticked. Ticking the task itself (`PUT /tasks/{id}/done`)
        ticks all its subtasks and unticking a done task unticks all of them
        (unticking an open task leaves its subtask ticks alone). Ticking
        twice changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sub_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The task with its state today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines:
    get:
      operationId: listRoutines
      summary: Routines of the household with their tasks in order (scope tasks:read)
      description: |
        A routine is the ordered sequence of one person's tasks for a part of
        the day (ADR 0018). `task_ids` lists the routine's tasks in the order
        the personal view shows them. Everyone, children included, may read.
      parameters:
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Routines, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Routine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createRoutine
      summary: Create a routine for a person and a part of the day (scope tasks:write, parents only)
      description: |
        A person has at most one routine per part of the day: a second one is
        409 and names the existing routine in `existing_routine_id`. Add its
        tasks with `POST /tasks` (`routine_id`) or `POST /routines/{id}/tasks`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRoutine" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/RoutineConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRoutine
      summary: One routine with its tasks in order (scope tasks:read)
      responses:
        "200":
          description: The routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRoutine
      summary: Rename a routine or change its part of the day (scope tasks:write, parents only)
      description: |
        Changing the part of the day changes it for every task of the routine.
        A part the person already has a routine for is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                part_of_day: { $ref: "#/components/schemas/RoutinePart" }
      responses:
        "200":
          description: The updated routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RoutineConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: dissolveRoutine
      summary: Dissolve a routine; its tasks stay (scope tasks:delete, parents only)
      description: |
        Deletes the routine and no task: its tasks stay as single tasks of the
        person with their part of the day (after school becomes any time),
        their stars and their history.
      responses:
        "204": { description: Dissolved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /routines/{id}/tasks:
    post:
      operationId: addTaskToRoutine
      summary: Take a person's single task into the routine, at the end (scope tasks:write, parents only)
      description: |
        The task must be the routine's person's and in no routine (else 409 for
        a task that is in one, 422 for another person's). It takes the
        routine's part of the day. To create a new task in a routine, use
        `POST /tasks` with `routine_id`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              additionalProperties: false
              properties:
                task_id: { type: string, format: uuid }
      responses:
        "200":
          description: The routine with the task at its end
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RoutineConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines/{id}/tasks/{task_id}:
    delete:
      operationId: removeTaskFromRoutine
      summary: Take a task out of the routine (scope tasks:write, parents only)
      description: |
        The task becomes a single task again and keeps the routine's part of
        the day (after school becomes any time), its stars and its history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Taken out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines/{id}/order:
    put:
      operationId: setRoutineOrder
      summary: Put the routine's tasks in a new order (scope tasks:write, parents only)
      description: |
        `task_ids` must name every task of the routine exactly once, else 422
        and nothing changes. The personal view shows the new order.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_ids]
              additionalProperties: false
              properties:
                task_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The routine in its new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routine-templates:
    get:
      operationId: listRoutineTemplates
      summary: Routine templates, own first, then the ones that come with Hejmo (scope tasks:read)
      description: |
        A routine template is a routine without a person (ADR 0018). The
        parent's own templates come first, oldest first, then the templates
        that ship with Hejmo (`source: shipped`, ids such as `school-morning`),
        in the language in use: their names and step titles follow the
        request's language, German or English. Everyone, children included,
        may read.
      responses:
        "200":
          description: Own templates, then shipped ones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoutineTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: saveRoutineAsTemplate
      summary: Save a routine as an own template (scope tasks:write, parents only)
      description: |
        Copies the routine's part of the day and its steps in order, with
        emoji, star value and repetition. Once-only tasks are left out; a
        routine with no other task is 422. What a person ticked, stars earned
        and history stay with the person. The template is a copy: changing
        the routine later does not change it. Without `name` the template is
        called "<routine> von <person>" (English: "<routine> of <person>").
        A name already used by an own template (ignoring case) is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routine_id]
              additionalProperties: false
              properties:
                routine_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: The new template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routine-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "An own template's UUID or the id of a shipped one" }
    get:
      operationId: getRoutineTemplate
      summary: One routine template with its steps (scope tasks:read)
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRoutineTemplate
      summary: Rename an own template or change its suggested part of the day (scope tasks:write, parents only)
      description: |
        Routines that were made from the template stay as they are. A
        template that ships with Hejmo cannot be changed: 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                part_of_day: { $ref: "#/components/schemas/RoutinePart" }
      responses:
        "200":
          description: The updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteRoutineTemplate
      summary: Delete an own template (scope tasks:delete, parents only)
      description: |
        Routines that were made from the template stay as they are. A
        template that ships with Hejmo cannot be deleted: 409.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
  /routine-templates/{id}/steps:
    post:
      operationId: addRoutineTemplateStep
      summary: Add a step at the end of an own template (scope tasks:write, parents only)
      description: |
        A step is never once-only (`repeat` is `daily` or `weekly`) and has
        no subtasks. `stars` defaults to 1.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, repeat]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                emoji: { type: string, maxLength: 16 }
                stars: { type: integer, minimum: 0, maximum: 100 }
                repeat: { $ref: "#/components/schemas/TemplateRepeat" }
                weekdays: { type: array, items: { $ref: "#/components/schemas/TaskWeekday" } }
      responses:
        "201":
          description: The template with the new step at its end
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routine-templates/{id}/steps/{step_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: step_id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRoutineTemplateStep
      summary: Change a step of an own template (scope tasks:write, parents only)
      description: |
        Only the fields given change. Changing `repeat` to `daily` drops the
        weekdays; `weekly` needs weekdays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                emoji: { type: string, maxLength: 16 }
                stars: { type: integer, minimum: 0, maximum: 100 }
                repeat: { $ref: "#/components/schemas/TemplateRepeat" }
                weekdays: { type: array, items: { $ref: "#/components/schemas/TaskWeekday" } }
      responses:
        "200":
          description: The updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteRoutineTemplateStep
      summary: Remove a step from an own template (scope tasks:write, parents only)
      responses:
        "200":
          description: The template without the step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" } # the last step of a template stays
  /routine-templates/{id}/order:
    put:
      operationId: setRoutineTemplateOrder
      summary: Put the steps of an own template in a new order (scope tasks:write, parents only)
      description: |
        `step_ids` must name every step of the template exactly once, else
        422 and nothing changes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_ids]
              additionalProperties: false
              properties:
                step_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The template in its new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meals:
    get:
      operationId: listMeals
      summary: The meal plan from one day to another (scope meals:read)
      description: |
        Entries from `from` to `to`, both included, by day and then by mealtime
        in the order of the day (breakfast, lunch, snack, dinner). Without
        `from` and `to` the week from today in the household's time zone. At
        most 62 days; give both or neither, else 422. Everyone, children
        included, may read the plan.

        An entry is the effective meal: this week's adjustment if there is one,
        else what a meal plan template fills in, else the hand-typed entry
        (`source` and `template_dish` say which). A meal emptied for a week is
        not listed.

        An entry is free text or a recipe (`recipe_id`, with `portions`);
        `dish` is the recipe's current name, or the text. A renamed recipe
        shows its new name here at once; a deleted recipe leaves its name as
        free text.

        Every entry also appears as an all-day event "<Mealtime>: <dish>" in
        the generated, read-only calendar of kind `meals` (see `/calendars`),
        which is shared through the box by default (ADR 0015). Portions and
        warnings are not part of the event.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Meals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meals/{date}/{mealtime}:
    put:
      operationId: setMeal
      summary: Plan a meal, or change the planned one (scope meals:write, parents only)
      description: |
        Sets the entry of a day and mealtime, free `text` or a recipe
        (`recipe_id` with `portions` from 1 to 99; without `portions` they are
        the number of people in the household), and writes its all-day event in
        the meal-plan calendar, which is created on first use. The event title
        uses the language of the request (Accept-Language), for example
        "Dinner: Pasta bake" or, for a recipe, its name. Saving the same entry
        again changes nothing. Give `text` or `recipe_id`, not both (else 422);
        an empty text is refused with 422: remove a meal with DELETE. A recipe
        of another household, or none, is refused with 422.

        Where a meal plan template fills the day, the entry is that week's
        adjustment (`source` adjusted; a recipe always is one); typing the
        template's own dish is no adjustment.

        Ingredients the shopping list took from the recipe
        (`/meal-shopping`) are taken back when the recipe leaves this entry
        or its portions shrink: the quantity of the portions that go comes
        off the entries not yet ticked, an entry a run made disappears when
        nothing is left, and the source lines of the meal go. Ticked entries
        are never touched.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: mealtime, in: path, required: true, schema: { $ref: "#/components/schemas/Mealtime" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 200, description: "Free text: one line, trimmed; at most 200 characters. Not with recipe_id" }
                recipe_id: { type: string, description: "A recipe of the household (`/recipes`). Not with text" }
                portions: { type: integer, description: "With recipe_id: how many portions, 1 to 99 (else 422); default the number of people in the household" }
      responses:
        "200":
          description: The meal as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteMeal
      summary: Remove a planned meal and its calendar event (scope meals:delete, parents only)
      description: |
        Removing a meal that is not planned is not an error (204). Where a meal
        plan template fills the day, it empties the meal for that week (an
        adjustment); `restoreMeal` brings the template's dish back.

        Ingredients the shopping list took from the recipe
        (`/meal-shopping`) are taken back when the recipe leaves the plan:
        the quantity of the portions that go comes off the entries not yet
        ticked, an entry a run made disappears when nothing is left, and the
        source lines of the meal go. Ticked entries are never touched.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: mealtime, in: path, required: true, schema: { $ref: "#/components/schemas/Mealtime" } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meals/{date}/{mealtime}/restore:
    post:
      operationId: restoreMeal
      summary: Back to template, drop the week's change of a meal (scope meals:write, parents only)
      description: |
        Removes the adjustment of a meal, so the template's dish shows again
        (and in the calendar). 404 if the meal is not adjusted.

        Ingredients the shopping list took from the recipe
        (`/meal-shopping`) are taken back when the recipe of the adjustment
        leaves the meal: the quantity of the portions that go comes off the
        entries not yet ticked, an entry a run made disappears when nothing
        is left, and the source lines of the meal go. Ticked entries are
        never touched.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: mealtime, in: path, required: true, schema: { $ref: "#/components/schemas/Mealtime" } }
      responses:
        "200":
          description: The meal as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meal-shopping:
    get:
      operationId: previewMealShopping
      summary: Look first, then add - what putting a meal or a week of recipes on a list would do (scope lists:write, parents only)
      description: |
        The tick list of the web interface as data (ticket 283). Give `meal`
        (`<day>.<mealtime>`, for example `2026-11-17.dinner`) for one meal, or
        `week` (a day of the week, or an ISO week such as `2026-W47`) for the
        recipe meals of that week from today on. Quantities are scaled to the
        planned portions (a meal that is on a list already offers only the
        missing portions). Kitchen measures (tbsp, tsp, pinch, ...) go on the
        list without a quantity; containers keep their quantity and add up only
        within the same unit. `list_id` names a list with suggestions; without it
        the list last used for meals is taken, else the first one. Every row says
        what adding does (`outcome`) through `list.PlanAdd`, so nothing lands
        twice. Pantry articles are in `group: pantry` and `tick: false`.
      parameters:
        - { name: meal, in: query, schema: { type: string, example: "2026-11-17.dinner" } }
        - { name: week, in: query, schema: { type: string, example: "2026-W47" } }
        - { name: list_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The preview with its counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealShopping" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: addMealShopping
      summary: Put the ingredients of a meal or a week on a list (scope lists:write, parents only)
      description: |
        Adds the ticked rows through `list.PlanAdd` in one step and records, per
        list entry and meal, how much each meal contributed (the `sources` of the
        entries; basis for taking quantities back). A meal that is on a list
        already is never added twice: only missing portions are. `versions` are
        the recipe versions from the preview: if a recipe changed since, nothing is
        added and the answer is 409 with the ids in `changed`. Without `versions` this check is skipped
        (send them). If the meal got on a list since the preview (a double send), the
        answer is 409 too and nothing is added. Without `picks` the
        rows the preview ticks are added; `meals` (week only) leaves out whole
        meals. Undo the run with `POST /meal-shopping/runs/{id}/undo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_id]
              properties:
                meal: { type: string, example: "2026-11-17.dinner" }
                week: { type: string, example: "2026-W47" }
                list_id: { type: string, format: uuid }
                meals: { type: array, items: { type: string }, description: "Week only: the meal keys to take; all by default" }
                picks: { type: array, items: { type: string }, description: "The row keys to add; the ticked rows of the preview by default" }
                versions: { type: object, additionalProperties: { type: string }, description: "Recipe id to the version the preview gave" }
      responses:
        "201":
          description: What was added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealShoppingRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A recipe changed (`changed` names it) or a meal is not planned as a recipe any more. Nothing was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealShoppingConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meal-shopping/runs/{id}/undo:
    post:
      operationId: undoMealShopping
      summary: Take back exactly that run (scope lists:write, parents only)
      description: |
        Deletes the open entries the run made, subtracts the quantities it
        added, empties entries that took a quantity from it, and forgets its
        contributions, so the meals count as not on a list. Entries that were
        ticked off meanwhile stay and are named in `ticked`. A run can be taken
        back once (409 afterwards).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: What was taken back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealShoppingUndo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run was taken back already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /meal-templates:
    get:
      operationId: listMealTemplates
      summary: Meal plan templates, by name (scope meals:read)
      description: |
        A template is a week pattern from Monday to Sunday that fills the meal
        plan by itself, every `interval` weeks from `start_week`. A slot is free
        text or a recipe (`recipe_id`).
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MealTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMealTemplate
      summary: Create a meal plan template (scope meals:write, parents only)
      description: |
        Fills the meal plan and the meal-plan calendar from today on. Entries of
        mealtimes the template does not fill are ignored; an empty entry leaves
        that meal free. At least one entry must be filled (else 422).

        Two templates may not fill the same mealtime on the same weekday of the
        same week, from today on. Then nothing is saved and the answer is 409
        with `clashes`: for each template it clashes with, the mealtime, the
        weekdays and the first week.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMealTemplate" }
      responses:
        "201":
          description: The template as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MealTemplateClash" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meal-templates/{id}:
    get:
      operationId: getMealTemplate
      summary: One meal plan template (scope meals:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateMealTemplate
      summary: Replace a meal plan template (scope meals:write, parents only)
      description: |
        Changes reach today and all later days, never days before today. Meals
        adjusted for a week keep their change. Overlaps are refused as in
        `createMealTemplate`.

        Ingredients the shopping list took from the recipe
        (`/meal-shopping`) are taken back when a recipe leaves a meal or its
        portions shrink: the quantity of the portions that go comes off the
        entries not yet ticked, an entry a run made disappears when nothing
        is left, and the source lines of the meal go. Ticked entries are
        never touched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMealTemplate" }
      responses:
        "200":
          description: The template as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MealTemplateClash" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteMealTemplate
      summary: Delete a meal plan template (scope meals:delete, parents only)
      description: |
        From today on its meals leave the plan and the calendar. Days before
        today keep what they showed; meals adjusted for a week stay as plain
        entries.

        Ingredients the shopping list took from the recipe
        (`/meal-shopping`) are taken back when a recipe leaves the plan: the
        quantity of the portions that go comes off the entries not yet
        ticked, an entry a run made disappears when nothing is left, and the
        source lines of the meal go. Ticked entries are never touched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recipes:
    get:
      operationId: listRecipes
      summary: The household's own recipes, from A to Z (scope meals:read)
      description: |
        Everyone reads recipes, children included. `q` searches the name, the
        ingredients and the tags (case and umlauts ignored); `category`
        keeps one of the six categories. The answer holds no health data: the
        warnings of the family's allergies are at `/recipes/{id}/warnings`.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { $ref: "#/components/schemas/RecipeCategory" } }
      responses:
        "200":
          description: The recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRecipe
      summary: Write a recipe (scope meals:write, parents only)
      description: |
        Only the name is required. Steps are an ordered list of their own, never
        part of `tips`; empty steps and empty ingredient lines are not saved.
        The name must be free in the household, ignoring case (else 422, field
        `name`). An ingredient is an article of the library (`article_id`, or the
        exact name, or a name followed by a variety such as "Mehl Type 405") or
        free text, which Hejmo does not check for allergens. A variety written in
        the text (`text` "Mehl Type 405") wins over a `variety` sent with the
        line, since it is what was typed; `variety` is used when the text has
        none. A unit without a
        quantity means one. The units are those of `GET /recipe-units`.
        Warnings never block saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRecipe" }
      responses:
        "201":
          description: The recipe as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /starter-recipes:
    get:
      operationId: listStarterRecipes
      summary: The starter collection of 200 recipes that ships with the box, from A to Z (scope meals:read)
      description: |
        Everyone reads them, children included. The texts come in the language of
        the request (`Accept-Language` or the person's choice), German when
        unknown. Each recipe names its source (`source_name`, `source_url`: "Ingredients
        after: ..."), has `starter` true and an id that starts with `starter-`; the
        family's own recipes at `/recipes` do not hold them. A starter recipe is read
        at `GET /recipes/{id}` like an own one but cannot be replaced or deleted
        (403). `q` and `category` work as at `/recipes`.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { $ref: "#/components/schemas/RecipeCategory" } }
      responses:
        "200":
          description: The starter recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /recipes/{id}:
    get:
      operationId: getRecipe
      summary: One recipe, an own one or a starter recipe (scope meals:read)
      description: |
        The id of a starter recipe starts with `starter-` (see `GET /starter-recipes`).
        With `portions` the recipe is written for that many portions, as the
        cooking view shows it: `portions` is the number asked for, and every
        quantity is scaled and rounded to one decimal, never up to a whole
        number (`3` for 4 portions is `4.5` for 6). The stored recipe does not
        change. Without `portions`, or with the recipe's own, the quantities are
        the stored ones.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: portions, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 99 }, description: Scale the quantities to this many portions }
      responses:
        "200":
          description: The recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    put:
      operationId: updateRecipe
      summary: Replace a recipe (scope meals:write, parents only)
      description: Give all fields; the ingredients, steps and tags are replaced. Who wrote the recipe stays. An ingredient's variety is read as in `POST /recipes`. A starter recipe (id starts with `starter-`) is never replaced (403).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRecipe" }
      responses:
        "200":
          description: The recipe as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteRecipe
      summary: Delete a recipe with its ingredients, steps and tips (scope meals:delete, parents only)
      description: |
        A starter recipe (id starts with `starter-`) is never deleted (403).

        Ingredients the shopping list took from the recipe
        (`/meal-shopping`) are taken back when the recipe is deleted: the
        quantity of the portions that go comes off the entries not yet
        ticked, an entry a run made disappears when nothing is left, and the
        source lines of the meal go. Ticked entries are never touched.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recipes/{id}/favourites:
    put:
      operationId: setRecipeFavourites
      summary: Mark a recipe as the favourite of people, "Mia likes it" (scope meals:write, parents only)
      description: |
        Replaces the marks: the recipe is afterwards a favourite of exactly the
        people in `person_ids` (members of the household, each once), and of
        nobody with an empty list. The meal plan's suggestions show favourites
        first. Only the household's own recipes can be marked: a starter recipe
        (id starts with `starter-`) cannot be planned and answers 403. An unknown
        person is 422, field `person_ids`; nothing changes then. Answers the
        recipe with `favourite_of` and `last_cooked`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person_ids]
              properties:
                person_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The recipe with its marks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /recipes/{id}/warnings:
    get:
      operationId: getRecipeWarnings
      summary: Who has to look out for what in a recipe (scope health:read)
      description: |
        Health data, so only the scope `health` reaches it. One entry per
        allergen of the 14 main EU allergens, naming every person it concerns.
        Free-text ingredients (`not_checked_ingredients`) and the people's
        free-text allergies (`not_checked_allergies`) are not checked
        automatically (`note`). The answer is experimental and without
        guarantee. Warnings never block anything. Works for starter recipes too.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeWarnings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recipes/{id}/nutrition:
    get:
      operationId: getRecipeNutrition
      summary: The nutrition values of a recipe per portion (scope meals:read)
      description: |
        The seven values of the EU nutrition declaration (energy in kJ and kcal, fat,
        of which saturates, carbohydrate, of which sugars, protein, salt) per portion,
        calculated from the ingredients with BLS 4.0 (Max Rubner-Institut, CC BY 4.0)
        and USDA FoodData Central (CC0), shipped in the box. They are guide values.
        A value that is not known is `null`, never 0: `not_counted` lists the
        ingredients that could not be counted (free text, no quantity, a unit with no
        known weight, an own article without a food) and `missing_values` the values
        the food data lacks. Units count in grams only when the weight is known:
        g, kg, oz, lb always; ml, l, tablespoon, teaspoon and pinch with the article's
        density; piece, dozen, jar and tub with the article's piece weight (for
        nutrition only; shopping lists never convert kitchen measures). Works for
        starter recipes too. Parents always get the values; a child gets them only when
        a parent switched on `nutrition_shown` for them, otherwise 404. Never on displays.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeNutrition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /foods:
    get:
      operationId: searchFoods
      summary: Search the food data of the box (scope lists:read)
      description: |
        The foods of BLS 4.0 and USDA FoodData Central that ship in the box, with the
        seven values per 100 g. Every word of `q` must appear in the German or English
        name (case, umlauts and ue for ü ignored); names that are the query come
        first, then names that start with it. From two letters on; fewer find nothing.
        Offline: nothing is looked up on the internet. An article's `food` is one of them.
        Nutrition values are hidden from a child unless a parent switched them on for that
        child: otherwise 404, and an article carries no `food` or `piece_g`.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: The foods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NutritionFood" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /foods/{id}:
    get:
      operationId: getNutritionFood
      summary: One food of the food data (scope lists:read)
      description: A child whose nutrition switch is off gets 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "For example bls:C133000 or usda:170848" }
      responses:
        "200":
          description: The food
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionFood" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recipe-units:
    get:
      operationId: listRecipeUnits
      summary: The units an ingredient can have (scope meals:read)
      description: |
        The household's units (`GET /units`), then the kitchen measures (`tbsp`,
        `tsp`, `pinch`, `knifetip`, `dash`, `splash`, `handful`, `cup`), which never
        convert into or add up with g and ml, then the containers and piece
        measures (`can`, `packet`, `tub`, `bunch`, `jar`, `bottle`, `stick`, `clove`,
        `slice`, `cube`, `sprig`, `stalk`, `ball`, `leaf`, `punnet`, `pot`), whose
        quantities add up only within the same unit.
      responses:
        "200":
          description: The unit keys
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /people/{id}/stars:
    get:
      operationId: getStars
      summary: A person's star balance and star log (scope tasks:read)
      description: |
        The balance is the sum of all bookings of the person. `entries` are the
        latest bookings, newest first (default 50, at most 200). Everyone,
        children included, may read it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: The star account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: bookStars
      summary: Book stars by hand with a note (scope tasks:write, parents only)
      description: |
        A negative amount deducts, for example -5 with the note "redeemed: ice
        cream". The amount may not be 0 and the note may not be blank (else
        422). Ticking tasks books stars on its own, see `setTaskDone`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewStarBooking" }
      responses:
        "201":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}/badges:
    get:
      operationId: getBadges
      summary: A person's badges (scope tasks:read)
      description: |
        The ten fixed badges (ticket 295) a person has earned, newest first (the
        ones earned together in catalogue order): `first_routine`, `whole_day`,
        `whole_week`, `streak_7`, `streak_30`, `first_star`, `stars_100`,
        `stars_500`, `first_reward`, `goal_reached`. A badge is earned once per
        person and never taken away: unticking, a falling balance or a broken
        week leave it in place. `stars_100` and `stars_500` count every star
        earned (ticks and parents' positive bookings), not the balance.
        `new` is true for a badge earned today or yesterday (household time
        zone) while the person's switch "week count and badges" was on.
        `name` and `how` are in the language of the request. Read only: there is
        no way to award or remove a badge. While `streaks_shown` is false the
        list is empty (badges are hidden everywhere, but still earned and
        stored). Everyone may read it; there is no ranking between people.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The badges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Badges" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /people/{id}/savings-goal:
    get:
      operationId: getSavingsGoal
      summary: A person's savings goal (scope tasks:read)
      description: |
        The reward a person saves for (ticket 293), with their star balance
        (the number of the star chip; nothing is set aside) and whether it is
        reached (`balance >= price`, the reward's current price). Without a goal
        `reward_id` is null. A goal ends by itself when its redemption is
        confirmed, when the reward is archived or deleted, or when it is no
        longer meant for the person; `ended` then says why and when, for 7 days
        or until a new goal is chosen. Everyone may read it. There is exactly
        one goal per person and no ranking between people.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The savings goal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsGoal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setSavingsGoal
      summary: Choose a savings goal (scope tasks:complete, parents for anyone, a child only for themselves)
      description: |
        Replaces the person's goal (and any ended line). The reward must be
        offered (not archived) and meant for the person, else 422 with field
        `reward_id`. A child changing another person's goal gets 403.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_id]
              properties:
                reward_id: { type: string, format: uuid }
      responses:
        "200":
          description: The savings goal now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsGoal" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: clearSavingsGoal
      summary: Clear the savings goal (scope tasks:complete, parents for anyone, a child only for themselves)
      description: The stars stay. Without a goal nothing happens.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: No savings goal now }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rewards:
    get:
      operationId: listRewards
      summary: The reward catalogue (scope tasks:read)
      description: |
        What children trade their stars for (ticket 291). A parent gets every
        reward, archived ones included, with `redeemed` (how often it was
        confirmed). A child gets only the offered rewards meant for them, sorted
        by price and then name, each with `affordable` (their star balance
        covers the price), `limit_reached` and `available_again` (the start of
        the next period when the limit is used up). A limit counts the person's
        confirmed redemptions in the current calendar day, week (Monday to
        Sunday) or month in the household time zone, not a rolling window. For a
        child `redeemed` and `created_by` are null; for a parent the three
        child fields are null.
      responses:
        "200":
          description: The rewards, by price and name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReward
      summary: Add a reward (scope tasks:write, parents only)
      description: |
        `name` (at most 60 characters) and `price` (1 to 999 stars) are
        required, and so is the audience: `whole_family: true` (everyone, also
        people who join later) or `person_ids` (at least one). The picture is
        a `symbol` (an emoji of the Noto Emoji set, default the gift) or a
        photo sent with `PUT /rewards/{id}/picture`; a reward never fetches a
        picture from the web. `limit_period` is `none` (default), `day`,
        `week` or `month`; `limit_count` (1 to 99) is required with a period
        and must be left out without one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /rewards/requests:
    get:
      operationId: listRewardRequests
      summary: Requests to redeem rewards (scope tasks:read)
      description: |
        A parent gets the open requests of the household, oldest first. A child
        gets their own: the open ones and the ones decided in the last 7 days
        (confirmed or declined), oldest first.
      responses:
        "200":
          description: The requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /rewards/requests/{id}/withdraw:
    post:
      operationId: withdrawRewardRequest
      summary: A child takes an open request back (scope tasks:complete, children only)
      description: |
        The stars were never booked, so they are free again. A request decided
        already is 409 with `code: decided` and who decided it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RedemptionRefused" }
  /rewards/requests/{id}/confirm:
    post:
      operationId: confirmRewardRequest
      summary: Say yes to a request (scope tasks:write, parents only)
      description: |
        Balance and limit are checked again and the price is booked in the
        star log in one transaction ("Eingelöst: symbol name", negative). When
        either fails the request stays open and the answer is 409 with `code`
        `stars` (and `missing`) or `limit` (and `available_again`). A second
        decision books nothing and is 409 with `code: decided`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RedemptionRefused" }
  /rewards/requests/{id}/decline:
    post:
      operationId: declineRewardRequest
      summary: Say no to a request (scope tasks:write, parents only)
      description: The child keeps the stars. The note is optional (at most 120 characters) and the child sees it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RedemptionRefused" }
        "422": { $ref: "#/components/responses/Invalid" }
  /rewards/{id}/ask:
    post:
      operationId: askReward
      summary: A child asks a parent for a reward (scope tasks:complete, children only)
      description: |
        Nothing is booked. The price must fit into the child's free stars: the
        balance minus the prices of their other open requests (else 409,
        `code: stars`). A child has at most one open request per reward (else
        409, `code: asked`) and cannot ask while the limit is used up (409,
        `code: limit`). The request keeps the reward's name, symbol, picture
        and price as they are now.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The open request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RedemptionRefused" }
  /rewards/{id}/redeem:
    post:
      operationId: redeemReward
      summary: A parent redeems a reward for a person now (scope tasks:write, parents only)
      description: |
        The same balance and limit checks as a confirmation (409 with `code`
        `stars` or `limit`); the stars go at once. When the person has an open
        request for this reward, that request is confirmed instead of a second
        booking, and the answer is that request (`direct: false`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person_id]
              properties:
                person_id: { type: string, format: uuid }
      responses:
        "201":
          description: The confirmed redemption
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redemption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RedemptionRefused" }
        "422": { $ref: "#/components/responses/Invalid" }
  /rewards/{id}:
    get:
      operationId: getReward
      summary: One reward (scope tasks:read)
      description: A child gets 404 for an archived reward and for one meant for others.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateReward
      summary: Change an offered reward (scope tasks:write, parents only)
      description: |
        Fields left out keep their value. A new price applies from now on;
        earlier redemptions keep the price they had. `symbol` replaces a photo
        by a symbol, `remove_picture` takes the photo away (the symbol shows).
        An archived reward is 409: offer it again first.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardWrite" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RewardConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteReward
      summary: Delete a reward that was never redeemed (scope tasks:delete, parents only)
      description: |
        A reward with a confirmed redemption is 409: archive it with
        `POST /rewards/{id}/archive`, so the star logs stay right.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RewardConflict" }
  /rewards/{id}/archive:
    post:
      operationId: archiveReward
      summary: Archive a reward (scope tasks:write, parents only)
      description: |
        An archived reward is hidden from children and from the child view of
        the API. Redemptions stay in the star logs. Archiving again changes
        nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rewards/{id}/restore:
    post:
      operationId: restoreReward
      summary: Offer an archived reward again (scope tasks:write, parents only)
      description: |
        A reward the box archived itself (`archived_reason: audience_gone`)
        was meant only for people who left the household. It is never offered
        to the whole family by itself: the body must say who it is for now
        (`whole_family: true` or `person_ids`), else 422. For any other
        archived reward the body is optional; with one, it replaces the audience.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                whole_family: { type: boolean }
                person_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Offered again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /rewards/{id}/picture:
    get:
      operationId: getRewardPicture
      summary: The stored photo of a reward, a JPEG of at most 512 px (scope tasks:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The picture
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setRewardPicture
      summary: Set the photo of a reward (scope tasks:write, parents only)
      description: |
        The request body is the photo itself: JPEG, PNG, WebP or GIF, at most
        15 MB. The box turns it upright, scales it to at most 512 px and stores
        it as JPEG without metadata (place, camera). Refused with 422 when it is
        too large, not a picture or a web page.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RewardConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists:
    get:
      operationId: listLists
      summary: The household's lists with their number of entries (scope lists:read)
      description: |
        Oldest first. Every list belongs to the household and has no audience.
        A new box has the lists "Shopping" and "To-dos". Everyone, children
        included, may read lists.
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/List" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createList
      summary: Create a list (scope lists:write, parents only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewList" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getList
      summary: One list with its entries in the order the list shows them (scope lists:read)
      description: |
        An alphabetical list orders its entries by text, ignoring case and
        treating ä, ö, ü like a, o, u; a manual list follows the positions
        set with `PUT /lists/{id}/entries/{entry}/position`.
      responses:
        "200":
          description: The list with its entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListWithEntries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateList
      summary: Rename a list or change its colour, symbol or sorting (scope lists:write, parents only)
      description: Switching the sorting keeps the manual order, so switching back restores it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListChange" }
      responses:
        "200":
          description: The changed list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteList
      summary: Delete a list with all its entries (scope lists:delete, parents only)
      description: A child is refused with 403.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lists/{id}/entries:
    post:
      operationId: addListEntry
      summary: Add an entry at the end of a list (scope lists:write, parents only)
      description: |
        An alphabetical list shows it at its place by text.

        A list with `suggestions` takes an article of the library (`article_id`,
        the key of a shipped article or the id of an own one; or the exact name
        in `text`, in German or English, which is the same) and a quantity
        (`amount` and `unit`). The entry's text is then the article's name in
        the language of the request. Only open entries merge:

        - the same article (or the same text, ignoring case) with a unit of the
          same kind **adds up** (500 g + 1 kg = 1.5 kg; 6 pieces + 1 dozen = 18
          pieces), the total shown in the article's first default unit where it
          fits (`result: added_to`, status 200);
        - an entry without quantity takes the quantity (`filled`, 200);
        - adding without a quantity something that is already there makes no
          second entry (`exists`, 200);
        - another kind (piece, pack, bunch, weight, volume) gets its own entry
          directly under the old one (`added`, 201).

        `unit` is optional: the unit last used for the article, otherwise its
        first default unit. `amount` is a number above 0 up to 9999; a unit
        that is switched off (`GET /units`) is refused. A list without
        suggestions takes plain `text` only.

        `variety` is the more exact kind of an article ("Mehl · Type 405"): the
        entry stands next to the same article without a variety, and
        quantities add up only for the same article **and** variety, ignoring
        case, spaces and umlauts (`Type 405` and `type  405` are one). Adding
        without a quantity says `exists` only when article and variety are both
        equal. A variety needs an article (`article_id`, or a `text` that names
        one) and at most 60 characters, else 422 with field `variety`; free
        text has none. Allergens and diets come from the article, never from
        the variety.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 200 }
                article_id: { type: string, description: "Key of a shipped article or id of an own one" }
                amount: { type: number, description: "Above 0, at most 9999; anything else is refused with 422" }
                unit: { type: string, description: "A key of `GET /units`; one that is switched off is refused with 422" }
                variety: { type: string, nullable: true, description: "The variety of the article, at most 60 characters (422 otherwise), for example `Type 405`; trimmed, inner spaces collapsed. Null or empty: none. Only with an article, else 422 with field `variety`" }
      responses:
        "200":
          description: Merged into an entry that was there, or already there
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntryResult" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntryResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}/entries/{entry}:
    patch:
      operationId: setListEntryQuantity
      summary: Change the quantity or the variety of an open entry (scope lists:write, parents only)
      description: |
        Send `amount` (with `unit`), `variety` or both; what is left out stays.
        `variety` replaces the variety (null or empty takes it away); only an
        entry with an article has one (422 with field `variety` for free text
        or more than 60 characters). When another open entry has the same
        article, the same variety as it will be and the same kind of quantity,
        this entry goes into it (`result: merged`, the answer is the entry that
        stays).

        The amount **replaces** the old quantity and never adds to it. The
        caller converts a change of unit within one kind (500 g to 0.5 kg keeps
        the amount). `amount` is rounded as shown (two decimals, whole g and ml);
        sending back the rounded number of the entry's own quantity, in any unit
        of its kind, keeps the exact total. The total is shown by the same rules
        as when adding. When
        the article is already on the list in the new kind (or, for `amount:
        null`, with any other entry), this entry goes into it (`result: merged`,
        the answer is the entry that stays); otherwise `result: set`.
        `amount: null` takes the quantity away. An entry that is ticked off or
        gone answers 409. Only on lists with `suggestions`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of `amount` and `variety`
              properties:
                amount: { type: number, nullable: true, description: "Above 0, at most 9999; null takes the quantity away. Left out: the quantity stays" }
                unit: { type: string, description: "A key of `GET /units`; one that is switched off is refused with 422" }
                variety: { type: string, nullable: true, description: "The new variety, at most 60 characters (422 otherwise); null or empty takes it away. Left out: the variety stays" }
      responses:
        "200":
          description: The entry now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntryResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The entry is ticked off or gone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteListEntry
      summary: Delete one entry (scope lists:delete, parents only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lists/{id}/entries/{entry}/done:
    put:
      operationId: setListEntryDone
      summary: Tick an entry off or back open (scope lists:complete)
      description: Everyone, children included, may do this. Ticking twice changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}/entries/{entry}/position:
    put:
      operationId: moveListEntry
      summary: Move an entry to a place of a manually sorted list (scope lists:write, parents only)
      description: Position 0 is first. Refused with 422 on an alphabetical list.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The entries in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}/completed-entries:
    delete:
      operationId: deleteCompletedListEntries
      summary: Delete all ticked-off entries of a list (scope lists:delete, parents only)
      description: Open entries stay.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: How many entries were deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /units:
    get:
      operationId: getUnits
      summary: The units a quantity can have in this household (scope lists:read)
      description: |
        `active` are the units that can be chosen when adding. They follow the
        country of the home (`country`) until a parent changes them (`custom:
        true`): metric plus piece, dozen, pack and bunch in most countries; the
        United Kingdom adds imperial units; the United States use US customary.
        `units` lists every unit of the catalogue with its group, kind
        (`count`, `pack`, `bunch`, `weight`, `volume`: only units of one kind
        convert into each other) and size in pieces, grams or millilitres.
      responses:
        "200":
          description: The units
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Units" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setUnits
      summary: Switch units on and off (scope lists:write, parents only)
      description: |
        Piece is always on; unknown keys are dropped. Weight and volume each
        keep at least one unit, otherwise 422 names the group in `field`
        (`weight` or `volume`). Switching a unit off changes no entry that is
        already on a list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: array, items: { type: string }, description: "Keys of `GET /units`" }
      responses:
        "200":
          description: The units now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Units" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: resetUnits
      summary: Go back to the preset of the home's country (scope lists:write, parents only)
      responses:
        "200":
          description: The units now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Units" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /articles:
    get:
      operationId: listArticles
      summary: The article library, shipped and own articles (scope lists:read)
      description: |
        The articles Hejmo ships (`source: hejmo`, about 250, German and English
        names) and the household's own ones (`source: own`). Optional `q` keeps
        the articles whose name holds the text, ignoring case and umlauts.
        `units` are the article's default units, `offered_units` the ones the
        add card offers: those that are switched on, a switched-off one
        replaced by the nearest active unit of its kind (kg by g), piece when
        nothing is left. Articles say which
        allergens they contain; who is warned about them is health data, see
        `/articles/{id}/warnings`.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The articles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createArticle
      summary: Add an own article (scope lists:write, parents only)
      description: |
        `kind` has no default: `meat`, `fish`, `veg`, `vegan` or `nonfood`.
        Allergens are keys of the 14 main EU allergens and are cleared for
        `nonfood`. `unit1` is required (default piece), `unit2` optional; both
        must be switched on. A picture is either a `symbol` (an emoji of the Noto
        Emoji set) or a `picture_url` that the box downloads once (http or
        https, public addresses only, at most 15 MB, 10 seconds); the box stores a
        scaled-down JPEG without metadata and never links to the address. A
        photo is sent with `PUT /articles/{id}/picture`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /articles/{id}:
    get:
      operationId: getArticle
      summary: One article, by its key (shipped) or id (own) (scope lists:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateArticle
      summary: Change an own article (scope lists:write, parents only)
      description: |
        Fields left out keep their value. `symbol` replaces a picture by a
        symbol, `picture_url` replaces it by a downloaded image,
        `remove_picture` takes it away (the tile then shows the symbol of the
        department). Articles from Hejmo cannot be changed (422): hide them or
        copy them.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleWrite" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteArticle
      summary: Delete an own article (scope lists:delete, parents only)
      description: Entries on lists keep their text.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /articles/{id}/picture:
    get:
      operationId: getArticlePicture
      summary: The stored picture of an own article, a JPEG of at most 512 px (scope lists:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The picture
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setArticlePicture
      summary: Set the picture of an own article from a photo (scope lists:write, parents only)
      description: |
        The request body is the photo itself: JPEG, PNG, WebP or GIF, at most
        15 MB. The box turns it upright, scales it to at most 512 px and
        stores it as JPEG without metadata (place, camera). Refused with 422
        when it is too large, not a picture or a web page.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /articles/{id}/hidden:
    put:
      operationId: setArticleHidden
      summary: Hide an article from Hejmo by hand, or show it again (scope lists:write, parents only)
      description: |
        A hidden article is not suggested; typing it by hand still works. Own
        articles are deleted, not hidden (422).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        "200":
          description: The article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /articles/{id}/pantry:
    put:
      operationId: setArticlePantry
      summary: Mark an article as a pantry article, or not (scope lists:write, parents only)
      description: |
        Works for every article. Pantry articles are usually at home (salt,
        oil, spices); recipes leave them out of the shopping list by default.
        Hejmo ships typical pantry articles marked; this changes the mark for
        the household only. For an own article it is the same as `pantry` of
        `PATCH /articles/{id}`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pantry]
              properties:
                pantry: { type: boolean }
      responses:
        "200":
          description: The article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /articles/{id}/copy:
    post:
      operationId: copyArticle
      summary: Make an own version of an article from Hejmo (scope lists:write, parents only)
      description: |
        Copies name (in the language of the request), department, units and
        allergens as an own article and hides the original.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: The own article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /articles/{id}/always:
    get:
      operationId: getArticleAlways
      summary: The rule "always on the list" of an article (scope lists:read)
      description: |
        Per article (the key of an article from Hejmo or the id of an own one)
        one rule: on `weekday` of every `every`-th week from `start_week` Hejmo
        puts the article on the list at the household's time (`/library/always`).
        404 when the article has no rule.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlwaysRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setArticleAlways
      summary: Set the rule of an article, or switch it off (scope lists:write)
      description: |
        With `enabled: false` the rule is switched off and keeps what it says
        (404 without a rule). Otherwise `list_id` and `weekday` are required;
        `every` is 1 to 52 weeks (default 1), `start_week` any day of the first
        week (default this week), `quantity` optional: without it an article
        that is already open on the list is left as it is, with it Hejmo adds
        the quantity. A rule saved on its own day starts the next time. A rule
        whose list was deleted is paused: `paused` is true and `list_id` null.
        A rule that does not fit answers 422 with the `field` that is wrong:
        `list_id`, `weekday`, `every`, `start_week`, `quantity.amount` or
        `quantity.unit`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                list_id: { type: string, format: uuid }
                weekday: { type: integer, description: "1 Monday to 7 Sunday (422 otherwise)" }
                every: { type: integer, description: "1 to 52 (422 otherwise)" }
                start_week: { type: string, description: "A day, YYYY-MM-DD (422 otherwise)" }
                quantity:
                  type: object
                  required: [amount, unit]
                  properties:
                    amount: { type: number }
                    unit: { $ref: "#/components/schemas/UnitKey" }
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlwaysRule" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteArticleAlways
      summary: Remove the rule of an article (scope lists:delete)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/always:
    get:
      operationId: getLibraryAlways
      summary: The time of day, the holiday and all rules of "always on the list" (scope lists:read)
      responses:
        "200":
          description: The settings and the rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlwaysSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setLibraryAlways
      summary: Set the time of day and the holiday for all rules (scope lists:write)
      description: |
        `time` is the household's local time as `HH:MM`. `holiday` pauses all
        rules from its first to its last day, both included; nothing is caught
        up afterwards, and it switches itself off after its last day. `null`
        means no holiday. The last day may not be before the first or already
        over (422 with the field `holiday.from` or `holiday.to`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time]
              properties:
                time: { type: string, description: "HH:MM, 24 hours (422 otherwise)" }
                holiday:
                  nullable: true
                  allOf:
                    - { $ref: "#/components/schemas/AlwaysHoliday" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlwaysSettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /articles/{id}/warnings:
    get:
      operationId: getArticleWarnings
      summary: Who has to look out for an article, and whether Hejmo suggests it (scope health:read, parents only)
      description: |
        Health data: who is allergic and which diets an article suits. People
        with exactly the same allergens share one entry. The answer is
        experimental and without guarantee: it only knows the 14 main
        allergens as tagged in the library, no traces, and cannot check free
        text (`note`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleWarnings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/hiding:
    get:
      operationId: getLibraryHiding
      summary: The experimental setting that hides articles with an allergen (scope health:read, parents only)
      responses:
        "200":
          description: The setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hiding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setLibraryHiding
      summary: Switch the hiding on or off (scope health:write, parents only)
      description: |
        Off by default and experimental: Hejmo guarantees no completeness and
        takes no liability. Switching it on needs `confirm: true`, which says
        that the person behind the token read the notice; they are recorded
        with the time. `everyone` hides for everyone with allergies, otherwise
        only for `people`. Free text is never hidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                everyone: { type: boolean }
                people:
                  type: array
                  items: { type: string, format: uuid }
                confirm: { type: boolean }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hiding" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /groups:
    get:
      operationId: listGroups
      summary: Subgroups such as "School children"
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                members: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /groups/{id}:
    patch:
      operationId: updateGroup
      summary: Rename a subgroup or replace its members (parents only, scope people:write)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                members: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteGroup
      summary: Delete a subgroup (parents only, scope people:write)
      description: A subgroup that still decides who sees a calendar or an event is not deleted (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The subgroup is still used by a calendar or an event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /calendars:
    get:
      operationId: listCalendars
      summary: Calendars (local family calendar, synced calendars) with their audience
      responses:
        "200":
          description: Calendars
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: addCalendar
      summary: Subscribe to an ICS calendar (parents)
      description: |
        Adds a read-only calendar from an ICS address (`https://`, `http://` or `webcal://`)
        and syncs it once right away. If that first sync fails the calendar is still added;
        the failure is in the sync log and the scheduler retries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCalendar" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendars/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCalendar
      summary: Change a synced calendar (share through the box, two-way / read-only, waste collection, name, colour, audience)
      description: |
        Send at least one field. `share_through_box` switches sharing through the box for a synced
        calendar; the family calendar is always served to personal devices, asking to change it answers 422.
        `read_only` switches a CalDAV calendar between two-way (the default: events created, changed or deleted on the box
        are written back to the server right away, ADR 0012) and read-only (the box never writes; API edits answer 422).
        ICS and local calendars have no such switch and answer 422. Switching back to two-way pushes
        changes still queued and also removes `waste_collection` (only a read-only calendar can be a waste collection calendar).
        `name`, `color` and `audience` can only be changed on a synced calendar (else 422; 404 if no calendar has the id); a field
        left out stays as it is. Changing them sends nothing to the calendar's source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                share_through_box: { type: boolean }
                read_only: { type: boolean, description: "CalDAV calendars only; false (two-way) also clears waste_collection" }
                waste_collection: { type: boolean, description: "Only a read-only calendar can be marked, else 422" }
                name: { type: string, minLength: 1 }
                color: { type: string, example: "#B4583A", description: "#RRGGBB, else 422" }
                audience: { $ref: "#/components/schemas/Audience" }
      responses:
        "200":
          description: The calendar after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: removeCalendar
      summary: Remove a synced calendar and its events from the box
      description: Nothing is deleted outside the box. An ICS subscription goes with its calendar; a CalDAV calendar leaves its connection and the connection's other calendars alone. The family calendar cannot be removed.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendars/{id}/sync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncCalendarNow
      summary: Sync a calendar now
      description: Answers 200 with the calendar and its new sync state, also when the sync failed (see `sync.last_error` and the sync log).
      responses:
        "200":
          description: Calendar after the sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "404": { $ref: "#/components/responses/NotFound" }
  /google:
    get:
      operationId: getGoogleApp
      summary: The family's Google app registration (parents, scope settings:read)
      description: |
        Google lets programs reach calendars only with an app registration (an OAuth client of type
        "Web application"). Each family creates its own at Google (ADR 0013); the box keeps one per household.
        This returns the client ID, the two redirect URIs and the scope to enter at Google, and the Google
        accounts already connected. The client secret is stored encrypted and never returned.
      responses:
        "200":
          description: The app registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleApp" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setGoogleApp
      summary: Enter or replace the Google app registration (parents, scope settings:write)
      description: |
        Stores the client ID (it ends with `.apps.googleusercontent.com`, else 422 with `field`
        `client_id`) and the client secret (encrypted). Another client ID applies to all Google connections:
        their sign-ins belong to the old client, so they are marked `needs_signin` and listed in
        `sign_in_again`. The same client ID with a new secret keeps them. Nothing is sent to Google.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: { type: string, example: "318046275519-k7q2m9xlb4tn0c8e1rvd6hf3ys5pjw2a.apps.googleusercontent.com" }
                client_secret: { type: string, writeOnly: true, description: "Shown by Google only once. Stored encrypted, never returned" }
      responses:
        "200":
          description: The app registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleApp" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The client ID or the client secret is not valid; `field` names it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /google/authorize:
    post:
      operationId: startGoogleSignIn
      summary: Start signing in at Google (parents, scope settings:write)
      description: |
        Makes the PKCE pair (S256) and a `state` that the box signs, valid for 15 minutes and for one use,
        and returns the address at Google to open in a browser. Nothing is created before this call.
        `way` `relay` sends Google's answer through the static page `https://hejmo-home.github.io/oauth/`,
        which forwards it to the box (`https://<box>/connections/google/callback`); it only works when the
        relay page may go back to the address this request reached the box under (https, or http to an
        address in the home network), else the answer says `fallback`. On the `fallback` way Google sends
        the browser to `http://127.0.0.1:8099/`, which shows an error; the address in the address bar is
        then given to `POST /google/callback` as `url`. With `connection_id` an existing Google connection
        signs in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                way: { type: string, enum: [relay, fallback], default: relay }
                connection_id: { type: string, format: uuid, description: "A Google connection that signs in again" }
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [url, way, redirect_uri, expires_at]
                properties:
                  url: { type: string, description: "The address at Google" }
                  way: { type: string, enum: [relay, fallback], description: "The way that will be used" }
                  redirect_uri: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OffNow" }
        "422": { $ref: "#/components/responses/Invalid" }
  /google/callback:
    post:
      operationId: finishGoogleSignIn
      summary: Finish signing in at Google (parents, scope settings:write)
      description: |
        Takes what Google sent back, either the whole address from the address bar of the fallback way
        (`url`) or its parts (`code`, `state`, `error`, `scope`). The `state` must be one the box made,
        not older than 15 minutes and not used before; the code is then exchanged with the PKCE verifier and
        the refresh token is stored encrypted. A new Google account becomes a connection (201); an account
        that already has a connection, or a connection that signs in again, gets the new refresh token
        (200) and its calendars sync again at once. Tick calendars with `POST /calendar-connections/{id}/calendars`.
        Otherwise 422 with `problem`: `state_unknown`, `state_expired`, `state_used`, `cancelled`,
        `code_rejected`, `scope_missing`, `client_rejected`, `wrong_account` (another Google account than the
        connection that asked; `account` and `nonce` are then given: `POST /google/adopt` adds it as a new
        connection), `not_a_callback`, `unreachable`, `no_app`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, example: "http://127.0.0.1:8099/?state=hj1.aHR0cHM6Ly9ib3g.AbCd&code=4%2F0AVMB&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fcalendar" }
                code: { type: string }
                state: { type: string }
                error: { type: string, example: access_denied }
                scope: { type: string }
      responses:
        "200":
          description: An existing connection signed in again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "422":
          description: The sign-in did not work; `problem` says why and nothing was stored
          content:
            application/json:
              schema:
                type: object
                required: [error, problem]
                properties:
                  error: { type: string }
                  problem: { type: string, enum: [state_unknown, state_expired, state_used, cancelled, code_rejected, scope_missing, client_rejected, wrong_account, not_a_callback, unreachable, no_app] }
                  account: { type: string, description: "With wrong_account: the Google account that signed in" }
                  nonce: { type: string, description: "With wrong_account: for POST /google/adopt" }
  /google/adopt:
    post:
      operationId: addStashedGoogleAccount
      summary: Add the account of a sign-in that was for another connection as a new connection (parents, scope settings:write)
      description: The `nonce` comes from a `wrong_account` answer of `POST /google/callback`. It works once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendar-connections:
    get:
      operationId: listCalendarConnections
      summary: CalDAV, iCloud and Google connections (parents, scope settings:read)
      description: Never contains a password, a refresh token or a client secret.
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: connectCalendarServer
      summary: Connect iCloud or another CalDAV server and discover its calendars (parents, scope settings:write)
      description: |
        Signs in to the server and lists its event calendars; nothing is synced yet. The
        connection is stored only if that works: a refused login or an unreachable server
        answers 422 and stores nothing. The password is encrypted with the box's key
        (AES-256-GCM) and never returned. Tick calendars with `POST /calendar-connections/{id}/calendars`.
        For iCloud use an app-specific password. With `single_calendar` the address is that of
        one calendar, entered by hand, and only that calendar is offered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCalendarConnection" }
      responses:
        "201":
          description: Connected, with the discovered calendars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendar-connections/outlook/sign-ins:
    post:
      operationId: startOutlookSignIn
      summary: Start the device sign-in of an Outlook (Microsoft) account (parents, scope settings:write)
      description: |
        Asks Microsoft for a device code (a public client: the box holds no secret). The parent opens the
        verification address on any personal device or computer, enters `user_code`, signs in and chooses Accept; the
        box notices by itself, see `GET /calendar-connections/outlook/sign-ins/{id}`. A code is valid for
        15 minutes, so fetch it only when the parent is ready. `client_id` is the app ID of the family's own
        app registration; left out, the Hejmo project's registration is used (422 if the box has none).
        With `connection_id` the sign-in renews an existing connection whose Microsoft sign-in ended; only the
        same account is accepted. Personal Microsoft accounts work first; work and school accounts work
        unless the tenant requires admin consent (state `consent_required`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: string, description: "App ID of the family's own app registration" }
                connection_id: { type: string, format: uuid, description: "Reconnect this Outlook connection" }
      responses:
        "201":
          description: A code to enter at Microsoft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlookSignIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OffNow" }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { description: "Microsoft did not answer, so there is no code" }
  /calendar-connections/outlook/sign-ins/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOutlookSignIn
      summary: State of an Outlook sign-in; asks Microsoft if its interval has passed (parents, scope settings:write)
      description: |
        Poll about every `interval_seconds`. When the person has signed in, the connection is stored (the
        refresh token sealed, never returned) and `connection_id` names it; an account the box already has is
        renewed, not added twice. The sign-in is kept in the box's memory for an hour.
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlookSignIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OffNow" }
  /calendar-connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeCalendarConnection
      summary: Remove a connection with its synced calendars and their events from the box (parents, scope settings:delete)
      description: Nothing is deleted outside the box.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendar-connections/{id}/credentials:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: changeConnectionPassword
      summary: Replace the password of a connection, after the server accepted it (parents, scope settings:write; not for Google)
      description: |
        Signs in with the new password and lists the server's calendars, as when connecting. Only if that
        works is the password stored (encrypted with the box's key, never returned) and the connection's
        calendars synced again at once. A refused login, a server that points to another domain and an
        unreachable server answer 422 and keep the old password. For iCloud use an app-specific password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, writeOnly: true }
      responses:
        "204": { description: The password was checked and stored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendar-connections/{id}/calendars:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: discoverConnectionCalendars
      summary: List the server's calendars again, marking those already synced (parents, scope settings:write)
      responses:
        "200":
          description: The connection with its calendars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: addConnectionCalendar
      summary: Sync one of the server's calendars (parents, scope settings:write)
      description: |
        Adds the calendar with its colour and audience and syncs it once right away; if that
        first sync fails the calendar is still added (see the sync log) and the scheduler retries.
        `url` must be a calendar on the connection's server and not yet synced. These calendars
        are two-way (see `PATCH /calendars/{id}`); delta sync runs every 5 minutes by default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewConnectionCalendar" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendar-connections/{id}/event-counts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: countConnectionEvents
      summary: How many events each of the server's calendars has in the import window (parents, scope settings:write)
      description: |
        Lists the server's calendars again and asks the server to count, per calendar, the events in the
        import window: the past 12 months and everything later, a series counting once. Nothing is
        downloaded or stored. The calendars are asked together, each within a timeout; a calendar the
        server does not answer in time (or cannot count) has `state` `unknown` and the others are
        unaffected. The web page asks for this after it has been shown, so a slow server cannot block it.
      responses:
        "200":
          description: One entry per calendar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventCount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OffNow" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /sync-log:
    get:
      operationId: listSyncLog
      summary: Sync problems (failures, conflicts and remarks), newest first (parents, scope settings:read)
      description: A record of problems only. Successful runs show as `sync.last_success_at`, `sync.event_count` and `sync.last_run` of each calendar.
      responses:
        "200":
          description: At most 200 entries from the last 30 days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncLogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /https:
    get:
      operationId: getHTTPS
      summary: How the box secures HTTPS and whether its certificate needs attention (parents, scope settings:read)
      description: |
        `own-ca` is the box's own certificate authority (it is renewed by the box). Without `warning` there is
        nothing to do. With `warning` true it is the fallback of a configured box whose public certificate could
        not be loaded or obtained (decision Q27): the box serves its own CA's certificate on HTTPS, never
        plain HTTP, and personal devices must first trust the own CA (`/ca`); `renewal_error` says why.
        `public` is a publicly trusted certificate for the family's DNS name (ADR 0014); `warning` is set when its
        renewal failed or it is about to expire.

        With the own CA, `names` lists what the box certificate is valid for (the box name, the address of the
        box in the home network, and the router name if there is one), `router_name` is the name of the box in
        the family's router (decision Q92) and `expires_at` is when the CA ends.
      responses:
        "200":
          description: HTTPS status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPSStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: setRouterName
      summary: Add the box's name in the router to its certificate (parents, scope settings:write)
      description: |
        The page "Sichere Verbindung" of the web interface as an API call (decision Q92). Only with the box's own
        CA. The box CA is name-constrained to the box, so a new name needs a **new CA**: it replaces the old one
        and an earlier router name, and **every device must trust the box again** (trust page `/ca`, which
        opens over plain HTTP; the CA's fingerprint changes). The name is lower-cased and a trailing dot is
        dropped. It must have at least two labels of letters a to z, digits and hyphens, and must not be an
        address or a name the certificate covers already (422). With a public name the box has no use for
        it (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [router_name]
              properties:
                router_name: { type: string, example: hejmo.fritz.box, description: "The name the router shows for the box, for example hejmo.fritz.box" }
      responses:
        "200":
          description: HTTPS status with the new certificate names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPSStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The box uses a public name, or has no CA yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The name is missing, cannot go into a certificate or is covered already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /settings:
    get:
      operationId: getSettings
      summary: Household settings (scope settings:read)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateSettings
      summary: Change household settings; omitted fields stay as they are (scope settings:write)
      description: |
        The time format applies to every time shown in the web interface and
        on displays (ADR 0016). An unknown `date_format` is refused with 400, an
        unknown value of any other field with 422.

        The home place sets where sunrise and sunset are computed (front light
        of displays, themes) and which weather is shown. Give `home_place_id`,
        the id of a place of the list on the box (find it with `GET /places`):
        the name and the coordinates then come from the list, and giving
        `home_name`, `latitude` or `longitude` as well is refused. Or give
        `latitude` and `longitude` together (degrees, -90 to 90 and -180 to 180);
        a new `home_name` needs them too, and the stored `home_place_id` becomes
        null. An unknown place id, out-of-range or lone coordinates are refused
        with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/Invalid" }
  /places:
    get:
      operationId: searchPlaces
      summary: Search the places on the box, to set the home location (scope settings:read)
      description: |
        Searches the list of towns, villages and districts of Germany, Austria
        and Switzerland that ships on the box (GeoNames, CC BY 4.0). The answer
        comes from the box; nothing goes to the internet. Matching is case- and
        diacritic-insensitive (ü = ue, ß = ss) over the name, the ASCII name and the
        alternate names in German, English, French and Italian. It starts at two
        letters (a shorter name is an empty list). Names that start with the
        text come before names with a word that does, then larger places come
        first. At most five places are listed; `more` says that more matched.
        No match is an empty list. Use the `id` as `home_place_id` of
        `PATCH /settings`.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 100 }, description: "The text to search for, for example Pasing; blank or longer than 100 characters is refused with 422" }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [de, en] }, description: "The language of the region label; default the language of the request. Anything else is refused with 422" }
      responses:
        "200":
          description: The matching places, best match first
          content:
            application/json:
              schema:
                type: object
                required: [places, more]
                properties:
                  places: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Place" } }
                  more: { type: boolean, description: "True if more than five places matched; the five largest are listed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /outbound:
    get:
      operationId: getOutbound
      summary: Offline mode, the connections to the outside, and what the box refused (scope settings:read)
      description: |
        The box makes every connection to the outside through one gate (ticket 201).
        With `offline` true, the gate refuses all of them and records each attempt in
        `refused`, newest first (at most 200); `connections` then show every switch as
        `locked`. `enabled` is the state the connection is in now: with offline mode on
        it is false for all, while the switches themselves are kept and come back when
        offline mode goes off. The DNS service has no switch (`switchable` false): it is
        in use while the box has a `public_name`. `last_contact` is the last time the box
        reached the service (for `update`, the last time the host script looked).
        Place search is not listed: the list of places is on the box.
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outbound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateOutbound
      summary: Switch offline mode or single connections; omitted fields stay as they are (scope settings:write)
      description: |
        `offline` switches offline mode on or off; switching it off brings every
        switch back as it was before. `connections` maps a connection id to its
        switch; it is refused with 409 while offline mode is on (the switches are
        locked), and with 422 for an id without a switch (`dns` among them).
        Switching offline mode on while the box has a `public_name` is refused with
        409: that needs the change to the home network (`POST /outbound/offline`).
        `update_reminder_days` (7 to 365) is how many days without an update make
        the web interface remind parents (offline mode).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundUpdate" }
      responses:
        "200":
          description: The state after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outbound" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The switches are locked by offline mode, or the public name must be left first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /outbound/offline:
    post:
      operationId: goOffline
      summary: Switch offline mode on, leaving a public name first if the box has one (scope settings:write)
      description: |
        The change the web page "Switch on offline mode" makes, in its order: with
        `delete_dns` true the box first deletes its records at the DNS service (the
        last connection to the outside), then forgets the public name, makes its own
        certificate for its address at home and switches offline mode on. Every device
        must trust the box's own CA again, and passkeys only work for the old name.
        If the DNS service refuses, nothing is changed (502). Without a public name it
        only switches offline mode on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delete_dns: { type: boolean, description: "Delete the box's DNS records at the DNS service first (default false)" }
      responses:
        "200":
          description: The state after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outbound" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: The DNS service did not delete the records; nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /update:
    get:
      operationId: getUpdate
      summary: Auto-update mode and what the host script last did (scope settings:read)
      description: |
        The host-side update script (ADR 0018) reports through a small status
        file; this is its content with fixed values only. `notice` says whether
        the web interface shows a notice to parents: after an update (what is new),
        after a rollback or a rejected image (with the `reason`), and, with
        mode `notify`, while a newer version is available.
      responses:
        "200":
          description: Update status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /update/dismiss:
    post:
      operationId: dismissUpdateNotice
      summary: Dismiss the current update notice so it is not shown again (scope settings:write)
      description: A notice about an available update (mode notify) cannot be dismissed; it goes when the update is installed.
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /update/file:
    get:
      operationId: getUpdateFile
      summary: The uploaded update file that waits or installs, and whether one can be uploaded (scope settings:read)
      description: |
        In offline mode (or with the update check switched off) a parent can bring a
        release to the box as a file instead of the nightly check: `POST` it, check what
        it holds, then confirm with `POST /update/file/install`. `available` says whether
        a file can be uploaded now (a host script that installs files runs, the box does
        not update itself, and no failed rollback needs a person at the box). `state` is
        `none`, `ready` (checked, waits for the yes; deleted after an hour) or
        `installing` (handed to the host script; `step` says where it is: `verify`,
        `backup`, `start` or `health`). One file at a time for the whole box.
      responses:
        "200":
          description: The upload, if any
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: uploadUpdateFile
      summary: Upload an update file; the box checks it and keeps it waiting for confirmation (scope settings:write)
      description: |
        Send the file `hejmo-<version>-<arch>.update` of the release page as
        `multipart/form-data` in the part `update_file`, over HTTPS only. The box checks
        the format, the cosign signature of the release workflow (offline, against the
        Sigstore root built into the box), the architecture and that the version is a
        published one newer than what runs. Nothing is installed by this call. A refused
        file is deleted at once and the answer carries the `code`: `signature_invalid`,
        `no_signature`, `wrong_arch`, `not_newer`, `not_newer_unknown`, `prerelease`,
        `damaged`, `not_update_name`, `no_file`. A file over 500 MB is refused with 413,
        one that does not fit with room left for the installation with 507; 409 means
        an installation is running or no upload is possible now (`available` in `GET`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [update_file]
              properties:
                update_file: { type: string, format: binary }
      responses:
        "201":
          description: The file is checked and waits for confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateFile" }
        "400": { $ref: "#/components/responses/UpdateFileRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/UpdateFileRefused" }
        "413": { $ref: "#/components/responses/UpdateFileRefused" }
        "422": { $ref: "#/components/responses/UpdateFileRefused" }
        "507": { $ref: "#/components/responses/UpdateFileRefused" }
    delete:
      operationId: discardUpdateFile
      summary: Delete the waiting update file (scope settings:write)
      description: Answers 409 while the file is being installed.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The file is being installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /update/file/install:
    post:
      operationId: installUpdateFile
      summary: Install the waiting update file now (scope settings:write)
      description: |
        The parent's yes. The box saves the request in the settings file for the host
        script (fixed keys: version, SHA-256 of the file, time), which checks the file
        again, saves the data, starts the new version and goes back to the previous one
        if it does not answer. The box is unreachable for about two minutes. Poll
        `GET /update/file` for `step`, and `GET /update` for the result. Over HTTPS only.
      responses:
        "202":
          description: The host script was asked to install the file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An installation is running already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /events:
    get:
      operationId: listOccurrences
      summary: Occurrences in a time range, series expanded
      description: Without `person` this is the family view. With `person`, only what that person's view shows (event and calendar audiences, subgroups).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Occurrences sorted by start
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Occurrence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createEvent
      summary: Create an event or a series
      description: |
        In a two-way CalDAV calendar the event is written to the server right away (in the background; if the
        server is down it is queued and written with the next sync). In a read-only calendar the answer is 422.
        Changing and deleting events (`PATCH`/`DELETE /events/{id}`) work the same way.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEvent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: occurrence
        in: query
        required: false
        description: Original start of the occurrence to change (RFC 3339; a date for all-day events). Defaults to the event's start.
        schema: { type: string }
      - name: scope
        in: query
        required: false
        description: Which occurrences of a series to touch. Defaults to `this`.
        schema: { type: string, enum: [this, following, all] }
    patch:
      operationId: updateEvent
      summary: Change an event or occurrences of a series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPatch" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteEvent
      summary: Delete an event or occurrences of a series
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /holidays:
    get:
      operationId: listHolidays
      summary: Public holidays of the home region (state or canton)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: exclusive, schema: { type: string, format: date } }
      responses:
        "200":
          description: Holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [date, name, name_en, partial]
                  properties:
                    date: { type: string, format: date }
                    name: { type: string, example: Allerheiligen }
                    name_en: { type: string, example: "All Saints' Day" }
                    partial: { type: boolean, description: "Holiday in most, but not all, municipalities of the region (e.g. 15 August in Bavaria)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /search:
    get:
      operationId: search
      summary: Full-text search (V1.0 searches events; tasks and lists follow)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching events, at most 100
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: hejmo_session }
    displayBearer: { type: http, scheme: bearer, description: "A display's own token from `POST /display/pairing`; it opens the display's routes only" }
  schemas:
    Role:
      type: string
      enum: [parent, child]
    Person:
      type: object
      required: [id, name, role, color, shape, symbol, streaks_shown, nutrition_shown]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        color: { type: string, description: "Hex colour for colour mode: one of the eight palette colours (empty for a person added before colours were chosen)", example: "#B4583A" }
        shape: { type: string, description: "Marker for black-and-white mode", example: circle-filled }
        symbol: { type: string }
        streaks_shown: { type: boolean, description: "The switch \"week count and badges\": when off, no week, best streak or badge is shown for the person anywhere (stars stay). On for children and off for adults when the person is created." }
        nutrition_shown: { type: boolean, description: "The switch \"nutrition values at recipes\" of a child: off at first, a parent switches it on. Parents always see the nutrition values whatever this says (false for them), wall displays never." }
    ContactLine:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, description: "One of cell, home, work, other, custom. `cell` only for numbers. `custom` needs a `label` of at most 30 characters." }
        label: { type: string }
        value: { type: string, description: The number or address exactly as typed }
    ContactAddress:
      type: object
      properties:
        street: { type: string }
        postcode: { type: string }
        city: { type: string }
        country: { type: string, description: "Empty means the country of the home" }
    ContactBirthday:
      type: object
      required: [day, month]
      properties:
        day: { type: integer, description: "1 to 31, a day that exists" }
        month: { type: integer, description: "1 to 12" }
        year: { type: integer, nullable: true, description: "1900 to this year, not in the future; null when unknown (then no age is shown)" }
    ContactRelation:
      type: object
      description: "A relation (ADR 0021): one word plus the people it is for, or the whole family. A whole-family relation stores no people, so a person who joins later is included. Only further contacts have relations, never a person's contact."
      required: [word, whole_family, people]
      properties:
        word: { type: string, description: "1 to 40 characters, for example Oma, Klassenlehrerin, Kinderärztin; the same word for the same people is merged" }
        whole_family: { type: boolean, description: "True: the whole family; `people` is then empty" }
        people: { type: array, items: { type: string, format: uuid }, description: "Ids of people of the household, in the order of the people; at least one unless `whole_family`" }
    ContactRelationInput:
      type: object
      description: "A relation as the API takes it: `whole_family` and `people` may be left out (false, none). A word with no people and no `whole_family` is 422 (unlike the web form, which reads a line with no person chosen as the whole family)."
      required: [word]
      properties:
        word: { type: string, description: "1 to 40 characters; leave it empty only for an empty line (whole family), which is skipped" }
        whole_family: { type: boolean }
        people: { type: array, items: { type: string, format: uuid } }
    ContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "The Hejmo name: 1 to 40 characters, unique ignoring case among contacts and people" }
        full_name: { type: string, description: "At most 120 characters" }
        name_day:
          type: object
          description: "The name day of the contact (ticket 318); omitted it stays as it is. With mode name the name must be one the household's list knows (while name days are on), with mode entry an entry of it; else 422."
          required: [mode]
          properties:
            mode: { type: string, enum: [auto, entry, name, none] }
            entry: { type: string }
            name: { type: string, maxLength: 40 }
        numbers: { type: array, description: "At most 10", items: { $ref: "#/components/schemas/ContactLine" } }
        emails: { type: array, description: "At most 10", items: { $ref: "#/components/schemas/ContactLine" } }
        address: { $ref: "#/components/schemas/ContactAddress" }
        birthday: { allOf: [{ $ref: "#/components/schemas/ContactBirthday" }], nullable: true }
        show_in_birthdays: { type: boolean, default: true, description: "Whether the birthday is in the generated calendar of kind `birthdays`. Omitted means true, so a replace without it switches the birthday on again" }
        for_children: { type: boolean, default: false, description: "Whether the contact is on the children's page \"Important numbers\" (`GET /numbers`; it shows only with a number, and only its photo, name and numbers). Off for every new contact, the contacts of people included. Omitted means false, so a replace without it switches it off again" }
        note: { type: string, description: "At most 1000 characters" }
        groups: { type: array, items: { type: string }, description: "Ids of contact groups" }
        relations: { type: array, items: { $ref: "#/components/schemas/ContactRelationInput" }, description: "Replaces the relations; an empty line (no word, whole family) is skipped, people without a word are 422, so are a word with no people (and no `whole_family`), more than 40 characters, unknown people, more than 20 relations and any relation on a person's contact" }
    Contact:
      type: object
      required: [id, person_id, name, full_name, numbers, emails, address, birthday, show_in_birthdays, for_children, note, groups, relations, photo, created_by, created_at, updated_by, updated_at, name_day]
      properties:
        id: { type: string, format: uuid, description: "The id of the person for a person's contact" }
        person_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        full_name: { type: string }
        numbers: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
        emails: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
        address: { $ref: "#/components/schemas/ContactAddress" }
        birthday: { allOf: [{ $ref: "#/components/schemas/ContactBirthday" }], nullable: true }
        show_in_birthdays: { type: boolean, description: "Whether the birthday is in the generated calendar of kind `birthdays`" }
        for_children: { type: boolean, description: "Whether the contact is on the children's page \"Important numbers\" (`GET /numbers`)" }
        note: { type: string }
        groups: { type: array, items: { type: string } }
        relations: { type: array, items: { $ref: "#/components/schemas/ContactRelation" } }
        photo: { allOf: [{ $ref: "#/components/schemas/ContactPhoto" }], nullable: true, description: "Null without a photo; the photo itself is at `/contacts/{id}/photo`" }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
        name_day: { $ref: "#/components/schemas/ContactNameDay" }
    ContactNameDay:
      type: object
      description: "What the contact says about its name day (ticket 318) and, while the household has name days on and the contact has one, the day it falls on next."
      required: [mode, entry, name, resolved]
      properties:
        mode: { type: string, enum: [auto, entry, name, none], description: "auto: the usual day of the first given name of `full_name` (else of the Hejmo name; for a hyphenated name the whole name, then each part); entry: another day of the list (`entry`); name: another name (`name`); none: no name day" }
        entry: { type: string, nullable: true, description: "The id of the list entry, with mode entry" }
        name: { type: string, nullable: true, maxLength: 40, description: "The other name, with mode name" }
        resolved:
          type: object
          nullable: true
          description: "Null while name days are off or when the list has no name day for the contact"
          required: [date, name, saint, entry]
          properties:
            date: { type: string, format: date, description: "The next day it falls on" }
            name: { type: string, description: "The name of the name day as the list writes it" }
            saint: { type: string }
            entry: { type: string, description: "The id of the entry in the list" }
    ChildContact:
      type: object
      description: A contact as the children see it. The photo, the Hejmo name and the numbers are all of it.
      required: [id, person_id, name, has_photo, numbers]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid, nullable: true, description: "Set for the contact of a person of the household" }
        name: { type: string, description: "The Hejmo name" }
        has_photo: { type: boolean }
        numbers: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
    ContactImport:
      type: object
      description: An uploaded contact file and what it brings to the household's contacts (ticket 300)
      required: [id, file_name, uploaded_by, uploaded_at, expires_at, cards, duplicates, new, same, unreadable]
      properties:
        id: { type: string, format: uuid }
        file_name: { type: string }
        uploaded_by: { type: string, format: uuid }
        uploaded_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "One hour after the upload, then the file is deleted" }
        cards: { type: integer, description: "Cards in the file, including those Hejmo cannot read" }
        duplicates:
          type: array
          items: { $ref: "#/components/schemas/ContactImportDuplicate" }
        new:
          type: array
          items: { $ref: "#/components/schemas/ContactImportNew" }
        same:
          type: array
          description: Cards whose contact already holds everything they say; nothing to do
          items:
            type: object
            required: [contact_id, name]
            properties:
              contact_id: { type: string, format: uuid }
              name: { type: string }
        unreadable:
          type: array
          items:
            type: object
            required: [card, line, reason]
            properties:
              card: { type: integer }
              line: { type: integer, description: "The line the card starts on" }
              reason: { type: string, enum: [empty, cut], description: "`empty`: no name, no number, no e-mail address; `cut`: the card ends in the middle" }
    ContactImportCard:
      type: object
      required: [card, name, full_name, numbers, emails, photo, photo_link]
      properties:
        card: { type: integer, description: "Position in the file, from 1" }
        name: { type: string, description: "The nickname, else the full name" }
        full_name: { type: string }
        numbers: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
        emails: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
        photo: { type: boolean, description: "An embedded photo was read" }
        photo_link: { type: boolean, description: "The photo is only a web link; Hejmo does not fetch it" }
    ContactImportDuplicate:
      type: object
      required: [key, in_file, contact_id, cards, reasons, preselect, choices, new_name, photo_choice, adds]
      properties:
        key: { type: string, description: "For example d3: the number of the first card" }
        in_file: { type: boolean, description: "Cards of the file that look the same; no contact in Hejmo" }
        contact_id: { type: string, format: uuid, nullable: true }
        cards: { type: array, items: { $ref: "#/components/schemas/ContactImportCard" } }
        reasons:
          type: array
          items:
            type: object
            required: [kind, value, file_value]
            properties:
              kind: { type: string, enum: [number, email, name] }
              value: { type: string, description: "As Hejmo (or the first card) has it" }
              file_value: { type: string, description: "As the file writes it" }
        preselect: { type: string, nullable: true, enum: [merge, null], description: "`merge` for a match by number or e-mail address; null for a match by name only" }
        choices: { type: array, items: { type: string, enum: [merge, new, skip] } }
        new_name: { type: string, description: "The Hejmo name an own contact would get" }
        photo_choice: { type: boolean, description: "Both sides have a photo: `photos` chooses" }
        adds:
          type: object
          description: What merging adds
          required: [numbers, emails, full_name, address, birthday, birth_year, note, photo]
          properties:
            numbers: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
            emails: { type: array, items: { $ref: "#/components/schemas/ContactLine" } }
            full_name: { type: string }
            address: { type: boolean }
            birthday: { type: boolean }
            birth_year: { type: boolean }
            note: { type: boolean }
            photo: { type: boolean }
    ContactImportNew:
      type: object
      required: [key, name, name_change, card]
      properties:
        key: { type: string, description: "For example n4: the number of the card" }
        name: { type: string, description: "The Hejmo name the contact gets" }
        name_change: { type: string, nullable: true, enum: [long, taken, null], description: "Why it is not the name the file gives it: over 40 characters, or another contact has it" }
        card: { $ref: "#/components/schemas/ContactImportCard" }
    ContactPhoto:
      type: object
      description: Where the photo of a contact came from. The last change wins.
      required: [origin, by, device, at]
      properties:
        origin: { type: string, enum: [manual, sync], description: "`manual`: a parent chose it; `sync`: a personal device sent it over contact sync" }
        by: { type: string, format: uuid, nullable: true, description: "The parent who set it (`manual`); null for `sync` or when that person is gone" }
        device: { type: string, description: "The personal device, for `sync`; else empty" }
        at: { type: string, format: date-time }
    ContactGroup:
      type: object
      required: [id, name, shipped_key, contacts]
      properties:
        id: { type: string }
        name: { type: string, description: "Empty for a group of Hejmo" }
        shipped_key: { type: string, nullable: true, enum: [familie, kinderbetreuung_schule, arztpraxen, notfall, sonstige, null] }
        contacts: { type: array, items: { type: string, format: uuid } }
    Diet:
      type: string
      enum: [omnivore, vegetarian, pescatarian, vegan]
    Allergen:
      type: string
      description: The 14 main allergens of EU Regulation 1169/2011, Annex II
      enum: [celery, gluten, crustaceans, eggs, fish, lupin, milk, molluscs, mustard, nuts, peanuts, sesame, soy, sulphites]
    Food:
      type: object
      description: Diet and allergies of a person. Health data (ADR 0019).
      required: [person_id, diet, allergens, other, other_note]
      properties:
        person_id: { type: string, format: uuid }
        diet: { $ref: "#/components/schemas/Diet" }
        allergens:
          type: array
          items: { $ref: "#/components/schemas/Allergen" }
        other:
          type: array
          description: Free-text allergies and intolerances. The box cannot check or filter by them.
          items: { type: string }
        other_note: { type: string, description: "Always says that `other` is not checked automatically and not filterable (nicht automatisch geprüft, nicht filterbar)" }
    FoodUpdate:
      type: object
      required: [diet]
      properties:
        diet: { type: string, description: "One of `Diet`; anything else gets 422", example: vegetarian }
        allergens:
          type: array
          description: Keys of `Allergen`; an unknown key gets 422. Omitted means none (the entry is replaced as a whole)
          items: { type: string }
        other:
          type: array
          description: Free-text entries without commas; omitted means none
          items: { type: string }
    PersonColor:
      type: string
      description: The eight person colours of the palette, in slot order
      enum: ["#B4583A", "#2F5E7A", "#4E7D52", "#9A7420", "#86587F", "#3A7A74", "#5559A3", "#B04A6A"]
    PersonShape:
      type: string
      description: The eight black-and-white markers, in slot order
      enum: [circle-filled, circle-empty, square-filled, square-empty, triangle-filled, diamond-filled, cross-filled, star-filled]
    PersonUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        color: { $ref: "#/components/schemas/PersonColor" }
        shape: { $ref: "#/components/schemas/PersonShape" }
        streaks_shown: { type: boolean }
        nutrition_shown: { type: boolean, description: "Children only; a request for a parent gets 422." }
    NewPerson:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 80 }
        role: { $ref: "#/components/schemas/Role" }
        color: { $ref: "#/components/schemas/PersonColor" }
        shape: { $ref: "#/components/schemas/PersonShape" }
        symbol: { type: string }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at, box_name, works]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: "Null until it was used" }
        box_name: { type: string, description: "The box name the passkey was created for", example: hejmo.local }
        works: { type: boolean, description: "False once the box has another name than `box_name`" }
    TaskRepeat:
      type: string
      enum: [once, daily, weekly]
    TaskWeekday:
      type: string
      enum: [MO, TU, WE, TH, FR, SA, SU]
    TaskPartOfDay:
      type: string
      enum: ["", morning, afterschool, evening]
      description: |
        Empty means any time of the day. `afterschool` exists only in routines:
        a task in a routine always reports its routine's part of the day, and a
        task outside a routine cannot be `afterschool`.
    RoutinePart:
      type: string
      enum: [morning, afterschool, evening]
    NewRoutine:
      type: object
      required: [person_id]
      description: |
        Without `template_id`, `name` and `part_of_day` are required (else
        422). With `template_id` the routine is made from a routine template
        (own or shipped): its steps become new tasks of the person, an
        independent copy that keeps no link to the template. Then `part_of_day`
        defaults to the template's suggestion (any part of the day may be
        chosen) and `name` to the stock name of the part ("Morgenroutine").
        Shipped templates are copied in the language in use.
      properties:
        person_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60, example: Morgenroutine }
        part_of_day: { $ref: "#/components/schemas/RoutinePart" }
        template_id: { type: string, description: "An own template's UUID or the id of a shipped one", example: school-morning }
    TemplateRepeat:
      type: string
      enum: [daily, weekly]
      description: A template step is never once-only.
    RoutineTemplate:
      type: object
      required: [id, name, part_of_day, source, steps]
      properties:
        id: { type: string, description: "A UUID for an own template, a readable id such as school-morning for a shipped one" }
        name: { type: string }
        part_of_day: { $ref: "#/components/schemas/RoutinePart" }
        source: { type: string, enum: [own, shipped] }
        origin_routine: { type: string, description: "Own templates: the name of the routine it was saved from" }
        origin_person: { type: string, description: "Own templates: the name of that routine's person" }
        saved_at: { type: string, format: date-time, description: "Own templates: when it was saved" }
        steps:
          type: array
          items:
            type: object
            required: [id, title, emoji, stars, repeat, weekdays]
            properties:
              id: { type: string }
              title: { type: string }
              emoji: { type: string }
              stars: { type: integer, minimum: 0, maximum: 100 }
              repeat: { $ref: "#/components/schemas/TemplateRepeat" }
              weekdays: { type: array, items: { $ref: "#/components/schemas/TaskWeekday" } }
    Pause:
      type: object
      required: [id, from, to, person_ids, whole_family]
      properties:
        id: { type: string, format: uuid }
        from: { type: string, format: date, description: "First day, in the household's time zone" }
        to: { type: string, format: date, description: "Last day, not before `from`, at most 366 days long" }
        person_ids:
          type: array
          items: { type: string, format: uuid }
          description: The people the pause is for; empty for the whole family
        whole_family: { type: boolean }
    NewPause:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        person_ids:
          type: array
          items: { type: string, format: uuid }
          description: Leave out or empty for the whole family
    PauseUpdate:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        person_ids:
          type: array
          items: { type: string, format: uuid }
    Routine:
      type: object
      required: [id, person_id, name, part_of_day, task_ids]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        name: { type: string }
        part_of_day: { $ref: "#/components/schemas/RoutinePart" }
        task_ids:
          type: array
          items: { type: string, format: uuid }
          description: The routine's tasks in their order
    NewTask:
      type: object
      required: [person_id, title, repeat]
      properties:
        person_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120, example: Brush teeth }
        emoji: { type: string, maxLength: 16, example: "🪥" }
        notes: { type: string, maxLength: 2000, description: "Optional free text. CalDAV clients show it as the task's description and may change it" }
        repeat: { $ref: "#/components/schemas/TaskRepeat" }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/TaskWeekday" }
          description: Required (at least one) for `weekly`, else must be empty
        date: { type: string, format: date, description: "The day of a `once` task (required); the first day of a repeating one (default today)" }
        part_of_day: { $ref: "#/components/schemas/TaskPartOfDay" }
        stars: { type: integer, minimum: 0, maximum: 100, description: "Stars credited when ticked off (0 allowed). Default: 1 for a child, 0 for an adult" }
        routine_id: { type: string, format: uuid, description: "Create the task as the last step of this routine (of the same person). It takes the routine's part of the day and `part_of_day` is ignored" }
    Task:
      type: object
      required: [id, person_id, title, emoji, notes, repeat, weekdays, date, part_of_day, stars, routine_id, position, due, done, subtasks]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        title: { type: string }
        emoji: { type: string }
        notes: { type: string, description: "Free text; empty if none" }
        repeat: { $ref: "#/components/schemas/TaskRepeat" }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/TaskWeekday" }
        date: { type: string, format: date }
        part_of_day: { $ref: "#/components/schemas/TaskPartOfDay" }
        stars: { type: integer, description: "Stars credited when ticked off, deducted when unticked" }
        routine_id: { type: string, description: "The routine the task is a step of; empty for a single task" }
        position: { type: integer, description: "Place in the routine, from 1; 0 for a single task" }
        due: { type: boolean, description: "Due on the requested day" }
        done: { type: boolean, description: "Ticked off on the requested day. A task with subtasks is done when all of them are" }
        subtasks:
          type: array
          description: The items the task is split into, in their order (at most 10); empty for a task without
          items: { $ref: "#/components/schemas/Subtask" }
    Subtask:
      type: object
      required: [id, title, emoji, position, done]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        emoji: { type: string }
        position: { type: integer, description: "Place in the task, from 1" }
        done: { type: boolean, description: "Ticked off on the requested day (each occurrence of the task starts open)" }
    NewSubtask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, example: "Pencil case" }
        emoji: { type: string, maxLength: 16, example: "✏️" }
    NewStarBooking:
      type: object
      required: [delta, note]
      properties:
        delta: { type: integer, minimum: -1000, maximum: 1000, description: "Stars to add; negative to deduct; not 0", example: -5 }
        note: { type: string, minLength: 1, maxLength: 120, example: "redeemed: ice cream" }
    StarEntry:
      type: object
      required: [id, person_id, delta, note, task_id, task_title, day, booked_by, booked_by_removed, created_at]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        delta: { type: integer, description: "Positive credits, negative deducts" }
        note: { type: string, description: "Of a manual booking, else empty" }
        task_id: { type: string, description: "Of the ticked or unticked task; empty for a manual booking or once the task is deleted" }
        task_title: { type: string, description: "Title of the task at booking time" }
        day: { type: string, description: "The ticked day (YYYY-MM-DD); empty for a manual booking" }
        booked_by: { type: string, description: "Name of the person who booked; empty when a display did. Once that person is removed, their last name" }
        booked_by_removed: { type: boolean, description: "True when the person who booked has been removed; clients show the name as removed" }
        created_at: { type: string, format: date-time }
        redemption_id: { type: string, description: "Of the redemption this booking pays for; empty otherwise" }
        reward_name: { type: string, description: "With a redemption: the reward's name when it was asked for or redeemed" }
        reward_symbol: { type: string, description: "With a redemption: the reward's symbol then" }
        direct: { type: boolean, description: "With a redemption: a parent redeemed it directly, else `booked_by` confirmed a request" }
    StarAccount:
      type: object
      required: [person_id, balance, shown, entries]
      properties:
        person_id: { type: string, format: uuid }
        balance: { type: integer }
        shown: { type: boolean, description: "Whether displays show stars for this person: they have a task worth stars or a booking" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/StarEntry" }
    Badges:
      type: object
      required: [person_id, streaks_shown, badges]
      properties:
        person_id: { type: string, format: uuid }
        streaks_shown: { type: boolean, description: "The person's switch \"week count and badges\"; the list is empty while it is off" }
        badges:
          type: array
          items: { $ref: "#/components/schemas/Badge" }
    Badge:
      type: object
      required: [key, name, how, earned_at, new]
      properties:
        key:
          type: string
          enum: [first_routine, whole_day, whole_week, streak_7, streak_30, first_star, stars_100, stars_500, first_reward, goal_reached]
        name: { type: string, description: "The short name in the language of the request" }
        how: { type: string, description: "One sentence saying how the badge is earned" }
        earned_at: { type: string, format: date-time, description: "In the household time zone; a box updated to this version dates the badges its history already earned that day" }
        new: { type: boolean, description: "Earned today or yesterday (household time zone) while the switch was on" }
    ListColor:
      type: string
      description: The person colour slot 1 to 6 of DESIGN.md, by name
      enum: [terracotta, blue, green, ochre, plum, teal]
    ListSymbol:
      type: string
      description: The black-and-white symbol, in the order of the person colour slots
      enum: [circle-filled, circle-empty, square-filled, square-empty, triangle-filled, diamond-filled]
    ListSort:
      type: string
      enum: [manual, alphabetical]
    NewList:
      type: object
      required: [name, color, symbol]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: "#/components/schemas/ListColor" }
        symbol: { $ref: "#/components/schemas/ListSymbol" }
        sort: { allOf: [{ $ref: "#/components/schemas/ListSort" }], description: "Default manual" }
        suggestions: { type: boolean, description: "Suggestions from the article library and quantities; default true" }
    ListChange:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: "#/components/schemas/ListColor" }
        symbol: { $ref: "#/components/schemas/ListSymbol" }
        sort: { $ref: "#/components/schemas/ListSort" }
        suggestions: { type: boolean }
    List:
      type: object
      required: [id, name, color, symbol, sort, suggestions, open_count, done_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/ListColor" }
        symbol: { $ref: "#/components/schemas/ListSymbol" }
        sort: { $ref: "#/components/schemas/ListSort" }
        suggestions: { type: boolean, description: "The list offers articles of the library while typing and takes quantities (a to-do list switches it off)" }
        open_count: { type: integer, description: "Entries not ticked off" }
        done_count: { type: integer, description: "Entries ticked off" }
    Article:
      type: object
      required: [id, source, name_de, name_en, dept, kind, allergens, units, offered_units, symbol, picture, picture_source, hidden_by_hand, pantry, food, piece_g, created_by, created_at]
      properties:
        id: { type: string, description: "The key of an article from Hejmo, the id of an own one" }
        source: { type: string, enum: [hejmo, own] }
        name_de: { type: string }
        name_en: { type: string, description: The same as name_de for an own article }
        dept:
          type: string
          enum: [produce, bakery, dairy, meat_fish, frozen, pantry, baking_spices, sweets, drinks, drugstore, household, baby, other]
        kind: { type: string, enum: [meat, fish, veg, vegan, nonfood] }
        allergens:
          type: array
          items: { type: string, enum: [celery, gluten, crustaceans, eggs, fish, lupin, milk, molluscs, mustard, nuts, peanuts, sesame, soy, sulphites] }
        units:
          type: array
          description: One or two default units, the first is preselected when adding
          items: { $ref: "#/components/schemas/Unit" }
        offered_units:
          type: array
          description: The default units that are switched on; piece when neither is
          items: { $ref: "#/components/schemas/Unit" }
        symbol: { type: string, description: "The emoji of a shipped article or a chosen symbol, else empty" }
        picture:
          type: string
          nullable: true
          description: Where the stored picture is (GET), or null
        picture_source: { type: string, enum: ["", symbol, upload, web] }
        hidden_by_hand: { type: boolean }
        pantry: { type: boolean, description: "A pantry article, usually at home (salt, oil): recipes leave it out of the shopping list by default. Shipped articles come with a default mark that a parent can change per article." }
        food:
          nullable: true
          description: The food behind the nutrition values of recipes. Shipped articles have one (except what is not food); an own article may have one or none, then recipes do not count it. Always null for a child whose nutrition switch is off.
          allOf:
            - { $ref: "#/components/schemas/NutritionFood" }
        piece_g: { type: number, nullable: true, description: "The weight of one piece in grams, null when not known; recipes in piece, jar or tub need it. Always null for a child whose nutrition switch is off." }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    NutritionValues:
      type: object
      description: The seven values of the EU nutrition declaration as eight numbers (energy has two). A number is null when it is not known; it is never 0 for unknown.
      required: [energy_kj, energy_kcal, fat_g, saturates_g, carbohydrate_g, sugars_g, protein_g, salt_g]
      properties:
        energy_kj: { type: number, nullable: true }
        energy_kcal: { type: number, nullable: true }
        fat_g: { type: number, nullable: true }
        saturates_g: { type: number, nullable: true, description: Of which saturated fatty acids }
        carbohydrate_g: { type: number, nullable: true }
        sugars_g: { type: number, nullable: true, description: Of which sugars }
        protein_g: { type: number, nullable: true }
        salt_g: { type: number, nullable: true }
    NutritionFood:
      type: object
      required: [id, source, name_de, name_en, per_100g]
      properties:
        id: { type: string, description: "bls:<BLS code> or usda:<FoodData Central id>", example: "bls:C133000" }
        source: { type: string, enum: [bls, usda], description: "bls: Bundeslebensmittelschlüssel 4.0, Max Rubner-Institut, CC BY 4.0; usda: USDA FoodData Central, CC0" }
        name_de: { type: string, nullable: true, description: Null for a USDA food }
        name_en: { type: string, nullable: true }
        per_100g: { $ref: "#/components/schemas/NutritionValues" }
    RecipeNutrition:
      type: object
      required: [recipe_id, portions, counted, complete, per_portion, not_counted, missing_values, sources, note]
      properties:
        recipe_id: { type: string }
        portions: { type: integer }
        counted: { type: integer, description: The number of ingredient lines in the sum }
        complete: { type: boolean, description: True when every line counted and no value is missing }
        per_portion: { $ref: "#/components/schemas/NutritionValues" }
        not_counted:
          type: array
          items:
            type: object
            required: [name, article_id, unit, reason]
            properties:
              name: { type: string }
              article_id: { type: string, nullable: true }
              unit: { type: string, nullable: true }
              reason: { type: string, enum: [free_text, no_quantity, no_weight, no_food] }
        missing_values:
          type: array
          description: Values that are null because the food of a counted line lacks them
          items:
            type: object
            required: [value, foods]
            properties:
              value: { type: string, enum: [energy_kj, energy_kcal, fat_g, saturates_g, carbohydrate_g, sugars_g, protein_g, salt_g] }
              foods:
                type: array
                items: { $ref: "#/components/schemas/NutritionFood" }
        sources:
          type: array
          description: The databases the counted foods come from; name them where you show the values (CC BY 4.0 needs the attribution)
          items: { type: string, enum: [bls, usda] }
        note: { type: string }
    Unit:
      type: string
      enum: [piece, dozen, pack, bunch, g, kg, ml, l, oz, lb, floz_us, floz_uk, cup_us, pint_us, pint_uk, quart_us, gallon_us, gallon_uk]
    Redemption:
      type: object
      required: [id, person_id, reward_id, name, symbol, price, status, note, asked_at, decided_at, decided_by, decided_by_name, direct, decline_reason]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        reward_id: { type: string, format: uuid, nullable: true, description: "Null once the reward was deleted" }
        name: { type: string, description: "The reward's name when it was asked for (when redeemed, for a direct redemption)" }
        symbol: { type: string }
        price: { type: integer, description: "The price then" }
        status: { type: string, enum: [open, confirmed, declined, withdrawn] }
        note: { type: string, maxLength: 120, description: "The parent's note when declining" }
        asked_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string, format: uuid, nullable: true, description: "The parent who confirmed or declined; null when nobody did (withdrawn, or the reward was removed)" }
        decided_by_name: { type: string }
        direct: { type: boolean, description: "A parent redeemed it directly, without a request" }
        decline_reason: { type: string, enum: [parent, reward_gone], nullable: true }
    RedemptionRefused:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [stars, limit, asked, decided] }
        missing: { type: integer, description: "With `stars`: how many stars are missing" }
        available_again: { type: string, format: date-time, description: "With `limit`: when the next period starts" }
        redemption: { $ref: "#/components/schemas/Redemption" }
    SavingsGoal:
      type: object
      required: [person_id, reward_id, name, symbol, price, balance, reached, set_at, ended]
      properties:
        person_id: { type: string, format: uuid }
        reward_id: { type: string, format: uuid, nullable: true, description: "The reward saved for; null without a goal" }
        name: { type: string, nullable: true }
        symbol: { type: string, nullable: true }
        price: { type: integer, nullable: true, description: "The reward's current price" }
        balance: { type: integer, description: "The plain star balance" }
        reached: { type: boolean, description: "balance >= price" }
        set_at: { type: string, format: date-time, nullable: true }
        ended:
          nullable: true
          description: Why and when the goal ended by itself; null after 7 days and once a new goal is chosen
          type: object
          required: [reason, at, name]
          properties:
            reason: { type: string, enum: [redeemed, archived, deleted, audience] }
            at: { type: string, format: date-time }
            name: { type: string, description: "The reward's name when the goal ended" }
    Reward:
      type: object
      required: [id, name, symbol, picture, picture_source, price, limit_period, limit_count, whole_family, person_ids, archived, archived_at, archived_reason, redeemed, created_by, created_at, affordable, limit_reached, available_again]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        symbol: { type: string, description: "An emoji; shown when there is no photo" }
        picture: { type: string, nullable: true, description: "Path of the stored photo, `GET /rewards/{id}/picture`" }
        picture_source: { type: string, enum: [symbol, upload] }
        price: { type: integer, minimum: 1, maximum: 999, description: Stars }
        limit_period: { type: string, enum: [none, day, week, month] }
        limit_count: { type: integer, nullable: true, minimum: 1, maximum: 99, description: "How often one person may redeem it per period; null without a period" }
        whole_family: { type: boolean, description: "Meant for everyone, also people who join later" }
        person_ids: { type: array, items: { type: string, format: uuid }, description: "The people it is meant for; empty with whole_family" }
        archived: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        archived_reason: { type: string, enum: [audience_gone], nullable: true, description: "Set when the box archived it because the last person it was meant for left the household" }
        redeemed: { type: integer, nullable: true, description: "Confirmed redemptions; null for a child" }
        created_by: { type: string, format: uuid, nullable: true, description: "Null for a child, and when that person is gone" }
        created_at: { type: string, format: date-time }
        affordable: { type: boolean, nullable: true, description: "The caller's balance covers the price; null for a parent" }
        limit_reached: { type: boolean, nullable: true, description: "The caller used up the limit in the current period; null for a parent" }
        available_again: { type: string, format: date-time, nullable: true, description: "Start of the next period while the limit is reached" }
    RewardWrite:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        symbol: { type: string, description: "An emoji of the Noto Emoji set" }
        price: { type: integer, minimum: 1, maximum: 999 }
        limit_period: { type: string, enum: [none, day, week, month] }
        limit_count: { type: integer, minimum: 1, maximum: 99 }
        whole_family: { type: boolean }
        person_ids: { type: array, items: { type: string, format: uuid } }
        remove_picture: { type: boolean }
    ArticleWrite:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        dept:
          type: string
          enum: [produce, bakery, dairy, meat_fish, frozen, pantry, baking_spices, sweets, drinks, drugstore, household, baby, other]
        kind: { type: string, enum: [meat, fish, veg, vegan, nonfood] }
        allergens:
          type: array
          items: { type: string, enum: [celery, gluten, crustaceans, eggs, fish, lupin, milk, molluscs, mustard, nuts, peanuts, sesame, soy, sulphites] }
        unit1: { $ref: "#/components/schemas/Unit" }
        unit2:
          type: string
          description: "The optional second default unit, empty for none"
        symbol: { type: string, description: "An emoji of the Noto Emoji set" }
        picture_url: { type: string, description: "An http or https address of an image the box downloads once" }
        remove_picture: { type: boolean }
        pantry: { type: boolean, description: "Mark as a pantry article (default false when creating)" }
        food: { type: string, description: "The id of a food of GET /foods (bls:... or usda:...); empty removes it. Without a food recipes do not count the article in their nutrition values." }
        piece_g: { type: number, description: "The weight of one piece in grams, 0 up to 5000 (anything else gets 422); 0 removes it" }
    ArticleWarnings:
      type: object
      required: [article_id, warnings, suits, does_not_suit, suggested, not_suggested_because, hidden_for, note]
      properties:
        article_id: { type: string }
        warnings:
          type: array
          items:
            type: object
            required: [people, allergens]
            properties:
              people:
                type: array
                items: { type: string, format: uuid }
              allergens:
                type: array
                items: { type: string }
        suits:
          type: array
          items: { type: string, format: uuid }
        does_not_suit:
          type: array
          items: { type: string, format: uuid }
        suggested: { type: boolean }
        not_suggested_because: { type: string, nullable: true, enum: [hand, allergy, diet, null] }
        hidden_for:
          type: array
          items: { type: string, format: uuid }
        note: { type: string }
    AlwaysHoliday:
      type: object
      required: [from, to]
      properties:
        from: { type: string, description: "YYYY-MM-DD" }
        to: { type: string, description: "YYYY-MM-DD" }
    AlwaysRule:
      type: object
      required: [article_id, enabled, paused, list_id, list_name, weekday, every, start_week, quantity, next_date]
      properties:
        article_id: { type: string }
        enabled: { type: boolean }
        paused: { type: boolean, description: "On, but the list was deleted" }
        list_id: { type: string, format: uuid, nullable: true }
        list_name: { type: string }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        every: { type: integer, minimum: 1, maximum: 52 }
        start_week: { type: string, format: date, description: "The Monday of the first week" }
        quantity:
          type: object
          nullable: true
          required: [amount, unit]
          properties:
            amount: { type: number }
            unit: { $ref: "#/components/schemas/UnitKey" }
        next_date: { type: string, format: date, nullable: true, description: "The next day it comes, after the holiday; null unless it is running" }
    AlwaysSettings:
      type: object
      required: [time, holiday, rules]
      properties:
        time: { type: string }
        holiday:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/AlwaysHoliday" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/AlwaysRule" }
    Hiding:
      type: object
      required: [enabled, everyone, people, confirmed_by, confirmed_at, experimental]
      properties:
        enabled: { type: boolean }
        everyone: { type: boolean }
        people:
          type: array
          items: { type: string, format: uuid }
        confirmed_by: { type: string, format: uuid, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        experimental: { type: boolean, description: "Always true" }
    UnitKey:
      type: string
      description: "The household's units, and the containers a recipe's ingredients bring to a list (can, packet, tub, jar, ...; ticket 283). Kitchen measures never reach a list."
      enum: [piece, dozen, pack, bunch, g, kg, ml, l, oz, lb, floz_us, floz_uk, cup_us, pint_us, pint_uk, quart_us, gallon_us, gallon_uk, can, packet, tub, jar, bottle, stick, clove, slice, cube, sprig, stalk, ball, leaf, punnet, pot]
    ListEntry:
      type: object
      required: [id, text, done, article_id, variety, symbol, picture]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, description: "The entry's words: for an article its name, without the variety" }
        done: { type: boolean }
        variety: { type: string, nullable: true, maxLength: 60, description: "The variety of the article, for example `Type 405` (shown as \"Mehl · Type 405\"); null for none and for free text. Quantities add up only for the same article and variety." }
        article_id: { type: string, nullable: true, description: "The library article of the entry: the one stored when it was added from the library, else (an entry without one) the article its text names in German or English, ignoring case, umlauts and singular or plural (the exact name first, the endings of the name's own language only); never an article hidden by hand. The key of a shipped article or the id of an own one. Null for free text." }
        symbol: { type: string, nullable: true, description: "The emoji a tile shows for the article (its department's symbol when it has none). Null for free text and for an article that has a picture." }
        picture: { type: string, nullable: true, description: "Path of the own article's picture, `GET /articles/{id}/picture`. Null without one." }
        amount: { type: number, description: "How much, as shown (rounded: g and ml whole, else at most two decimals); missing without a quantity" }
        unit: { $ref: "#/components/schemas/UnitKey" }
        sources:
          type: array
          description: "The meals that brought quantities to this entry (ticket 283); absent for none"
          items: { $ref: "#/components/schemas/MealShoppingSource" }
    ListEntryResult:
      allOf:
        - { $ref: "#/components/schemas/ListEntry" }
        - type: object
          required: [result]
          properties:
            result:
              type: string
              enum: [added, added_to, filled, exists, set, merged]
              description: What happened to the entry (see `addListEntry` and `setListEntryQuantity`)
            previous:
              type: object
              description: The quantity the entry had before, when it changed
              required: [amount, unit]
              properties:
                amount: { type: number }
                unit: { $ref: "#/components/schemas/UnitKey" }
    Units:
      type: object
      required: [country, custom, active, units]
      properties:
        country: { type: string, description: "ISO 3166-1 alpha-2 country of the home, empty without a place", example: DE }
        custom: { type: boolean, description: "A parent changed the units; false while they follow the country" }
        active: { type: array, items: { $ref: "#/components/schemas/UnitKey" } }
        units:
          type: array
          items:
            type: object
            required: [key, group, kind, size]
            properties:
              key: { $ref: "#/components/schemas/UnitKey" }
              group: { type: string, enum: [count, weight, volume] }
              kind: { type: string, enum: [count, pack, bunch, weight, volume] }
              size: { type: number, description: "In pieces, grams or millilitres" }
    ListView:
      type: object
      required: [view, default]
      properties:
        view: { type: string, enum: [tiles, list] }
        default: { type: boolean, description: "True while the person never chose: children then see tiles, adults the list" }
    ListViewChange:
      type: object
      required: [view]
      properties:
        view: { type: string, enum: [tiles, list] }
    ListWithEntries:
      allOf:
        - { $ref: "#/components/schemas/List" }
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: "#/components/schemas/ListEntry" }
    Group:
      type: object
      required: [id, name, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        members: { type: array, items: { type: string, format: uuid } }
    Audience:
      type: object
      required: [people, groups]
      properties:
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    Calendar:
      type: object
      required: [id, name, kind, color, read_only, share_through_box, waste_collection, audience]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [local, ics, caldav, google, outlook, meals, birthdays], description: "meals is the meal plan, generated by the box: read-only, its events change only in the meal plan. birthdays is the calendar of the birthdays of the contacts (`birthday`, `show_in_birthdays` of a contact), generated by the box: read-only, one yearly all-day event per contact, made when the first birthday is saved. A birthday shows with the age when the year is known (`Mia (7)`); 29 February repeats on the last day of February in other years" }
        color: { type: string }
        read_only: { type: boolean, description: "The box never changes this calendar's events outside (always true for ICS; false by default for CalDAV and Google, where a parent can switch it on)" }
        waste_collection: { type: boolean, description: "A read-only calendar marked as the household's waste collection calendar: its events show only in the family view's tomorrow tile (reminder from 18:00) and on the night page, not in the strip, person columns or personal view" }
        share_through_box: { type: boolean, description: "Personal devices may subscribe to this calendar over CalDAV. Always true for the family calendar; on by default for ICS, off for CalDAV and Google" }
        audience: { $ref: "#/components/schemas/Audience" }
        sync: { $ref: "#/components/schemas/SyncState" }
    ApiToken:
      type: object
      required: [id, name, scopes, person, created_at, last_used_at, mcp]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: iPhone Mama }
        scopes: { type: string, example: calendars }
        person: { type: string, description: "Name of the person the token acts for" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        mcp: { type: boolean, description: "Created for the MCP server: it works there only, not in this API or CalDAV" }
    MCPState:
      type: object
      required: [enabled, address]
      properties:
        enabled: { type: boolean }
        address: { type: string, example: "https://hejmo.local/mcp", description: "Where an AI assistant reaches the MCP server; always https" }
    MCPAreas:
      type: object
      description: What a token may do per area. An area left out counts as none.
      properties:
        events: { $ref: "#/components/schemas/MCPLevel" }
        lists: { $ref: "#/components/schemas/MCPLevel" }
        tasks: { $ref: "#/components/schemas/MCPLevel" }
        meals: { $ref: "#/components/schemas/MCPLevel" }
        health:
          description: Diet and allergies (health data). Only `none` or `read`; `write` is refused with 422 and the default is `none`.
          allOf: [{ $ref: "#/components/schemas/MCPLevel" }]
    MCPLevel:
      type: string
      enum: [none, read, write]
    DisplayType:
      type: string
      enum: [eink_bw, eink_color, screen]
      description: Black-and-white E-Ink, colour E-Ink or normal screen
    DayNote:
      type: object
      required: [day, text]
      properties:
        day: { type: string, format: date }
        text: { type: string }
    Display:
      type: object
      required: [id, name, room, type, paired_at, last_seen_at, show_tomorrow, theme, sunrise_offset, sunset_offset, quiet_mode, kiosk, screensaver, brightness, list_view, layout]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hallway }
        room: { type: string, example: Entrance }
        type: { $ref: "#/components/schemas/DisplayType" }
        paired_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        show_tomorrow: { type: boolean, description: "Show the faded tomorrow block from 18:00. Off by default (ADR 0016)" }
        theme: { $ref: "#/components/schemas/DisplayTheme" }
        sunrise_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes added to sunrise before an automatic theme turns light" }
        sunset_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes added to sunset before an automatic theme turns dark" }
        quiet_mode: { $ref: "#/components/schemas/QuietMode" }
        kiosk: { $ref: "#/components/schemas/Kiosk" }
        screensaver: { $ref: "#/components/schemas/Screensaver" }
        brightness: { $ref: "#/components/schemas/Brightness" }
        layout: { $ref: "#/components/schemas/DisplayLayout" }
    DisplayLayout:
      type: object
      description: |
        What a display shows (ticket 180, ADR 0020): which people in which order, and which layout
        blocks are on in each of the three fixed zones (ADR 0016). Every display has its own layout;
        a new display starts with today's: the whole family and every block of before. Exactly one
        person means the display shows that person's personal view (ADR 0015). Events for the whole
        family always show.
      required: [whole_family, people, rotate_daily, blocks, list_id, orientation]
      properties:
        whole_family: { type: boolean, description: "\"Whole family\": people who join the household later are added at the end. Default true" }
        people:
          type: array
          items: { type: string, format: uuid }
          description: "The people the display shows, in the order of today's columns, from left to right. While the rotation runs, the order of today. A PATCH that switches `rotate_daily` on takes the order it sends (or the stored one) as the base order of the rotation, so today's columns can move at once by today mod the number of people; a PATCH that leaves it on and sends today's order keeps the columns as they are"
        rotate_daily: { type: boolean, description: "Every day at 03:00 each person moves one column to the right, the rightmost goes to the left (round-robin), the same on every display with this switched on. Default false" }
        blocks:
          type: array
          description: "Every block with its zone and switch, in the order shown inside each zone. The block `emergency` (emergency numbers, ticket 303) is the last of the footer and off by default: it shows the contacts of the shipped group `notfall` that have at least one number, in the order of the contacts overview, in a footer row of its own; it stays away while there is none, and in a personal view"
          items:
            type: object
            required: [id, zone, enabled]
            properties:
              id: { type: string, enum: [clock, weather, events, routines, tasks, stars, meals, tomorrow, list, emergency] }
              zone: { type: string, enum: [header, columns, footer] }
              enabled: { type: boolean }
        list_id: { type: string, format: uuid, nullable: true, description: "The list of the block `list` (\"one list\"); at most 8 open entries show. Null: none chosen. A list that was deleted meanwhile stays here and the display shows no list until another is chosen" }
        orientation: { type: string, enum: [landscape, portrait], description: "How the display last reported it hangs (the settings page draws its preview that way). Read-only; landscape until the display reports it" }
    UpdateDisplayLayout:
      type: object
      description: |
        Only the fields sent change. `blocks` names blocks in the order they should have inside
        their zone (a block not named keeps its place after the named ones) and may switch them
        with `enabled`. Refused with 422: no person, an unknown person, an unknown block or list,
        or the block `list` on while there is no list to show.
      properties:
        whole_family: { type: boolean }
        people: { type: array, items: { type: string, format: uuid }, minItems: 1 }
        rotate_daily: { type: boolean }
        blocks:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, enum: [clock, weather, events, routines, tasks, stars, meals, tomorrow, list, emergency] }
              enabled: { type: boolean }
        list_id: { type: string, description: "The ID of the list of the block `list`; an empty string removes the choice" }
    Brightness:
      type: object
      description: |
        How bright the display is (ticket 179, ADR 0020). It needs a kiosk app: the box sets
        the brightness (E-Ink: the front light) through it, and without one only the values
        are stored. `day` and `evening` switch at the same sun times and offsets as the
        automatic theme (ADR 0015); without a home location `day` applies all day.
      required: [day, evening, light_source, quiet, current]
      properties:
        day: { type: integer, minimum: 1, maximum: 100, description: "Percent from sunrise to sunset; default 100" }
        evening: { type: integer, minimum: 1, maximum: 100, description: "Percent from sunset to sunrise; default 40" }
        light_source:
          type: string
          enum: [sun, room]
          description: "`sun`: day and evening by the sun. `room`: the device's light sensor regulates (only effective when the device reports one); quiet mode applies either way"
        quiet:
          type: object
          description: What quiet mode does to the light, and the wake after a touch
          required: [mode, level, wake_minutes]
          properties:
            mode: { type: string, enum: [off, dim], description: "`off`: the front light (E-Ink) or the screen (normal screen) goes off. `dim`: dimmed to `level`" }
            level: { type: integer, minimum: 1, maximum: 100, description: "Percent for `dim`; default 5" }
            wake_minutes: { type: integer, minimum: 1, maximum: 30, description: "How long a touch wakes a display that quiet mode switched off, at evening brightness; default 1" }
        current:
          type: object
          nullable: true
          description: What the display should do now and whether the kiosk app confirmed it. Null without a kiosk app or before the box has checked it (it checks every minute).
          required: [phase, percent, since, confirmed, reachable, light_sensor]
          properties:
            phase: { type: string, enum: [day, evening, room, quiet_off, quiet_dim, wake] }
            percent: { type: integer, nullable: true, description: "Null while the light sensor regulates (`room`, or a `wake` under it)" }
            since: { type: string, format: date-time, nullable: true, description: "When this phase began; null without a home location" }
            confirmed: { type: boolean, description: "The kiosk app received it" }
            reachable: { type: boolean, description: "The kiosk app answered at the last check; the box retries every minute" }
            light_sensor: { type: boolean, description: "The device reports a light sensor, so `light_source: room` has an effect" }
    UpdateBrightness:
      type: object
      description: Only the fields sent change. A value outside its range, an unknown mode or source is refused with 422.
      properties:
        day: { type: integer, minimum: 1, maximum: 100 }
        evening: { type: integer, minimum: 1, maximum: 100 }
        light_source: { type: string, enum: [sun, room] }
        quiet:
          type: object
          properties:
            mode: { type: string, enum: [off, dim] }
            level: { type: integer, minimum: 1, maximum: 100 }
            wake_minutes: { type: integer, minimum: 1, maximum: 30 }
        list_view: { type: string, enum: [tiles, list], description: "How the display shows lists (ADR 0019). A display is not a person and keeps its own view, tiles until someone switches it at the display or here." }
    DisplayPairing:
      type: object
      required: [token, state, code, code_expires_at, pair_url]
      properties:
        token: { type: string, description: "The display's own bearer token, shown once" }
        state: { type: string, enum: [pairing] }
        code: { type: string, pattern: "^[0-9]{6}$", example: "482916" }
        code_expires_at: { type: string, format: date-time }
        pair_url: { type: string, description: "Where a parent's personal device confirms the code (the QR code on the page route)" }
    DisplayState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [paired, pairing, unpaired] }
        code: { type: string, pattern: "^[0-9]{6}$", description: "Only while `pairing`" }
        theme: { type: string, description: "Only while `paired`: the palette shown now (light, dark or bw)" }
        saver: { type: string, enum: ["0", "1"], description: "Only while `paired`: `1` when the photo screensaver is due now (on, and not in quiet mode)" }
        saver_seconds: { type: string, pattern: "^[0-9]+$", description: "Only while `paired`: the idle seconds after which the family view asks again; `0` when the screensaver is off" }
    QuietMode:
      type: object
      description: The daily window, in the household's time zone, in which the display is quiet (ADR 0015). Off by default.
      required: [enabled, from, to]
      properties:
        enabled: { type: boolean }
        from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "22:00" }
        to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "06:00", description: "May be earlier than `from` (the window then spans midnight); never equal to it" }
    Kiosk:
      type: object
      description: The display's kiosk app (ADR 0005). The API key is never returned.
      required: [url, api_key_set]
      properties:
        url: { type: string, example: "http://192.168.1.20:8080", description: "Empty without a kiosk app" }
        api_key_set: { type: boolean }
    DisplayTheme:
      type: string
      enum: [light, dark, auto]
      description: |
        `auto` turns dark at sunset and light at sunrise at the home
        location (computed on the box), each shifted by its offset. New
        displays: E-Ink `light`, normal screen `auto`. Quiet mode takes
        precedence over the theme (ADR 0015).
    UpdateDisplay:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "The new name, trimmed; empty or longer than 80 characters is refused with 422" }
        type: { $ref: "#/components/schemas/DisplayType" }
        show_tomorrow: { type: boolean }
        theme: { $ref: "#/components/schemas/DisplayTheme" }
        sunrise_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes, -180 to 180, else 422" }
        sunset_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes, -180 to 180, else 422" }
        quiet_mode:
          type: object
          properties:
            enabled: { type: boolean }
            from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "22:00" }
            to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "06:00" }
        kiosk:
          type: object
          properties:
            url: { type: string, description: "http or https address; empty removes the kiosk app and its key" }
            api_key: { type: string, writeOnly: true, description: "Omitted or empty keeps the stored key" }
        screensaver: { $ref: "#/components/schemas/UpdateScreensaver" }
        brightness: { $ref: "#/components/schemas/UpdateBrightness" }
        list_view: { type: string, enum: [tiles, list], description: "How the display shows lists (ADR 0019); anything else is refused with 422" }
        layout: { $ref: "#/components/schemas/UpdateDisplayLayout" }
    PairDisplay:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", example: "042917" }
        name: { type: string, minLength: 1, maxLength: 80 }
        room: { type: string, maxLength: 80 }
        type: { $ref: "#/components/schemas/DisplayType" }
    PersonalDevice:
      type: object
      required: [id, name, person_id, person_name, paired_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Mia's tablet" }
        person_id: { type: string, format: uuid, description: "The person the personal device acts for, with their role" }
        person_name: { type: string, example: Mia }
        paired_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
    PersonalDevicePairing:
      type: object
      required: [id, device, kind, verification, expires_at, for_person_id]
      properties:
        id: { type: string, format: uuid }
        device: { type: string, example: Safari on iPhone, description: "What the personal device said about itself (browser and device), in the language of the request; empty when it said nothing" }
        kind: { type: string, enum: [phone, tablet, device], description: "The kind of screen, stored with the pairing; `device` when unknown. The box proposes the name by it." }
        verification: { type: string, example: "483 920", description: "Six-digit number the waiting personal device shows. Confirm only if it matches the number on the personal device in your hand." }
        expires_at: { type: string, format: date-time }
        for_person_id: { type: string, format: uuid, nullable: true, description: "Whom the personal device is for next when the code came from `repairPersonalDevice`; null for an ordinary code" }
    NewPersonalDevicePairing:
      type: object
      required: [id, url, expires_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: "The address to show as a QR code. Only in this answer." }
        expires_at: { type: string, format: date-time }
        person_id: { type: string, format: uuid, description: "Only for `repairPersonalDevice`: whom the personal device is for next" }
    RepairPersonalDevice:
      type: object
      required: [person_id]
      properties:
        person_id: { type: string, format: uuid, description: "Whom the personal device is for next: a member of the household other than the personal device's current person" }
    Invitation:
      type: object
      required: [state, created_at, expires_at, created_by, accepted_at, withdrawn_at]
      properties:
        state: { type: string, enum: [open, used, expired, withdrawn] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Seven days after it was created }
        created_by: { type: string, format: uuid, nullable: true, description: The parent who created it; null if that person was removed }
        accepted_at: { type: string, format: date-time, nullable: true }
        withdrawn_at: { type: string, format: date-time, nullable: true, description: Also set when a newer link replaced it }
        url: { type: string, format: uri, description: "The address to show as a QR code or send. Only in the answer of createInvitation." }
    ConfirmPersonalDevice:
      type: object
      required: [person_id, name]
      properties:
        person_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
    SyncState:
      type: object
      description: Only on synced calendars. Displays read `state` to show the sync notice.
      required: [state, interval_minutes, last_attempt_at, last_success_at, last_error]
      properties:
        event_count: { type: integer, description: "Events the calendar holds now, events written on the box included and not limited to the import window; a series counts once" }
        last_run:
          type: object
          description: What the last successful run did to the events. A failed run leaves it as it was.
          required: [new, changed, removed]
          properties:
            new: { type: integer }
            changed: { type: integer }
            removed: { type: integer }
        state: { type: string, enum: [ok, stale], description: "stale = 24 hours without a successful sync; one success clears it. A paused calendar is never stale" }
        paused: { type: boolean, description: "True while the calendar's connection to the outside is off (offline mode, or the connection's own switch; see GET /outbound). The calendar keeps its events, is not tried and is not a problem; it syncs again at once when the connection is on" }
        interval_minutes: { type: integer, example: 60 }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: "Empty after a successful sync. Translated to the language of the request (Accept-Language, default German)" }
    NewCalendar:
      type: object
      required: [kind, name, url]
      properties:
        kind: { type: string, enum: [ics], description: "Only ICS subscriptions so far" }
        name: { type: string }
        url: { type: string, example: "webcal://example.org/school.ics" }
        color: { type: string, example: "#B4583A", description: "#RRGGBB, else 422. Left out, the box picks one from a fixed set" }
        audience: { $ref: "#/components/schemas/Audience" }
        sync_interval_minutes: { type: integer, default: 60, description: "Between 5 and 1440 minutes, else 422" }
    CalendarConnection:
      type: object
      required: [id, kind, url, username, single_calendar]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [caldav, google, outlook], description: "outlook: signed in at Microsoft (`/calendar-connections/outlook/sign-ins`); `username` is then the Microsoft account. google: signed in at Google with the family's own app registration (`/google`); `username` is then the Google account and `url` Google's CalDAV API" }
        url: { type: string, example: "https://caldav.icloud.com" }
        username: { type: string, description: "The Apple ID or CalDAV user name; for Outlook the Microsoft account" }
        single_calendar: { type: boolean }
        needs_signin: { type: boolean, description: "Google only: Google no longer accepts the stored sign-in (invalid_grant): the connection must sign in again (`POST /google/authorize` with its id). Its calendars keep their events and queued changes. Absent when the sign-in works" }
        signin_needed_at: { type: string, format: date-time, description: "Google only, with `needs_signin`: since when" }
        reauth_since: { type: string, format: date-time, description: "Outlook only: when the Microsoft sign-in ended. Until it is renewed (a new sign-in through the reconnect page) no new events arrive; the old ones stay. Absent while the sign-in is valid." }
        calendars:
          type: array
          description: The server's event calendars. Only on connect and on discovery.
          items:
            type: object
            required: [url, name, added]
            properties:
              url: { type: string }
              name: { type: string }
              added: { type: boolean, description: "Already synced through this connection" }
              read_only: { type: boolean, description: "Outlook only: Outlook does not let the account change this calendar (shared with it, birthdays, holidays). It is read-only for good" }
              shared_by: { type: string, description: "Who shared the calendar, when it is known: Outlook gives \"Name (address)\", Google the account" }
              calendar_id: { type: string, format: uuid, description: "The synced calendar, when `added`: change it with PATCH /calendars/{id}, switch it off with DELETE /calendars/{id}" }
              access: { type: string, enum: [read_write, read_only], description: "Google only: whether the box may change events in this calendar. `read_only` calendars (shared for viewing only, birthdays, holidays) are added read-only and can never be switched to two-way" }
              reason: { type: string, enum: [writable, shared, birthdays, google], description: "Google only: why (`shared` = shared with this account for viewing only)" }
              shared: { type: boolean, description: "Google only: another account owns the calendar and shares it with this one" }
    GoogleApp:
      type: object
      required: [configured, redirect_uris, scope, accounts]
      properties:
        configured: { type: boolean, description: "The family has entered its app registration (OAuth client)" }
        client_id: { type: string, description: "Ends with .apps.googleusercontent.com. The client secret is never returned" }
        registered_at: { type: string, format: date-time }
        redirect_uris:
          type: object
          description: The two redirect URIs to enter at Google (exact match). Values to type in, not links
          required: [relay, fallback]
          properties:
            relay: { type: string, example: "https://hejmo-home.github.io/oauth/" }
            fallback: { type: string, example: "http://127.0.0.1:8099/" }
        scope: { type: string, example: "https://www.googleapis.com/auth/calendar" }
        accounts: { type: array, items: { type: string }, description: "Google accounts already connected" }
        sign_in_again:
          type: array
          items: { type: string }
          description: Only in the answer to a PUT that changed the client ID. The Google accounts that must sign in again, because their sign-ins belong to the old client
    OutlookSignIn:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [waiting, signed_in, expired, declined, consent_required, wrong_account, error]
          description: |
            waiting: no verdict yet. signed_in: the connection is stored. expired: the code ran out.
            declined: Cancel or Do not accept at Microsoft. consent_required: a work or school tenant needs an
            administrator to approve the app (give the IT `app_id` and `scopes`). wrong_account: a reconnect was
            signed in with another account (`other_account`). error: Microsoft did not answer or the account could not be read; start again.
        user_code: { type: string, description: "Only while waiting" }
        verification_uri: { type: string, description: "Only while waiting, e.g. https://microsoft.com/devicelogin" }
        expires_at: { type: string, format: date-time, description: "Only while waiting" }
        interval_seconds: { type: integer, description: "How often to ask. Only while waiting" }
        last_polled_at: { type: string, format: date-time, description: "When the box last asked Microsoft" }
        account: { type: string, description: "The Microsoft account signed in (for wrong_account: the one that was expected)" }
        other_account: { type: string, description: "wrong_account: the account that signed in" }
        connection_id: { type: string, format: uuid, description: "When signed_in" }
        app_id: { type: string, description: "consent_required: the app ID the IT approves" }
        scopes: { type: array, items: { type: string }, description: "consent_required: the permissions the app asks for" }
    EventCount:
      type: object
      required: [url, state, count, text]
      properties:
        url: { type: string, description: "The calendar's address, as in the discovery" }
        state: { type: string, enum: [count, empty, unknown], description: "empty = no events in the last 12 months or later; unknown = the server did not answer in time or cannot count" }
        count: { type: integer, description: "0 unless state is count" }
        text: { type: string, description: "The count as text, translated to the language of the request (Accept-Language, default German)" }
    NewCalendarConnection:
      type: object
      required: [provider, username, password]
      properties:
        provider: { type: string, enum: [icloud, caldav] }
        url: { type: string, description: "Server address (required for caldav, ignored for icloud), or the calendar address with single_calendar" }
        username: { type: string, description: "Apple ID for iCloud" }
        password: { type: string, description: "App-specific password for iCloud. Stored encrypted, never returned" }
        single_calendar: { type: boolean, default: false }
    NewConnectionCalendar:
      type: object
      required: [url, name]
      properties:
        url: { type: string, description: "A calendar address from the discovery" }
        name: { type: string }
        color: { type: string, example: "#B4583A", description: "#RRGGBB, else 422. Left out, the box picks one from a fixed set" }
        audience: { $ref: "#/components/schemas/Audience" }
        sync_interval_minutes: { type: integer, default: 5, description: "Between 5 and 1440 minutes, else 422" }
    SyncLogEntry:
      type: object
      required: [id, calendar_id, calendar_name, at, kind, message]
      properties:
        id: { type: string, format: uuid }
        calendar_id: { type: string, format: uuid }
        calendar_name: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [failure, conflict, note] }
        message: { type: string, description: "Translated to the language of the request (Accept-Language, default German)" }
        detail: { type: string, description: "For a conflict: the version that lost, as iCalendar text. Kept for 30 days with the entry. Absent for other entries" }
    Place:
      type: object
      required: [id, name, region, latitude, longitude, region_code]
      properties:
        id: { type: integer, description: "The GeoNames id; give it as home_place_id", example: 2855334 }
        name: { type: string, example: Pasing }
        region: { type: string, description: "What sets the place apart, in the language asked for: district of its town (when it is one), the area when two results would read the same, the state or canton and the country", example: "district of München, Bayern, Germany" }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        region_code: { type: string, description: "ISO 3166-2 code of the state or canton, one of the regions of the setup form", example: DE-BY }
    Settings:
      type: object
      required: [date_format, time_format, temperature_unit, auto_update, home_name, home_place_id, latitude, longitude, below_zero, first_steps_hidden, first_steps_skipped, meal_cutoffs, name_days]
      properties:
        date_format: { type: string, enum: [dmy, mdy], description: "Day first DD.MM.YYYY (default) or month first MM/DD/YYYY. Only how the web interface writes dates in numbers; this API, CalDAV and iCalendar stay ISO 8601" }
        home_name: { type: string, description: "The name of the home place; the name of the place picked from the list" }
        home_place_id: { type: integer, nullable: true, description: "The id of the place of the list on the box (GET /places) the home was picked from; null when the location was set by coordinates only" }
        latitude: { type: number, nullable: true, format: double, description: "Latitude of the home in degrees (north positive); null until the home has a location. Sunrise and sunset, themes and weather use it" }
        longitude: { type: number, nullable: true, format: double, description: "Longitude of the home in degrees (east positive); null until the home has a location" }
        time_format: { type: string, enum: ["24h", "12h"], description: "24-hour (default) or 12-hour clock" }
        temperature_unit: { type: string, enum: [c, f], description: "Degrees Celsius (default) or Fahrenheit" }
        below_zero: { type: boolean, description: "Whether unticking a task may take a star balance below zero (default true). With false, unticking deducts at most down to zero. Redeeming never goes below zero." }
        first_steps_hidden: { type: boolean, description: "Whether the first steps card on the start page is hidden (default false). A parent closes the card when all six steps are done or skipped, or hides it earlier." }
        first_steps_skipped:
          type: array
          description: "The steps of the first steps card a parent skipped, in the order of the card (default empty)"
          items: { type: string, enum: [family, parents, calendars, tasks, meals, display] }
        auto_update: { type: string, enum: [on, off, notify], description: "Auto-update (ADR 0018; has no effect unless GET /update says managed): on (default) installs new published versions at 03:30, off never checks, notify only tells parents that an update is available" }
        meal_cutoffs: { $ref: "#/components/schemas/MealCutoffs" }
        name_days: { $ref: "#/components/schemas/NameDays" }
    NameDays:
      type: object
      description: "Whether the name days of the contacts are in the generated calendar `birthdays` (ticket 318), and after which church. Off by default: Hejmo chooses no church. Switching off keeps the church and every contact's choice."
      required: [on, list]
      properties:
        on: { type: boolean }
        list: { type: string, nullable: true, enum: [catholic, protestant, romanian_orthodox, greek_orthodox, null], description: "The name-day list: catholic (Regionalkalender for Germany, Austria and Switzerland), protestant, romanian_orthodox or greek_orthodox; null until a church was chosen. More values may follow." }
    MealCutoffs:
      type: object
      description: "Per mealtime, the time of day (hh:mm, 24-hour) from which it is no longer shown on displays (ADR 0016). Empty means no cut-off: shown for the rest of the day. Defaults: breakfast 10:00, lunch 13:30, snack 16:30, dinner none."
      required: [breakfast, lunch, snack, dinner]
      properties:
        breakfast: { $ref: "#/components/schemas/CutoffTime" }
        lunch: { $ref: "#/components/schemas/CutoffTime" }
        snack: { $ref: "#/components/schemas/CutoffTime" }
        dinner: { $ref: "#/components/schemas/CutoffTime" }
    CutoffTime: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$', example: "13:30" }
    SettingsUpdate:
      type: object
      properties:
        date_format: { type: string, description: "dmy or mdy; anything else is refused with 400" }
        home_place_id: { type: integer, description: "A place of the list on the box (GET /places): name and coordinates come from it; not together with home_name, latitude or longitude" }
        home_name: { type: string, description: "New home place name; needs latitude and longitude" }
        latitude: { type: number, format: double, description: "-90 to 90; with longitude" }
        longitude: { type: number, format: double, description: "-180 to 180; with latitude. latitude 0 and longitude 0 together mean no location and are refused" }
        time_format: { type: string, description: "24h or 12h" }
        temperature_unit: { type: string, description: "c or f" }
        auto_update: { type: string, description: "on, off or notify" }
        below_zero: { type: boolean, description: "Allow or forbid a star balance below zero after unticking a task" }
        first_steps_hidden: { type: boolean, description: "Hide or show the first steps card on the start page" }
        first_steps_skipped:
          type: array
          description: "Replaces the list of skipped steps; an unknown step refuses the whole request with 422. Steps: family, parents, calendars, tasks, meals, display."
          items: { type: string }
        name_days:
          type: object
          description: "Switch name days on or off and choose the church; omitted parts stay as they are. `on: true` needs a church (the stored one or `list`), else 422; an unknown list is 422. Changing the church sets contacts whose `entry` or `name` the new list does not have back to `auto`."
          properties:
            on: { type: boolean }
            list: { type: string, description: "catholic, protestant, romanian_orthodox or greek_orthodox" }
        meal_cutoffs:
          type: object
          description: "Only the mealtimes given change; a time outside hh:mm refuses the whole request with 422"
          properties:
            breakfast: { type: string }
            lunch: { type: string }
            snack: { type: string }
            dinner: { type: string }
    Outbound:
      type: object
      required: [offline, offline_since, update_reminder_days, public_name, connections, refused]
      properties:
        offline: { type: boolean }
        offline_since: { type: string, nullable: true, format: date-time, description: "When offline mode was switched on; null while it is off" }
        update_reminder_days: { type: integer, minimum: 7, maximum: 365, description: "Days without an update after which parents are reminded (offline mode)" }
        public_name: { type: string, nullable: true, description: "The box's public DNS name, or null if it uses its own certificate" }
        connections:
          type: array
          items:
            type: object
            required: [id, enabled, switchable, locked, last_contact]
            properties:
              id: { type: string, enum: [weather, update, calendars, ics, recipes, images, dns] }
              enabled: { type: boolean, description: "Whether the connection may go outside now; false for all while offline mode is on" }
              switchable: { type: boolean, description: "False for the DNS service, which has no switch" }
              locked: { type: boolean, description: "True while offline mode is on" }
              last_contact: { type: string, nullable: true, format: date-time }
              target: { type: string, description: "The host last reached" }
        refused:
          type: array
          description: "What the gate refused, newest first, at most 200"
          items:
            type: object
            required: [at, service, target]
            properties:
              at: { type: string, format: date-time }
              service: { type: string, enum: [weather, update, calendars, ics, recipes, images, dns, other] }
              target: { type: string }
    OutboundUpdate:
      type: object
      properties:
        offline: { type: boolean }
        connections:
          type: object
          description: "Connection id to switch (weather, update, calendars, ics, recipes, images)"
          additionalProperties: { type: boolean }
        update_reminder_days: { type: integer }
    UpdateFile:
      type: object
      required: [state, available]
      properties:
        state: { type: string, enum: [none, ready, installing] }
        available: { type: boolean, description: "Whether a file can be uploaded now" }
        version: { type: string, description: "The version the file holds (x.y.z)" }
        from_version: { type: string, description: "The version that ran when the file was uploaded; absent when the box does not know it" }
        arch: { type: string, enum: [arm64, amd64] }
        file_name: { type: string }
        size: { type: integer, format: int64, description: "Bytes" }
        sha256: { type: string, description: "Of the whole file, hex" }
        released: { type: string, format: date, description: "Release date of the version, from the signed manifest" }
        signer: { type: string, description: "The identity the signature names: the release workflow of the tag" }
        uploaded_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "When a waiting file is deleted if nobody answers" }
        started_at: { type: string, format: date-time }
        started_by: { type: string, description: "The parent who said yes" }
        step: { type: string, enum: [verify, backup, start, health], description: "Where the host script is with an installation" }
    UpdateStatus:
      type: object
      required: [mode, managed, state, notice]
      properties:
        mode: { type: string, enum: [on, off, notify] }
        managed: { type: boolean, description: "Whether the host updater of the install script manages this box. False on a plain Docker Compose install: then mode (also in /settings) is stored but nothing acts on it." }
        state:
          type: string
          enum: [idle, installing, available, updated, rolled_back, rejected, failed]
          description: "installing (an uploaded update file is being installed), idle (nothing newer or no report yet), available (notify only), updated, rolled_back (the new version failed; the previous one runs again with its data), rejected (signature not valid, not installed), failed (nothing changed, except with reason rollback_failed: then the image and database did change)"
        version: { type: string, description: "The version that runs now" }
        target: { type: string, description: "The version offered or attempted" }
        reason: { type: string, enum: [start_failed, health_check_failed, signature_invalid, backup_failed, pull_failed, rollback_failed, box_not_running, file_invalid, load_failed, verifier_missing] }
        time: { type: string, format: date-time, description: "When the script recorded this event" }
        notice: { type: boolean, description: "Whether the web interface currently shows a notice to parents" }
        release_notes_url: { type: string, format: uri, description: "Release notes of the version installed or offered" }
    HTTPSStatus:
      type: object
      required: [mode, warning]
      properties:
        mode: { type: string, enum: [own-ca, public] }
        name: { type: string, description: "Public DNS name of the box (mode public)" }
        issuer: { type: string, enum: [letsencrypt, actalis], description: "Chosen certificate authority (mode public)" }
        expires_at: { type: string, format: date-time, description: "When the public certificate ends (mode public), or when the box's own CA ends (mode own-ca)" }
        names: { type: array, items: { type: string }, description: "Names and addresses the box certificate is valid for (mode own-ca)" }
        router_name: { type: string, description: "The name of the box in the router that the certificate covers (mode own-ca, only when there is one)" }
        warning: { type: boolean, description: "True if the public certificate could not be resumed, loaded, obtained or renewed, or expires within 7 days" }
        renewal_error: { type: string, description: "Why the last resume, load, order or renewal failed" }
    Mealtime: { type: string, enum: [breakfast, lunch, snack, dinner] }
    Meal:
      type: object
      description: "One entry of the shared meal plan for a day and a mealtime: free text, or a recipe with portions."
      required: [date, mealtime, text, dish, source]
      properties:
        date: { type: string, format: date }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        text: { type: string, maxLength: 200, description: "The same as dish, kept for clients that read text" }
        dish: { type: string, maxLength: 200, description: "What there is to eat: the recipe's current name, or the free text" }
        recipe_id: { type: string, description: "The recipe, when the entry is one; absent for free text" }
        portions: { type: integer, minimum: 1, maximum: 99, description: "Portions of the recipe; absent for free text" }
        source:
          type: string
          enum: [manual, template, adjusted]
          description: |
            Where the meal comes from: typed by hand, filled in by a meal plan
            template, or a template's meal that was changed for this week.
        template_id: { type: string, format: uuid, description: "The template that fills this meal (source template or adjusted)" }
        template_dish: { type: string, description: "What the template fills in (source template or adjusted)" }
    MealShoppingSource:
      type: object
      description: What one meal brought to a row or to a list entry
      required: [date, mealtime, recipe_id, recipe_name, portions]
      properties:
        date: { type: string, format: date }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        recipe_id: { type: string }
        recipe_name: { type: string }
        portions: { type: integer, description: "The portions this meal put on the list" }
        amount: { type: number, description: "How much it brought; missing for a kitchen measure or free text" }
        unit: { $ref: "#/components/schemas/UnitKey" }
    MealShopping:
      type: object
      required: [meal, week, list_id, list_name, meals, versions, rows, same, counts]
      properties:
        meal: { type: string, nullable: true }
        week: { type: string, nullable: true, format: date, description: "The Monday of the week" }
        list_id: { type: string, nullable: true, format: uuid }
        list_name: { type: string, nullable: true }
        meals:
          type: array
          items:
            type: object
            required: [key, date, mealtime, recipe_id, recipe_name, portions, on_list, to_add, status, selected]
            properties:
              key: { type: string }
              date: { type: string, format: date }
              mealtime: { $ref: "#/components/schemas/Mealtime" }
              recipe_id: { type: string }
              recipe_name: { type: string }
              portions: { type: integer, description: "Planned portions" }
              on_list: { type: integer, description: "Portions on a list already" }
              to_add: { type: integer, description: "Portions this run would put on the list" }
              status: { type: string, enum: [open, done, empty] }
              selected: { type: boolean }
        versions: { type: object, additionalProperties: { type: string }, description: "Recipe id to its version: send them back when adding" }
        rows:
          type: array
          items:
            type: object
            required: [key, name, article_id, variety, group, outcome, tick, sources]
            properties:
              key: { type: string }
              name: { type: string }
              article_id: { type: string, nullable: true }
              variety: { type: string, nullable: true }
              amount: { type: number, description: "Missing without a quantity (kitchen measures, free text)" }
              unit: { $ref: "#/components/schemas/UnitKey" }
              group: { type: string, enum: [new, on_list, pantry] }
              outcome: { type: string, enum: [new, added, filled, separate] }
              tick: { type: boolean }
              kitchen: { type: string, description: "What the recipe says in kitchen measures, for the sentence" }
              sources:
                type: array
                items: { $ref: "#/components/schemas/MealShoppingSource" }
        same: { type: array, items: { type: string }, description: "Entries that stay exactly as they are" }
        counts:
          type: object
          required: [new, on_list, same, pantry, ticked]
          properties:
            new: { type: integer }
            on_list: { type: integer }
            same: { type: integer }
            pantry: { type: integer }
            ticked: { type: integer }
    MealShoppingRun:
      type: object
      required: [run_id, list_id, list_name, added, left_out]
      properties:
        run_id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        list_name: { type: string }
        added:
          type: array
          items:
            type: object
            required: [entry_id, name, action]
            properties:
              entry_id: { type: string, format: uuid }
              name: { type: string }
              action: { type: string, enum: [new, added, filled] }
              amount: { type: number, description: "How much the meals brought" }
              unit: { $ref: "#/components/schemas/UnitKey" }
        left_out: { type: array, items: { type: string }, description: "Pantry articles that were not put on the list" }
    MealShoppingConflict:
      type: object
      required: [error]
      properties:
        error: { type: string }
        changed: { type: array, items: { type: string }, description: "Ids of the recipes that changed" }
    MealShoppingUndo:
      type: object
      required: [removed, reverted, ticked]
      properties:
        removed: { type: array, items: { type: string } }
        reverted:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              amount: { type: number }
              unit: { $ref: "#/components/schemas/UnitKey" }
        ticked: { type: array, items: { type: string }, description: "Entries that were ticked off meanwhile and stay" }
    MealTemplateEntry:
      type: object
      required: [weekday, mealtime]
      description: |
        One slot of a template's week: free text, or a recipe of the household.
        Give `text` or `recipe_id`, not both (else 422). Applying the template
        plans a recipe slot with as many portions as there are people in the
        household. A recipe slot is read with the recipe's current name as
        `text`; when the recipe is deleted the slot stays as that name in free
        text, without `recipe_id`.
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "1 Monday to 7 Sunday" }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        text: { type: string, maxLength: 200, description: "Free text; with `recipe_id` (as read) the recipe's name" }
        recipe_id: { type: string, description: "A recipe of the household (`/recipes`); an unknown one is 422. Not with a text in a request" }
    NewMealTemplate:
      type: object
      required: [name, mealtimes, interval, start_week, entries]
      properties:
        name: { type: string, maxLength: 60 }
        mealtimes: { type: string, enum: [all, one], description: "Fills all mealtimes of the day, or one" }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        interval: { type: integer, minimum: 1, maximum: 52, description: "Every n weeks, counted from the start week" }
        start_week: { type: string, format: date, description: "The Monday of the start week" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MealTemplateEntry" }
    MealTemplate:
      allOf:
        - $ref: "#/components/schemas/NewMealTemplate"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    MealTemplateClash:
      type: object
      required: [error, clashes]
      properties:
        error: { type: string }
        clashes:
          type: array
          items:
            type: object
            required: [template, mealtime, weekdays, first_week]
            properties:
              template:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              mealtime: { $ref: "#/components/schemas/Mealtime" }
              weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
              first_week: { type: string, format: date, description: "Monday of the first week both fill the meal, from today on" }
    RecipeCategory: { type: string, enum: [main, side, dessert, baking, breakfast, snack] }
    RecipeIngredient:
      type: object
      description: |
        One line of a recipe: an article of the library (with an optional
        variety) or free text (`article_id` null), which is not checked for
        allergens. No `quantity` means "as needed" (salt).
      required: [name]
      properties:
        quantity: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 9999, description: For the recipe's portions }
        unit: { type: string, nullable: true, description: "A key of GET /recipe-units; none for a plain number" }
        name: { type: string, maxLength: 200 }
        article_id: { type: string, nullable: true, description: The key of a shipped article or the id of an own one }
        variety: { type: string, nullable: true, maxLength: 60, description: 'The more exact kind, such as "Type 405"; only an article has one. A variety written in `text` wins over this ("Mehl Type 405" with variety "Type 550" is Type 405); this counts only when `text` has none' }
    NewRecipe:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        category: { $ref: "#/components/schemas/RecipeCategory" }
        portions: { type: integer, minimum: 1, maximum: 99, description: The number of people in the household when missing }
        minutes: { type: integer, nullable: true, minimum: 0, maximum: 9999, description: From start to table; none when unknown }
        mealtimes:
          type: array
          description: Which mealtimes it suits; empty means every mealtime
          items: { $ref: "#/components/schemas/Mealtime" }
        tags:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 30 }
        tips: { type: string, maxLength: 2000 }
        source: { type: string, maxLength: 300, description: "A book, a person or a web address" }
        ingredients:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RecipeIngredient" }
        steps:
          type: array
          maxItems: 100
          description: The steps in order; each at most 2000 characters
          items: { type: string }
    Recipe:
      type: object
      required: [id, name, category, portions, minutes, mealtimes, tags, tips, source, source_url, source_name, starter, ingredients, steps, diet, favourite_of, last_cooked, created_by, created_at, updated_by, updated_at]
      properties:
        id: { type: string, description: A uuid; a starter recipe's id starts with "starter-" }
        favourite_of:
          type: array
          items: { type: string, format: uuid }
          description: "The people who like the recipe (\"Mia likes it\"), in the order of the household; set with `PUT /recipes/{id}/favourites`. Empty for a starter recipe."
        last_cooked: { type: string, format: date, nullable: true, description: "The latest day the recipe was planned that is over (before today, in the household's time zone), null when it never was. It moves on by itself when a planned day passes. Null for a starter recipe." }
        starter: { type: boolean, description: "True for a recipe of the starter collection, which nobody in the household wrote and nobody can change" }
        source_name: { type: string, nullable: true, description: 'The site the ingredients are after ("Ingredients after: Chefkoch"); only a starter recipe has one' }
        name: { type: string }
        category: { $ref: "#/components/schemas/RecipeCategory" }
        portions: { type: integer }
        minutes: { type: integer, nullable: true }
        mealtimes:
          type: array
          items: { $ref: "#/components/schemas/Mealtime" }
        tags:
          type: array
          items: { type: string }
        tips: { type: string }
        source: { type: string }
        source_url: { type: string, nullable: true, description: The source when it is a web address }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/RecipeIngredient" }
        steps:
          type: array
          items: { type: string }
        diet: { type: string, nullable: true, enum: [vegan, vegetarian, null], description: Set only when every library article fits; free text does not stop it }
        created_by: { type: string, nullable: true, format: uuid }
        created_at: { type: string, format: date-time, nullable: true, description: Null for a starter recipe }
        updated_by: { type: string, nullable: true, format: uuid }
        updated_at: { type: string, format: date-time, nullable: true, description: Null for a starter recipe }
    RecipeWarnings:
      type: object
      required: [recipe_id, warnings, not_checked_ingredients, not_checked_allergies, diet, note]
      properties:
        recipe_id: { type: string }
        warnings:
          type: array
          items:
            type: object
            required: [allergen, people]
            properties:
              allergen: { type: string }
              people:
                type: array
                items: { type: string, format: uuid }
        not_checked_ingredients:
          type: array
          items: { type: string }
        not_checked_allergies:
          type: array
          items:
            type: object
            required: [person_id, text]
            properties:
              person_id: { type: string, format: uuid }
              text: { type: string }
        diet: { type: string, nullable: true, enum: [vegan, vegetarian, null] }
        note: { type: string }
    Event:
      type: object
      description: An event or series master. Times are RFC 3339 in the household's time zone; all-day events use dates with an exclusive end.
      required: [id, calendar_id, title, description, location, all_day, start, end, rrule, people, groups]
      properties:
        id: { type: string, format: uuid }
        calendar_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        all_day: { type: boolean }
        start: { type: string, example: "2026-11-02T16:00:00+01:00" }
        end: { type: string, example: "2026-11-02T17:00:00+01:00" }
        rrule: { type: string, description: "RFC 5545 RRULE value, empty for single events", example: "FREQ=WEEKLY;BYDAY=MO" }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
        invitation: { $ref: "#/components/schemas/EventInvitation" }
    EventInvitation:
      type: object
      description: Other people are invited to this event (Outlook). It is read-only on the box, also in a calendar that is not, because a change would send a message to every attendee; changing or deleting it answers 422. Change it at its source (`web_link`).
      required: [organizer, response, web_link]
      properties:
        organizer: { type: string }
        response: { type: string, description: "The account's answer in Outlook", enum: ["", accepted, tentativelyAccepted, declined, notResponded, organizer] }
        web_link: { type: string }
    NewEvent:
      type: object
      required: [title, start, end]
      properties:
        calendar_id: { type: string, format: uuid, description: "Defaults to the family calendar" }
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        all_day: { type: boolean }
        start: { type: string }
        end: { type: string }
        timezone: { type: string, example: "Europe/Berlin", description: "IANA time zone the event keeps (its wall-clock time stays the same across daylight-saving changes). Defaults to the household's. It cannot be changed afterwards." }
        rrule: { type: string }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    EventPatch:
      type: object
      description: Only the fields given change. start/end are the new times of the edited occurrence; with scope following or all, the shift applies to the series. Sending timezone on PATCH answers 422 (the timezone of an event cannot be changed).
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        start: { type: string }
        end: { type: string }
        rrule: { type: string }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    Occurrence:
      type: object
      required: [event_id, series_id, recurrence_id, calendar_id, title, description, location, all_day, start, end, people, groups]
      properties:
        event_id: { type: string, format: uuid }
        series_id: { type: string, description: "Series master id, empty for single events" }
        recurrence_id: { type: string, description: "Original start within the series; pass as ?occurrence= to edit" }
        calendar_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        all_day: { type: boolean }
        start: { type: string }
        end: { type: string }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
        invitation: { $ref: "#/components/schemas/EventInvitation" }
    Screensaver:
      type: object
      description: |
        The photo screensaver of a display (ADR 0020). On by default; it never runs
        in quiet mode. A new E-Ink display changes the photo every 15 minutes, any
        other display every minute.
      required: [enabled, idle_minutes, interval_minutes, album_ids]
      properties:
        enabled: { type: boolean }
        idle_minutes: { type: integer, minimum: 1, maximum: 240, example: 10, description: "Minutes without a touch before the photos start" }
        interval_minutes: { type: integer, minimum: 1, maximum: 240, example: 1, description: "Minutes each photo stays" }
        album_ids: { type: array, items: { type: string, format: uuid }, description: "The albums it shows; empty means all albums, including albums made later" }
    UpdateScreensaver:
      type: object
      properties:
        enabled: { type: boolean }
        idle_minutes: { type: integer, description: "1 to 240, else 422" }
        interval_minutes: { type: integer, description: "1 to 240, else 422" }
        album_ids: { type: array, items: { type: string, format: uuid }, description: "An empty list means all albums; an unknown album is refused with 422" }
    DisplaySaver:
      type: object
      required: [active, interval_seconds, display_type, photos]
      properties:
        active: { type: boolean }
        interval_seconds: { type: integer }
        display_type: { $ref: "#/components/schemas/DisplayType" }
        photos: { type: array, items: { type: string, format: uuid } }
    AlbumName:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    Album:
      type: object
      required: [id, name, source, folder, default, photo_count, hidden_count, cover_photo_id, displays]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, enum: [upload, folder], description: "`folder`: it comes from a subfolder of the box's photo folder and is changed only there" }
        folder: { type: string, description: "The subfolder name, empty for an uploaded album" }
        default: { type: boolean, description: "The album that takes the first uploads and the photos lying directly in the folder; it cannot be deleted" }
        photo_count: { type: integer }
        hidden_count: { type: integer, description: "How many of the photos are hidden from displays" }
        cover_photo_id: { type: string, nullable: true, format: uuid }
        displays:
          type: array
          description: The displays that show this album
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    Photo:
      type: object
      required: [id, album_id, name, hidden, width, height, created_at]
      properties:
        id: { type: string, format: uuid }
        album_id: { type: string, format: uuid }
        name: { type: string, description: "The file name it came with" }
        hidden: { type: boolean, description: "Don't show on displays" }
        width: { type: integer }
        height: { type: integer }
        created_at: { type: string, format: date-time }
    UpdatePhoto:
      type: object
      properties:
        hidden: { type: boolean }
        album_id: { type: string, format: uuid }
    PhotoStorage:
      type: object
      required: [used_bytes, limit_bytes, limit_gb, photo_count, full, waiting]
      properties:
        used_bytes: { type: integer, format: int64 }
        limit_bytes: { type: integer, format: int64 }
        limit_gb: { type: integer, example: 2 }
        photo_count: { type: integer }
        full: { type: boolean, description: "Whether another photo would be refused" }
        waiting:
          type: array
          description: Photos in the box's folder that wait for space, by folder (empty name is the folder itself)
          items:
            type: object
            required: [folder, count]
            properties:
              folder: { type: string }
              count: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        field: { type: string, description: "The refused field, when the error is about one" }
        code: { type: string, description: "A fixed word for the cause, where an endpoint documents them" }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role or token scope does not allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpdateFileRefused:
      description: The update file was refused, or no upload is possible now; `code` says why and the text is in the language of the request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RedemptionRefused:
      description: |
        Refused: not enough stars (`stars`), the limit is used up (`limit`),
        there is an open request already (`asked`), or the request was decided
        already (`decided`, with who decided it and when). Nothing was booked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RedemptionRefused" }
    Invalid:
      description: Request is well-formed but not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OffNow:
      description: |
        The connection to the outside this needs is off: offline mode is on, or the
        connection is switched off (`GET /outbound` says which). Nothing was sent
        to the outside and nothing was changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasskeyName:
      description: |
        The request did not reach the box under its box name (an IP address or
        another name). Passkeys are created and used only under the box name.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TemplateConflict:
      description: |
        An own template already has that name (`field: name`), or the template
        ships with Hejmo and cannot be changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RewardConflict:
      description: |
        The request clashes with what is stored: the reward was redeemed (it is
        archived, not deleted), or it is archived (offer it again to change it).
        Nothing was changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoutineConflict:
      description: |
        The request clashes with what is stored: the person has a routine for
        that part of the day already (`existing_routine_id`), or the task is in
        a routine already. Nothing was saved.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              existing_routine_id: { type: string, format: uuid }
    MealTemplateClash:
      description: The template fills a meal another template fills too; nothing was saved
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MealTemplateClash" }
    TooLarge:
      description: The file is larger than 64 MB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PhotosFull:
      description: The space for photos is full; nothing was deleted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many wrong attempts, try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
