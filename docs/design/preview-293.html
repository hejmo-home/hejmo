<script>
const CSS = "/* \"Nordic Calm\" design tokens and shared styles for the web interface and the\n   displays. The values are recorded in DESIGN.md (binding values: docs/spec.md,\n   section \"Design specification\"); web/design_test.go keeps both in step.\n   Themes: light (default), dark, bw (black-and-white). Select one with\n   data-theme on <html> or any container. No shadows, no gradients, no\n   animations (E-Ink). Fonts come from the box (/static/fonts), never a CDN. */\n\n@font-face {\n  font-family: Figtree;\n  src: url(\"/static/fonts/Figtree-wght.ttf\") format(\"truetype\");\n  font-weight: 300 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root, [data-theme=\"light\"] {\n  color-scheme: light;\n  --background: #F6F3EE;\n  --surface: #FFFFFF;\n  --text: #2A2A28;\n  --text-secondary: #5C5A55;\n  --accent: #2F5E7A;\n  --border: #D6D3CC;\n  --error-bg: #F7E7E0;\n  --error-text: #5C3A2C;\n  --notice-bg: #FBF1DC;\n  --notice-text: #5A4520;\n  --person-1: #B4583A;\n  --person-1-tint: #F7E7E0;\n  --person-1-text: #5C3A2C;\n  --person-2: #2F5E7A;\n  --person-2-tint: #E1EBF1;\n  --person-2-text: #24485E;\n  --person-3: #4E7D52;\n  --person-3-tint: #E3EEE3;\n  --person-3-text: #2F4D31;\n  --person-4: #9A7420;\n  --person-4-tint: #F3EAD3;\n  --person-4-text: #5A4513;\n  --person-5: #86587F;\n  --person-5-tint: #F0EBF0;\n  --person-5-text: #432C40;\n  --person-6: #3A7A74;\n  --person-6-tint: #E7EFEE;\n  --person-6-text: #1D3D3A;\n  --person-7: #5559A3;\n  --person-7-tint: #EBEBF4;\n  --person-7-text: #2A2C52;\n  --person-8: #B04A6A;\n  --person-8-tint: #F6E9ED;\n  --person-8-text: #582535;\n  --accent-text: #FFFFFF;\n  /* type scale: size and weight per element */\n  --fs-date: 36px;        --fw-date: 700;\n  --fs-key-figure: 22px;  --fw-key-figure: 700;\n  --fs-person-name: 19px; --fw-person-name: 700;\n  --fs-event-title: 16px; --fw-event-title: 600;\n  --fs-body: 16px;        --fw-body: 400;\n  --fs-label: 14px;       --fw-label: 400;\n  --fs-label-large: 15px; --fw-label-large: 400;\n  --fs-meta: 13px;        --fw-meta: 400;\n  --fs-title-phone: 28px; /* h1 under 600 px */\n  --fs-secret: 19px;      /* a secret shown once, monospace */\n  /* shapes and spacing */\n  --radius-tile: 22px;\n  --radius-chip: 18px;\n  --radius-card: 14px;\n  --radius-field: 12px;\n  --radius-progress: 4px;\n  --progress-height: 8px;\n  --margin: 28px;\n  --gap: 14px;\n  --gap-section: 20px;\n  --gap-cards: 10px;\n  --pad-column: 16px;\n  --col-min: 144px; /* narrowest person column (ADR 0016) */\n  --cols-max: 6; /* person columns side by side in landscape; portrait below */\n  --pad-card: 10px 12px;\n  --marker-size: 14px;\n  --marker-size-bw-column: 16px;\n  --journey-border: 1.5px;\n  --icon-stroke: 1.8px;\n  --touch-target: 44px;\n  font-family: Figtree, system-ui, sans-serif;\n}\n\n[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --background: #1B1A18;\n  --surface: #262522;\n  --text: #ECE9E3;\n  --text-secondary: #B4B0A7;\n  --accent: #6FA3C2;\n  --border: #403E39;\n  --error-bg: #3E2A24;\n  --error-text: #F0CDBF;\n  --notice-bg: #38301D;\n  --notice-text: #EBD9A6;\n  --person-1: #D98466;\n  --person-1-tint: #4A3830;\n  --person-1-text: #F4DAD1;\n  --person-2: #6FA3C2;\n  --person-2-tint: #353E42;\n  --person-2-text: #D4E3ED;\n  --person-3: #7FB383;\n  --person-3-tint: #384135;\n  --person-3-text: #D9E8DA;\n  --person-4: #D1A94A;\n  --person-4-tint: #483F2A;\n  --person-4-text: #F1E5C9;\n  --person-5: #B98AB2;\n  --person-5-tint: #43393F;\n  --person-5-text: #EADCE8;\n  --person-6: #6FB2AA;\n  --person-6-tint: #35413D;\n  --person-6-text: #D4E8E6;\n  --person-7: #8589D6;\n  --person-7-tint: #393946;\n  --person-7-text: #DADCF3;\n  --person-8: #D67188;\n  --person-8-tint: #493436;\n  --person-8-text: #F3D4DB;\n  --accent-text: #1B1A18;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme]) {\n    color-scheme: dark;\n    --background: #1B1A18;\n    --surface: #262522;\n    --text: #ECE9E3;\n    --text-secondary: #B4B0A7;\n    --accent: #6FA3C2;\n    --border: #403E39;\n    --error-bg: #3E2A24;\n    --error-text: #F0CDBF;\n    --notice-bg: #38301D;\n    --notice-text: #EBD9A6;\n    --person-1: #D98466;\n    --person-1-tint: #4A3830;\n    --person-1-text: #F4DAD1;\n    --person-2: #6FA3C2;\n    --person-2-tint: #353E42;\n    --person-2-text: #D4E3ED;\n    --person-3: #7FB383;\n    --person-3-tint: #384135;\n    --person-3-text: #D9E8DA;\n    --person-4: #D1A94A;\n    --person-4-tint: #483F2A;\n    --person-4-text: #F1E5C9;\n    --person-5: #B98AB2;\n    --person-5-tint: #43393F;\n    --person-5-text: #EADCE8;\n    --person-6: #6FB2AA;\n    --person-6-tint: #35413D;\n    --person-6-text: #D4E8E6;\n    --person-7: #8589D6;\n    --person-7-tint: #393946;\n    --person-7-text: #DADCF3;\n    --person-8: #D67188;\n    --person-8-tint: #493436;\n    --person-8-text: #F3D4DB;\n    --accent-text: #1B1A18;\n  }\n}\n\n[data-theme=\"bw\"] {\n  color-scheme: light;\n  --background: #EDEDEA;\n  --surface: #FFFFFF;\n  --text: #111111;\n  --text-secondary: #3A3A38;\n  --accent: #111111;\n  --border: #111111;\n  --error-bg: #E4E4E1;\n  --error-text: #111111;\n  --notice-bg: #E4E4E1;\n  --notice-text: #111111;\n  --event-card: #E4E4E1;\n  --progress-fill: #111111;\n  --progress-track: #D6D6D3;\n  --person-1: #111111;\n  --person-1-tint: #E4E4E1;\n  --person-1-text: #111111;\n  --person-2: #111111;\n  --person-2-tint: #E4E4E1;\n  --person-2-text: #111111;\n  --person-3: #111111;\n  --person-3-tint: #E4E4E1;\n  --person-3-text: #111111;\n  --person-4: #111111;\n  --person-4-tint: #E4E4E1;\n  --person-4-text: #111111;\n  --person-5: #111111;\n  --person-5-tint: #E4E4E1;\n  --person-5-text: #111111;\n  --person-6: #111111;\n  --person-6-tint: #E4E4E1;\n  --person-6-text: #111111;\n  --person-7: #111111;\n  --person-7-tint: #E4E4E1;\n  --person-7-text: #111111;\n  --person-8: #111111;\n  --person-8-tint: #E4E4E1;\n  --person-8-text: #111111;\n  --accent-text: #FFFFFF;\n  --fw-event-title: 700;\n}\n\n* { box-sizing: border-box; }\nbody { margin: 0; padding: var(--margin); background: var(--background); color: var(--text); font-size: var(--fs-body); font-weight: var(--fw-body); }\nh1 { font-size: var(--fs-date); font-weight: var(--fw-date); margin: 0 0 8px; }\n.lead { color: var(--text-secondary); margin: 0 0 20px; }\n.steps { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: var(--gap); max-width: 560px; }\n.steps li { background: var(--surface); border-radius: var(--radius-tile); padding: 16px; }\n.steps strong { display: block; font-size: var(--fs-person-name); }\n.steps span { color: var(--text-secondary); font-size: var(--fs-label); }\n.button { cursor: pointer; display: inline-block; min-height: var(--touch-target); padding: 10px 22px; border-radius: var(--radius-chip); background: var(--accent); color: var(--accent-text); font-weight: 700; text-decoration: none; border: 0; font: inherit; font-weight: 700; }\n.steps fieldset { border: 0; margin: 0; background: var(--surface); border-radius: var(--radius-tile); padding: 16px; display: grid; gap: 10px; }\n.steps legend { font-size: var(--fs-person-name); font-weight: 700; padding: 0; float: left; }\n.steps form { display: grid; gap: var(--gap); }\n.hint { color: var(--text-secondary); font-size: var(--fs-label); overflow-wrap: anywhere; }\n[hidden] { display: none !important; }\nlabel { display: grid; gap: 4px; font-size: var(--fs-label); color: var(--text-secondary); }\ninput, select { font: inherit; color: var(--text); min-height: var(--touch-target); padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-field); background: var(--surface); }\n.error { background: var(--error-bg); color: var(--error-text); border-radius: var(--radius-card); padding: 10px 12px; max-width: 560px; }\n.secret { font-size: var(--fs-person-name); letter-spacing: 0.08em; word-break: break-all; }\n.task-today { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 var(--gap-section); }\n.task-today .hint { margin: 0; }\n.f > .hint { margin: 0; }\n.f.short input { width: 7em; max-width: 100%; font-variant-numeric: tabular-nums; }\n.steps fieldset > .notice { margin: 0; }\n.task-stars, .msg b, .notice b { white-space: nowrap; }\n.notice { background: var(--notice-bg); color: var(--notice-text); border-radius: var(--radius-card); padding: 10px 12px; max-width: 560px; }\n.cards { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: var(--gap); max-width: 560px; }\n.cards li { background: var(--surface); border-radius: var(--radius-tile); padding: 16px; display: grid; gap: 6px; }\n.cards .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }\n.swatch { width: calc(var(--marker-size) * 2); min-height: 0; height: var(--marker-size); padding: 0; border: 0; vertical-align: middle; background: none; }\n.button.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }\n.check { display: flex; align-items: center; gap: 8px; color: var(--text); }\n.check input { min-height: 0; width: 20px; height: 20px; }\n.log { border-collapse: collapse; max-width: 100%; font-size: var(--fs-label); }\n.log th, .log td { text-align: left; padding: 6px 12px 6px 0; vertical-align: top; }\n/* The name of the calendar keeps its words whole: the column of a long message must not squeeze it (ticket 18, a Google failure line is long). */\n.log td:nth-child(2) { overflow-wrap: break-word; }\na { color: var(--accent); }\n\n/* Person slots: a person gets data-person=\"1\"..\"8\" (colour, tint, text on\n   tint). In bw every slot is black on a grey tint and differs by marker shape. */\n[data-person=\"1\"] { --pc: var(--person-1); --pc-tint: var(--person-1-tint); --pc-text: var(--person-1-text); }\n[data-person=\"2\"] { --pc: var(--person-2); --pc-tint: var(--person-2-tint); --pc-text: var(--person-2-text); }\n[data-person=\"3\"] { --pc: var(--person-3); --pc-tint: var(--person-3-tint); --pc-text: var(--person-3-text); }\n[data-person=\"4\"] { --pc: var(--person-4); --pc-tint: var(--person-4-tint); --pc-text: var(--person-4-text); }\n[data-person=\"5\"] { --pc: var(--person-5); --pc-tint: var(--person-5-tint); --pc-text: var(--person-5-text); }\n[data-person=\"6\"] { --pc: var(--person-6); --pc-tint: var(--person-6-tint); --pc-text: var(--person-6-text); }\n[data-person=\"7\"] { --pc: var(--person-7); --pc-tint: var(--person-7-tint); --pc-text: var(--person-7-text); }\n[data-person=\"8\"] { --pc: var(--person-8); --pc-tint: var(--person-8-tint); --pc-text: var(--person-8-text); }\n\n/* Marker: circle in the person colour; in bw a shape (16px in the column\n   header). */\n.marker { display: inline-block; width: var(--marker-size); height: var(--marker-size); border-radius: 50%; background: var(--pc); vertical-align: middle; flex: none; }\n[data-theme=\"bw\"] .marker { width: var(--marker-size-bw-column); height: var(--marker-size-bw-column); background: var(--text); border: 2px solid var(--text); border-radius: 0; }\n[data-theme=\"bw\"] .marker[data-shape=\"circle-filled\"] { border-radius: 50%; }\n[data-theme=\"bw\"] .marker[data-shape=\"circle-empty\"] { border-radius: 50%; background: transparent; }\n[data-theme=\"bw\"] .marker[data-shape=\"square-filled\"] { border-radius: 0; }\n[data-theme=\"bw\"] .marker[data-shape=\"square-empty\"] { border-radius: 0; background: transparent; }\n[data-theme=\"bw\"] .marker[data-shape=\"triangle-filled\"] { border: 0; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }\n[data-theme=\"bw\"] .marker[data-shape=\"diamond-filled\"] { border: 0; border-radius: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }\n[data-theme=\"bw\"] .marker[data-shape=\"cross-filled\"] { border: 0; border-radius: 0; clip-path: polygon(34% 0, 66% 0, 66% 34%, 100% 34%, 100% 66%, 66% 66%, 66% 100%, 34% 100%, 34% 66%, 0 66%, 0 34%, 34% 34%); }\n[data-theme=\"bw\"] .marker[data-shape=\"star-filled\"] { border: 0; border-radius: 0; clip-path: polygon(50% 0, 62% 36%, 100% 36%, 69% 58%, 81% 96%, 50% 73%, 19% 96%, 31% 58%, 0 36%, 38% 36%); }\n\n/* Who an event is for is said in words (Q62): a line under the title that\n   wraps, so the card grows; names are never cut. Markers stay in the column\n   headers and the person chips. */\n.event .who { font-size: var(--fs-meta); font-weight: var(--fw-meta); overflow-wrap: break-word; hyphens: manual; }\n\n/* Family view building blocks (screens use them from ticket 5.3 on). */\n.tile, .column, .chip { background: var(--surface); }\n.tile, .column { border-radius: var(--radius-tile); }\n.column { padding: var(--pad-column); display: grid; gap: var(--gap-cards); align-content: start; }\n.chip { border-radius: var(--radius-chip); padding: 8px 16px; font-size: var(--fs-key-figure); font-weight: var(--fw-key-figure); }\n.event { background: var(--pc-tint); color: var(--pc-text); border-radius: var(--radius-card); padding: var(--pad-card); display: grid; gap: 2px; }\n[data-theme=\"bw\"] .event { background: var(--event-card); color: var(--text); }\n.event .title { font-size: var(--fs-event-title); font-weight: var(--fw-event-title); }\n.event .meta { font-size: var(--fs-meta); font-weight: var(--fw-meta); }\n.event.journey { background: none; color: var(--text); border: var(--journey-border) dashed var(--pc); }\n.progress { height: var(--progress-height); border-radius: var(--radius-progress); background: var(--pc-tint); overflow: hidden; }\n.progress > span { display: block; height: 100%; width: calc(var(--pct, 0) * 1%); background: var(--pc); }\n[data-theme=\"bw\"] .progress { background: var(--progress-track); }\n[data-theme=\"bw\"] .progress > span { background: var(--progress-fill); }\n.icon { stroke: var(--accent); stroke-width: var(--icon-stroke); fill: none; stroke-linecap: round; stroke-linejoin: round; }\n.display { text-align: center; max-width: 560px; margin: 0 auto; }\n.display .qr { width: min(70vw, 360px); margin: 0 auto 16px; color: var(--text); background: var(--surface); border-radius: var(--radius-tile); padding: 8px; }\n.display .qr svg { display: block; width: 100%; height: auto; }\n.pairing-code { font-size: 56px; font-weight: 700; letter-spacing: 0.18em; margin: 0; font-variant-numeric: tabular-nums; }\n\n/* Frame (ticket 5.11): brand bar, navigation and content. Narrow screens\n   stack them; wide screens put the navigation beside the content. */\n.skip { position: absolute; left: -9999px; }\n.skip:focus { position: static; display: inline-block; padding: 10px 12px; }\n.frame { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-section); align-content: start; }\n.frame-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }\n.brand { display: inline-flex; align-items: center; min-height: var(--touch-target); font-size: var(--fs-key-figure); font-weight: var(--fw-key-figure); color: var(--text); text-decoration: none; }\n.frame-bar .button { min-height: var(--touch-target); }\n.frame-bar form { margin: 0; }\n.frame-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--gap-cards); }\n.frame-nav li { flex: none; }\n.frame-nav a { display: flex; align-items: center; min-height: var(--touch-target); padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); text-decoration: none; }\n[data-theme=\"bw\"] .frame-nav a { border-width: 2px; }\n.back { display: inline-flex; align-items: center; min-height: var(--touch-target); color: var(--accent); font-weight: 600; }\n.hub-row { display: grid; gap: 2px; min-height: var(--touch-target); text-decoration: none; color: var(--text); }\n.hub-row strong { font-size: var(--fs-event-title); }\n[data-theme=\"bw\"] .hub-row { text-decoration: underline; }\n.frame main { min-width: 0; }\n@media (max-width: 599px) {\n  body.web { padding: var(--gap); }\n}\n@medi
