openapi: 3.0.3
info:
  title: Hejmo box API
  version: 0.2.0
  description: |
    The REST API is the single interface for the web UI, displays, phones and
    integrations. Authenticate with a bearer token (`Authorization: Bearer hejmo_…`)
    or a browser session. A token acts on behalf of a person and is limited by
    its scopes: `read`, `write`, `<resource>` or `<resource>:<action>`
    (resources: people, events, tasks, lists, meals, displays, settings, tokens;
    actions: read, write, delete, complete).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in person
      responses:
        "200":
          description: Current person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /people:
    get:
      operationId: listPeople
      summary: Household members in display order
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPerson
      summary: Add a household member (parents only, scope people:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPerson" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}:
    get:
      operationId: getPerson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tokens:
    post:
      operationId: createToken
      summary: Create an API token for the caller (scope tokens:write)
      description: The token value is returned once and stored only as a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, example: Assistant }
                scopes: { type: string, example: read }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, name, scopes, token]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  scopes: { type: string }
                  token: { type: string, example: hejmo_… }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token for good (scope tokens:delete)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: hejmo_session }
  schemas:
    Role:
      type: string
      enum: [parent, child]
    Person:
      type: object
      required: [id, name, role, color, shape, symbol]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        color: { type: string, description: "Hex colour for colour mode", example: "#B4583A" }
        shape: { type: string, description: "Marker for black-and-white mode", example: circle-filled }
        symbol: { type: string }
    NewPerson:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        shape: { type: string }
        symbol: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role or token scope does not allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Request is well-formed but not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
