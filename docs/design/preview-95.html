.wsteps ol[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.wsteps ol[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.people .acc-state { font-weight: 600; color: var(--text); }
.invite-page .actions, main > form.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 var(--gap); }
.wizard .actions { flex-wrap: wrap; align-items: center; }
.wizard .actions form { margin: 0; }
/* People overview: the account state is its own line under name and buttons. */
.cards.people li > .hint { order: 3; flex: 1 1 100%; }
/* #111's status pill .flag must not touch the flag image of the language switcher (#134). */
.lang .flag, [data-theme="bw"] .lang .flag { padding: 0; border: 0; background: none; border-radius: 3px; }
/* A how-it-works tile on a framed page (outside the wizard). */
main > .tile.invite-how { display: grid; gap: 12px; padding: var(--pad-column); max-width: 560px; box-sizing: border-box; margin: 0 0 var(--gap-section); }
main > .tile.invite-how h2 { margin: 0; }
[data-theme="bw"] main > .tile.invite-how { border: 2px solid var(--text); }
.wizard .who { display: inline-flex; align-items: center; gap: 6px; vertical-align: bottom; }
.steps .invitee span:not(.marker) { font-size: inherit; color: var(--text); }

/* ticket 95: passkeys. Existing tokens only. */
/* A box name or IP address in running text: never widens a 375 px page. */
.host { font-weight: 600; overflow-wrap: anywhere; }
/* "oder" between the two ways to sign in: a thin rule on each side. */
.or { display: flex; align-items: center; gap: 12px; margin: 0; max-width: 560px; color: var(--text-secondary); font-size: var(--fs-label); }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
[data-theme="bw"] .or::before, [data-theme="bw"] .or::after { border-top-color: var(--text); }
.signin-pk { display: grid; gap: 8px; max-width: 560px; }
.signin-pk .hint { margin: 0; }
/* Buttons with a leading line icon (the key). */
.button.pk, .button:has(> .icon) { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.button > .icon { stroke: currentColor; flex: none; }
/* The three reasons in the passkey offer: icon, bold lead-in, one sentence. */
.pk-why { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.pk-why li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; }
.pk-why .icon { margin-top: 2px; }
.notice .icon.inl { vertical-align: -4px; stroke: currentColor; }
.notice a, .error a { color: inherit; font-weight: 700; }
/* Passkeys to remove together with a reset: 44 px rows with a 24 px box. */
fieldset.pk-pick { border: 0; margin: 0 0 10px; padding: 0; min-width: 0; display: grid; gap: 4px; }
fieldset.pk-pick legend { padding: 0; margin: 0 0 4px; font-weight: 700; color: var(--text); float: left; width: 100%; }
fieldset.pk-pick .check { min-height: var(--touch-target); align-items: flex-start; gap: 12px; overflow-wrap: anywhere; }
fieldset.pk-pick .check input { flex: none; width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--accent); }
details.danger > p b { color: var(--text); }
details.danger .f { margin: 0 0 10px; }
details.danger details.more { margin: 0 0 10px; }
.list-rows .t .flag { margin-top: 2px; }
.rows-head + .notice { margin: 0 0 var(--gap-cards); }
main > .hint { max-width: 560px; }

const DOCS = [{"Title": "Einrichtung, Schritt 2: Passkey anbieten (am Mac)", "Note": "Gleich nach „Konto anlegen“, also nach dem HTTPS-Schritt und sobald es ein Konto gibt (ADR 0018). Der Schritt bleibt „Dein Konto“; der Wizard behält seine 4 Schritte. Freiwillig: eine Hauptaktion „Passkey anlegen“, daneben „Jetzt nicht“. Drei Sätze sagen, was ein Passkey tut, dass Passwort und Einmalcode der Weg zurück bleiben und für welchen Namen er gilt. Der Name des Passkeys hat einen guten Vorschlag (erkanntes Gerät) und steht unter „Mehr Optionen“. Ist die Box über die IP-Adresse geöffnet oder kann der Browser keine Passkeys, entfällt diese Seite ohne Hinweis und es geht direkt zum Einmalcode.", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/invite/x/konto\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English<\/button><\/form><\/details><\/div><\/header>\n<nav class=\"wsteps\" aria-label=\"Fortschritt der Einrichtung\"><p class=\"wiz-count\">Einrichtung: Schritt 2 von 4<\/p><ol><li data-state=\"done\"><span class=\"lab\"><svg class=\"icon\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>Sichere Verbin­dung<span class=\"sr\"> (erledigt)<\/span><\/span><\/li><li aria-current=\"step\"><span class=\"lab\"><span class=\"n\">2<\/span>Dein Konto<\/span><\/li><li><span class=\"lab\"><span class=\"n\">3<\/span>Einmal­code<\/span><\/li><li><span class=\"lab\"><span class=\"n\">4<\/span>Erste Schritte<\/span><\/li><\/ol><\/nav>\n<main id=\"content\">\n<p class=\"msg ok\" role=\"status\" data-success><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg><span>Konto angelegt. Du bist als Mama angemeldet.<\/span><\/p><h1>Schneller anmelden mit Passkey?<\/h1><p class=\"lead\">Freiwillig. Ein Passkey ist ein digitaler Schlüssel, der auf diesem Mac bleibt. Du kannst ihn auch später unter Einstellungen › Mein Konto anlegen.<\/p><form class=\"tile\" method=\"post\" action=\"/account/passkeys\"><ul class=\"pk-why\"><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg><span><b>So meldest du dich an:<\/b> mit Touch ID oder deinem Mac-Passwort, ohne Hejmo-Passwort und ohne Einmalcode.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3\"/><path d=\"M18 3v4h-4M6 21v-4h4\"/><\/svg><span><b>Dein Weg zurück bleibt:<\/b> Passwort und Einmalcode funktionieren weiter. Den Einmalcode richtest du im nächsten Schritt trotzdem ein.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"/><\/svg><span><b>Gilt nur für<\/b> <span class=\"host\">familie-mueller-luedenscheid.dedyn.io<\/span>. Über eine IP-Adresse oder einen anderen Namen fragt die Box nach Passwort und Einmalcode.<\/span><\/li><\/ul><details class=\"more\"><summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg>Name des Passkeys<span class=\"sum\">Mac<\/span><\/summary><div><div class=\"f\"><label>Name<input name=\"name\" type=\"text\" value=\"Mac\" autocomplete=\"off\"><\/label><p class=\"hint\">So erkennst du ihn später unter Mein Konto wieder.<\/p><\/div><\/div><\/details><div class=\"actions\"><button class=\"button\" type=\"submit\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg>Passkey anlegen<\/button><a class=\"link\" href=\"/setup/totp\">Jetzt nicht, weiter zum Einmalcode<\/a><\/div><\/form>\n<\/main>\n<\/div>"}, {"Title": "Schritt 2: Der Mac fragt nach Touch ID", "Note": "Während das Fenster des Browsers offen ist, sagt die Seite in Worten, worauf sie wartet. Der Knopf ist ausgegraut und sagt, was passiert. Keine Animation (E-Ink).", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/invite/x/konto\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English<\/button><\/form><\/details><\/div><\/header>\n<nav class=\"wsteps\" aria-label=\"Fortschritt der Einrichtung\"><p class=\"wiz-count\">Einrichtung: Schritt 2 von 4<\/p><ol><li data-state=\"done\"><span class=\"lab\"><svg class=\"icon\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>Sichere Verbin­dung<span class=\"sr\"> (erledigt)<\/span><\/span><\/li><li aria-current=\"step\"><span class=\"lab\"><span class=\"n\">2<\/span>Dein Konto<\/span><\/li><li><span class=\"lab\"><span class=\"n\">3<\/span>Einmal­code<\/span><\/li><li><span class=\"lab\"><span class=\"n\">4<\/span>Erste Schritte<\/span><\/li><\/ol><\/nav>\n<main id=\"content\">\n<h1>Schneller anmelden mit Passkey?<\/h1><p class=\"lead\">Freiwillig. Ein Passkey ist ein digitaler Schlüssel, der auf diesem Mac bleibt. Du kannst ihn auch später unter Einstellungen › Mein Konto anlegen.<\/p><form class=\"tile\" method=\"post\" action=\"/account/passkeys\"><ul class=\"pk-why\"><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg><span><b>So meldest du dich an:<\/b> mit Touch ID oder deinem Mac-Passwort, ohne Hejmo-Passwort und ohne Einmalcode.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3\"/><path d=\"M18 3v4h-4M6 21v-4h4\"/><\/svg><span><b>Dein Weg zurück bleibt:<\/b> Passwort und Einmalcode funktionieren weiter. Den Einmalcode richtest du im nächsten Schritt trotzdem ein.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"/><\/svg><span><b>Gilt nur für<\/b> <span class=\"host\">familie-mueller-luedenscheid.dedyn.io<\/span>. Über eine IP-Adresse oder einen anderen Namen fragt die Box nach Passwort und Einmalcode.<\/span><\/li><\/ul><details class=\"more\"><summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg>Name des Passkeys<span class=\"sum\">Mac<\/span><\/summary><div><div class=\"f\"><label>Name<input name=\"name\" type=\"text\" value=\"Mac\" autocomplete=\"off\"><\/label><p class=\"hint\">So erkennst du ihn später unter Mein Konto wieder.<\/p><\/div><\/div><\/details><p class=\"checkline\" data-state=\"waiting\" role=\"status\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3.5 2\"/><\/svg><span><span>Dein Mac fragt jetzt nach Touch ID.<\/span><small>Bestätige im Fenster deines Browsers. Nach 2 Minuten ohne Antwort schließt es sich; dann kannst du es noch einmal versuchen.<\/small><\/span><\/p><div class=\"actions\"><button class=\"button\" type=\"button\" disabled>Passkey wird angelegt<\/button><\/div><\/form>\n<\/main>\n<\/div>"}, {"Title": "Fehler: kein Passkey angelegt", "Note": "Abgebrochen oder abgelaufen: der Fehler steht dort, wo gewartet wurde, und sagt, dass das Konto da ist. „Nochmal versuchen“ ist die Hauptaktion, „Jetzt nicht“ bleibt. Hat dieses Gerät schon einen Passkey für dieses Konto, lautet der Satz „Dieser Mac hat schon einen Passkey für dich.“ und die Hauptaktion wird „Weiter zum Einmalcode“.", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%2  7.5\"/><\/svg>Sichere Verbin­dung<span class=\"sr\"> (erledigt)<\/span><\/span><\/li><li aria-current=\"step\"><span class=\"lab\"><span class=\"n\">2<\/span>Dein Konto<\/span><\/li><li><span class=\"lab\"><span class=\"n\">3<\/span>Einmal­code<\/span><\/li><li><span class=\"lab\"><span class=\"n\">4<\/span>Erste Schritte<\/span><\/li><\/ol><\/nav>\n<main id=\"content\">\n<h1>Schneller anmelden mit Passkey?<\/h1><p class=\"lead\">Freiwillig. Ein Passkey ist ein digitaler Schlüssel, der auf diesem Mac bleibt. Du kannst ihn auch später unter Einstellungen › Mein Konto anlegen.<\/p><form class=\"tile\" method=\"post\" action=\"/account/passkeys\"><ul class=\"pk-why\"><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg><span><b>So meldest du dich an:<\/b> mit Touch ID oder deinem Mac-Passwort, ohne Hejmo-Passwort und ohne Einmalcode.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3\"/><path d=\"M18 3v4h-4M6 21v-4h4\"/><\/svg><span><b>Dein Weg zurück bleibt:<\/b> Passwort und Einmalcode funktionieren weiter. Den Einmalcode richtest du im nächsten Schritt trotzdem ein.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"/><\/svg><span><b>Gilt nur für<\/b> <span class=\"host\">familie-mueller-luedenscheid.dedyn.io<\/span>. Über eine IP-Adresse oder einen anderen Namen fragt die Box nach Passwort und Einmalcode.<\/span><\/li><\/ul><details class=\"more\"><summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg>Name des Passkeys<span class=\"sum\">Mac<\/span><\/summary><div><div class=\"f\"><label>Name<input name=\"name\" type=\"text\" value=\"Mac\" autocomplete=\"off\"><\/label><p class=\"hint\">So erkennst du ihn später unter Mein Konto wieder.<\/p><\/div><\/div><\/details><p class=\"checkline\" data-state=\"fail\" role=\"alert\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5v5.5M12 16.5v.5\"/><\/svg><span><span>Es wurde kein Passkey angelegt.<\/span><small>Das Fenster wurde abgebrochen oder ist nach 2 Minuten abgelaufen. Dein Konto ist da; nichts ist verloren.<\/small><\/span><\/p><div class=\"actions\"><button class=\"button\" type=\"submit\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg>Nochmal versuchen<\/button><a class=\"link\" href=\"/setup/totp\">Jetzt nicht, weiter zum Einmalcode<\/a><\/div><\/form>\n<\/main>\n<\/div>"}, {"Title": "Schritt 3 nach dem Passkey: Erfolgszeile, dann Einmalcode", "Note": "Die Erfolgszeile sagt, was jetzt anders ist. Der erste Satz des Einmalcode-Schritts erklärt, warum er trotz Passkey nötig ist. Sonst unverändert wie in #133.", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\ rkannten Gerät (iPhone: Face ID oder Code).", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/invite/x/konto\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English<\/button><\/form><\/details><\/div><\/header>\n<nav class=\"wsteps\" aria-label=\"Fortschritt der Einladung\"><p class=\"wiz-count\">Einladung annehmen: Schritt 1 von 2<\/p><ol data-count=\"2\"><li aria-current=\"step\"><span class=\"lab\"><span class=\"n\">1<\/span>Dein Konto<\/span><\/li><li><span class=\"lab\"><span class=\"n\">2<\/span>Einmal­code<\/span><\/li><\/ol><\/nav>\n<main id=\"content\">\n<p class=\"msg ok\" role=\"status\" data-success><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg><span>Konto angelegt. Du bist als Papa angemeldet.<\/span><\/p><h1>Schneller anmelden mit Passkey?<\/h1><p class=\"lead\">Freiwillig. Ein Passkey ist ein digitaler Schlüssel, der auf diesem iPhone bleibt. Du kannst ihn auch später unter Einstellungen › Mein Konto anlegen.<\/p><form class=\"tile\" method=\"post\" action=\"/account/passkeys\"><ul class=\"pk-why\"><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg><span><b>So meldest du dich an:<\/b> mit Face ID oder dem Code deines iPhones, ohne Hejmo-Passwort und ohne Einmalcode.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3\"/><path d=\"M18 3v4h-4M6 21v-4h4\"/><\/svg><span><b>Dein Weg zurück bleibt:<\/b> Passwort und Einmalcode funktionieren weiter. Den Einmalcode richtest du im nächsten Schritt trotzdem ein.<\/span><\/li><li><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"/><\/svg><span><b>Gilt nur für<\/b> <span class=\"host\">hejmo.local<\/span>. Über eine IP-Adresse oder einen anderen Namen fragt die Box nach Passwort und Einmalcode.<\/span><\/li><\/ul><details class=\"more\"><summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg>Name des Passkeys<span class=\"sum\">iPhone von Papa<\/span><\/summary><div><div class=\"f\"><label>Name<input name=\"name\" type=\"text\" value=\"iPhone von Papa\" autocomplete=\"off\"><\/label><p class=\"hint\">So erkennst du ihn später unter Mein Konto wieder.<\/p><\/div><\/div><\/details><div class=\"actions\"><button class=\"button\" type=\"submit\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg>Passkey anlegen<\/button><a class=\"link\" href=\"/setup/totp\">Jetzt nicht, weiter zum Einmalcode<\/a><\/div><\/form>\n<\/main>\n<\/div>"}, {"Title": "Anmelden: Passwort zuerst, Passkey als zweiter Weg", "Note": "So sieht die Anmeldung auf einem Gerät aus, das noch nie einen Passkey benutzt hat. Passwort und Einmalcode bleiben die Hauptaktion. Darunter, nach „oder“, steht „Mit Passkey anmelden“ als zweiter Knopf mit einem Satz, was das heißt. Das Feld Benutzername schlägt Passkeys zusätzlich direkt vor (autocomplete „webauthn“), wenn der Browser das kann.", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang- szimmer<\/b><span class=\"meta\">Angelegt 05/11/2026 · zuletzt benutzt 09/11/2026<\/span><\/span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/a><\/li><\/ul><div class=\"actions\"><button class=\"button\" type=\"button\" data-passkey-add><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg>Weiteren Passkey anlegen<\/button><\/div><p class=\"hint\">Der Passkey entsteht auf dem Gerät, auf dem du diese Seite öffnest. Für ein Handy öffne Mein Konto dort, oder wähle im Fenster des Browsers „anderes Gerät“.<\/p><p class=\"hint\">Passkeys gelten nur für <span class=\"host\">familie-mueller-luedenscheid.dedyn.io<\/span>. Bekommt die Box einen anderen Namen, funktionieren sie nicht mehr; Passwort und Einmalcode gehen weiter.<\/p><h2 class=\"rows-head\">Einmalcode<\/h2><dl class=\"facts\"><dt>Einmalcode<\/dt><dd>Eingerichtet am 02/11/2026<\/dd><dt>Wiederherstellungs­codes<\/dt><dd>7 von 10 übrig<\/dd><\/dl><form method=\"post\" action=\"/account/recovery-codes\" class=\"actions\"><button class=\"button secondary\" type=\"submit\">Neue Wiederherstellungscodes erstellen<\/button><\/form><p class=\"hint\">Die jetzigen Codes werden damit ungültig.<\/p><h2 class=\"rows-head\">Andere Eltern<\/h2><ul class=\"list-rows\"><li><a href=\"/account/reset/2b7c\"><span class=\"t\"><b class=\"who\"><span class=\"marker\" data-person=\"2\" data-shape=\"circle-empty\" aria-hidden=\"true\"><\/span>Papa: Einmalcodes zurücksetzen<\/b><span class=\"meta\">Wenn Papa das Handy mit der Authenticator-App verloren hat und keinen Wiederherstellungscode mehr hat.<\/span><\/span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/a><\/li><\/ul>\n<\/main>\n<\/div>"}, {"Title": "Passkey-Detailseite: umbenennen,  "Die Erfolgszeile nennt, was passiert ist, auch den entfernten Passkey mit Namen. Darunter wie bisher der Hinweis auf Handys und Kalender-Apps, mit Links. Papas Zeile sagt den neuen Zustand in Worten.", "Body": "<a class=\"skip\" href=\"#content\">Zum Inhalt springen<\/a>\n<div class=\"frame framed has-nav\">\n<header class=\"frame-bar\">\n  <a class=\"brand\" href=\"/\">Hejmo<\/a>\n  <div class=\"frame-tools\">\n    <details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/people\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23 span class=\"t\"><b>iPhone von Mama<\/b><span class=\"meta\">Angelegt 02/11/2026 · zuletzt benutzt heute, 08:14<\/span><span class=\"flag open\">Damit bist du gerade angemeldet<\/span><\/span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/a><\/li><li><a href=\"/account/passkeys/1\"><span class=\"t\"><b>Passwort-Manager auf dem Familien-Laptop im Arbeitszimmer<\/b><span class=\"meta\">Angelegt 05/11/2026 · zuletzt benutzt 09/11/2026<\/span><\/span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/a><\/li><\/ul><div class=\"actions\"><button class=\"button\" type=\"button\" data-passkey-add><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"15\" r=\"4.5\"/><path d=\"M11.2 11.8L20 3M16.5 6.5l2.5 2.5M14 9l2 2\"/><\/svg>Weiteren Passkey anlegen<\/button><\/div><p class=\"hint\">Der Passkey entsteht auf dem Gerät, auf dem du diese Seite öffnest. Für ein Handy öffne Mein Konto dort, oder wähle im Fenster des Browsers „anderes Gerät“.<\/p><p class=\"hint\">Passkeys gelten nur für <span class=\"host\">familie-mueller-luedenscheid.dedyn.io<\/span>. Bekommt die Box einen anderen Namen, funktionieren sie nicht mehr; Passwort und Einmalcode gehen weiter.<\/p><h2 class=\"rows-head\">Einmalcode<\/h2><dl class=\"facts\"><dt>Einmalcode<\/dt><dd>Eingerichtet am 02/11/2026<\/dd><dt>Wiederherstellungs­codes<\/dt><dd>7 von 10 übrig<\/dd><\/dl><form method=\"post\" action=\"/account/recovery-codes\" class=\"actions\"><button class=\"button secondary\" type=\"submit\">Neue Wiederherstellungscodes erstellen<\/button><\/form><p class=\"hint\">Die jetzigen Codes werden damit ungültig.<\/p><h2 class=\"rows-head\">Andere Eltern<\/h2><ul class=\"list-rows\"><li><a href=\"/account/reset/2b7c\"><span class=\"t\"><b class=\"who\"><span class=\"marker\" data-person=\"2\" data-shape=\"circle-empty\" aria-hidden=\"true\"><\/span>Papa: Einmalcodes zurücksetzen<\/b><span class=\"meta\">Einmalcodes zurückgesetzt am 15/11/2026, 20:40. Papa richtet bei der nächsten Anmeldung neue ein.<\/span><\/span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/a><\/li><\/ul>\n<\/main>\n<\/div>"}];
