# Start the box: docker compose up -d
# Then open http://<box-ip> in a browser; the setup wizard sets up HTTPS first.
# Ports: HTTP (redirects to HTTPS) and HTTPS. Change them in a .env file next
# to this one, for example HEJMO_HTTP_PORT=8080 and HEJMO_HTTPS_PORT=8443.
services:
  hejmo:
    build: .
    image: ghcr.io/hejmo-home/hejmo:latest
    container_name: hejmo
    restart: unless-stopped
    ports:
      - "${HEJMO_HTTP_PORT:-80}:8080"
      - "${HEJMO_HTTPS_PORT:-443}:8443"
    volumes:
      - hejmo-data:/data
    environment:
      TZ: Europe/Berlin
      HEJMO_PUBLIC_HTTPS_PORT: ${HEJMO_HTTPS_PORT:-443}

volumes:
  hejmo-data:
