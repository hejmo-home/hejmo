><div class=\"s\"><b>Papa \u00f6ffnet sie auf dem eigenen Handy<\/b><p>Am einfachsten scannt Papa den QR-Code hier vom Bildschirm. Ist Papa nicht da, schickst du den Link.<\/p><\/div><\/li><li><div class=\"s\"><b>Papa legt das Konto an<\/b><p>Benutzername und Passwort w\u00e4hlt Papa selbst, danach den Einmalcode. Du siehst Papas Passwort nie.<\/p><\/div><\/li><\/ol><\/section><form method=\"post\" action=\"/people/2b7c/invitation\" class=\"actions\"><button class=\"button\" type=\"submit\">Einladung erstellen<\/button><\/form>\n<\/main>\n<\/div>\n"}, {"Title": "Einladung erstellt: QR-Code und Link, nur jetzt sichtbar", "Note": "Der Link wird nur gehasht gespeichert (Ticket), deshalb zeigt die Box ihn wie ein neues Ger\u00e4tetoken (#111) genau einmal im Rahmen \u201eonce\u201c. Der QR-Code steht vorn, weil Papa meist daneben steht; der Link bricht an jeder Stelle um und passt so auf 375 px. \u201eFertig\u201c f\u00fchrt zur\u00fcck zur Seite mit dem Zustand.", "Body": "<a class=\"skip\" href=\"#content\">Zum Inhalt springen<\/a>\n<div class=\"frame framed has-nav\">\n<header class=\"frame-bar\">\n  <a class=\"brand\" href=\"/\">Hejmo<\/a>\n  <div class=\"frame-tools\">\n    <details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/people\ roke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English<\/button><\/form><\/details>\n    <form class=\"signout\" method=\"post\" action=\"/logout\"><button class=\"button secondary\" type=\"submit\">Abmelden<\/button><\/form>\n  <\/div>\n<\/header>\n<nav class=\"frame-nav\" aria-label=\"Hauptnavigation\"><ul>\n  <li><a href=\"/\" aria-current=\"page\">Start<\/a><\/li>\n  <li><a href=\"/calendar\">Kalender<\/a><\/li>\n  <li><a href=\"/tasks\">Aufgaben<\/a><\/li>\n  <li><a href=\"/meals\">Essen<\/a><\/li>\n  <li><a href=\"/settings\">Einstellungen<\/a><\/li>\n  <\/ul><\/nav>\n\n\n<main id=\"content\">\n\n\n  <h1>Hallo Mama<\/h1>\n  \n  \n  \n  <section class=\"firststeps\" data-firststeps>\n    <h2>Erste Schritte<\/h2>\n    <p>So f\u00fcllst du Hejmo mit eurem Familienleben. Die Reihenfolge hilft, jeder Schritt l\u00e4sst sich \u00fcberspringen.<\/p>\n    <div class=\"fs-progress\"><span class=\"fs-bar\" aria-hidden=\"true\"><span data-state=\"done\"><\/span><span data-state=\"open\"><\/span><span data-state=\"open\"><\/span><span data-state=\"skipped\"><\/span><span data-state=\"open\"><\/span><span data-state=\"done\"><\/span><\/span><span class=\"fs-count\">2 von 6 erledigt, 1 \u00fcbersprungen<\/span><\/div>\n    <ol class=\"howto\">\n      <li data-done><div class=\"s\"><p class=\"fs-head\"><b>Familie eintragen<\/b><span class=\"fs-state\" data-state=\"done\">Erledigt<\/span><\/p>\n        <p>8 Personen:<\/p>\n        <ul class=\"who-chips\"><li><span class=\"marker\" data-person=\"1\" data-shape=\"circle-filled\" aria-hidden=\"true\"><\/span>Mama<\/li><li><span class=\"marker\" data-person=\"2\" data-shape=\"circle-empty\" aria-hidden=\"true\"><\/span>Papa<\/li><li><span class=\"marker\" data-person=\"3\" data-shape=\"square-filled\" aria-hidden=\"true\"><\/span>Sebastian<\/li><li><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"><\/span>Mia<\/li><li><span class=\"marker\" data-person=\"5\" data-shape=\"triangle-filled\" aria-hidden=\"true\"><\/span>Konstantin<\/li><li><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"><\/span>Charlotte-Sophie<\/li><li><span class=\"marker\" data-person=\"7\" data-shape=\"cross-filled\" aria-hidden=\"true\"><\/span>Maximilian<\/li><li><span class=\"marker\" data-person=\"8\" data-shape=\"star-filled\" aria-hidden=\"true\"><\/span>Friederike<\/li><\/ul>\n        \n        <div class=\"fs-acts\"><a class=\"link\" href=\"/people\">Familie \u00e4ndern<\/a><\/div><\/div><\/li>\n      <li><div class=\"s\"><p class=\"fs-head\"><b>Zweites Elternteil einladen<\/b><span class=\"fs-state\" data-state=\"open\">Noch offen<\/span><\/p>\n        <ul class=\"fs-sub\"><li data-state=\"open\"><span class=\"dot\" aria-hidden=\"true\"><\/span><span>Papa ist eingeladen, hat aber noch kein Konto. Der Link gilt bis Sonntag, 22/11/2026, 20:15.<span class=\"vh\"> (noch offen)<\/span><\/span><\/li><li data-state=\"open\"><span class=\"dot\" aria-hidden=\"true\"><\/span><span>Noch kein Handy verbunden.<span class=\"vh\"> (noch offen)<\/span><\/span><\/li><\/ul>\n        <div class=\"fs-acts\"><a class=\"button\" href=\"/people/2b7c/invitation\">Einladung ansehen<\/a><form method=\"post\" action=\"/first-steps/skip\"><input type=\"hidden\" name=\"step\" value=\"parents\"><button class=\"link quiet\" type=\"submit\">\u00dcberspringen<\/button><\/form><\/div><\/div><\/li>\n      <li><div class=\"s\"><p class=\"fs-head\"><b>Kalender verbinden<\/b><span class=\"fs-state\" data-state=\"open\">Noch offen<\/span><\/p>\n        <p>Verbinde iCloud, Google oder einen anderen Kalender. F\u00fcr jeden Kalender w\u00e4hlst du, f\u00fcr wen er ist: f\u00fcr die ganze Familie oder f\u00fcr einzelne Personen. Ohne eigenen Kalender kannst du den Kalender der Box nutzen.<\/p>\n        \n        \n        <div class=\"fs-acts\"><a class=\"link\" href=\"/calendars\">Kalender verbinden<\/a><form method=\"post\" action=\"/first-steps/skip\"><input type=\"hidden\" name=\"step\" value=\"calendars\"><button class=\"link quiet\" type=\"submit\">\u00dcberspringen<\/button><\/form><\/div><\/div><\/li>\n      <li data-skipped><div class=\"s\"><p class=\"fs-head\"><b>Aufgaben oder Routine<\/b><span class=\"fs-state\" data-state=\"skipped\">\u00dcbersprungen<\/span><\/p>\n        <p>\u00dcbersprungen. Du kannst es jederzeit nachholen.<\/p>\n        \n        \n        <div class=\"fs-acts\"><form method=\"post\" action=\"/first-steps/undo\"><input type=\"hidden\" name=\"step\" value=\"tasks\"><button class=\"link quiet\" type=\"submit\">Doch machen<\/button><\/form><\/div><\/div><\/li>\n      <li><div class=\"s\"><p class=\"fs-head\"><b>Einkaufsliste und Essensplan<\/b><span class=\"fs-state\" data-state=\"open\">Noch offen<\/span><\/p>\n        <p>Plane das Essen der Woche, dann steht es auf dem Display. Die Einkaufsliste kommt in einer sp\u00e4teren Version.<\/p>\n        \n        \n        <div class=\"fs-acts\"><a class=\"link\" href=\"/meals\">Essensplan \u00f6ffnen<\/a><form method=\"post\" action=\"/first-steps/skip\"><input type=\"hidden\" name=\"step\" value=\"meals\"><button class=\"link quiet\" type=\"submit\">\u00dcberspringen<\/button><\/form><\/div><\/div><\/li>\n      <li data-done><div class=\"s\"><p class=\"fs-head\"><b>Erstes Display aufh\u00e4ngen<\/b><span class=\"fs-state\" data-state=\"done\">Erledigt<\/span><\/p>\n        <ul class=\"fs-sub\"><li data-state=\"done\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg><span>Display \u201eK\u00fcche\u201c ist verbunden.<span class=\"vh\"> (erledigt)<\/span><\/span><\/li><\/ul>\n        \n        \n        <div class=\"fs-acts\"><a class=\"link\" href=\"/displays\">Displays verwalten<\/a><\/div><\/div><\/li>\n      \n    <\/ol>\n    <div class=\"fs-foot\"><form method=\"post\" action=\"/first-steps/hide\"><button class=\"link quiet\" type=\"submit\">Erste Schritte ausblenden<\/button><\/form><p class=\"hint\">Du findest sie danach unter Einstellungen.<\/p><\/div>\n  <\/section>\n  \n  \n  <form class=\"steps note-day\" method=\"post\" action=\"/notes\">\n    <fieldset>\n      <legend>Notiz auf dem Display<\/legend>\n      <p class=\"hint\">Steht in der Kachel \u201eMorgen\u201c \u2013 ab 18:00 am Vorabend bis zum Ende des Tages. Schreib kurz und mit Namen, die Kinder lesen mit.<\/p>\n      <fieldset class=\"seg\">\n        <legend>F\u00fcr welchen Tag?<\/legend>\n        <label><input type=\"radio\" name=\"day\" value=\"today\">Heute<small>Sa 14/11<\/small><\/label>\n        <label><input type=\"radio\" name=\"day\" value=\"tomorrow\" checked>Morgen<small>So 15/11<\/small><\/label>\n        <label><input type=\"radio\" name=\"day\" value=\"other\">Anderer Tag<\/label>\n      <\/fieldset>\n      \n      <div class=\"other-day\"><div class=\"f\">\n  <label>Tag\n    <input name=\"other\" type=\"date\" value=\"\"><\/label>\n  \n  \n<\/div><\/div>\n      <div class=\"f\">\n        <label>Notiz<textarea name=\"text\" rows=\"2\" maxlength=\"120\" placeholder=\"z. B. Mia: Schwimmsachen einpacken\" data-counter><\/textarea><\/label>\n        <span class=\"counter\" data-format=\"%d von 120 Zeichen\">0 von 120 Zeichen<\/span>\n        \n      <\/div>\n    <\/fieldset>\n    <button class=\"button\" type=\"submit\">Notiz speichern<\/button>\n  <\/form>\n  <h2>Geplante Notizen<\/h2>\n  <p class=\"hint\">Noch keine Notiz geplant.<\/p>\n  \n  \n\n<\/main>\n<\/div>\n"}, {"Title": "Einladung \u00f6ffnen: Willkommen, Papa", "Note": "Die erste Seite, die Papa sieht. Sie sagt, wer einl\u00e4dt, als wer Papa eingetragen ist (Zeichen und Name wie auf dem Display), was kommt, wie lange es dauert, und bis wann der Link gilt. Eine Hauptaktion. Sprachumschalter oben rechts (#134); die gew\u00e4hlte Sprache wird Papas Kontosprache.", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/invite/x\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English<\/button><\/form><\/details><\/div><\/header>\n\n<main id=\"content\">\n<h1>Mama l\u00e4dt dich zu Hejmo ein<\/h1><p class=\"lead\">Hejmo zeigt eure Termine, Aufgaben und das Essen der Woche, auf dem Handy und auf dem Display in der K\u00fcche.<\/p><section class=\"tile\"><h2>Du bist eingetragen als<\/h2><p class=\"invitee\"><span class=\"marker\" data-person=\"2\" data-shape=\"circle-empty\" aria-hidden=\"true\"><\/span><span>Papa<\/span><\/p><p class=\"hint\">So steht dein Name auf dem Display. \u00c4ndern kannst du ihn sp\u00e4ter unter Personen.<\/p><\/section><section class=\"tile\"><h2>So geht es<\/h2><ol class=\"howto\"><li><div class=\"s\"><b>Dein Konto<\/b><p>Du w\u00e4hlst einen Benutzernamen und ein Passwort.<\/p><\/div><\/li><li><div class=\"s\"><b>Einmal\u00adcode<\/b><p>Eine App auf deinem Handy zeigt dir beim Anmelden einen Code. So sch\u00fctzt du dein Konto.<\/p><\/div><\/li><\/ol><p class=\"hint\">Das dauert etwa 5 Minuten. Du brauchst dein Handy mit einer Authenticator-App, zum Beispiel <a class=\"ext\" href=\"https://2fas.com/\" target=\"_blank\" rel=\"noopener noreferrer\">2FAS<svg class=\"icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 5h5v5M19 5l-8 8M17 14v5H5V7h5\"/><\/svg><\/a> oder <a class=\"ext\" href=\"https://support.google.com/accounts/answer/1066447\" target=\"_blank\" rel=\"noopener noreferrer\">Google Authenticator<svg class=\"icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 5h5v5M19 5l-8 8M17 14v5H5V7h5\"/><\/svg><\/a>.<\/p><\/section><p class=\"valid\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3.5 2\"/><\/svg><span>Die Einladung gilt einmal, bis <b>Sonntag, 22/11/2026, 20:15<\/b>.<\/span><\/p><div class=\"actions\"><a class=\"button\" href=\"/invite/x/konto\">Konto anlegen<\/a><\/div>\n<\/main>\n<\/div>\n"}, {"Title": "Einladung, Box mit eigenem Zertifikat: Schritt 1 der Box vertrauen", "Note": "Die Vertrauensseite aus #133 mit dem Fortschritt der Einladung (3 Schritte statt 2) und einem Satz, wer einl\u00e4dt und warum zuerst das Zertifikat kommt. Zustand \u201enoch nicht vertraut\u201c; sobald die Pr\u00fcfung klappt, erscheint \u201eWeiter zur Einladung\u201c und f\u00fchrt zur Willkommensseite.", "Body": "\n\n<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/ca\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English<\/button><\/form><\/details><\/div><\/header>\n<nav class=\"wsteps\" aria-label=\"Fortschritt der Einladung\"><p class=\"wiz-count\">Einladung annehmen: Schritt 1 von 3<\/p><ol data-count=\"3\">\n<li aria-current=\"step\"><span class=\"lab\"><span class=\"n\">1<\/span>Der Box vertrauen<\/span><\/li>\n<li><span class=\"lab\"><span class=\"n\">2<\/span>Dein Konto<\/span><\/li>\n<li><span class=\"lab\"><span class=\"n\">3<\/span>Einmal\u00adcode<\/span><\/li>\n<\/ol><\/nav>\n\n<main id=\"content\">\n\n\n  <h1>Mama l\u00e4dt dich zu Hejmo ein<\/h1>\n  <p class=\"lead\">Zuerst vertraut dein Ger\u00e4t der Box, damit dein Passwort verschl\u00fcsselt \u00fcbertragen wird. Das dauert etwa 2 Minuten. Danach legst du dein Konto an.<\/p>\n  <nav class=\"devnav\" aria-label=\"Ger\u00e4t w\u00e4hlen\">\n    <ul class=\"devices\">\n      <li><a href=\"?device=ios\" aria-current=\"true\">iPhone oder iPad<\/a><\/li>\n      <li><a href=\"?device=android\">Android<\/a><\/li>\n      <li><a href=\"?device=mac\">Mac<\/a><\/li>\n      <li><a href=\"?device=windows\">Windows<\/a><\/li>\n      <li><a href=\"?device=linux\">Linux<\/a><\/li>\n      \n    <\/ul>\n    <p class=\"detected\">Erkannt: iPhone oder iPad. Stimmt nicht? W\u00e4hle dein Ger\u00e4t.<\/p>\n  <\/nav>\n  <section class=\"tile\" data-check=\"trust\" data-check-url=\"https://127.0.0.1/healthz\" data-retry-seconds=\"5\" data-device=\"ios\" data-detected>\n    <h2>iPhone oder iPad: 4 Schritte<\/h2>\n    <ol class=\"howto\">\n      <li><div class=\"s\">\n        <b>Profil laden<\/b>\n        <p data-after=\"Geladen. Als N\u00e4chstes installierst du das Profil.\">Tippe auf den Knopf. Fragt dein Ger\u00e4t, ob es das Profil laden darf, tippe auf \u201eZulassen\u201c.<\/p>\n        \n        <a class=\"button\" href=\"/ca/hejmo.mobileconfig\" data-download data-again-text=\"Noch einmal laden\">Profil laden<\/a>\n        \n        \n      <\/div><\/li>\n      <li><div class=\"s\">\n        <b>Profil installieren<\/b>\n        <p>\u00d6ffne die <span class=\"path\">Einstellungen<\/span>. Oben steht <span class=\"path\">Profil geladen<\/span>. Tippe darauf, dann auf \u201eInstallieren\u201c, und gib den Code deines Ger\u00e4ts ein.<\/p>\n        \n        \n        \n        \n      <\/div><\/li>\n      <li><div class=\"s\" data-fail-step>\n        <b>Vertrauen einschalten<\/b>\n        <p>\u00d6ffne <span class=\"path\">Einstellungen \u203a Allgemein \u203a Info \u203a Zertifikats\u00advertrauens\u00adeinstellungen<\/span> und schalte <span class=\"path\">Hejmo box CA<\/span> ein.<\/p>\n        \n        \n        <p class=\"checkline\" data-state=\"fail\" role=\"status\" data-hook=\"fail\" hidden><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5v5.5M12 16.5v.5\"/><\/svg><span><span>Dein Ger\u00e4t vertraut der Box noch nicht.<\/span><small data-small>Ist <span class=\"path\">Hejmo box CA<\/span> bei den Zertifikatsvertrauenseinstellungen eingeschaltet? Das ist ein eigener Schalter, den es erst nach dem Installieren gibt.<\/small><\/span><\/p>\n        \n      <\/div><\/li>\n      <li><div class=\"s\">\n        <b>Hierher zur\u00fcckkommen<\/b>\n        <p>Diese Seite merkt von selbst, wenn dein Ger\u00e4t der Box vertraut.<\/p>\n        \n        \n        \n        <p class=\"checkline\" data-state=\"waiting\" role=\"status\" data-hook=\"waiting\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3.5 2\"/><\/svg><span><span>Dein Ger\u00e4t vertraut der Box noch nicht.<\/span><small data-small>Diese Seite pr\u00fcft alle 5 Sekunden. Zuletzt: \u2013<\/small><\/span><\/p>\n        <p class=\"checkline\" data-state=\"ok\" role=\"status\" data-hook=\"ok\" hidden><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg><span><span>Dein Ger\u00e4t vertraut der Box.<\/span><\/span><\/p>\n        <div class=\"actions\"><a class=\"button\" href=\"https://hejmo.local/invite/K7QX-M2PD-9WRT-4HNA-ZC6E\" data-continue-link hidden>Weiter zur Einladung<\/a><\/div>\n      <\/div><\/li>\n      \n    <\/ol>\n    \n  <\/section>\n  <details class=\"more\" data-fp>\n    <summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg>Fingerabdruck vergleichen (freiwillig)<\/summary>\n    <div>\n      <p>Der Fingerabdruck ist wie eine Seriennummer: Jedes Zertifikat hat einen eigenen. Zeigt dein Ger\u00e4t beim Installieren einen <b>SHA-256<\/b>-Fingerabdruck an, muss er genau so aussehen. Vergleiche mindestens die erste und die letzte Zeile.<\/p>\n      <div class=\"fp\" aria-label=\"SHA-256-Fingerabdruck: CE:C8:EB:63:61:53:ED:B5:8C:49:59:C9:69:B5:B8:DB:BA:FF:39:B4:22:BE:59:32:DE:87:A9:A9:4B:3A:3E:CF\"><span>CE<\/span><span>C8<\/span><span>EB<\/span><span>63<\/span><span>61<\/span><span>53<\/span><span>ED<\/span><span>B5<\/span><span>8C<\/span><span>49<\/span><span>59<\/span><span>C9<\/span><span>69<\/span><span>B5<\/span><span>B8<\/span><span>DB<\/span><span>BA<\/span><span>FF<\/span><span>39<\/span><span>B4<\/span><span>22<\/span><span>BE<\/span><span>59<\/span><span>32<\/span><span>DE<\/span><span>87<\/span><span>A9<\/span><span>A9<\/span><span>4B<\/span><span>3A<\/span><span>3E<\/span><span>CF<\/span><\/div>\n      <p class=\"hint\">Wo du ihn findest: beim Installieren unter \u201eMehr Details\u201c.<\/p>\n      <p class=\"hint\">Stimmt er nicht \u00fcberein, installiere das Zertifikat nicht. Das Protokoll der Box nennt denselben Fingerabdruck; der Vergleich dort ist die sicherere Pr\u00fcfung.<\/p>\n    <\/div>\n  <\/details>\n  <details class=\"more no-print\">\n    <summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\/svg>Die Pr\u00fcfung klappt nicht?<\/summary>\n    <div>\n      <p>Manche Browser lassen die Pr\u00fcfung nicht zu. Hast du alle Schritte gemacht, kannst du trotzdem weitergehen. Zeigt der Browser dann eine Warnung, fehlt das Zertifikat noch.<\/p>\n      <a class=\"link\" href=\"https://hejmo.local/invite/K7QX-M2PD-9WRT-4HNA-ZC6E\">Ohne Pr\u00fcfung weiter<\/a>\n    <\/div>\n  <\/details>\n  \n  \n\n<\/main>\n<\/div>\n"}, {"Title": "Schritt 1: Dein Konto", "Note": "Wie \u201eDein Konto\u201c im Assistenten (#133), aber nur, was zu Papa geh\u00f6rt: kein Ort, keine Eltern-PIN (geh\u00f6ren dem Haushalt). Name und Zeichen stehen fest und sind nicht editierbar, damit Papa sieht, f\u00fcr wen das Konto ist. Der Benutzername ist aus dem Namen vorgeschlagen.", "Body": "<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <form class=\"lang-menu\" method=\"po d autocomplete=\"username\" autocapitalize=\"none\" aria-invalid=\"true\" aria-describedby=\"err-username\" autofocus><\/label><p class=\"ferr\" id=\"err-username\" role=\"alert\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 8v5M12 16.5v.5\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\/svg>Diesen Benutzernamen hat schon jemand in eurer Box. W\u00e4hle einen anderen, zum Beispiel papa.<\/p><\/div><div class=\"f\"><label>Passwort<span class=\"pw\"><input name=\"password\" type=\"password\" required minlength=\"10\" autocomplete=\"new-password\"><button class=\"button secondary\" type=\"button\" data-pw-toggle aria-pressed=\"false\">Anzeigen<\/button><\/span><\/label><p class=\"hint\">Mindestens 10 Zeichen. Aus Sicherheitsgr\u00fcnden bitte noch einmal eingeben.<\/p><\/div><\/fieldset><div class=\"actions\"><button class=\"button\" type=\"submit\">Konto anlegen<\/button><\/div><\/form>\n<\/main>\n<\/div>\n"}, {"Title": "Schritt 2: Einmalcode", "Note": "Unver\u00e4ndert aus dem Assistenten (#133), nur der Fortschritt ist der der Einladung. Auf dem Handy kommt wie dort zuerst der Knopf, der die App \u00f6ffnet.", "Body": "\n\n<div class=\"wizard\">\n<header class=\"frame-bar\"><span class=\"brand\">Hejmo<\/span><div class=\"frame-tools\"><details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: <\/span>Deutsch<\/span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/summary>\n      <f
