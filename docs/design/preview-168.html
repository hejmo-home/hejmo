page: the line on the day of adding and the reason under an entry. */\n.auto-note { display: flex; gap: 10px; align-items: flex-start; max-width: 560px; box-sizing: border-box; margin: 0 0 var(--gap); padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }\n.auto-note p { margin: 0; overflow-wrap: break-word; }\n.auto-note .icon { flex: none; stroke: var(--accent); margin-top: 2px; }\n[data-theme=\"bw\"] .auto-note { border: 2px solid var(--text); }\n[data-theme=\"bw\"] .auto-note .icon { stroke: var(--text); }\n.auto-src { display: flex; gap: 6px; align-items: flex-start; margin: -6px 0 8px; padding-left: 54px; font-size: var(--fs-label); color: var(--text-secondary); overflow-wrap: break-word; }\n.entries li > .auto-src { flex: 1 1 100%; }\n.auto-src .icon { flex: none; stroke: currentColor; margin-top: 1px; }\n[data-theme=\"bw\"] .auto-src { color: var(--text); }\n.entries li[data-done=\"true\"] > .auto-src { display: none; }\ndetails.auto-rules { max-width: 560px; }\ndetails.auto-rules > summary { overflow-wrap: break-word; }\ndetails.auto-rules > div { display: grid; gap: 8px; }\ndetails.auto-rules .list-rows { margin: 0; }\ndetails.auto-rules .hint { margin: 0; }\ndetails.auto-rules[open] .list-rows .chev { transform: none; }\n\n/* Display: the same words at display size. */\n.lv-entries .auto-note { max-width: none; margin: 0; font-size: var(--fs-event-title); }\n.lv-entries .auto-src { margin: -2px 0 0; padding-left: 64px; font-size: var(--fs-event-title); }\n";
const DOCS = [{"Kind": "web", "Title": "Einstellungen → Listen: neue Zeile „Immer auf der Liste“", "Note": "Unter der Artikel-Bibliothek eine ruhige Zeile, die in Worten sagt, welche Artikel von selbst kommen, wann das nächste Mal ist und was gerade nicht läuft. Namen statt Zahlen.", "Body": "<a class=\"skip\" href=\"#content\">Zum Inhalt springen</a>\n<div class=\"frame framed has-nav\">\n<header class=\"frame-bar\">\n  <a class=\"brand\" href=\"/\">Hejmo</a>\n  <div class=\"frame-tools\">\n    <details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: </span>Deutsch</span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/people\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English</button></form></details>\n    <form class=\"signout\" method=\"post\" action=\"/logout\"><button class=\"button secondary\" type=\"submit\">Abmelden</button></form>\n  </div>\n</header>\n<nav class=\"frame-nav\" aria-label=\"Hauptnavigation\"><ul><li><a href=\"/\">Start</a></li><li><a href=\"/calendar\">Kalender</a></li><li><a href=\"/tasks\">Aufgaben</a></li><li><a href=\"/lists\">Listen</a></li><li><a href=\"/meals\">Essen</a></li><li><a href=\"/settings\" aria-current=\"page\">Einstellungen</a></li></ul></nav>\n<main id=\"content\">\n\n<a class=\"back\" href=\"/settings\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"/></svg>Zurück zu den Einstellungen</a><h1>Listen</h1><p class=\"lead\">Was für alle Listen gilt: welche Artikel Hejmo vorschlägt, was von selbst auf eine Liste kommt und wie Hejmo bei Allergien warnt.</p><ul class=\"list-rows\"><li><a href=\"/settings/lists/library\"><span class=\"art-sym\" aria-hidden=\"true\">🧺</span><span class=\"t\"><b>Artikel-Bibliothek</b><span class=\"meta\">248 Artikel von Hejmo, davon 2 von Hand ausgeblendet</span><span class=\"meta\">4 eigene Artikel</span></span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg></a></li><li><a href=\"/settings/lists/always\"><span class=\"art-sym\" aria-hidden=\"true\"><svg class=\"icon rep\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M17 3l3 3-3 3\"/><path d=\"M4 11V9a3 3 0 0 1 3-3h13\"/><path d=\"M7 21l-3-3 3-3\"/><path d=\"M20 13v2a3 3 0 0 1-3 3H4\"/></svg></span><span class=\"t\"><b>Immer auf der Liste</b><span class=\"meta\">Milch, Vollkornbrot, Eier, Hafer-Drink Barista und Spülmaschinentabs kommen von selbst</span><span class=\"meta\">Nächstes Mal: Mittwoch, 18.11., Hafer-Drink Barista auf „Einkauf“</span><span class=\"meta auto-stopped\">Angehalten: Bananen (Liste gelöscht). Aus: Windeln Größe 5 für Maximilian</span></span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg></a></li></ul><section aria-labelledby=\"al\"><h2 id=\"al\">Allergien</h2><div class=\"lib-card\"><h3>So warnt Hejmo</h3><p>Steht ein Artikel mit einem der 14 Hauptallergene in den Vorschlägen oder auf einer Liste, steht darunter in Worten, wen es betrifft. Das ist immer an.</p><p><span class=\"allergen-warn\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 4l9 16H3z\"/><path d=\"M12 10v4M12 17v.5\"/></svg><span>Enthält Erdnüsse: <span class=\"who\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia</span> ist allergisch</span></span></p><p class=\"hint caveat\"><b>Experimentell, ohne Gewähr:</b> Eine Warnung kann fehlen oder falsch sein. Lies im Zweifel die Zutaten auf der Packung.</p></div>\n<div class=\"lib-card\"><h3>Eingetragene Allergien</h3><ul class=\"allergy-people\">\n<li><span class=\"who\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia:</span><span>Erdnüsse, Schalenfrüchte (Nüsse)</span><span class=\"unchecked\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6M12 16.8v.4\"/></svg><span>Nicht automatisch geprüft, nicht filterbar: Kiwi</span></span></li>\n<li><span class=\"who\"><span class=\"marker\" data-person=\"5\" data-shape=\"triangle-filled\" aria-hidden=\"true\"></span>Konstantin:</span><span>Milch und Laktose</span></li>\n<li><span class=\"who\"><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"></span>Charlotte-Sophie:</span><span>Glutenhaltiges Getreide, Sellerie, Senf, Sesam, Soja</span><span class=\"unchecked\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6M12 16.8v.4\"/></svg><span>Nicht automatisch geprüft, nicht filterbar: Erdbeeren, Tomaten, Pfirsiche (roh), Nachtschattengewächse</span></span></li>\n<li><span class=\"who\"><span class=\"marker\" data-person=\"8\" data-shape=\"star-filled\" aria-hidden=\"true\"></span>Friederike:</span><span>Fisch, Krebstiere, Weichtiere</span></li>\n</ul><p class=\"hint\">Ändern kannst du sie auf der Seite der Person unter „Essen und Allergien“. Mama, Papa, Sebastian und Maximilian haben keine eingetragen.</p></div><form method=\"post\" action=\"/settings/lists\" class=\"steps lib-form\"><fieldset><legend>Artikel ausblenden <span class=\"tag exp\">Experimentell</span></legend>\n<p class=\"hint\">Blendet Artikel mit einem Allergen dieser Personen aus den Vorschlägen und aus der Auswahl der Kachelansicht aus. Was schon auf einer Liste steht, bleibt mit Warnung stehen.</p>\n<div class=\"card-row\"><span class=\"t\"><b>Artikel mit Allergenen ausblenden</b><span class=\"state\"><span class=\"on-text\">An. Hejmo schlägt Artikel mit einem Allergen dieser Personen nicht mehr vor.</span><span class=\"off-text\">Aus. Hejmo warnt nur und blendet nichts aus.</span></span></span><label class=\"switch\"><input type=\"checkbox\" role=\"switch\" name=\"hide\" aria-label=\"Artikel mit Allergenen ausblenden\"></label></div>\n<div class=\"when-on\"><fieldset class=\"chips\"><legend>Für wen?</legend>\n<label class=\"pchip all\"><input type=\"checkbox\" name=\"whole_family\" value=\"1\" checked><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 11l8-6.5 8 6.5\"/><path d=\"M6 10v9h12v-9\"/></svg>Ganze Familie<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"4\"><input type=\"checkbox\" name=\"people\" value=\"Mia\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"5\"><input type=\"checkbox\" name=\"people\" value=\"Konstantin\"><span class=\"marker\" data-person=\"5\" data-shape=\"triangle-filled\" aria-hidden=\"true\"></span>Konstantin<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"6\"><input type=\"checkbox\" name=\"people\" value=\"Charlotte-Sophie\"><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"></span>Charlotte-Sophie<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"8\"><input type=\"checkbox\" name=\"people\" value=\"Friederike\"><span class=\"marker\" data-person=\"8\" data-shape=\"star-filled\" aria-hidden=\"true\"></span>Friederike<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><p class=\"hint\">„Ganze Familie“ heißt: alle, bei denen Allergien eingetragen sind. Wähle einzelne Personen, wenn bei den anderen die Warnung reicht.</p></fieldset><div class=\"liability\" role=\"note\"><h3><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 4l9 16H3z\"/><path d=\"M12 10v4M12 17v.5\"/></svg>Experimentell: keine Garantie, keine Haftung</h3><ul>\n<li>Hejmo kennt nur die 14 Hauptallergene und nur so, wie sie in der Bibliothek eingetragen sind.</li>\n<li>Spuren („Kann Spuren von … enthalten“) und geänderte Rezepturen kennt Hejmo nicht.</li>\n<li>Freitext-Allergien blendet Hejmo nicht aus (siehe unten).</li>\n<li>Von Hand eintragen geht weiter; der Eintrag trägt dann die Warnung.</li></ul>\n<p>Hejmo garantiert nicht, dass die Angaben vollständig oder richtig sind, und übernimmt keine Haftung. Lest immer die Zutatenliste auf der Packung.</p></div><div class=\"confirm-field\"><label class=\"confirm\"><input type=\"checkbox\" name=\"liability\"><span>Ich habe das gelesen. Hejmo ersetzt nicht den Blick auf die Packung.</span></label></div><section class=\"unchecked-box\" aria-labelledby=\"unch\"><h2 id=\"unch\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6M12 16.8v.4\"/></svg>Das blendet Hejmo nicht aus</h2><p class=\"hint\">Freitext kann Hejmo nicht prüfen und nicht danach filtern. Diese Allergien stehen deshalb weiter als Hinweis unter jeder Liste:</p><ul><li><span class=\"who\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia:</span><span>Kiwi</span></li><li><span class=\"who\"><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"></span>Charlotte-Sophie:</span><span>Erdbeeren, Tomaten, Pfirsiche (roh), Nachtschattengewächse</span></li></ul></section></div></fieldset><button class=\"button\" type=\"submit\">Speichern</button></form></section>\n\n</main>\n</div>\n", "Lang": "de", "Sizes": [["light", 1024, 768], ["dark", 1024, 768], ["bw", 1024, 768], ["light", 768, 1024], ["bw", 768, 1024], ["light", 375, 812], ["dark", 375, 812], ["bw", 375, 812]]}, {"Kind": "web", "Title": "Einstellungen → Listen: noch nichts „Immer auf der Liste“", "Note": "Ohne Artikel sagt die Zeile, wofür es gut ist.", "Body": "<a class=\"skip\" href=\"#content\">Zum Inhalt springen</a>\n<div class=\"frame framed has-nav\">\n<header class=\"frame-bar\">\n  <a class=\"brand\" href=\"/\">Hejmo</a>\n  <div class=\"frame-tools\">\n    <details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: </span>Deutsch</span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/people\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English</button></form></details>\n    <form class=\"signout\" method=\"post\" action=\"/logout\"><button class=\"button secondary\" type=\"submit\">Abmelden</button></form>\n  </div>\n</header>\n<nav class=\"frame-nav\" aria-label=\"Hauptnavigation\"><ul><li><a href=\"/\">Start</a></li><li><a href=\"/calendar\">Kalender</a></li><li><a href=\"/tasks\">Aufgaben</a></li><li><a href=\"/lists\">Listen</a></li><li><a href=\"/meals\">Essen</a></li><li><a href=\"/settings\" aria-current=\"page\">Einstellungen</a></li></ul></nav>\n<main id=\"content\">\n\n<a class=\"back\" href=\"/settings\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"/></svg>Zurück zu den Einstellungen</a><h1>Listen</h1><p class=\"lead\">Was für alle Listen gilt: welche Artikel Hejmo vorschlägt und wie es bei Allergien warnt.</p><ul class=\"list-rows\"><li><a href=\"/settings/lists/library\"><span class=\"art-sym\" aria-hidden=\"true\">🧺</span><span class=\"t\"><b>Artikel-Bibliothek</b><span class=\"meta\">248 Artikel von Hejmo, davon 2 von Hand ausgeblendet</span><span class=\"meta\">4 eigene Artikel</span></span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg></a></li><li><a href=\"/settings/lists/always\"><span class=\"art-sym\" aria-hidden=\"true\"><svg class=\"icon rep\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M17 3l3 3-3 3\"/><path d=\"M4 11V9a3 3 0 0 1 3-3h13\"/><path d=\"M7 21l-3-3 3-3\"/><path d=\"M20 13v2a3 3 0 0 1-3 3H4\"/></svg></span><span class=\"t\"><b>Immer auf der Liste</b><span class=\"meta\">Noch keine. Zum Beispiel Milch jede Woche auf „Einkauf“.</span></span><svg class=\"icon chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg></a></li></ul><section aria-labelledby=\"al\"><h2 id=\"al\">Allergien</h2><div class=\"lib-card\"><h3>So warnt Hejmo</h3><p>Steht ein Artikel mit einem der 14 Hauptallergene in den Vorschlägen oder auf einer Liste, steht darunter in Worten, wen es betrifft. Das ist immer an.</p><p><span class=\"allergen-warn\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 4l9 16H3z\"/><path d=\"M12 10v4M12 17v.5\"/></svg><span>Enthält Erdnüsse: <span class=\"who\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia</span> ist allergisch</span></span></p><p class=\"hint caveat\"><b>Experimentell, ohne Gewähr:</b> Eine Warnung kann fehlen oder falsch sein. Lies im Zweifel die Zutaten auf der Packung.</p></div>\n<div class=\"lib-card\"><h3>Eingetragene Allergien</h3><ul class=\"allergy-people\">\n<li><span class=\"who\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia:</span><span>Erdnüsse, Schalenfrüchte (Nüsse)</span><span class=\"unchecked\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6M12 16.8v.4\"/></svg><span>Nicht automatisch geprüft, nicht filterbar: Kiwi</span></span></li>\n<li><span class=\"who\"><span class=\"marker\" data-person=\"5\" data-shape=\"triangle-filled\" aria-hidden=\"true\"></span>Konstantin:</span><span>Milch und Laktose</span></li>\n<li><span class=\"who\"><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"></span>Charlotte-Sophie:</span><span>Glutenhaltiges Getreide, Sellerie, Senf, Sesam, Soja</span><span class=\"unchecked\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6M12 16.8v.4\"/></svg><span>Nicht automatisch geprüft, nicht filterbar: Erdbeeren, Tomaten, Pfirsiche (roh), Nachtschattengewächse</span></span></li>\n<li><span class=\"who\"><span class=\"marker\" data-person=\"8\" data-shape=\"star-filled\" aria-hidden=\"true\"></span>Friederike:</span><span>Fisch, Krebstiere, Weichtiere</span></li>\n</ul><p class=\"hint\">Ändern kannst du sie auf der Seite der Person unter „Essen und Allergien“. Mama, Papa, Sebastian und Maximilian haben keine eingetragen.</p></div><form method=\"post\" action=\"/settings/lists\" class=\"steps lib-form\"><fieldset><legend>Artikel ausblenden <span class=\"tag exp\">Experimentell</span></legend>\n<p class=\"hint\">Blendet Artikel mit einem Allergen dieser Personen aus den Vorschlägen und aus der Auswahl der Kachelansicht aus. Was schon auf einer Liste steht, bleibt mit Warnung stehen.</p>\n<div class=\"card-row\"><span class=\"t\"><b>Artikel mit Allergenen ausblenden</b><span class=\"state\"><span class=\"on-text\">An. Hejmo schlägt Artikel mit einem Allergen dieser Personen nicht mehr vor.</span><span class=\"off-text\">Aus. Hejmo warnt nur und blendet nichts aus.</span></span></span><label class=\"switch\"><input type=\"checkbox\" role=\"switch\" name=\"hide\" aria-label=\"Artikel mit Allergenen ausblenden\"></label></div>\n<div class=\"when-on\"><fieldset class=\"chips\"><legend>Für wen?</legend>\n<label class=\"pchip all\"><input type=\"checkbox\" name=\"whole_family\" value=\"1\" checked><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 11l8-6.5 8 6.5\"/><path d=\"M6 10v9h12v-9\"/></svg>Ganze Familie<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"4\"><input type=\"checkbox\" name=\"people\" value=\"Mia\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"5\"><input type=\"checkbox\" name=\"people\" value=\"Konstantin\"><span class=\"marker\" data-person=\"5\" data-shape=\"triangle-filled\" aria-hidden=\"true\"></span>Konstantin<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"6\"><input type=\"checkbox\" name=\"people\" value=\"Charlotte-Sophie\"><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"></span>Charlotte-Sophie<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip\" data-person=\"8\"><input type=\"checkbox\" name=\"people\" value=\"Friederike\"><span class=\"marker\" data-person=\"8\" data-shape=\"star-filled\" aria-hidden=\"true\"></span>Friederike<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><p class=\"hint\">„Ganze Familie“ heißt: alle, bei denen Allergien eingetragen sind. Wähle einzelne Personen, wenn bei den anderen die Warnung reicht.</p></fieldset><div class=\"liability\" role=\"note\"><h3><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 4l9 16H3z\"/><path d=\"M12 10v4M12 17v.5\"/></svg>Experimentell: keine Garantie, keine Haftung</h3><ul>\n<li>Hejmo kennt nur die 14 Hauptallergene und nur so, wie sie in der Bibliothek eingetragen sind.</li>\n<li>Spuren („Kann Spuren von … enthalten“) und geänderte Rezepturen kennt Hejmo nicht.</li>\n<li>Freitext-Allergien blendet Hejmo nicht aus (siehe unten).</li>\n<li>Von Hand eintragen geht weiter; der Eintrag trägt dann die Warnung.</li></ul>\n<p>Hejmo garantiert nicht, dass die Angaben vollständig oder richtig sind, und übernimmt keine Haftung. Lest immer die Zutatenliste auf der Packung.</p></div><div class=\"confirm-field\"><label class=\"confirm\"><input type=\"checkbox\" name=\"liability\"><span>Ich habe das gelesen. Hejmo ersetzt nicht den Blick auf die Packung.</span></label></div><section class=\"unchecked-box\" aria-labelledby=\"unch\"><h2 id=\"unch\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6M12 16.8v.4\"/></svg>Das blendet Hejmo nicht aus</h2><p class=\"hint\">Freitext kann Hejmo nicht prüfen und nicht danach filtern. Diese Allergien stehen deshalb weiter als Hinweis unter jeder Liste:</p><ul><li><span class=\"who\"><span class=\"marker\" data-person=\"4\" data-shape=\"square-empty\" aria-hidden=\"true\"></span>Mia:</span><span>Kiwi</span></li><li><span class=\"who\"><span class=\"marker\" data-person=\"6\" data-shape=\"diamond-filled\" aria-hidden=\"true\"></span>Charlotte-Sophie:</span><span>Erdbeeren, Tomaten, Pfirsiche (roh), Nachtschattengewächse</span></li></ul></section></div></fieldset><button class=\"button\" type=\"submit\">Speichern</button></form></section>\n\n</main>\n</div>\n", "Lang": "de", "Sizes": [["light", 1024, 768], ["bw", 768, 1024], ["light", 375, 812]]}, {"Kind": "web", "Title": "Artikel von Hejmo: Milch, „Immer auf der Liste“ aus", "Note": "Auf der Seite jedes Artikels (von Hejmo und eigene) eine Karte „Immer auf der Liste“ mit Schalter, Zustand in Worten. Aus: keine Felder. Dasselbe Formular, dieselbe eine Hauptaktion „Speichern“ wie in #164.", "Body": "<a class=\"skip\" href=\"#content\">Zum Inhalt springen</a>\n<div class=\"frame framed has-nav\">\n<header class=\"frame-bar\">\n  <a class=\"brand\" href=\"/\">Hejmo</a>\n  <div class=\"frame-tools\">\n    <details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: </span>Deutsch</span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <form class=\"lang-menu\" method=\"post\" action=\"/language\"><input type=\"hidden\" name=\"next\" value=\"/people\"><button type=\"submit\" name=\"lang\" value=\"en\" lang=\"en\"><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2030%22%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%2F%3E%3C%2FclipPath%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15%20h30%20v15%20z%20v15%20h-30%20z%20h-30%20v-15%20z%20v-15%20h30%20z%22%2F%3E%3C%2FclipPath%3E%3Cg%20clip-path%3D%22url%28%23s%29%22%3E%3Cpath%20d%3D%22M0%2C0%20v30%20h60%20v-30%20z%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20L60%2C30%20M60%2C0%20L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M30%2C0%20v30%20M0%2C15%20h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A\" alt=\"\">English</button></form></details>\n    <form class=\ Bananas</dd><dt>Abteilung</dt><dd>Obst und Gemüse</dd><dt>Einheiten</dt><dd><span>Bund und Stück</span><span class=\"hint\">Beim Hinzufügen ist Bund vorgewählt.</span></dd><dt>Was ist drin</dt><dd>Vegan: nichts vom Tier</dd><dt>Passt zu</dt><dd>allen bei euch</dd><dt>Steht gerade auf</dt><dd>keiner Liste</dd></dl><form method=\"post\" action=\"#\" class=\"steps lib-form\"><fieldset class=\"auto-card\"><legend>Immer auf der Liste</legend><p class=\"hint\">Für Dinge, die ihr regelmäßig braucht, etwa Milch jede Woche.</p><div class=\"card-row\"><span class=\"t\"><b>Kommt von selbst auf eine Liste</b><span class=\"state is-on\"><span class=\"on-text\">An, aber angehalten: Die Liste fehlt.</span><span class=\"off-text\">Aus. Bananen kommt nur auf eine Liste, wenn jemand sie draufsetzt.</span></span></span><label class=\"switch\"><input type=\"checkbox\" role=\"switch\" name=\"auto\" checked aria-label=\"Bananen kommt von selbst auf eine Liste\"></label></div><div class=\"when-on\"><fieldset class=\"chips auto-lists\" aria-invalid=\"true\" aria-describedby=\"err-list\"><legend>Auf welche Liste?</legend><label class=\"pchip plain\"><input type=\"radio\" name=\"list\" value=\"einkauf\"><span class=\"marker\" data-person=\"2\" data-shape=\"circle-filled\" aria-hidden=\"true\"></span><span>Einkauf</span><svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"list\" value=\"drogerie\"><span class=\"marker\" data-person=\"8\" data-shape=\"star-filled\" aria-hidden=\"true\"></span><span>Drogerie und Haushalt</span><svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"list\" value=\"geburtstag\"><span class=\"marker\" data-person=\"1\" data-shape=\"circle-empty\" aria-hidden=\"true\"></span><span>Kindergeburtstag Sebastian: Ausleihliste Nachbarschaft</span><svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"list\" value=\"todos\"><span class=\"marker\" data-person=\"5\" data-shape=\"triangle-filled\" aria-hidden=\"true\"></span><span>To-dos</span><svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><p class=\"ferr\" id=\"err-list\" role=\"alert\"><svg class=\"icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 8v5M12 16.5v.5\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/></svg><span>Die Liste „Wochenmarkt“, auf die Bananen kamen, gibt es nicht mehr. Wähl eine andere Liste, dann kommen sie wieder von selbst.</span></p></fieldset><fieldset class=\"chips auto-days\"><legend>An welchem Tag?</legend><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"montag\">Montag<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"dienstag\">Dienstag<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"mittwoch\">Mittwoch<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"donnerstag\">Donnerstag<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"freitag\">Freitag<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"samstag\" checked>Samstag<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label><label class=\"pchip plain\"><input type=\"radio\" name=\"weekday\" value=\"sonntag\">Sonntag<svg class=\"icon tick\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></label></fieldset><div class=\"auto-rhythm\"><div class=\"f\"><span class=\"lab\" id=\"lab-every\">Wie oft?</span><label class=\"every\">Alle <input name=\"every\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"52\" step=\"1\" value=\"1\" aria-labelledby=\"lab-every\"> Wochen</label><p class=\"hint\">1 heißt jede Woche, 2 jede zweite Woche, höchstens 52.</p></div><div class=\"f\"><label>Ab welcher Woche?<select name=\"start\"><option selected>Woche 47 · 16.11. – 22.11. (diese Woche)</option><option>Woche 48 · 23.11. – 29.11.</option><option>Woche 49 · 30.11. – 06.12.</option><option>Woche 50 · 07.12. – 13.12.</option><option>Woche 51 · 14.12. – 20.12.</option><option>Woche 52 · 21.12. – 27.12.</option><option>Woche 53 · 28.12. – 03.01.2027</option></select></label></div></div><div class=\"auto-qty\"><fieldset class=\"seg mode\"><legend>Wie viel?</legend><label><input type=\"radio\" name=\"qmode\" value=\"none\">Ohne Menge</label><label><input type=\"radio\" name=\"qmode\" value=\"qty\" checked>Mit Menge</label></fieldset><fieldset class=\"qty\"><legend class=\"vh\">Menge und Einheit</legend><div class=\"f amount\"><label for=\"amount\">Menge</label><div class=\"stepper\"><button class=\"button secondary step\" type=\"button\" aria-label=\"Weniger\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 12h12\"/></svg></button><input id=\"amount\" name=\"amount\" type=\"text\" inputmode=\"decimal\" value=\"1\" autocomplete=\"off\"><button class=\"button secondary step\" type=\"button\" aria-label=\"Mehr\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 6v12M6 12h12\"/></svg></button></div></div><fieldset class=\"units\"><legend>Einheit</legend><label><input type=\"radio\" name=\"unit\" value=\"Bund\" checked><span>Bund</span></label><label><input type=\"radio\" name=\"unit\" value=\"Stück\"><span>Stück</span></label></fieldset><details class=\"more more-units\"><summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg>Weitere Einheiten</summary><div><p class=\"hint\">Die übrigen eingeschalteten Einheiten, wie beim Hinzufügen.</p></div></details></fieldset></div><div class=\"auto-plan stopped\" aria-live=\"polite\"><p class=\"ap-head\"><svg class=\"icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M10 9v6M14 9v6\"/></svg><b>Angehalten: Bananen kommen gerade auf keine Liste</b></p><p><span class=\"hint\">Tag, Rhythmus und Menge bleiben gespeichert. Mit einer neuen Liste geht es am nächsten Samstag weiter.</span></p></div></div></fieldset><fieldset><legend>In den Vorschlägen</legend><div class=\"card-row\"><span class=\"t\"><b>Von Hand ausblenden</b><span class=\"state\"><span class=\"on-text\">An. Hejmo schlägt Bananen nicht mehr vor. Von Hand eintragen geht weiter.</span><span class=\"off-text\">Aus. Hejmo schlägt Bananen vor.</span></span></span><label class=\"switch\"><input type=\"checkbox\" role=\"switch\" name=\"hidden\" aria-label=\"Bananen von Hand ausblenden\"></label></div></fieldset><button class=\"button\" type=\"submit\">Speichern</button></form><details class=\"more\"><summary><svg class=\"icon chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg>Eigene Fassung anlegen</summary><div><p class=\"hint\">Stimmt etwas nicht für eure Marke, etwa ein Allergen oder die Abteilung? Hejmo kopiert den Artikel als eigenen Artikel und blendet diesen hier aus. „Immer auf der Liste“ geht mit.</p><form method=\"post\" action=\"#\"><button class=\"button secondary\" type=\"submit\">Als eigenen Artikel kopieren</button></form></div></details>\n</main>\n</div>\n", "Lang": "de", "Sizes": [["light", 1024, 768], ["dark", 1024, 768], ["bw", 1024, 768], ["light", 768, 1024], ["bw", 768, 1024], ["light", 375, 812], ["dark", 375, 812], ["bw", 375, 812]], "Anchor": ".auto-card"}, {"Kind": "web", "Title": "Einstellungen → Listen → Immer auf der Liste", "Note": "Übersicht in ruhigen Zeilen, die je die Artikelseite öffnen: Rhythmus, Liste und Menge in Worten, das nächste Datum. Dazu „Die nächsten zwei Wochen“ wie beim Essensplan, mit dem, was heute passiert ist. Angehaltene und ausgeschaltete stehen getrennt und sagen, warum. Keine Hauptaktion: Eingerichtet wird am Artikel.", "Body": "<a class=\"skip\" href=\"#content\">Zum Inhalt springen</a>\n<div class=\"frame framed has-nav\">\n<header class=\"frame-bar\">\n  <a class=\"brand\" href=\"/\">Hejmo</a>\n  <div class=\"frame-tools\">\n    <details class=\"lang\"><summary><img class=\"flag\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%220%22%20fill%3D%22%23000000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%221%22%20fill%3D%22%23DD0000%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20y%3D%222%22%20fill%3D%22%23FFCE00%22%2F%3E%3C%2Fsvg%3E%0A\" alt=\"\" width=\"24\" height=\"16\"><span class=\"lang-name\"><span class=\"vh\">Sprache: </span>Deutsch</span><svg class=\"icon chev\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/>
