openapi: 3.0.3
info:
  title: Hejmo box API
  version: 0.5.0
  description: |
    The REST API is the single interface for the web UI, displays, phones and
    integrations. Authenticate with a bearer token (`Authorization: Bearer hejmo_…`)
    or a browser session. A token acts on behalf of a person and is limited by
    its scopes: `read`, `write`, `<resource>` or `<resource>:<action>`
    (resources: people, events, calendars, tasks, lists, meals, displays, settings, tokens;
    actions: read, write, delete, complete).

    The scopes `calendars` and `tasks` are for a phone's calendar and
    reminders apps: they open the box's CalDAV server at `/dav/` (HTTP Basic
    with the person's username and the token as password, HTTPS only) and
    nothing in this REST API. `calendars` opens the calendars (VEVENT),
    `tasks` one task list per person (VTODO); a device token holds both. A
    task list shows a once task as it is and a repeating task as today's
    occurrence. Clients may change a task's title, notes, the day of a once
    task and its completion (which credits or deducts its stars once);
    creating and deleting tasks from a client is refused with 403. Create
    one token per device and revoke it on its own.

    The box also speaks MCP (Model Context Protocol, streamable HTTP, stateless)
    at `/mcp`, for AI assistants (ADR 0018). It is off by default (`GET` and `PUT`
    `/mcp` below), served over HTTPS only, and takes only a bearer token that was
    created for MCP (`POST /mcp/tokens`). Its tools are the functions of this API
    for events, lists, tasks (with routines, templates and stars) and the meal
    plan, except managing calendars (`POST /calendars`, `PATCH` and `DELETE`
    `/calendars/{id}`, `POST /calendars/{id}/sync` are no tools), run as the parent who made the token and with the token's scopes;
    tools the scopes do not allow are not offered. Tokens, settings, people,
    displays and phones are never tools. A token made for MCP works there only:
    this REST API and CalDAV refuse it, and MCP refuses every other token.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in person
      responses:
        "200":
          description: Current person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/recovery-codes:
    post:
      operationId: createRecoveryCodes
      summary: Create a new set of 10 recovery codes for the caller (parents only, scope people:write)
      description: |
        A recovery code replaces the one-time code at sign-in, never the
        password, and is valid once. The new set voids the old one. The codes
        are returned once and stored only as Argon2id hashes.
        Refused with 403 while the caller's new one-time codes are not yet
        confirmed (after a reset).
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes:
                    type: array
                    items: { type: string, example: K7QD2-M9XPA }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/passkeys:
    get:
      operationId: listPasskeys
      summary: The caller's passkeys (scope people:read)
      description: |
        A passkey replaces password and one-time code at sign-in (ADR 0018). It is
        valid only for the box name it was created under (`box_name`); `works` is
        false once the box has another name. Only parents have passkeys.
      responses:
        "200":
          description: The caller's passkeys, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPasskey
      summary: Finish creating a passkey (browser session, scope people:write)
      description: |
        Second step of creating a passkey: send what the browser's credentials
        API answered to the options of `POST /me/passkeys/registration`. Only a
        signed-in browser session may create a passkey, never a token and never a
        paired phone's session: a passkey
        signs in for good, so a stolen token must not be able to make one. The
        box checks the answer: the authenticator must have verified the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: { type: string, description: "The `ceremony` of the first step. It works once, for two minutes." }
                credential: { type: object, description: "The credential the browser created (`PublicKeyCredential`, as JSON)" }
                name: { type: string, maxLength: 80, description: "Name of the passkey; the device it was made on when empty" }
      responses:
        "201":
          description: The passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PasskeyName" }
        "422": { $ref: "#/components/responses/Invalid" }
  /me/passkeys/registration:
    post:
      operationId: beginPasskey
      summary: Start creating a passkey (browser session, scope people:write)
      description: |
        First step of creating a passkey. The answer holds the options for
        `navigator.credentials.create`. The request must come to the box under its
        box name (GLOSSARY): over an IP address or another name it is refused with
        409, because a passkey could not work there. A token and a paired phone's session
        are refused with 403.
      responses:
        "200":
          description: The ceremony to finish with `POST /me/passkeys`
          content:
            application/json:
              schema:
                type: object
                required: [ceremony, options]
                properties:
                  ceremony: { type: string }
                  options: { type: object, description: "WebAuthn PublicKeyCredentialCreationOptions as an object with the member publicKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PasskeyName" }
  /me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename a passkey of the caller (scope people:write)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: The passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: removePasskey
      summary: Remove a passkey of the caller for good (scope people:delete)
      description: Nobody can sign in with it afterwards. The caller's sessions stay.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /people/{id}/invitation:
    get:
      operationId: getInvitation
      summary: The newest invitation of an adult (scope tokens:read)
      description: |
        The state of the newest invitation made for this person: `open`, `used`
        (the person created their account), `expired` or `withdrawn`. The link
        itself is not in the answer: the box keeps only a hash of it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createInvitation
      summary: Invite an adult who has no account (scope tokens:write)
      description: |
        Creates an invitation link, valid once and for 7 days, and returns its
        address once: show it as a QR code or send it to that person. A link
        that is still open for the person is withdrawn, because a new link
        replaces the old one. The invited person opens the address on their own
        device and chooses username and password themselves, then sets up
        one-time codes. With the box's own certificate authority the address
        leads over the plain-HTTP trust page first (ADR 0014). Children cannot
        be invited (422), and neither can a person who has an account (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The new invitation, with its address (only in this answer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The person has an account already }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: withdrawInvitation
      summary: Withdraw the open invitation of an adult (scope tokens:delete)
      description: The link stops working at once. 404 when no invitation is open.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}/reset-otp:
    post:
      operationId: resetOneTimeCodes
      summary: Reset another parent's one-time codes (parents only, scope people:write)
      description: |
        Removes the parent's one-time code secret and recovery codes and ends
        their browser sessions. Device sessions and tokens stay. At the next
        sign-in the parent sets up new one-time codes before anything else is
        reachable. The caller confirms with their own password and one-time
        code (or an unused recovery code). A parent cannot reset their own
        codes this way.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, description: The caller's own password }
                code: { type: string, description: The caller's own one-time code or an unused recovery code }
                remove_passkeys:
                  type: array
                  items: { type: string, format: uuid }
                  description: |
                    Passkeys of the parent whose codes are reset to remove in the same
                    step (ADR 0018): one that was on the lost device could keep signing
                    in. Ids of other people's passkeys are ignored. None are removed by
                    default.
      responses:
        "204": { description: Reset }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { description: Too many failed confirmations. Wait 15 minutes. }
  /people:
    get:
      operationId: listPeople
      summary: Household members in display order
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPerson
      summary: Add a household member (parents only, scope people:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPerson" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/{id}:
    get:
      operationId: getPerson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePerson
      summary: Change a person's name, colour or marker (parents only, scope people:write)
      description: |
        Only the fields sent change. The colour is one of the eight palette colours
        (`Person.color`), the marker one of the eight shapes. No two people may have
        the same colour and the same marker: such a request gets 422.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /people/order:
    put:
      operationId: orderPeople
      summary: Set the order of the people, which is the order of the columns on the displays (parents only, scope people:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  description: Every person of the household exactly once
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The people in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tokens:
    get:
      operationId: listTokens
      summary: Active API tokens of the household, without their values (scope tokens:read)
      responses:
        "200":
          description: Tokens, oldest first. Revoked tokens are not listed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      summary: Create an API token for the caller (scope tokens:write)
      description: The token value is returned once and stored only as a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, example: Assistant }
                scopes: { type: string, example: read }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, name, scopes, token]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  scopes: { type: string }
                  token: { type: string, example: hejmo_… }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /mcp:
    get:
      operationId: getMCP
      summary: Whether the MCP server is on, and its address (scope settings:read)
      description: |
        The address always starts with `https://`: MCP is served over HTTPS
        only. A browser session may open the page of the web interface at the
        same address.
      responses:
        "200":
          description: State of the MCP server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setMCP
      summary: Switch the MCP server on or off (scope settings:write)
      description: |
        Off by default. Switching off needs no confirmation: tokens made for MCP
        stay stored and work again once it is switched on; an open MCP session
        stops at its next request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPState" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /mcp/tokens:
    post:
      operationId: createMCPToken
      summary: Create an API token for MCP, for the caller (scope tokens:write)
      description: |
        The areas events, lists, tasks (with routines, templates and stars) and
        meals each get `none`, `read` (scope `<area>:read`) or `write` (scope
        `<area>`, every action including adding, ticking off and deleting). An
        area left out counts as `none`; at least one area needs `read` or
        `write` (else 422). The token acts as the caller, who has to be a parent,
        and never holds `read`, `write`, `tokens` or `settings`. The name is
        unique among MCP tokens (not case-sensitive, else 422). The token value
        is returned once and stored only as a hash. Creating one works while MCP
        is off too; it works as soon as MCP is on. Revoke it with
        `DELETE /tokens/{id}`; `GET /tokens` lists it with `mcp: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, areas]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, example: Claude on Mama's laptop }
                areas: { $ref: "#/components/schemas/MCPAreas" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, name, scopes, areas, token, address]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  scopes: { type: string, example: "events lists:read" }
                  areas: { $ref: "#/components/schemas/MCPAreas" }
                  token: { type: string, example: hejmo_… }
                  address: { type: string, example: "https://hejmo.local/mcp" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /caldav-profile:
    post:
      operationId: createCalDAVProfile
      summary: Download an iOS profile that sets up the caller's CalDAV account (scope tokens:write)
      description: |
        Creates a new device token (scope `calendars`) for the caller, named
        after the device, and answers with an iOS configuration profile
        (`com.apple.caldav.account`) that holds the box address, the caller's
        user name and that token. For the caller's own account only. The box
        keeps no copy: the profile is the answer to this request; asking again
        creates another profile and another token. The token is listed and
        revoked like any other (`/tokens`). Served over HTTPS only, because
        the file holds the token in plain text; a plain HTTP request gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80, example: iPhone Mama }
      responses:
        "200":
          description: The profile, as a download
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/x-apple-aspen-config:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a token for good (scope tokens:delete)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /day-notes:
    get:
      operationId: listDayNotes
      summary: Notes for days, oldest day first (scope displays:read)
      description: Notes of days that are over are deleted by the box when the list is read, so only today and later are listed. Children are refused (403).
      responses:
        "200":
          description: The notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DayNote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /day-notes/{day}:
    parameters:
      - { name: day, in: path, required: true, schema: { type: string, format: date, example: "2026-11-16" } }
    put:
      operationId: setDayNote
      summary: Set the note of a day, replacing an earlier one (scope displays:write)
      description: |
        A free-text note of up to 120 characters for one day (`YYYY-MM-DD`, household time). The family
        view's tomorrow tile shows it as its last line from 18:00 the evening before until the end of that
        day; before 18:00 it shows the note of today. A day that is not a date, or a text that is empty after
        trimming spaces, answers 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayNote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteDayNote
      summary: Remove the note of a day (scope displays:delete)
      responses:
        "204": { description: Removed (also when the day had no note) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /displays:
    get:
      operationId: listDisplays
      summary: Paired displays of the household (scope displays:read)
      description: Children, including a child's phone, are refused (403). Device management is for parents.
      responses:
        "200":
          description: Displays, oldest first. Unpaired displays are not listed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: pairDisplay
      summary: Pair a waiting display by the six-digit code it shows (scope displays:write)
      description: |
        A new display opens the box's display address (`/display`) and shows a
        QR code and a six-digit code, valid for ten minutes. Confirming the
        code names the display and gives it its own revocable token, which it
        keeps in its browser. A wrong or expired code is refused with 404;
        after five wrong codes in 15 minutes the person gets 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairDisplay" }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /displays/{id}:
    patch:
      operationId: updateDisplay
      summary: Change the settings of a paired display (scope displays:write)
      description: |
        Only the fields sent are changed. `name` (1 to 80 characters after trimming) and `type` (`eink_bw`, `eink_color` or `screen`) rename and retype the display; an empty or too long name, or an unknown type, is refused with 422. `show_tomorrow` switches the tomorrow block of the family view (ADR 0016).
        `theme` and the two offsets set the display's theme (ADR 0015); an unknown theme or an offset outside -180..180 is refused with 422.
        `quiet_mode` sets the daily window in which the display shows the night page (a black page on a normal screen) and the front light goes off (ADR 0015). Quiet mode takes precedence over the theme.
        `kiosk` sets the address and API key of the kiosk app (FreeKiosk, ADR 0005) the box uses to switch the front light off at sunset and in quiet mode; an empty `url` removes it. Times and addresses that are not valid are refused with 422.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDisplay" }
      responses:
        "200":
          description: The display with its settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: unpairDisplay
      summary: Unpair a display and revoke its token (scope displays:delete)
      description: The display shows the pairing screen again within a minute.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unpaired }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /phones:
    get:
      operationId: listPhones
      summary: Paired phones of the household (scope tokens:read)
      description: Each phone has a long-lived device session for the person it was paired for (ADR 0015).
      responses:
        "200":
          description: Phones, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Phone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /phones/{id}:
    delete:
      operationId: revokePhone
      summary: Remove a phone and end its device session (scope tokens:delete)
      description: The phone is signed out the next time it opens the app.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /phones/pairings:
    get:
      operationId: listPhonePairings
      summary: Phones that opened a pairing code and wait for confirmation (scope tokens:read)
      responses:
        "200":
          description: Waiting phones, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PhonePairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPhonePairing
      summary: Create a pairing code for a phone (scope tokens:write)
      description: |
        Returns the address a phone opens, valid once and for ten minutes; show
        it as a QR code. The box keeps only a hash of the code, so the address
        is only in this answer. With the box's own certificate authority the
        address leads over the plain-HTTP trust page first, which then leads on
        to the pairing (ADR 0014). The phone opens the address, waits, and a
        parent confirms it with `confirmPhonePairing`.
      responses:
        "201":
          description: The pairing code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewPhonePairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /phones/pairings/{id}/confirm:
    post:
      operationId: confirmPhonePairing
      summary: Confirm the phone that opened a pairing code (scope tokens:write)
      description: |
        Chooses whom the phone is for (an account or a child) and names it. The
        phone gets its device session at its next request. The phone acts with
        the role of that person. A pairing that no phone opened, or that
        expired or was confirmed already, is 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPhone" }
      responses:
        "201":
          description: The phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Phone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks:
    get:
      operationId: listTasks
      summary: Simple tasks of the household with their state on one day (scope tasks:read)
      description: |
        All tasks, oldest first. `due` says whether a task is due on `date`
        (default today in the household's time zone) and `done` whether it is
        ticked off that day. A repeating task is open again on the next day it
        is due. Everyone, children included, may read all tasks.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createTask
      summary: Create a task for a person (scope tasks:write, parents only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTask" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}:
    patch:
      operationId: updateTask
      summary: Change a task's star value (scope tasks:write, parents only)
      description: |
        Only `stars` can be changed so far; any other or unknown field is
        refused with 400. The new value counts from the next tick. Ticks that
        are already credited keep their value: the star log and the stars
        credited for done days stay as they are, and unticking deducts what was
        credited. A missing value, a value that is not a whole number and a value
        outside 0 to 100 give 422 with `field: stars`, as on POST /tasks.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                `stars` is a whole number from 0 to 100. The range is checked by
                the box, so a value outside it gets the 422 below with a field
                error. Any other field is refused with 400.
              additionalProperties: false
              properties:
                stars: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: The updated task with its state today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: Not valid JSON or an unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteTask
      summary: Delete a task with its history (scope tasks:delete, parents only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/done:
    put:
      operationId: setTaskDone
      summary: Tick a task off or back open for today (scope tasks:complete)
      description: |
        Parents may do this for every task, a child only for its own (else
        403). The task must be due today, else 422. Ticking twice changes
        nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The task with its state today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}/subtasks:
    post:
      operationId: addSubtask
      summary: Add a subtask to a task (scope tasks:write, parents only)
      description: |
        A subtask is a title with an optional emoji (ADR 0018). It is added at
        the end. A task has at most 10 subtasks, one level only: an 11th gives
        422 with `field: subtasks`. If the task is already ticked off today,
        the new subtask counts as done today, so the person loses no stars.
        Answers with the task and its state today.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSubtask" }
      responses:
        "201":
          description: The task with its subtasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}/subtasks/{sub_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sub_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSubtask
      summary: Change the title or emoji of a subtask (scope tasks:write, parents only)
      description: Any other or unknown field is refused with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                emoji: { type: string, maxLength: 16 }
      responses:
        "200":
          description: The task with its subtasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: Not valid JSON or an unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteSubtask
      summary: Remove a subtask (scope tasks:write, parents only)
      description: |
        Removing the last open subtask completes the task for today and
        credits its stars, because everything that is left is ticked. Removing
        the only subtask leaves a plain task as it was. Answers with the task
        and its state today.
      responses:
        "200":
          description: The task with its remaining subtasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/subtasks/{sub_id}/move:
    post:
      operationId: moveSubtask
      summary: Move a subtask one place up or down (scope tasks:write, parents only)
      description: Moving the first one up or the last one down changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sub_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: string, enum: [up, down] }
      responses:
        "200":
          description: The task with its subtasks in the new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /tasks/{id}/subtasks/{sub_id}/done:
    put:
      operationId: setSubtaskDone
      summary: Tick a subtask off or back open for today (scope tasks:complete)
      description: |
        Parents may do this for every task, a child only for its own (else
        403). The task must be due today, else 422. Ticks belong to today's
        occurrence and start open again with the next one. Ticking the last
        open subtask completes the task and credits its stars once; unticking
        a subtask of a done task reopens the task and deducts them, the other
        subtasks stay ticked. Ticking the task itself (`PUT /tasks/{id}/done`)
        ticks all its subtasks and unticking a done task unticks all of them
        (unticking an open task leaves its subtask ticks alone). Ticking
        twice changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sub_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The task with its state today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines:
    get:
      operationId: listRoutines
      summary: Routines of the household with their tasks in order (scope tasks:read)
      description: |
        A routine is the ordered sequence of one person's tasks for a part of
        the day (ADR 0018). `task_ids` lists the routine's tasks in the order
        the personal view shows them. Everyone, children included, may read.
      parameters:
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Routines, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Routine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createRoutine
      summary: Create a routine for a person and a part of the day (scope tasks:write, parents only)
      description: |
        A person has at most one routine per part of the day: a second one is
        409 and names the existing routine in `existing_routine_id`. Add its
        tasks with `POST /tasks` (`routine_id`) or `POST /routines/{id}/tasks`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRoutine" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/RoutineConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRoutine
      summary: One routine with its tasks in order (scope tasks:read)
      responses:
        "200":
          description: The routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRoutine
      summary: Rename a routine or change its part of the day (scope tasks:write, parents only)
      description: |
        Changing the part of the day changes it for every task of the routine.
        A part the person already has a routine for is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                part_of_day: { $ref: "#/components/schemas/RoutinePart" }
      responses:
        "200":
          description: The updated routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RoutineConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: dissolveRoutine
      summary: Dissolve a routine; its tasks stay (scope tasks:delete, parents only)
      description: |
        Deletes the routine and no task: its tasks stay as single tasks of the
        person with their part of the day (after school becomes any time),
        their stars and their history.
      responses:
        "204": { description: Dissolved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /routines/{id}/tasks:
    post:
      operationId: addTaskToRoutine
      summary: Take a person's single task into the routine, at the end (scope tasks:write, parents only)
      description: |
        The task must be the routine's person's and in no routine (else 409 for
        a task that is in one, 422 for another person's). It takes the
        routine's part of the day. To create a new task in a routine, use
        `POST /tasks` with `routine_id`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              additionalProperties: false
              properties:
                task_id: { type: string, format: uuid }
      responses:
        "200":
          description: The routine with the task at its end
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RoutineConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines/{id}/tasks/{task_id}:
    delete:
      operationId: removeTaskFromRoutine
      summary: Take a task out of the routine (scope tasks:write, parents only)
      description: |
        The task becomes a single task again and keeps the routine's part of
        the day (after school becomes any time), its stars and its history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Taken out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routines/{id}/order:
    put:
      operationId: setRoutineOrder
      summary: Put the routine's tasks in a new order (scope tasks:write, parents only)
      description: |
        `task_ids` must name every task of the routine exactly once, else 422
        and nothing changes. The personal view shows the new order.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_ids]
              additionalProperties: false
              properties:
                task_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The routine in its new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routine-templates:
    get:
      operationId: listRoutineTemplates
      summary: Routine templates, own first, then the ones that come with Hejmo (scope tasks:read)
      description: |
        A routine template is a routine without a person (ADR 0018). The
        parent's own templates come first, oldest first, then the templates
        that ship with Hejmo (`source: shipped`, ids such as `school-morning`),
        in the language in use: their names and step titles follow the
        request's language, German or English. Everyone, children included,
        may read.
      responses:
        "200":
          description: Own templates, then shipped ones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoutineTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: saveRoutineAsTemplate
      summary: Save a routine as an own template (scope tasks:write, parents only)
      description: |
        Copies the routine's part of the day and its steps in order, with
        emoji, star value and repetition. Once-only tasks are left out; a
        routine with no other task is 422. What a person ticked, stars earned
        and history stay with the person. The template is a copy: changing
        the routine later does not change it. Without `name` the template is
        called "<routine> von <person>" (English: "<routine> of <person>").
        A name already used by an own template (ignoring case) is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routine_id]
              additionalProperties: false
              properties:
                routine_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: The new template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routine-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "An own template's UUID or the id of a shipped one" }
    get:
      operationId: getRoutineTemplate
      summary: One routine template with its steps (scope tasks:read)
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRoutineTemplate
      summary: Rename an own template or change its suggested part of the day (scope tasks:write, parents only)
      description: |
        Routines that were made from the template stay as they are. A
        template that ships with Hejmo cannot be changed: 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                part_of_day: { $ref: "#/components/schemas/RoutinePart" }
      responses:
        "200":
          description: The updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteRoutineTemplate
      summary: Delete an own template (scope tasks:delete, parents only)
      description: |
        Routines that were made from the template stay as they are. A
        template that ships with Hejmo cannot be deleted: 409.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
  /routine-templates/{id}/steps:
    post:
      operationId: addRoutineTemplateStep
      summary: Add a step at the end of an own template (scope tasks:write, parents only)
      description: |
        A step is never once-only (`repeat` is `daily` or `weekly`) and has
        no subtasks. `stars` defaults to 1.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, repeat]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                emoji: { type: string, maxLength: 16 }
                stars: { type: integer, minimum: 0, maximum: 100 }
                repeat: { $ref: "#/components/schemas/TemplateRepeat" }
                weekdays: { type: array, items: { $ref: "#/components/schemas/TaskWeekday" } }
      responses:
        "201":
          description: The template with the new step at its end
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /routine-templates/{id}/steps/{step_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: step_id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRoutineTemplateStep
      summary: Change a step of an own template (scope tasks:write, parents only)
      description: |
        Only the fields given change. Changing `repeat` to `daily` drops the
        weekdays; `weekly` needs weekdays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                emoji: { type: string, maxLength: 16 }
                stars: { type: integer, minimum: 0, maximum: 100 }
                repeat: { $ref: "#/components/schemas/TemplateRepeat" }
                weekdays: { type: array, items: { $ref: "#/components/schemas/TaskWeekday" } }
      responses:
        "200":
          description: The updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteRoutineTemplateStep
      summary: Remove a step from an own template (scope tasks:write, parents only)
      responses:
        "200":
          description: The template without the step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" } # the last step of a template stays
  /routine-templates/{id}/order:
    put:
      operationId: setRoutineTemplateOrder
      summary: Put the steps of an own template in a new order (scope tasks:write, parents only)
      description: |
        `step_ids` must name every step of the template exactly once, else
        422 and nothing changes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_ids]
              additionalProperties: false
              properties:
                step_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The template in its new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TemplateConflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meals:
    get:
      operationId: listMeals
      summary: The meal plan from one day to another (scope meals:read)
      description: |
        Entries from `from` to `to`, both included, by day and then by mealtime
        in the order of the day (breakfast, lunch, snack, dinner). Without
        `from` and `to` the week from today in the household's time zone. At
        most 62 days; give both or neither, else 422. Everyone, children
        included, may read the plan.

        An entry is the effective meal: this week's adjustment if there is one,
        else what a meal plan template fills in, else the hand-typed entry
        (`source` and `template_dish` say which). A meal emptied for a week is
        not listed.

        Every entry also appears as an all-day event "<Mealtime>: <text>" in
        the generated, read-only calendar of kind `meals` (see `/calendars`),
        which is shared through the box by default (ADR 0015).
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Meals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meals/{date}/{mealtime}:
    put:
      operationId: setMeal
      summary: Plan a meal, or change the planned one (scope meals:write, parents only)
      description: |
        Sets the free-text entry of a day and mealtime and writes its all-day
        event in the meal-plan calendar, which is created on first use. The
        event title uses the language of the request (Accept-Language), for
        example "Dinner: Pasta bake". Saving the same text again changes
        nothing. An empty text is refused with 422: remove a meal with DELETE.

        Where a meal plan template fills the day, the text is that week's
        adjustment (`source` adjusted); typing the template's own dish is no
        adjustment.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: mealtime, in: path, required: true, schema: { $ref: "#/components/schemas/Mealtime" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 200, description: "One line, trimmed; at most 200 characters" }
      responses:
        "200":
          description: The meal as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteMeal
      summary: Remove a planned meal and its calendar event (scope meals:delete, parents only)
      description: |
        Removing a meal that is not planned is not an error (204). Where a meal
        plan template fills the day, it empties the meal for that week (an
        adjustment); `restoreMeal` brings the template's dish back.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: mealtime, in: path, required: true, schema: { $ref: "#/components/schemas/Mealtime" } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meals/{date}/{mealtime}/restore:
    post:
      operationId: restoreMeal
      summary: Back to template, drop the week's change of a meal (scope meals:write, parents only)
      description: |
        Removes the adjustment of a meal, so the template's dish shows again
        (and in the calendar). 404 if the meal is not adjusted.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: mealtime, in: path, required: true, schema: { $ref: "#/components/schemas/Mealtime" } }
      responses:
        "200":
          description: The meal as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meal-templates:
    get:
      operationId: listMealTemplates
      summary: Meal plan templates, by name (scope meals:read)
      description: |
        A template is a week pattern from Monday to Sunday that fills the meal
        plan by itself, every `interval` weeks from `start_week`.
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MealTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMealTemplate
      summary: Create a meal plan template (scope meals:write, parents only)
      description: |
        Fills the meal plan and the meal-plan calendar from today on. Entries of
        mealtimes the template does not fill are ignored; an empty entry leaves
        that meal free. At least one entry must be filled (else 422).

        Two templates may not fill the same mealtime on the same weekday of the
        same week, from today on. Then nothing is saved and the answer is 409
        with `clashes`: for each template it clashes with, the mealtime, the
        weekdays and the first week.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMealTemplate" }
      responses:
        "201":
          description: The template as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MealTemplateClash" }
        "422": { $ref: "#/components/responses/Invalid" }
  /meal-templates/{id}:
    get:
      operationId: getMealTemplate
      summary: One meal plan template (scope meals:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateMealTemplate
      summary: Replace a meal plan template (scope meals:write, parents only)
      description: |
        Changes reach today and all later days, never days before today. Meals
        adjusted for a week keep their change. Overlaps are refused as in
        `createMealTemplate`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMealTemplate" }
      responses:
        "200":
          description: The template as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MealTemplateClash" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteMealTemplate
      summary: Delete a meal plan template (scope meals:delete, parents only)
      description: |
        From today on its meals leave the plan and the calendar. Days before
        today keep what they showed; meals adjusted for a week stay as plain
        entries.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /people/{id}/stars:
    get:
      operationId: getStars
      summary: A person's star balance and star log (scope tasks:read)
      description: |
        The balance is the sum of all bookings of the person. `entries` are the
        latest bookings, newest first (default 50, at most 200). Everyone,
        children included, may read it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: The star account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: bookStars
      summary: Book stars by hand with a note (scope tasks:write, parents only)
      description: |
        A negative amount deducts, for example -5 with the note "redeemed: ice
        cream". The amount may not be 0 and the note may not be blank (else
        422). Ticking tasks books stars on its own, see `setTaskDone`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewStarBooking" }
      responses:
        "201":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists:
    get:
      operationId: listLists
      summary: The household's lists with their number of entries (scope lists:read)
      description: |
        Oldest first. Every list belongs to the household and has no audience.
        A new box has the lists "Shopping" and "To-dos". Everyone, children
        included, may read lists.
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/List" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createList
      summary: Create a list (scope lists:write, parents only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewList" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getList
      summary: One list with its entries in the order the list shows them (scope lists:read)
      description: |
        An alphabetical list orders its entries by text, ignoring case and
        treating ä, ö, ü like a, o, u; a manual list follows the positions
        set with `PUT /lists/{id}/entries/{entry}/position`.
      responses:
        "200":
          description: The list with its entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListWithEntries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateList
      summary: Rename a list or change its colour, symbol or sorting (scope lists:write, parents only)
      description: Switching the sorting keeps the manual order, so switching back restores it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListChange" }
      responses:
        "200":
          description: The changed list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteList
      summary: Delete a list with all its entries (scope lists:delete, parents only)
      description: A child is refused with 403.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lists/{id}/entries:
    post:
      operationId: addListEntry
      summary: Add an entry at the end of a list (scope lists:write, parents only)
      description: An alphabetical list shows it at its place by text.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}/entries/{entry}:
    delete:
      operationId: deleteListEntry
      summary: Delete one entry (scope lists:delete, parents only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /lists/{id}/entries/{entry}/done:
    put:
      operationId: setListEntryDone
      summary: Tick an entry off or back open (scope lists:complete)
      description: Everyone, children included, may do this. Ticking twice changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}/entries/{entry}/position:
    put:
      operationId: moveListEntry
      summary: Move an entry to a place of a manually sorted list (scope lists:write, parents only)
      description: Position 0 is first. Refused with 422 on an alphabetical list.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The entries in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /lists/{id}/completed-entries:
    delete:
      operationId: deleteCompletedListEntries
      summary: Delete all ticked-off entries of a list (scope lists:delete, parents only)
      description: Open entries stay.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: How many entries were deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups:
    get:
      operationId: listGroups
      summary: Subgroups such as "School children"
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                members: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /groups/{id}:
    patch:
      operationId: updateGroup
      summary: Rename a subgroup or replace its members (parents only, scope people:write)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                members: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteGroup
      summary: Delete a subgroup (parents only, scope people:write)
      description: A subgroup that still decides who sees a calendar or an event is not deleted (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The subgroup is still used by a calendar or an event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /calendars:
    get:
      operationId: listCalendars
      summary: Calendars (local family calendar, synced calendars) with their audience
      responses:
        "200":
          description: Calendars
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: addCalendar
      summary: Subscribe to an ICS calendar (parents)
      description: |
        Adds a read-only calendar from an ICS address (`https://`, `http://` or `webcal://`)
        and syncs it once right away. If that first sync fails the calendar is still added;
        the failure is in the sync log and the scheduler retries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCalendar" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendars/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCalendar
      summary: Change a synced calendar (share through the box, waste collection, name, colour, audience)
      description: |
        Send at least one field. `share_through_box` switches sharing through the box for a synced
        calendar; the family calendar is always served to phones, asking to change it answers 422.
        `name`, `color` and `audience` can only be changed on a synced calendar (else 422; 404 if no calendar has the id); a field
        left out stays as it is. Nothing is sent to the calendar's source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                share_through_box: { type: boolean }
                waste_collection: { type: boolean, description: "Only a read-only calendar can be marked, else 422" }
                name: { type: string, minLength: 1 }
                color: { type: string, example: "#B4583A", description: "#RRGGBB, else 422" }
                audience: { $ref: "#/components/schemas/Audience" }
      responses:
        "200":
          description: The calendar after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: removeCalendar
      summary: Remove a synced calendar and its events from the box
      description: Nothing is deleted outside the box. An ICS subscription goes with its calendar; a CalDAV calendar leaves its connection and the connection's other calendars alone. The family calendar cannot be removed.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendars/{id}/sync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncCalendarNow
      summary: Sync a calendar now
      description: Answers 200 with the calendar and its new sync state, also when the sync failed (see `sync.last_error` and the sync log).
      responses:
        "200":
          description: Calendar after the sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendar-connections:
    get:
      operationId: listCalendarConnections
      summary: CalDAV and iCloud connections (parents, scope settings:read)
      description: Never contains a password.
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: connectCalendarServer
      summary: Connect iCloud or another CalDAV server and discover its calendars (parents, scope settings:write)
      description: |
        Signs in to the server and lists its event calendars; nothing is synced yet. The
        connection is stored only if that works: a refused login or an unreachable server
        answers 422 and stores nothing. The password is encrypted with the box's key
        (AES-256-GCM) and never returned. Tick calendars with `POST /calendar-connections/{id}/calendars`.
        For iCloud use an app-specific password. With `single_calendar` the address is that of
        one calendar, entered by hand, and only that calendar is offered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCalendarConnection" }
      responses:
        "201":
          description: Connected, with the discovered calendars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendar-connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeCalendarConnection
      summary: Remove a connection with its synced calendars and their events from the box (parents, scope settings:delete)
      description: Nothing is deleted outside the box.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calendar-connections/{id}/credentials:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: changeConnectionPassword
      summary: Replace the password of a connection, after the server accepted it (parents, scope settings:write)
      description: |
        Signs in with the new password and lists the server's calendars, as when connecting. Only if that
        works is the password stored (encrypted with the box's key, never returned) and the connection's
        calendars synced again at once. A refused login, a server that points to another domain and an
        unreachable server answer 422 and keep the old password. For iCloud use an app-specific password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, writeOnly: true }
      responses:
        "204": { description: The password was checked and stored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendar-connections/{id}/calendars:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: discoverConnectionCalendars
      summary: List the server's calendars again, marking those already synced (parents, scope settings:write)
      responses:
        "200":
          description: The connection with its calendars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: addConnectionCalendar
      summary: Sync one of the server's calendars (parents, scope settings:write)
      description: |
        Adds the calendar with its colour and audience and syncs it once right away; if that
        first sync fails the calendar is still added (see the sync log) and the scheduler retries.
        `url` must be a calendar on the connection's server and not yet synced. These calendars
        are read-only for now; delta sync runs every 5 minutes by default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewConnectionCalendar" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /calendar-connections/{id}/event-counts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: countConnectionEvents
      summary: How many events each of the server's calendars has in the import window (parents, scope settings:write)
      description: |
        Lists the server's calendars again and asks the server to count, per calendar, the events in the
        import window: the past 12 months and everything later, a series counting once. Nothing is
        downloaded or stored. The calendars are asked together, each within a timeout; a calendar the
        server does not answer in time (or cannot count) has `state` `unknown` and the others are
        unaffected. The web page asks for this after it has been shown, so a slow server cannot block it.
      responses:
        "200":
          description: One entry per calendar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventCount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /sync-log:
    get:
      operationId: listSyncLog
      summary: Sync problems (failures, conflicts and remarks), newest first (parents, scope settings:read)
      description: A record of problems only. Successful runs show as `sync.last_success_at`, `sync.event_count` and `sync.last_run` of each calendar.
      responses:
        "200":
          description: At most 200 entries from the last 30 days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncLogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /https:
    get:
      operationId: getHTTPS
      summary: How the box secures HTTPS and whether its certificate needs attention (parents, scope settings:read)
      description: |
        `own-ca` is the box's own certificate authority (it is renewed by the box). Without `warning` there is
        nothing to do. With `warning` true it is the fallback of a configured box whose public certificate could
        not be loaded or obtained (decision Q27): the box serves its own CA's certificate on HTTPS, never
        plain HTTP, and phones must first trust the own CA (`/ca`); `renewal_error` says why.
        `public` is a publicly trusted certificate for the family's DNS name (ADR 0014); `warning` is set when its
        renewal failed or it is about to expire.
      responses:
        "200":
          description: HTTPS status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPSStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settings:
    get:
      operationId: getSettings
      summary: Household settings (scope settings:read)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateSettings
      summary: Change household settings; omitted fields stay as they are (scope settings:write)
      description: |
        The time format applies to every time shown in the web interface and
        on displays (ADR 0016). An unknown `date_format` is refused with 400, an
        unknown value of any other field with 422.

        The home place sets where sunrise and sunset are computed (front light
        of displays, themes) and which weather is shown. Give `home_place_id`,
        the id of a place of the list on the box (find it with `GET /places`):
        the name and the coordinates then come from the list, and giving
        `home_name`, `latitude` or `longitude` as well is refused. Or give
        `latitude` and `longitude` together (degrees, -90 to 90 and -180 to 180);
        a new `home_name` needs them too, and the stored `home_place_id` becomes
        null. An unknown place id, out-of-range or lone coordinates are refused
        with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/Invalid" }
  /places:
    get:
      operationId: searchPlaces
      summary: Search the places on the box, to set the home location (scope settings:read)
      description: |
        Searches the list of towns, villages and districts of Germany, Austria
        and Switzerland that ships on the box (GeoNames, CC BY 4.0). The answer
        comes from the box; nothing goes to the internet. Matching is case- and
        diacritic-insensitive (ü = ue, ß = ss) over the name, the ASCII name and the
        alternate names in German, English, French and Italian. It starts at two
        letters (a shorter name is an empty list). Names that start with the
        text come before names with a word that does, then larger places come
        first. At most five places are listed; `more` says that more matched.
        No match is an empty list. Use the `id` as `home_place_id` of
        `PATCH /settings`.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 100 }, description: "The text to search for, for example Pasing; blank or longer than 100 characters is refused with 422" }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [de, en] }, description: "The language of the region label; default the language of the request. Anything else is refused with 422" }
      responses:
        "200":
          description: The matching places, best match first
          content:
            application/json:
              schema:
                type: object
                required: [places, more]
                properties:
                  places: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Place" } }
                  more: { type: boolean, description: "True if more than five places matched; the five largest are listed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /update:
    get:
      operationId: getUpdate
      summary: Auto-update mode and what the host script last did (scope settings:read)
      description: |
        The host-side update script (ADR 0018) reports through a small status
        file; this is its content with fixed values only. `notice` says whether
        the web interface shows a notice to parents: after an update (what is new),
        after a rollback or a rejected image (with the `reason`), and, with
        mode `notify`, while a newer version is available.
      responses:
        "200":
          description: Update status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /update/dismiss:
    post:
      operationId: dismissUpdateNotice
      summary: Dismiss the current update notice so it is not shown again (scope settings:write)
      description: A notice about an available update (mode notify) cannot be dismissed; it goes when the update is installed.
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events:
    get:
      operationId: listOccurrences
      summary: Occurrences in a time range, series expanded
      description: Without `person` this is the family view. With `person`, only what that person's view shows (event and calendar audiences, subgroups).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: person, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Occurrences sorted by start
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Occurrence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      operationId: createEvent
      summary: Create an event or a series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEvent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: occurrence
        in: query
        required: false
        description: Original start of the occurrence to change (RFC 3339; a date for all-day events). Defaults to the event's start.
        schema: { type: string }
      - name: scope
        in: query
        required: false
        description: Which occurrences of a series to touch. Defaults to `this`.
        schema: { type: string, enum: [this, following, all] }
    patch:
      operationId: updateEvent
      summary: Change an event or occurrences of a series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPatch" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteEvent
      summary: Delete an event or occurrences of a series
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /holidays:
    get:
      operationId: listHolidays
      summary: Public holidays of the home region (state or canton)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: exclusive, schema: { type: string, format: date } }
      responses:
        "200":
          description: Holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [date, name, name_en, partial]
                  properties:
                    date: { type: string, format: date }
                    name: { type: string, example: Allerheiligen }
                    name_en: { type: string, example: "All Saints' Day" }
                    partial: { type: boolean, description: "Holiday in most, but not all, municipalities of the region (e.g. 15 August in Bavaria)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /search:
    get:
      operationId: search
      summary: Full-text search (V1.0 searches events; tasks and lists follow)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching events, at most 100
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: hejmo_session }
  schemas:
    Role:
      type: string
      enum: [parent, child]
    Person:
      type: object
      required: [id, name, role, color, shape, symbol]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        color: { type: string, description: "Hex colour for colour mode: one of the eight palette colours (empty for a person added before colours were chosen)", example: "#B4583A" }
        shape: { type: string, description: "Marker for black-and-white mode", example: circle-filled }
        symbol: { type: string }
    PersonColor:
      type: string
      description: The eight person colours of the palette, in slot order
      enum: ["#B4583A", "#2F5E7A", "#4E7D52", "#9A7420", "#86587F", "#3A7A74", "#5559A3", "#B04A6A"]
    PersonShape:
      type: string
      description: The eight black-and-white markers, in slot order
      enum: [circle-filled, circle-empty, square-filled, square-empty, triangle-filled, diamond-filled, cross-filled, star-filled]
    PersonUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        color: { $ref: "#/components/schemas/PersonColor" }
        shape: { $ref: "#/components/schemas/PersonShape" }
    NewPerson:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 80 }
        role: { $ref: "#/components/schemas/Role" }
        color: { $ref: "#/components/schemas/PersonColor" }
        shape: { $ref: "#/components/schemas/PersonShape" }
        symbol: { type: string }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at, box_name, works]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: "Null until it was used" }
        box_name: { type: string, description: "The box name the passkey was created for", example: hejmo.local }
        works: { type: boolean, description: "False once the box has another name than `box_name`" }
    TaskRepeat:
      type: string
      enum: [once, daily, weekly]
    TaskWeekday:
      type: string
      enum: [MO, TU, WE, TH, FR, SA, SU]
    TaskPartOfDay:
      type: string
      enum: ["", morning, afterschool, evening]
      description: |
        Empty means any time of the day. `afterschool` exists only in routines:
        a task in a routine always reports its routine's part of the day, and a
        task outside a routine cannot be `afterschool`.
    RoutinePart:
      type: string
      enum: [morning, afterschool, evening]
    NewRoutine:
      type: object
      required: [person_id]
      description: |
        Without `template_id`, `name` and `part_of_day` are required (else
        422). With `template_id` the routine is made from a routine template
        (own or shipped): its steps become new tasks of the person, an
        independent copy that keeps no link to the template. Then `part_of_day`
        defaults to the template's suggestion (any part of the day may be
        chosen) and `name` to the stock name of the part ("Morgenroutine").
        Shipped templates are copied in the language in use.
      properties:
        person_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60, example: Morgenroutine }
        part_of_day: { $ref: "#/components/schemas/RoutinePart" }
        template_id: { type: string, description: "An own template's UUID or the id of a shipped one", example: school-morning }
    TemplateRepeat:
      type: string
      enum: [daily, weekly]
      description: A template step is never once-only.
    RoutineTemplate:
      type: object
      required: [id, name, part_of_day, source, steps]
      properties:
        id: { type: string, description: "A UUID for an own template, a readable id such as school-morning for a shipped one" }
        name: { type: string }
        part_of_day: { $ref: "#/components/schemas/RoutinePart" }
        source: { type: string, enum: [own, shipped] }
        origin_routine: { type: string, description: "Own templates: the name of the routine it was saved from" }
        origin_person: { type: string, description: "Own templates: the name of that routine's person" }
        saved_at: { type: string, format: date-time, description: "Own templates: when it was saved" }
        steps:
          type: array
          items:
            type: object
            required: [id, title, emoji, stars, repeat, weekdays]
            properties:
              id: { type: string }
              title: { type: string }
              emoji: { type: string }
              stars: { type: integer, minimum: 0, maximum: 100 }
              repeat: { $ref: "#/components/schemas/TemplateRepeat" }
              weekdays: { type: array, items: { $ref: "#/components/schemas/TaskWeekday" } }
    Routine:
      type: object
      required: [id, person_id, name, part_of_day, task_ids]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        name: { type: string }
        part_of_day: { $ref: "#/components/schemas/RoutinePart" }
        task_ids:
          type: array
          items: { type: string, format: uuid }
          description: The routine's tasks in their order
    NewTask:
      type: object
      required: [person_id, title, repeat]
      properties:
        person_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120, example: Brush teeth }
        emoji: { type: string, maxLength: 16, example: "🪥" }
        notes: { type: string, maxLength: 2000, description: "Optional free text. CalDAV clients show it as the task's description and may change it" }
        repeat: { $ref: "#/components/schemas/TaskRepeat" }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/TaskWeekday" }
          description: Required (at least one) for `weekly`, else must be empty
        date: { type: string, format: date, description: "The day of a `once` task (required); the first day of a repeating one (default today)" }
        part_of_day: { $ref: "#/components/schemas/TaskPartOfDay" }
        stars: { type: integer, minimum: 0, maximum: 100, description: "Stars credited when ticked off (0 allowed). Default: 1 for a child, 0 for an adult" }
        routine_id: { type: string, format: uuid, description: "Create the task as the last step of this routine (of the same person). It takes the routine's part of the day and `part_of_day` is ignored" }
    Task:
      type: object
      required: [id, person_id, title, emoji, notes, repeat, weekdays, date, part_of_day, stars, routine_id, position, due, done, subtasks]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        title: { type: string }
        emoji: { type: string }
        notes: { type: string, description: "Free text; empty if none" }
        repeat: { $ref: "#/components/schemas/TaskRepeat" }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/TaskWeekday" }
        date: { type: string, format: date }
        part_of_day: { $ref: "#/components/schemas/TaskPartOfDay" }
        stars: { type: integer, description: "Stars credited when ticked off, deducted when unticked" }
        routine_id: { type: string, description: "The routine the task is a step of; empty for a single task" }
        position: { type: integer, description: "Place in the routine, from 1; 0 for a single task" }
        due: { type: boolean, description: "Due on the requested day" }
        done: { type: boolean, description: "Ticked off on the requested day. A task with subtasks is done when all of them are" }
        subtasks:
          type: array
          description: The items the task is split into, in their order (at most 10); empty for a task without
          items: { $ref: "#/components/schemas/Subtask" }
    Subtask:
      type: object
      required: [id, title, emoji, position, done]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        emoji: { type: string }
        position: { type: integer, description: "Place in the task, from 1" }
        done: { type: boolean, description: "Ticked off on the requested day (each occurrence of the task starts open)" }
    NewSubtask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, example: "Pencil case" }
        emoji: { type: string, maxLength: 16, example: "✏️" }
    NewStarBooking:
      type: object
      required: [delta, note]
      properties:
        delta: { type: integer, minimum: -1000, maximum: 1000, description: "Stars to add; negative to deduct; not 0", example: -5 }
        note: { type: string, minLength: 1, maxLength: 120, example: "redeemed: ice cream" }
    StarEntry:
      type: object
      required: [id, person_id, delta, note, task_id, task_title, day, booked_by, booked_by_removed, created_at]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        delta: { type: integer, description: "Positive credits, negative deducts" }
        note: { type: string, description: "Of a manual booking, else empty" }
        task_id: { type: string, description: "Of the ticked or unticked task; empty for a manual booking or once the task is deleted" }
        task_title: { type: string, description: "Title of the task at booking time" }
        day: { type: string, description: "The ticked day (YYYY-MM-DD); empty for a manual booking" }
        booked_by: { type: string, description: "Name of the person who booked; empty when a display did. Once that person is removed, their last name" }
        booked_by_removed: { type: boolean, description: "True when the person who booked has been removed; clients show the name as removed" }
        created_at: { type: string, format: date-time }
    StarAccount:
      type: object
      required: [person_id, balance, shown, entries]
      properties:
        person_id: { type: string, format: uuid }
        balance: { type: integer }
        shown: { type: boolean, description: "Whether displays show stars for this person: they have a task worth stars or a booking" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/StarEntry" }
    ListColor:
      type: string
      description: The person colour slot 1 to 6 of DESIGN.md, by name
      enum: [terracotta, blue, green, ochre, plum, teal]
    ListSymbol:
      type: string
      description: The black-and-white symbol, in the order of the person colour slots
      enum: [circle-filled, circle-empty, square-filled, square-empty, triangle-filled, diamond-filled]
    ListSort:
      type: string
      enum: [manual, alphabetical]
    NewList:
      type: object
      required: [name, color, symbol]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: "#/components/schemas/ListColor" }
        symbol: { $ref: "#/components/schemas/ListSymbol" }
        sort: { allOf: [{ $ref: "#/components/schemas/ListSort" }], description: "Default manual" }
    ListChange:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: "#/components/schemas/ListColor" }
        symbol: { $ref: "#/components/schemas/ListSymbol" }
        sort: { $ref: "#/components/schemas/ListSort" }
    List:
      type: object
      required: [id, name, color, symbol, sort, open_count, done_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/ListColor" }
        symbol: { $ref: "#/components/schemas/ListSymbol" }
        sort: { $ref: "#/components/schemas/ListSort" }
        open_count: { type: integer, description: "Entries not ticked off" }
        done_count: { type: integer, description: "Entries ticked off" }
    ListEntry:
      type: object
      required: [id, text, done]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        done: { type: boolean }
    ListWithEntries:
      allOf:
        - { $ref: "#/components/schemas/List" }
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: "#/components/schemas/ListEntry" }
    Group:
      type: object
      required: [id, name, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        members: { type: array, items: { type: string, format: uuid } }
    Audience:
      type: object
      required: [people, groups]
      properties:
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    Calendar:
      type: object
      required: [id, name, kind, color, read_only, share_through_box, waste_collection, audience]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [local, ics, caldav, google, meals], description: "meals is the meal plan, generated by the box: read-only, its events change only in the meal plan" }
        color: { type: string }
        read_only: { type: boolean, description: "The box never changes this calendar's events (always true for ICS)" }
        waste_collection: { type: boolean, description: "A read-only calendar marked as the household's waste collection calendar: its events show only in the family view's tomorrow tile (reminder from 18:00) and on the night page, not in the strip, person columns or personal view" }
        share_through_box: { type: boolean, description: "Phones may subscribe to this calendar over CalDAV. Always true for the family calendar; on by default for ICS, off for CalDAV and Google" }
        audience: { $ref: "#/components/schemas/Audience" }
        sync: { $ref: "#/components/schemas/SyncState" }
    ApiToken:
      type: object
      required: [id, name, scopes, person, created_at, last_used_at, mcp]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: iPhone Mama }
        scopes: { type: string, example: calendars }
        person: { type: string, description: "Name of the person the token acts for" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        mcp: { type: boolean, description: "Created for the MCP server: it works there only, not in this API or CalDAV" }
    MCPState:
      type: object
      required: [enabled, address]
      properties:
        enabled: { type: boolean }
        address: { type: string, example: "https://hejmo.local/mcp", description: "Where an AI assistant reaches the MCP server; always https" }
    MCPAreas:
      type: object
      description: What a token may do per area. An area left out counts as none.
      properties:
        events: { $ref: "#/components/schemas/MCPLevel" }
        lists: { $ref: "#/components/schemas/MCPLevel" }
        tasks: { $ref: "#/components/schemas/MCPLevel" }
        meals: { $ref: "#/components/schemas/MCPLevel" }
    MCPLevel:
      type: string
      enum: [none, read, write]
    DisplayType:
      type: string
      enum: [eink_bw, eink_color, screen]
      description: Black-and-white E-Ink, colour E-Ink or normal screen
    DayNote:
      type: object
      required: [day, text]
      properties:
        day: { type: string, format: date }
        text: { type: string }
    Display:
      type: object
      required: [id, name, room, type, paired_at, last_seen_at, show_tomorrow, theme, sunrise_offset, sunset_offset, quiet_mode, kiosk]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hallway }
        room: { type: string, example: Entrance }
        type: { $ref: "#/components/schemas/DisplayType" }
        paired_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        show_tomorrow: { type: boolean, description: "Show the faded tomorrow block from 18:00. Off by default (ADR 0016)" }
        theme: { $ref: "#/components/schemas/DisplayTheme" }
        sunrise_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes added to sunrise before an automatic theme turns light" }
        sunset_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes added to sunset before an automatic theme turns dark" }
        quiet_mode: { $ref: "#/components/schemas/QuietMode" }
        kiosk: { $ref: "#/components/schemas/Kiosk" }
    QuietMode:
      type: object
      description: The daily window, in the household's time zone, in which the display is quiet (ADR 0015). Off by default.
      required: [enabled, from, to]
      properties:
        enabled: { type: boolean }
        from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "22:00" }
        to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "06:00", description: "May be earlier than `from` (the window then spans midnight); never equal to it" }
    Kiosk:
      type: object
      description: The display's kiosk app (ADR 0005). The API key is never returned.
      required: [url, api_key_set]
      properties:
        url: { type: string, example: "http://192.168.1.20:8080", description: "Empty without a kiosk app" }
        api_key_set: { type: boolean }
    DisplayTheme:
      type: string
      enum: [light, dark, auto]
      description: |
        `auto` turns dark at sunset and light at sunrise at the home
        location (computed on the box), each shifted by its offset. New
        displays: E-Ink `light`, normal screen `auto`. Quiet mode takes
        precedence over the theme (ADR 0015).
    UpdateDisplay:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "The new name, trimmed; empty or longer than 80 characters is refused with 422" }
        type: { $ref: "#/components/schemas/DisplayType" }
        show_tomorrow: { type: boolean }
        theme: { $ref: "#/components/schemas/DisplayTheme" }
        sunrise_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes, -180 to 180, else 422" }
        sunset_offset: { type: integer, minimum: -180, maximum: 180, description: "Minutes, -180 to 180, else 422" }
        quiet_mode:
          type: object
          properties:
            enabled: { type: boolean }
            from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "22:00" }
            to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "06:00" }
        kiosk:
          type: object
          properties:
            url: { type: string, description: "http or https address; empty removes the kiosk app and its key" }
            api_key: { type: string, writeOnly: true, description: "Omitted or empty keeps the stored key" }
    PairDisplay:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", example: "042917" }
        name: { type: string, minLength: 1, maxLength: 80 }
        room: { type: string, maxLength: 80 }
        type: { $ref: "#/components/schemas/DisplayType" }
    Phone:
      type: object
      required: [id, name, person_id, person_name, paired_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Mia's phone" }
        person_id: { type: string, format: uuid, description: "The person the phone acts for, with their role" }
        person_name: { type: string, example: Mia }
        paired_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
    PhonePairing:
      type: object
      required: [id, device, verification, expires_at]
      properties:
        id: { type: string, format: uuid }
        device: { type: string, example: Safari on iPhone, description: "What the phone said about itself" }
        verification: { type: string, example: "483 920", description: "Six-digit number the waiting phone shows. Confirm only if it matches the number on the phone in your hand." }
        expires_at: { type: string, format: date-time }
    NewPhonePairing:
      type: object
      required: [id, url, expires_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: "The address to show as a QR code. Only in this answer." }
        expires_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [state, created_at, expires_at, created_by, accepted_at, withdrawn_at]
      properties:
        state: { type: string, enum: [open, used, expired, withdrawn] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Seven days after it was created }
        created_by: { type: string, format: uuid, nullable: true, description: The parent who created it; null if that person was removed }
        accepted_at: { type: string, format: date-time, nullable: true }
        withdrawn_at: { type: string, format: date-time, nullable: true, description: Also set when a newer link replaced it }
        url: { type: string, format: uri, description: "The address to show as a QR code or send. Only in the answer of createInvitation." }
    ConfirmPhone:
      type: object
      required: [person_id, name]
      properties:
        person_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
    SyncState:
      type: object
      description: Only on synced calendars. Displays read `state` to show the sync notice.
      required: [state, interval_minutes, last_attempt_at, last_success_at, last_error]
      properties:
        event_count: { type: integer, description: "Events the calendar holds after the last successful run; a series counts once" }
        last_run:
          type: object
          description: What the last successful run did to the events. A failed run leaves it as it was.
          required: [new, changed, removed]
          properties:
            new: { type: integer }
            changed: { type: integer }
            removed: { type: integer }
        state: { type: string, enum: [ok, stale], description: "stale = 24 hours without a successful sync; one success clears it" }
        interval_minutes: { type: integer, example: 60 }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: "Empty after a successful sync. Translated to the language of the request (Accept-Language, default German)" }
    NewCalendar:
      type: object
      required: [kind, name, url]
      properties:
        kind: { type: string, enum: [ics], description: "Only ICS subscriptions so far" }
        name: { type: string }
        url: { type: string, example: "webcal://example.org/school.ics" }
        color: { type: string, example: "#B4583A", description: "#RRGGBB, else 422. Left out, the box picks one from a fixed set" }
        audience: { $ref: "#/components/schemas/Audience" }
        sync_interval_minutes: { type: integer, default: 60, description: "Between 5 and 1440 minutes, else 422" }
    CalendarConnection:
      type: object
      required: [id, kind, url, username, single_calendar]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [caldav] }
        url: { type: string, example: "https://caldav.icloud.com" }
        username: { type: string }
        single_calendar: { type: boolean }
        calendars:
          type: array
          description: The server's event calendars. Only on connect and on discovery.
          items:
            type: object
            required: [url, name, added]
            properties:
              url: { type: string }
              name: { type: string }
              added: { type: boolean, description: "Already synced through this connection" }
              calendar_id: { type: string, format: uuid, description: "The synced calendar, when `added`: change it with PATCH /calendars/{id}, switch it off with DELETE /calendars/{id}" }
    EventCount:
      type: object
      required: [url, state, count, text]
      properties:
        url: { type: string, description: "The calendar's address, as in the discovery" }
        state: { type: string, enum: [count, empty, unknown], description: "empty = no events in the last 12 months or later; unknown = the server did not answer in time or cannot count" }
        count: { type: integer, description: "0 unless state is count" }
        text: { type: string, description: "The count as text, translated to the language of the request (Accept-Language, default German)" }
    NewCalendarConnection:
      type: object
      required: [provider, username, password]
      properties:
        provider: { type: string, enum: [icloud, caldav] }
        url: { type: string, description: "Server address (required for caldav, ignored for icloud), or the calendar address with single_calendar" }
        username: { type: string, description: "Apple ID for iCloud" }
        password: { type: string, description: "App-specific password for iCloud. Stored encrypted, never returned" }
        single_calendar: { type: boolean, default: false }
    NewConnectionCalendar:
      type: object
      required: [url, name]
      properties:
        url: { type: string, description: "A calendar address from the discovery" }
        name: { type: string }
        color: { type: string, example: "#B4583A", description: "#RRGGBB, else 422. Left out, the box picks one from a fixed set" }
        audience: { $ref: "#/components/schemas/Audience" }
        sync_interval_minutes: { type: integer, default: 5, description: "Between 5 and 1440 minutes, else 422" }
    SyncLogEntry:
      type: object
      required: [id, calendar_id, calendar_name, at, kind, message]
      properties:
        id: { type: string, format: uuid }
        calendar_id: { type: string, format: uuid }
        calendar_name: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [failure, conflict, note] }
        message: { type: string, description: "Translated to the language of the request (Accept-Language, default German)" }
    Place:
      type: object
      required: [id, name, region, latitude, longitude, region_code]
      properties:
        id: { type: integer, description: "The GeoNames id; give it as home_place_id", example: 2855334 }
        name: { type: string, example: Pasing }
        region: { type: string, description: "What sets the place apart, in the language asked for: district of its town (when it is one), the area when two results would read the same, the state or canton and the country", example: "district of München, Bayern, Germany" }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        region_code: { type: string, description: "ISO 3166-2 code of the state or canton, one of the regions of the setup form", example: DE-BY }
    Settings:
      type: object
      required: [date_format, time_format, temperature_unit, auto_update, home_name, home_place_id, latitude, longitude, first_steps_hidden, first_steps_skipped, meal_cutoffs]
      properties:
        date_format: { type: string, enum: [dmy, mdy], description: "Day first DD.MM.YYYY (default) or month first MM/DD/YYYY. Only how the web interface writes dates in numbers; this API, CalDAV and iCalendar stay ISO 8601" }
        home_name: { type: string, description: "The name of the home place; the name of the place picked from the list" }
        home_place_id: { type: integer, nullable: true, description: "The id of the place of the list on the box (GET /places) the home was picked from; null when the location was set by coordinates only" }
        latitude: { type: number, nullable: true, format: double, description: "Latitude of the home in degrees (north positive); null until the home has a location. Sunrise and sunset, themes and weather use it" }
        longitude: { type: number, nullable: true, format: double, description: "Longitude of the home in degrees (east positive); null until the home has a location" }
        time_format: { type: string, enum: ["24h", "12h"], description: "24-hour (default) or 12-hour clock" }
        temperature_unit: { type: string, enum: [c, f], description: "Degrees Celsius (default) or Fahrenheit" }
        first_steps_hidden: { type: boolean, description: "Whether the first steps card on the start page is hidden (default false). A parent closes the card when all six steps are done or skipped, or hides it earlier." }
        first_steps_skipped:
          type: array
          description: "The steps of the first steps card a parent skipped, in the order of the card (default empty)"
          items: { type: string, enum: [family, parents, calendars, tasks, meals, display] }
        auto_update: { type: string, enum: [on, off, notify], description: "Auto-update (ADR 0018; has no effect unless GET /update says managed): on (default) installs new published versions at 03:30, off never checks, notify only tells parents that an update is available" }
        meal_cutoffs: { $ref: "#/components/schemas/MealCutoffs" }
    MealCutoffs:
      type: object
      description: "Per mealtime, the time of day (hh:mm, 24-hour) from which it is no longer shown on displays (ADR 0016). Empty means no cut-off: shown for the rest of the day. Defaults: breakfast 10:00, lunch 13:30, snack 16:30, dinner none."
      required: [breakfast, lunch, snack, dinner]
      properties:
        breakfast: { $ref: "#/components/schemas/CutoffTime" }
        lunch: { $ref: "#/components/schemas/CutoffTime" }
        snack: { $ref: "#/components/schemas/CutoffTime" }
        dinner: { $ref: "#/components/schemas/CutoffTime" }
    CutoffTime: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$', example: "13:30" }
    SettingsUpdate:
      type: object
      properties:
        date_format: { type: string, description: "dmy or mdy; anything else is refused with 400" }
        home_place_id: { type: integer, description: "A place of the list on the box (GET /places): name and coordinates come from it; not together with home_name, latitude or longitude" }
        home_name: { type: string, description: "New home place name; needs latitude and longitude" }
        latitude: { type: number, format: double, description: "-90 to 90; with longitude" }
        longitude: { type: number, format: double, description: "-180 to 180; with latitude. latitude 0 and longitude 0 together mean no location and are refused" }
        time_format: { type: string, description: "24h or 12h" }
        temperature_unit: { type: string, description: "c or f" }
        auto_update: { type: string, description: "on, off or notify" }
        first_steps_hidden: { type: boolean, description: "Hide or show the first steps card on the start page" }
        first_steps_skipped:
          type: array
          description: "Replaces the list of skipped steps; an unknown step refuses the whole request with 422. Steps: family, parents, calendars, tasks, meals, display."
          items: { type: string }
        meal_cutoffs:
          type: object
          description: "Only the mealtimes given change; a time outside hh:mm refuses the whole request with 422"
          properties:
            breakfast: { type: string }
            lunch: { type: string }
            snack: { type: string }
            dinner: { type: string }
    UpdateStatus:
      type: object
      required: [mode, managed, state, notice]
      properties:
        mode: { type: string, enum: [on, off, notify] }
        managed: { type: boolean, description: "Whether the host updater of the install script manages this box. False on a plain Docker Compose install: then mode (also in /settings) is stored but nothing acts on it." }
        state:
          type: string
          enum: [idle, available, updated, rolled_back, rejected, failed]
          description: "idle (nothing newer or no report yet), available (notify only), updated, rolled_back (the new version failed; the previous one runs again with its data), rejected (signature not valid, not installed), failed (nothing changed, except with reason rollback_failed: then the image and database did change)"
        version: { type: string, description: "The version that runs now" }
        target: { type: string, description: "The version offered or attempted" }
        reason: { type: string, enum: [start_failed, health_check_failed, signature_invalid, backup_failed, pull_failed, rollback_failed, box_not_running] }
        time: { type: string, format: date-time, description: "When the script recorded this event" }
        notice: { type: boolean, description: "Whether the web interface currently shows a notice to parents" }
        release_notes_url: { type: string, format: uri, description: "Release notes of the version installed or offered" }
    HTTPSStatus:
      type: object
      required: [mode, warning]
      properties:
        mode: { type: string, enum: [own-ca, public] }
        name: { type: string, description: "Public DNS name of the box (mode public)" }
        issuer: { type: string, enum: [letsencrypt, actalis], description: "Chosen certificate authority (mode public)" }
        expires_at: { type: string, format: date-time }
        warning: { type: boolean, description: "True if the public certificate could not be resumed, loaded, obtained or renewed, or expires within 7 days" }
        renewal_error: { type: string, description: "Why the last resume, load, order or renewal failed" }
    Mealtime: { type: string, enum: [breakfast, lunch, snack, dinner] }
    Meal:
      type: object
      description: One entry of the shared meal plan, free text for a day and a mealtime.
      required: [date, mealtime, text, source]
      properties:
        date: { type: string, format: date }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        text: { type: string, maxLength: 200 }
        source:
          type: string
          enum: [manual, template, adjusted]
          description: |
            Where the meal comes from: typed by hand, filled in by a meal plan
            template, or a template's meal that was changed for this week.
        template_id: { type: string, format: uuid, description: "The template that fills this meal (source template or adjusted)" }
        template_dish: { type: string, description: "What the template fills in (source template or adjusted)" }
    MealTemplateEntry:
      type: object
      required: [weekday, mealtime, text]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "1 Monday to 7 Sunday" }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        text: { type: string, maxLength: 200 }
    NewMealTemplate:
      type: object
      required: [name, mealtimes, interval, start_week, entries]
      properties:
        name: { type: string, maxLength: 60 }
        mealtimes: { type: string, enum: [all, one], description: "Fills all mealtimes of the day, or one" }
        mealtime: { $ref: "#/components/schemas/Mealtime" }
        interval: { type: integer, minimum: 1, maximum: 52, description: "Every n weeks, counted from the start week" }
        start_week: { type: string, format: date, description: "The Monday of the start week" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MealTemplateEntry" }
    MealTemplate:
      allOf:
        - $ref: "#/components/schemas/NewMealTemplate"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    MealTemplateClash:
      type: object
      required: [error, clashes]
      properties:
        error: { type: string }
        clashes:
          type: array
          items:
            type: object
            required: [template, mealtime, weekdays, first_week]
            properties:
              template:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              mealtime: { $ref: "#/components/schemas/Mealtime" }
              weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
              first_week: { type: string, format: date, description: "Monday of the first week both fill the meal, from today on" }
    Event:
      type: object
      description: An event or series master. Times are RFC 3339 in the household's time zone; all-day events use dates with an exclusive end.
      required: [id, calendar_id, title, description, location, all_day, start, end, rrule, people, groups]
      properties:
        id: { type: string, format: uuid }
        calendar_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        all_day: { type: boolean }
        start: { type: string, example: "2026-11-02T16:00:00+01:00" }
        end: { type: string, example: "2026-11-02T17:00:00+01:00" }
        rrule: { type: string, description: "RFC 5545 RRULE value, empty for single events", example: "FREQ=WEEKLY;BYDAY=MO" }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    NewEvent:
      type: object
      required: [title, start, end]
      properties:
        calendar_id: { type: string, format: uuid, description: "Defaults to the family calendar" }
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        all_day: { type: boolean }
        start: { type: string }
        end: { type: string }
        timezone: { type: string, example: "Europe/Berlin", description: "IANA time zone the event keeps (its wall-clock time stays the same across daylight-saving changes). Defaults to the household's. It cannot be changed afterwards." }
        rrule: { type: string }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    EventPatch:
      type: object
      description: Only the fields given change. start/end are the new times of the edited occurrence; with scope following or all, the shift applies to the series. Sending timezone on PATCH answers 422 (the timezone of an event cannot be changed).
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        start: { type: string }
        end: { type: string }
        rrule: { type: string }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    Occurrence:
      type: object
      required: [event_id, series_id, recurrence_id, calendar_id, title, description, location, all_day, start, end, people, groups]
      properties:
        event_id: { type: string, format: uuid }
        series_id: { type: string, description: "Series master id, empty for single events" }
        recurrence_id: { type: string, description: "Original start within the series; pass as ?occurrence= to edit" }
        calendar_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        all_day: { type: boolean }
        start: { type: string }
        end: { type: string }
        people: { type: array, items: { type: string, format: uuid } }
        groups: { type: array, items: { type: string, format: uuid } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        field: { type: string, description: "The refused field, when the error is about one" }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role or token scope does not allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Request is well-formed but not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasskeyName:
      description: |
        The request did not reach the box under its box name (an IP address or
        another name). Passkeys are created and used only under the box name.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TemplateConflict:
      description: |
        An own template already has that name (`field: name`), or the template
        ships with Hejmo and cannot be changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoutineConflict:
      description: |
        The request clashes with what is stored: the person has a routine for
        that part of the day already (`existing_routine_id`), or the task is in
        a routine already. Nothing was saved.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              existing_routine_id: { type: string, format: uuid }
    MealTemplateClash:
      description: The template fills a meal another template fills too; nothing was saved
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MealTemplateClash" }
    TooManyRequests:
      description: Too many wrong attempts, try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
