# Preview builds from main (ADR 0018): for the founding family before 0.1.
# Tagged preview-<short sha> and preview. Never a version tag, never a GitHub
# release, never signed by the release workflow, so the box's auto-update
# (published versions only) cannot mistake one for a release.
name: Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hejmo-home/hejmo

jobs:
  image:
    name: Preview image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=preview
            type=raw,value=preview-{{sha}}
          labels: |
            org.opencontainers.image.title=Hejmo preview build
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
