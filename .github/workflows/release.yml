# Release pipeline (ADR 0018). A version tag builds, pushes, signs and announces.
#
#   v0.1.0        -> published version: tags 0.1.0 and latest, normal release
#   v0.1.0-rc.1   -> suffix = pre-release: tag 0.1.0-rc.1 only, marked pre-release
#
# The box's auto-update installs only tags without a suffix, and only images
# whose keyless signature names this workflow (see the cosign verify step).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hejmo-home/hejmo

jobs:
  image:
    name: Build, push and sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with the GitHub OIDC token
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest only for tags without a pre-release suffix.
          flavor: latest=auto
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Hejmo
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # keep the index free of extra attestation manifests
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign the image (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Check both architectures are in the image
        run: |
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" > index.txt
          cat index.txt
          grep -q 'linux/amd64' index.txt
          grep -q 'linux/arm64' index.txt
      - name: Verify the signature as the box's updater will
        run: |
          cosign verify "$IMAGE@${{ steps.build.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notes:
    name: GitHub release with notes
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release (notes list the merged PRs since the previous tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "$TAG" --generate-notes --verify-tag $flags
