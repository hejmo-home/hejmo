* { box-sizing: border-box; }
body { margin: 0; padding: var(--margin); background: var(--background); color: var(--text); font-size: var(--fs-body); font-weight: var(--fw-body); }
h1 { font-size: var(--fs-date); font-weight: var(--fw-date); margin: 0 0 8px; }
.lead { color: var(--text-secondary); margin: 0 0 20px; }
.steps { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: var(--gap); max-width: 560px; }
.steps li { background: var(--surface); border-radius: var(--radius-tile); padding: 16px; }
.steps strong { display: block; font-size: var(--fs-person-name); }
.steps span { color: var(--text-secondary); font-size: var(--fs-label); }
.button { cursor: pointer; display: inline-block; min-height: var(--touch-target); padding: 10px 22px; border-radius: var(--radius-chip); background: var(--accent); color: var(--accent-text); font-weight: 700; text-decoration: none; border: 0; font: inherit; font-weight: 700; }
.steps fieldset { border: 0; margin: 0; background: var(--surface); border-radius: var(--radius-tile); padding: 16px; display: grid; gap: 10px; }
.steps legend { font-size: var(--fs-person-name); font-weight: 700; padding: 0; float: left; }
.steps form { display: grid; gap: var(--gap); }
.hint { color: var(--text-secondary); font-size: var(--fs-label); overflow-wrap: anywhere; }
[hidden] { display: none !important; }
label { display: grid; gap: 4px; font-size: var(--fs-label); color: var(--text-secondary); }
input, select { font: inherit; color: var(--text); min-height: var(--touch-target); padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-field); background: var(--surface); }
.error { background: var(--error-bg); color: var(--error-text); border-radius: var(--radius-card); padding: 10px 12px; max-width: 560px; }
.secret { font-size: var(--fs-person-name); letter-spacing: 0.08em; word-break: break-all; }
.notice { background: var(--notice-bg); color: var(--notice-text); border-radius: var(--radius-card); padding: 10px 12px; max-width: 560px; }
.cards { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: var(--gap); max-width: 560px; }
.cards li { background: var(--surface); border-radius: var(--radius-tile); padding: 16px; display: grid; gap: 6px; }
.cards .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.swatch { width: calc(var(--marker-size) * 2); min-height: 0; height: var(--marker-size); padding: 0; border: 0; vertical-align: middle; background: none; }
.button.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
.check { display: flex; align-items: center; gap: 8px; color: var(--text); }
.check input { min-height: 0; width: 20px; height: 20px; }
.log { border-collapse: collapse; max-width: 100%; font-size: var(--fs-label); }
.log th, .log td { text-align: left; padding: 6px 12px 6px 0; vertical-align: top; }
a { color: var(--accent); }

/* Person slots: a person gets data-person="1".."8" (colour, tint, text on
   tint). In bw every slot is black on a grey tint and differs by marker shape. */
[data-person="1"] { --pc: var(--person-1); --pc-tint: var(--person-1-tint); --pc-text: var(--person-1-text); }
[data-person="2"] { --pc: var(--person-2); --pc-tint: var(--person-2-tint); --pc-text: var(--person-2-text); }
[data-person="3"] { --pc: var(--person-3); --pc-tint: var(--person-3-tint); --pc-text: var(--person-3-text); }
[data-person="4"] { --pc: var(--person-4); --pc-tint: var(--person-4-tint); --pc-text: var(--person-4-text); }
[data-person="5"] { --pc: var(--person-5); --pc-tint: var(--person-5-tint); --pc-text: var(--person-5-text); }
[data-person="6"] { --pc: var(--person-6); --pc-tint: var(--person-6-tint); --pc-text: var(--person-6-text); }
[data-person="7"] { --pc: var(--person-7); --pc-tint: var(--person-7-tint); --pc-text: var(--person-7-text); }
[data-person="8"] { --pc: var(--person-8); --pc-tint: var(--person-8-tint); --pc-text: var(--person-8-text); }

/* Marker: circle in the person colour; in bw a shape (16px in the column
   header). */
.marker { display: inline-block; width: var(--marker-size); height: var(--marker-size); border-radius: 50%; background: var(--pc); vertical-align: middle; flex: none; }
[data-theme="bw"] .marker { width: var(--marker-size-bw-column); height: var(--marker-size-bw-column); background: var(--text); border: 2px solid var(--text); border-radius: 0; }
[data-theme="bw"] .marker[data-shape="circle-filled"] { border-radius: 50%; }
[data-theme="bw"] .marker[data-shape="circle-empty"] { border-radius: 50%; background: transparent; }
[data-theme="bw"] .marker[data-shape="square-filled"] { border-radius: 0; }
[data-theme="bw"] .marker[data-shape="square-empty"] { border-radius: 0; background: transparent; }
[data-theme="bw"] .marker[data-shape="triangle-filled"] { border: 0; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
[data-theme="bw"] .marker[data-shape="diamond-filled"] { border: 0; border-radius: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
[data-theme="bw"] .marker[data-shape="cross-filled"] { border: 0; border-radius: 0; clip-path: polygon(34% 0, 66% 0, 66% 34%, 100% 34%, 100% 66%, 66% 66%, 66% 100%, 34% 100%, 34% 66%, 0 66%, 0 34%, 34% 34%); }
[data-theme="bw"] .marker[data-shape="star-filled"] { border: 0; border-radius: 0; clip-path: polygon(50% 0, 62% 36%, 100% 36%, 69% 58%, 81% 96%, 50% 73%, 19% 96%, 31% 58%, 0 36%, 38% 36%); }

/* Who an event is for is said in words (Q62): a line under the title that
   wraps, so the card grows; names are never cut. Markers stay in the column
   headers and the person chips. */
.event .who { font-size: var(--fs-meta); font-weight: var(--fw-meta); overflow-wrap: break-word; hyphens: manual; }

/* Family view building blocks (screens use them from ticket 5.3 on). */
.tile, .column, .chip { background: var(--surface); }
.tile, .column { border-radius: var(--radius-tile); }
.column { padding: var(--pad-column); display: grid; gap: var(--gap-cards); align-content: start; }
.chip { border-radius: var(--radius-chip); padding: 8px 16px; font-size: var(--fs-key-figure); font-weight: var(--fw-key-figure); }
.event { background: var(--pc-tint); color: var(--pc-text); border-radius: var(--radius-card); padding: var(--pad-card); display: grid; gap: 2px; }
[data-theme="bw"] .event { background: var(--event-card); color: var(--text); }
.event .title { font-size: var(--fs-event-title); font-weight: var(--fw-event-title); }
.event .meta { font-size: var(--fs-meta); font-weight: var(--fw-meta); }
.event.journey { background: none; color: var(--text); border: var(--journey-border) dashed var(--pc); }
.progress { height: var(--progress-height); border-radius: var(--radius-progress); background: var(--pc-tint); overflow: hidden; }
.progress > span { display: block; height: 100%; width: calc(var(--pct, 0) * 1%); background: var(--pc); }
[data-theme="bw"] .progress { background: var(--progress-track); }
[data-theme="bw"] .progress > span { background: var(--progress-fill); }
.icon { stroke: var(--accent); stroke-width: var(--icon-stroke); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.display { text-align: center; max-width: 560px; margin: 0 auto; }
.display .qr { width: min(70vw, 360px); margin: 0 auto 16px; color: var(--text); background: var(--surface); border-radius: var(--radius-tile); padding: 8px; }
.display .qr svg { display: block; width: 100%; height: auto; }
.pairing-code { font-size: 56px; font-weight: 700; letter-spacing: 0.18em; margin: 0; font-variant-numeric: tabular-nums; }

/* Frame (ticket 5.11): brand bar, navigation and content. Narrow screens
   stack them; wide screens put the navigation beside the content. */
.skip { position: absolute; left: -9999px; }
.skip:focus { position: static; display: inline-block; padding: 10px 12px; }
.frame { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-section); align-content: start; }
.frame-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
.brand { display: inline-flex; align-items: center; min-height: var(--touch-target); font-size: var(--fs-key-figure); font-weight: var(--fw-key-figure); color: var(--text); text-decoration: none; }
.frame-bar .button { min-height: var(--touch-target); }
.frame-bar form { margin: 0; }
.frame-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: var(--gap-cards); }
.frame-nav li { flex: none; }
.frame-nav a { display: flex; align-items: center; min-height: var(--touch-target); padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); text-decoration: none; }
.frame-nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
[data-theme="bw"] .frame-nav a { border-width: 2px; }
.back { display: inline-flex; align-items: center; min-height: var(--touch-target); color: var(--accent); font-weight: 600; }
.hub-row { display: grid; gap: 2px; min-height: var(--touch-target); text-decoration: none; color: var(--text); }
.hub-row strong { font-size: var(--fs-event-title); }
[data-theme="bw"] .hub-row { text-decoration: underline; }
.frame main { min-width: 0; }
@media (max-width: 599px) {
  body.web { padding: var(--gap); }
}
@media (min-width: 900px) {
  .frame.has-nav { grid-template-columns: max-content minmax(0, 1fr); align-items: start; }
  .frame.has-nav .frame-bar { grid-column: 1 / -1; }
  .frame-nav ul { flex-direction: column; overflow-x: visible; }
}

/* Portrait shows at most four person columns (ticket 5.7, ADR 0016). The
   display switches by itself when it is rotated. */
@media (orientation: portrait) {
  :root { --cols-max: 4; }
}

/* Family view (ticket 5.3, 5.7; ADR 0015, 0016). The page fills the display;
   the columns share the width up to --cols-max people (6 landscape, 4
   portrait), none narrower than --col-min; beyond that they scroll sideways. */
.family-page { height: calc(100vh - 2 * var(--margin)); height: calc(100dvh - 2 * var(--margin)); min-height: 0; }
.family-page > [data-view] { height: 100%; } /* the box swaps this one's content on a change (ticket 5.5) */
body:has(.family-page) { overflow: hidden; }
.fv { height: 100%; display: flex; flex-direction: column; gap: var(--gap-section); min-height: 0; }
.fv-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--gap); flex: none; }
.fv-header .lab { font-size: var(--fs-label); color: var(--text-secondary); }
.fv-header .date { font-size: var(--fs-date); font-weight: var(--fw-date); line-height: 1.1; }
.fv .chips { display: flex; gap: var(--gap); }
.fv .chip { font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.fv .sync-notice { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: var(--fs-label); font-weight: 700; }
.fv .sync-notice .icon { flex: none; }
.strip-wrap { flex: none; display: grid; gap: var(--gap-cards); }
.strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--gap-cards); align-items: center; }
.strip .lab { font-size: var(--fs-label); color: var(--text-secondary); font-weight: 700; }
.strip-item { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--radius-card); padding: var(--pad-card); font-size: var(--fs-event-title); }
.strip-item .title { font-weight: var(--fw-event-title); }
.strip-item .who { font-size: var(--fs-meta); color: var(--text-secondary); overflow-wrap: break-word; hyphens: manual; }
.who .nm { display: inline-block; max-width: 100%; }
.strip-item .meta { font-size: var(--fs-meta); color: var(--text-secondary); }
.strip-item[data-kind="holiday"] { background: var(--notice-bg); color: var(--notice-text); }
.strip-item[data-kind="holiday"] .meta { color: var(--notice-text); }
.strip-item.before { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.strip-item.after { border-top-right-radius: 0; border-bottom-right-radius: 0; }

.fv-grid { --visible: min(var(--cols), var(--cols-max)); flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: max(var(--col-min), calc((100% - (var(--visible) - 1) * var(--gap)) / var(--visible))); grid-auto-rows: minmax(0, 1fr); gap: var(--gap); overflow-x: auto; }
.fv .column { display: flex; flex-direction: column; gap: 0; min-height: 0; overflow: hidden; }
.fv .person-link { display: flex; align-items: center; gap: 8px; min-height: var(--touch-target); min-width: 0; overflow-wrap: anywhere; color: inherit; text-decoration: none; } /* a long single-word name wraps at the column edge instead of being clipped */
.fv .column h2 { flex: none; min-width: 0; margin: 0 0 var(--gap-cards); font-size: var(--fs-person-name); font-weight: var(--fw-person-name); display: flex; align-items: center; gap: 8px; }
.fv .events { flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: var(--gap-cards); align-content: start; }
.fv .events .tomorrow { display: grid; gap: var(--gap-cards); padding-top: var(--gap-cards); border-top: 1px solid var(--border); opacity: 0.6; }
.strip.tomorrow { opacity: 0.6; } /* ADR 0016: tomorrow is faded so today's events stand out */
.fv .tomorrow .lab { font-size: var(--fs-label); color: var(--text-secondary); font-weight: 700; }
.fv .event .meta { display: block; }
.fv-footer { flex: none; display: flex; flex-wrap: wrap; gap: var(--gap); }
.fv-footer .tile { flex: 1 1 200px; min-width: 0; padding: var(--pad-column); }
.fv-footer .lab { font-size: var(--fs-label); color: var(--text-secondary); }
.fv-footer .ln { font-size: var(--fs-body); font-weight: 600; }
.fv-footer .tile.alert { background: var(--notice-bg); color: var(--notice-text); border: 2px solid var(--accent); padding: calc(var(--pad-column) - 2px); }
.fv-footer .tile.alert .lab { color: var(--notice-text); }
.qr { width: min(60vw, 240px); margin: 0 0 12px; color: var(--text); }
.qr svg { display: block; width: 100%; height: auto; }

/* Quiet mode (ticket 5.9; ADR 0015). A normal screen goes black; an E-Ink
   display shows a calm night page about the coming morning. Quiet mode takes
   precedence over the theme: it uses the display's page background only. */
.quiet.black { position: fixed; inset: 0; background: black; }
.quiet.night { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: var(--gap-section); max-width: 32em; margin: 0 auto; }
.quiet.night .lab { font-size: var(--fs-label); color: var(--text-secondary); }
.quiet.night .date { font-size: var(--fs-date); font-weight: var(--fw-date); line-height: 1.1; }
.quiet.night .night-item .title { font-size: var(--fs-event-title); font-weight: var(--fw-event-title); }
.quiet.night .night-item .meta { font-size: var(--fs-meta); color: var(--text-secondary); }

/* Shared form patterns (ticket 5.16; ADR 0017). Switch, person chips,
   segmented control, choice cards, weekday chips, "More options", detail-page
   danger zone, empty state, success line and field errors. Colours come from
   the tokens only; selection never relies on colour alone (border, tick,
   weight; in bw the person marker is a shape). */
.msg { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--radius-card); padding: 10px 12px; max-width: 560px; margin: 0 0 var(--gap); }
.msg .icon { flex: none; margin-top: 2px; }
.msg.ok { background: var(--surface); border: 1.5px solid var(--accent); color: var(--text); }
[data-theme="bw"] .msg.ok { border-width: 2px; }
.f { display: grid; gap: 6px; }
.f input, .f select { width: 100%; }
.f.invalid input { border: 2px solid var(--error-text); }
.ferr { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 6px 10px; border-radius: var(--radius-field); background: var(--error-bg); color: var(--error-text); font-size: var(--fs-label); }
.ferr .icon { flex: none; stroke: var(--error-text); }
.button.danger { background: var(--error-text); color: var(--surface); }
.cards a, .steps a { color: var(--accent); font-weight: 600; }

/* Switch: "is it on?", with its state in words under the name. */
.card-row { display: flex; align-items: center; gap: 12px; }
.card-row .t { display: grid; gap: 2px; min-width: 0; }
.card-row .t b { font-size: var(--fs-event-title); font-weight: var(--fw-event-title); }
.card-row .state { font-size: var(--fs-meta); color: var(--text-secondary); }
.state .on-text, .state .off-text { display: none; }
.state.is-on .on-text, .state:not(.is-on) .off-text { display: inline; }
@supports selector(:has(a)) {
  .state.is-on .off-text { display: none; }
  .state.is-on .on-text { display: none; }
  .card-row:has(.switch input:checked) .state .on-text { display: inline; }
  .card-row:has(.switch input:not(:checked)) .state .off-text { display: inline; }
}
.switch { display: inline-flex; align-items: center; min-height: var(--touch-target); margin-left: auto; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; margin: 0; width: 52px; height: 32px; min-height: 0; padding: 0; border-radius: 16px; border: 2px solid var(--text-secondary); background: var(--surface); position: relative; flex: none; cursor: pointer; }
.switch input::before { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-secondary); }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::before { left: 24px; background: var(--accent-text); }
.switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[data-theme="bw"] .switch input { border-color: var(--text); }
[data-theme="bw"] .switch input::before { background: var(--text); }
[data-theme="bw"] .switch input:checked { background: var(--text); }
[data-theme="bw"] .switch input:checked::before { background: var(--surface); }

/* Choose calendars: the event count of each calendar (ADR 0017). It is filled
   in after the page has loaded; "empty" is the one that matters (a calendar
   with nothing in the window), so it is a notice, and in black and white bold. */
.count { font-size: var(--fs-meta); }
.count[data-state="loading"] { font-style: italic; }
.count[data-state="unknown"] { font-style: italic; }
.count[data-state="empty"] { background: var(--notice-bg); color: var(--notice-text); border-radius: var(--radius-field); padding: 2px 8px; justify-self: start; font-weight: 600; }
[data-theme="bw"] .count[data-state="empty"] { background: none; color: var(--text); border: 2px solid var(--text); }
.calchoice .card-row { margin-bottom: 4px; }
.cards [data-events], .cards [data-last-run] { font-variant-numeric: tabular-nums; }

/* Person chips: who is it for. Selected = tint + 2px border in the person
   colour + tick + bold. "Whole family" is neutral and selected by default. */
fieldset.chips { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.chips legend, fieldset.seg legend, fieldset.days legend, fieldset.choice legend { font-size: var(--fs-label); font-weight: 400; color: var(--text-secondary); padding: 0; margin: 0 0 8px; float: left; width: 100%; }
.steps fieldset.chips, .steps fieldset.seg, .steps fieldset.days, .steps fieldset.choice { background: none; border-radius: 0; padding: 0; }
.steps > fieldset.seg, .steps > fieldset.chips { background: var(--surface); border-radius: var(--radius-tile); padding: 16px; }
.pchip { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch-target); padding: 6px 14px 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); cursor: pointer; }
.pchip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; min-height: 0; padding: 0; }
.pchip .tick { display: none; stroke: currentColor; }
.pchip .icon { stroke: currentColor; }
.pchip:has(input:checked) { background: var(--pc-tint); color: var(--pc-text); border: 2px solid var(--pc); padding: 5px 13px 5px 11px; font-weight: 700; }
.pchip:has(input:checked) .tick { display: inline-block; }
.pchip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.pchip.all { --pc: var(--text); --pc-tint: var(--background); --pc-text: var(--text); }
.pchip.group { border-style: dashed; --pc: var(--text); --pc-tint: var(--background); --pc-text: var(--text); }
[data-theme="bw"] .pchip:has(input:checked) { background: var(--event-card); border-width: 3px; padding: 4px 12px 4px 10px; }
/* The Whole family checkbox stays ticked in the page while a person is chosen
   (the server ignores it then); it only looks selected when nobody else is. */
@supports selector(:has(a)) {
  fieldset.chips:has(.pchip:not(.all):not(.group) input:checked) .pchip.all:has(input:checked),
  fieldset.chips:has(.pchip.group input:checked) .pchip.all:has(input:checked) { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 6px 14px 6px 12px; font-weight: 400; }
  fieldset.chips:has(.pchip:not(.all):not(.group) input:checked) .pchip.all:has(input:checked) .tick,
  fieldset.chips:has(.pchip.group input:checked) .pchip.all:has(input:checked) .tick { display: none; }
}
.lead .pchip { cursor: default; }

/* Segmented control (2 to 4 short options), choice cards, weekday chips. */
fieldset.seg, fieldset.days, fieldset.choice { border: 0; margin: 0; padding: 0; min-width: 0; }
fieldset.seg { display: flex; flex-wrap: wrap; }
.seg label { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: 1 1 0; min-height: var(--touch-target); padding: 8px 10px; margin-left: -1px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); text-align: center; cursor: pointer; }
.seg label:first-of-type { border-radius: var(--radius-field) 0 0 var(--radius-field); margin-left: 0; }
.seg label:last-of-type { border-radius: 0 var(--radius-field) var(--radius-field) 0; }
.seg input, .days input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; min-height: 0; padding: 0; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; z-index: 1; }
.seg label:has(input:focus-visible), .days label:has(input:focus-visible), .choice label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
fieldset.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days label { position: relative; display: inline-flex; align-items: center; justify-content: center; width: var(--touch-target); height: var(--touch-target); border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--text); font-size: var(--fs-label); cursor: pointer; }
.days label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
fieldset.choice { display: grid; gap: 10px; }
.choice label { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; min-height: var(--touch-target); padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); color: var(--text); cursor: pointer; }
.choice input { grid-row: span 2; width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--accent); }
.choice b { font-size: var(--fs-event-title); }
.choice small { grid-column: 2; font-size: var(--fs-meta); color: var(--text-secondary); }
.choice label:has(input:checked) { border: 2px solid var(--accent); padding: 11px 13px; }
/* Dependent fields appear only when they apply; without :has they stay visible. */
@supports selector(:has(a)) {
  .steps:has(input[name="repeat"]) .when { display: none; }
  .steps:has(input[name="repeat"][value="once"]:checked) .when-once { display: grid; }
  .steps:has(input[name="repeat"][value="weekly"]:checked) .when-weekly { display: flex; }
}

/* "More options": fields with a good default sit in a disclosure. */
details.more { border-top: 1px solid var(--border); }
details.more > summary, details.danger > summary { display: flex; align-items: center; gap: 8px; min-height: var(--touch-target); cursor: pointer; list-style: none; }
details.more > summary { color: var(--accent); font-size: var(--fs-label-large); }
details.more > summary::-webkit-details-marker, details.danger > summary::-webkit-details-marker { display: none; }
details.more .chev { stroke: var(--accent); }
details.more[open] .chev { transform: rotate(90deg); }
details.more .sum { margin-left: auto; color: var(--text-secondary); font-size: var(--fs-meta); }
details.more > div { display: grid; gap: 12px; padding: 2px 0 10px; }

/* Destructive actions: only on a detail page, closed, explaining what happens. */
.cards details.danger { border-top: 0; margin-top: 4px; }
details.danger { border-top: 1px solid var(--border); margin-top: var(--gap-section); max-width: 560px; }
details.danger > summary { color: var(--error-text); font-weight: 700; }
details.danger p { margin: 0 0 10px; color: var(--text-secondary); font-size: var(--fs-label); }
details.danger form { margin: 0 0 10px; }

/* Empty state: what the thing is for, then the first action. */
.empty { display: grid; gap: 10px; justify-items: start; max-width: 560px; padding: 16px; margin: 0 0 20px; border: 1.5px dashed var(--border); border-radius: var(--radius-tile); }
.empty p { margin: 0; color: var(--text-secondary); }

/* Personal view (ticket 5.6; ADR 0015): one person's seven days and today's
   tasks. Touch targets are at least 44 px; the checkbox is larger. */
.pv { height: 100%; display: flex; flex-direction: column; gap: var(--gap-section); min-height: 0; }
.pv-header { display: flex; justify-content: space-between; align-items: center; flex: none; gap: var(--gap); }
.pv-header h1 { margin: 0; font-size: var(--fs-date); font-weight: var(--fw-date); display: flex; align-items: center; gap: 12px; }
.pv-back { display: inline-flex; align-items: center; min-height: var(--touch-target); padding: 8px 22px; border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); text-decoration: none; }
.pv-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--gap); }
.pv-days, .pv-tasks { background: var(--surface); border-radius: var(--radius-tile); padding: var(--pad-column); min-height: 0; overflow-y: auto; }
.pv-day { display: grid; gap: var(--gap-cards); padding-bottom: var(--gap-cards); }
.pv-day .lab, .pv-tasks .lab { font-size: var(--fs-label); color: var(--text-secondary); font-weight: 700; }
.pv-day .none { font-size: var(--fs-meta); color: var(--text-secondary); }
.pv-tasks ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--gap-cards); }
.pv-tasks form { margin: 0; }
.big-check { display: flex; align-items: center; gap: 14px; width: 100%; min-height: var(--touch-target); min-width: var(--touch-target); padding: 8px 4px; border: 0; background: none; color: var(--text); font: inherit; font-size: var(--fs-event-title); text-align: left; cursor: pointer; }
.big-check .box { flex: none; width: var(--touch-target); height: var(--touch-target); border: 3px solid var(--text); border-radius: var(--radius-card); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; line-height: 1; }
[data-done="true"] .big-check .title { text-decoration: line-through; color: var(--text-secondary); }
[data-done="true"] .big-check .box::after { content: "\\2713"; }

/* People page (ticket 5.21; ADR 0017). A person row: marker, name, role and
   the order buttons. The colour and marker choice shows every shape as its own
   preview, because in colour mode the plain marker is always a circle. */
.cards.people li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.people .who { display: flex; align-items: center; gap: 10px; flex: 1 1 140px; }
.people .who a { color: var(--text); text-decoration: none; }
.people .row { margin: 0 0 0 auto; flex-wrap: nowrap; }
.people .row form { margin: 0; }
.people .row .button { min-width: var(--touch-target); padding: 10px 16px; }
h1 .marker { margin-right: 4px; }
.pchip.shape { --pc: var(--text); --pc-tint: var(--background); --pc-text: var(--text); }
fieldset.look { display: flex; flex-wrap: wrap; gap: 8px; }
/* Taken options (ticket 76): a colour or marker another person wears is faded
   but stays readable (also in black and white); a pair that would be refused is
   disabled. The name of the person shows on hover and focus as a tooltip (the
   title attribute covers the mouse, the bubble covers keyboard focus;
   data-tip-open only lets the design preview show the bubble). */
fieldset.look .pchip.used { opacity: .6; }
fieldset.look .pchip:has(input:disabled) { opacity: .45; cursor: not-allowed; border-style: dashed; }
fieldset.look .pchip:has(input:checked) { opacity: 1; }
fieldset.look .pchip:has(input:focus-visible)::after, fieldset.look .pchip[data-tip-open]::after { content: attr(title); position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 2; white-space: nowrap; padding: 4px 10px; border-radius: var(--radius-field); background: var(--text); color: var(--background); font-size: var(--fs-meta); font-weight: 400; pointer-events: none; }
.marker.preview { background: var(--text); border: 0; border-radius: 0; }
[data-theme="bw"] .marker.preview { width: var(--marker-size); height: var(--marker-size); }
.marker.preview[data-shape="circle-filled"] { border-radius: 50%; }
.marker.preview[data-shape="circle-empty"] { border-radius: 50%; background: transparent; border: 2px solid var(--text); }
.marker.preview[data-shape="square-filled"] { border-radius: 0; }
.marker.preview[data-shape="square-empty"] { background: transparent; border: 2px solid var(--text); }
.marker.preview[data-shape="triangle-filled"] { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.marker.preview[data-shape="diamond-filled"] { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.marker.preview[data-shape="cross-filled"] { clip-path: polygon(34% 0, 66% 0, 66% 34%, 100% 34%, 100% 66%, 66% 66%, 66% 100%, 34% 100%, 34% 66%, 0 66%, 0 34%, 34% 34%); }
.marker.preview[data-shape="star-filled"] { clip-path: polygon(50% 0, 62% 36%, 100% 36%, 69% 58%, 81% 96%, 50% 73%, 19% 96%, 31% 58%, 0 36%, 38% 36%); }

/* Calendar screen (ticket 5.12; ADR 0011, 0015): the week as seven day
   columns with multi-day and all-day events as continuous bars above them.
   Narrow screens (a phone, a portrait tablet) stack the days and show the
   bars as items inside the days they cover. */
.wk-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap); margin: 0 0 var(--gap); }
.wk-nav { display: flex; flex-wrap: wrap; gap: var(--gap-cards); }
.wk-range { margin: 0 auto 0 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.wk-search { display: flex; flex-wrap: wrap; align-items: end; gap: var(--gap-cards); margin: 0 0 var(--gap-section); max-width: 560px; }
.wk-search .f { flex: 1 1 220px; }
.wk { display: grid; gap: 6px; margin: 0 0 var(--gap-section); }
.wk ol, .wk ul { list-style: none; margin: 0; padding: 0; }
.wk-heads, .wk-bars, .wk-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk-bars { row-gap: 4px; grid-auto-flow: row dense; } /* dense packing: a bar goes to the first row where its columns are free */
.c1 { grid-column-start: 1; } .c2 { grid-column-start: 2; } .c3 { grid-column-start: 3; } .c4 { grid-column-start: 4; } .c5 { grid-column-start: 5; } .c6 { grid-column-start: 6; } .c7 { grid-column-start: 7; }
.s1 { grid-column-end: span 1; } .s2 { grid-column-end: span 2; } .s3 { grid-column-end: span 3; } .s4 { grid-column-end: span 4; } .s5 { grid-column-end: span 5; } .s6 { grid-column-end: span 6; } .s7 { grid-column-end: span 7; }
.wk-heads li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; padding: 6px 8px; font-size: var(--fs-label); color: var(--text-secondary); min-width: 0; }
.wk-heads li[data-today], .wk-days li[data-today] .wk-dayname { color: var(--accent); }
.wk-heads li[data-today] { border-bottom: 3px solid var(--accent); }
.wk-heads .dn { font-weight: 700; color: var(--text); }
.wk-heads .hol { flex-basis: 100%; font-size: var(--fs-meta); background: var(--notice-bg); color: var(--notice-text); border-radius: var(--radius-field); padding: 1px 8px; overflow-wrap: anywhere; }
.wk-heads .add { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; min-width: var(--touch-target); min-height: var(--touch-target); margin-block: -10px; font-size: 22px; text-decoration: none; }
.bar, .ev { background: var(--pc-tint, var(--surface)); color: var(--pc-text, var(--text)); border-radius: var(--radius-card); padding: var(--pad-card); min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.bar { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.bar.before { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bar.after { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.wk-days > li { background: var(--surface); border-radius: var(--radius-card); padding: 6px; min-height: 180px; min-width: 0; display: grid; gap: var(--gap-cards); align-content: start; }
.wk-days .ev { background: var(--pc-tint, var(--background)); display: grid; gap: 2px; padding: 8px 8px; }
.wk-days ul { display: grid; gap: var(--gap-cards); }
.wk-dayname { display: none; margin: 0; font-size: var(--fs-person-name); }
.wk-allday { display: none !important; }
.wk-days .none { margin: 0; font-size: var(--fs-meta); color: var(--text-secondary); }
.ev .title, .bar .title { font-weight: var(--fw-event-title); font-size: var(--fs-label-large); color: inherit; text-decoration: none; }
.ev a.title:hover, .bar a.title:hover { text-decoration: underline; }
.ev .meta, .bar .meta { font-size: var(--fs-meta); }
.ev .icon, .bar .icon { stroke: currentColor; vertical-align: middle; }
.ev .who, .bar .who { display: block; font-size: var(--fs-meta); overflow-wrap: break-word; hyphens: manual; }
.who .nm { display: inline-block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[data-theme="bw"] .bar, [data-theme="bw"] .wk-days .ev { background: var(--event-card); color: var(--text); border: 1.5px solid var(--text); }
[data-theme="bw"] .wk-heads li[data-today] { border-bottom-width: 4px; }
.lock { color: var(--text-secondary); }
@media (max-width: 760px) {
  .wk-heads, .wk-bars { display: none; }
  .wk-days { grid-template-columns: minmax(0, 1fr); }
  .wk-days > li { min-height: 0; }
  .wk-dayname { display: block; }
  .wk-allday { display: grid !important; }
}
/* Date and time side by side. */
.dt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 9em); gap: var(--gap); align-items: start; }
.dt:not(:has(.when-timed)) { grid-template-columns: minmax(0, 1fr); }
.steps:has(input[name="all_day"]:checked) .dt { grid-template-columns: minmax(0, 1fr); }
/* An all-day event hides the times of the new-event form. */
.steps:has(input[name="all_day"]:checked) .when-timed { display: none; }
textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-field); padding: 10px 12px; }
/* Stars (ADR 0018): the balance chip in the personal view header, the value of a task. */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.chip.stars { font-variant-numeric: tabular-nums; }
.task-stars { margin-left: auto; flex: none; font-size: var(--fs-label); font-weight: 700; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.chip.stars::before { content: "\\2605\\00a0" / ""; }
.task-stars::before { content: "+" / ""; }
.task-stars::after { content: "\\00a0\\2605" / ""; }

/* Phones (ticket 5.13): the QR code a phone scans, and the offline view. */
.pair-qr { width: min(70vw, 280px); margin: 0 0 12px; color: var(--text); background: var(--surface); border-radius: var(--radius-tile); padding: 8px; }
.pair-qr svg { display: block; width: 100%; height: auto; }
html[data-offline] button:disabled, html[data-offline] input:disabled { opacity: .5; }

/* ---- Detail pages and calm overview rows (ticket 111, ADR 0017) ---- */
/* Detail pages and calm overview rows (ADR 0017). */
/* The frame's single column must be allowed to shrink: without minmax(0, 1fr) the
   one-line navigation sets the column to its full width and pushes the page past
   the right edge of a 375 px phone (left margin looks wrong, text does not wrap). */
.frame { grid-template-columns: minmax(0, 1fr); }
.frame > * { min-width: 0; }
/* Under 900 px the navigation wraps onto a second line instead of hiding
   screens past the right edge. */
@media (max-width: 899px) { .frame-nav ul { flex-wrap: wrap; overflow-x: visible; } }
.steps .card-row .t b { color: var(--text); }
h1 { overflow-wrap: anywhere; hyphens: auto; }
.back { gap: 6px; text-decoration: none; }
.back .icon { stroke: currentColor; }
main > .back { margin: 0 0 4px; }
.list-rows { list-style: none; padding: 0; margin: 0 0 var(--gap-section); display: grid; gap: var(--gap-cards); max-width: 560px; }
.list-rows a { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; background: var(--surface); border-radius: var(--radius-tile); color: var(--text); text-decoration: none; }
[data-theme="bw"] .list-rows a { border: 2px solid var(--text); }
.list-rows a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list-rows .t { display: grid; gap: 4px; min-width: 0; flex: 1; }
.list-rows b { font-size: var(--fs-event-title); font-weight: var(--fw-event-title); overflow-wrap: anywhere; }
.list-rows .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: var(--fs-label); color: var(--text-secondary); overflow-wrap: anywhere; }
.list-rows .chev { margin-left: auto; flex: none; stroke: var(--text-secondary); }
.rows-head { font-size: var(--fs-label-large); font-weight: 700; color: var(--text-secondary); margin: var(--gap-section) 0 var(--gap-cards); max-width: 560px; overflow-wrap: anywhere; }
.list-rows .who, .facts .who { display: inline-flex; align-items: center; gap: 6px; }
.flag { display: inline-flex; align-items: flex-start; gap: 6px; padding: 3px 8px; border-radius: var(--radius-field); font-size: var(--fs-label); font-weight: 600; justify-self: start; overflow-wrap: anywhere; }
.flag .icon { flex: none; stroke: currentColor; margin-top: 1px; }
.flag.problem { background: var(--error-bg); color: var(--error-text); }
.flag.warn { background: var(--notice-bg); color: var(--notice-text); }
[data-theme="bw"] .flag { background: none; color: var(--text); border: 2px solid var(--text); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 20px; margin: 0 0 var(--gap-section); padding: 16px; max-width: 560px; box-sizing: border-box; background: var(--surface); border-radius: var(--radius-tile); }
.facts dt { color: var(--text-secondary); font-size: var(--fs-label); padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.facts .button { margin-top: 4px; }
[data-theme="bw"] .facts { border: 2px solid var(--text); }
.steps .pair { display: flex; flex-wrap: wrap; align-items: start; gap: 10px var(--gap); }
.steps .pair .f { flex: 1 1 140px; min-width: 0; }
.steps .pair .f.invalid { flex-basis: 100%; }
@supports selector(:has(a)) {
  .steps fieldset:has(> .card-row .switch input:not(:checked)) > .when-on { display: none; }
  .calchoice:has(> .card-row .switch input:not(:checked)) > :not(.card-row):not(input) { display: none; }
}
.calchoice .status { font-size: var(--fs-meta); color: var(--text-secondary); }
details.danger { box-sizing: border-box; }
details.danger > summary .icon { stroke: var(--error-text); flex: none; }
details.danger[open] { background: var(--surface); border: 2px solid var(--error-text); border-radius: var(--radius-tile); padding: 0 16px 6px; }
details.danger ul { margin: 0 0 10px; padding-left: 20px; }
details.danger li { overflow-wrap: anywhere; }
details.danger .confirm { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 10px; }
details.danger .confirm form { margin: 0; }
details.danger .confirm a { display: inline-flex; align-items: center; min-height: var(--touch-target); font-weight: 600; }
.button { max-width: 100%; white-space: normal; text-align: center; }
.once { display: grid; gap: 12px; max-width: 560px; box-sizing: border-box; padding: 16px; margin: 0 0 var(--gap-section); background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius-tile); }
.once p { margin: 0; }
.once .secret { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: var(--fs-secret); font-weight: 600; letter-spacing: 0.04em; background: var(--background); border-radius: var(--radius-field); padding: 10px 12px; margin: 0; }
.once .row { display: flex; flex-wrap: wrap; gap: 10px; }
@media (max-width: 599px) {
  h1 { font-size: var(--fs-title-phone); }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 14px; }
  .facts dd { margin-bottom: 10px; }
  .facts dd:last-child { margin-bottom: 0; }
  .list-rows a { padding: 12px 14px; }
}
.once .facts { margin: 0; padding: 0; background: none; border: 0; max-width: none; }
.facts + .hint { max-width: 560px; }

/* Meal plan (ticket 6.3, ADR 0015): the week as one card per day, one row per
   mealtime in the order of the day. A row is the mealtime (icon and word) and
   the dish; a long dish wraps instead of being cut off. Two columns of days on
   a tablet, one on a phone; inside a narrow card the word sits above the dish. */
.weeknav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-cards); margin: 0 0 var(--gap); }
.weeknav .wk { display: grid; gap: 0; min-width: 9em; text-align: center; flex: 1 1 auto; }
.weeknav .wk strong { font-size: var(--fs-person-name); font-weight: var(--fw-person-name); }
.weeknav .wk span { font-size: var(--fs-label); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.wbtn { display: inline-flex; align-items: center; gap: 4px; min-height: var(--touch-target); padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); text-decoration: none; }
.wbtn .icon { stroke: currentColor; flex: none; }
.wbtn.this { color: var(--accent); border-color: var(--accent); font-weight: 600; }
[data-theme="bw"] .wbtn { border-width: 2px; }
.weeknav-row { display: flex; flex-wrap: wrap; gap: var(--gap-cards); align-items: center; justify-content: space-between; max-width: 1200px; }
@media (max-width: 599px) {
  .weeknav .wk { order: -1; flex-basis: 100%; text-align: left; }
  .weeknav .wbtn { flex: 1 1 auto; justify-content: center; }
}
.recipe { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 var(--gap-section); max-width: 720px; }
.recipe .icon { flex: none; stroke: var(--text-secondary); margin-top: 1px; }
.steps.wide { max-width: none; grid-template-columns: minmax(0, 1fr); }
.meal-week > * { min-width: 0; }
.meal-week { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: var(--gap); align-items: start; margin: 0 0 var(--gap-section); max-width: 1200px; }
.steps .meal-week { margin: 0; }
.meal-day { container-type: inline-size; background: var(--surface); border: 0; border-radius: var(--radius-tile); padding: 14px 16px 16px; display: grid; gap: 8px; min-width: 0; margin: 0; }
.meal-day legend, .meal-day h2 { float: left; width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: var(--fs-person-name); font-weight: var(--fw-person-name); margin: 0 0 4px; padding: 0; }
.meal-day .date { color: var(--text-secondary); font-weight: 400; font-size: var(--fs-label-large); font-variant-numeric: tabular-nums; }
.meal-day .today { align-self: center; font-size: var(--fs-meta); font-weight: 700; color: var(--accent-text); background: var(--accent); border-radius: var(--radius-chip); padding: 2px 10px; }
.meal-day[data-today] { outline: 3px solid var(--accent); outline-offset: -3px; }
.mrow { display: grid; grid-template-columns: 8.2em minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.mt { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-label-large); color: var(--text-secondary); min-width: 0; }
.mt .icon { flex: none; }
.mrow textarea { font: inherit; color: var(--text); width: 100%; min-height: var(--touch-target); padding: 10px 12px; line-height: 1.35; border: 1px solid var(--border); border-radius: var(--radius-field); background: var(--surface); resize: none; overflow: hidden; field-sizing: content; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.mrow textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mrow .ferr { grid-column: 2; }
.mrow.invalid textarea { border: 2px solid var(--error-text); }
[data-theme="bw"] .mrow textarea { border-color: var(--text); }
@container (max-width: 270px) {
  .mrow { grid-template-columns: minmax(0, 1fr); }
  .mrow .ferr { grid-column: 1; }
}
/* Read view (children, ADR 0015): the planned dishes, large; an unplanned
   mealtime is left out, an empty day says so in words. */
.meal-day dl { margin: 0; display: grid; gap: 10px; }
.meal-day dl > div { display: grid; gap: 2px; }
.meal-day dt { font-size: var(--fs-label); }
.meal-day dd { margin: 0 0 0 26px; font-size: var(--fs-event-title); font-weight: var(--fw-event-title); overflow-wrap: anywhere; }
.meal-day .none { margin: 0; color: var(--text-secondary); }
/* Save bar: the one primary action stays in reach while the week scrolls. */
.savebar { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; margin-top: -4px; background: var(--background); border-top: 1px solid var(--border); max-width: 1200px; }
.savebar .dirty { font-size: var(--fs-label); font-weight: 700; color: var(--text); }
.form-error { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 var(--gap); }
.form-error .icon { flex: none; stroke: var(--error-text); margin-top: 2px; }
.form-error a { color: var(--error-text); font-weight: 700; }
[data-theme="bw"] .form-error { border: 2px solid var(--text); }

/* Cut-off times (ADR 0016): one switch row per mealtime. Off = "Shown all
   day"; on = the time it disappears, in a time capsule. */
.cutoffs .cut { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--border); }
.cutoffs .cut:first-of-type { border-top: 0; }
.cutoffs .card-row .t b { display: inline-flex; align-items: center; gap: 6px; }
.cutoffs .at { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-left: 26px; font-size: var(--fs-label-large); color: var(--text); }
@supports selector(:has(a)) {
  .cut:has(.switch input:not(:checked)) .at { display: none; }
}

/* Time capsule (shared, every time field): the time in a pill as on iOS. On
   phones and tablets the system picker opens (input type="time"); on a computer
   and on displays a picker panel opens below it: hours and minutes as tap
   targets, no wheel, no scrolling (works with a mouse and on E-Ink). */
.tcap { font: inherit; font-size: var(--fs-event-title); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); min-height: var(--touch-target); padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--background); width: auto; }
.tcap::-webkit-calendar-picker-indicator { display: none; }
[data-theme="bw"] .tcap { border: 2px solid var(--text); background: var(--surface); }
.tcap[aria-expanded="true"] { border: 2px solid var(--accent); }
.tpick { display: grid; gap: 12px; width: min(100%, 340px); padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }
[data-theme="bw"] .tpick { border: 2px solid var(--text); }
.tpick .now { font-size: var(--fs-key-figure); font-weight: var(--fw-key-figure); font-variant-numeric: tabular-nums; }
.tpick fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.tpick .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.tpick legend { font-size: var(--fs-label); color: var(--text-secondary); padding: 0; margin: 0 0 6px; }
.tpick label { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: var(--touch-target); border: 1px solid var(--border); border-radius: var(--radius-field); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); font-variant-numeric: tabular-nums; cursor: pointer; }
.tpick input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; min-height: 0; padding: 0; }
.tpick label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
.tpick label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-theme="bw"] .tpick label { border-color: var(--text); }
.tpick .done { justify-self: end; }

/* Setup wizard (ticket #133, DESIGN.md "Setup wizard"). One centred column,
   no navigation, the progress of the four steps on top. Only existing tokens. */
.wizard { max-width: 600px; margin: 0 auto; display: grid; gap: var(--gap-section); align-content: start; }
.wizard main { display: grid; gap: var(--gap); min-width: 0; }
.wizard h1 { margin: 0; overflow-wrap: anywhere; hyphens: manual; }
.wizard h2 { margin: 0; font-size: var(--fs-person-name); font-weight: var(--fw-person-name); }
.wizard p, .wizard .lead { margin: 0; }
.wizard .notice, .wizard .error, .wizard .msg { max-width: none; margin: 0; }
.wizard .tile, .firststeps { background: var(--surface); border-radius: var(--radius-tile); padding: var(--pad-column); display: grid; gap: 12px; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px var(--gap); }
.actions .button { flex: 0 1 auto; }
ol.howto .s > .actions { justify-self: stretch; }
.link { display: inline-flex; align-items: center; min-height: var(--touch-target); color: var(--accent); font-weight: 600; }
.wizard ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.wiz-count { font-size: var(--fs-label); color: var(--text-secondary); text-align: right; }
@media (max-width: 599px) {
  .wizard h1 { font-size: var(--fs-key-figure); }
  .wizard .actions .button { flex: 1 1 100%; text-align: center; }
  .wizard details.more > summary { flex-wrap: wrap; }
}
/* Frame fix found while drawing #133: the navigation row must not widen the
   page on a 375 px phone (it scrolls sideways inside its own row instead). */
.frame { grid-template-columns: minmax(0, 1fr); }
.frame-nav { min-width: 0; }
@media (min-width: 900px) { .frame.has-nav { grid-template-columns: max-content minmax(0, 1fr); } }

/* .button as <button> keeps its look; disabled while the box works. */
.button[disabled] { cursor: default; background: var(--border); color: var(--text-secondary); }
[data-theme="bw"] .button[disabled] { background: var(--surface); color: var(--text); border: 2px dashed var(--text); }
[data-theme="bw"] .button.secondary { border-width: 2px; }

/* Progress through the four steps: a bar segment, number (tick when done) and
   name per step. The current step is bold; "Schritt n von 4" stands in words
   in the bar above. */
.wsteps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.wsteps li { display: grid; gap: 6px; align-content: start; font-size: var(--fs-meta); color: var(--text-secondary); min-width: 0; }
.wsteps li::before { content: ""; height: var(--progress-height); border-radius: var(--radius-progress); background: var(--border); }
.wsteps li[data-state="done"]::before, .wsteps li[aria-current="step"]::before { background: var(--accent); }
.wsteps li[aria-current="step"] { color: var(--text); font-weight: 700; }
.wsteps .lab { overflow-wrap: normal; hyphens: manual; }
.wsteps .n { font-variant-numeric: tabular-nums; margin-right: 4px; }
.wsteps .icon { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
[data-theme="bw"] .wsteps li::before { background: var(--progress-track); }
[data-theme="bw"] .wsteps li[data-state="done"]::before, [data-theme="bw"] .wsteps li[aria-current="step"]::before { background: var(--progress-fill); }
/* Under 600 px the numbers give way to the names (the bar above says "Schritt n von 4"). */
@media (max-width: 599px) { .wsteps .n { display: none; } }

/* Numbered how-to: a ringed number, a bold title, a sentence, then the
   action of that step. Used for every list of steps the family follows. */
ol.howto { list-style: none; counter-reset: howto; margin: 0; padding: 0; display: grid; }
ol.howto > li { counter-increment: howto; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
ol.howto > li:first-child { border-top: 0; padding-top: 2px; }
ol.howto > li:last-child { padding-bottom: 0; }
ol.howto > li::before { content: counter(howto); width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
ol.howto > li[data-done]::before { content: "\\2713"; background: var(--accent); color: var(--accent-text); }
ol.howto .s { display: grid; gap: 6px; min-width: 0; justify-items: start; }
ol.howto .s > b { font-size: var(--fs-event-title); font-weight: 700; }
ol.howto .s > p { margin: 0; color: var(--text); overflow-wrap: anywhere; }
ol.howto .s > .f, ol.howto .s > .checkline, ol.howto .s > .qr, ol.howto .s > details { justify-self: stretch; }
ol.howto .path { font-weight: 600; }
[data-theme="bw"] ol.howto > li::before { border-color: var(--text); color: var(--text); }
[data-theme="bw"] ol.howto > li[data-done]::before { background: var(--text); color: var(--surface); }

/* Device chooser on the trust page: links in the navigation chip look; the
   detected device is selected and named in words below. */
.devices { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.devices a { display: inline-flex; align-items: center; min-height: var(--touch-target); padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); text-decoration: none; }
.devices a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
[data-theme="bw"] .devices a { border-width: 2px; }
.detected { font-size: var(--fs-label); color: var(--text-secondary); }

/* Check line: the state of a check the page runs by itself, in words. */
.checkline { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--radius-card); padding: 10px 12px; margin: 0; }
.checkline .icon { flex: none; margin-top: 2px; stroke: currentColor; }
.checkline > span { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.checkline small { font-size: var(--fs-meta); }
.checkline[data-state="waiting"] { background: var(--notice-bg); color: var(--notice-text); }
.checkline[data-state="fail"] { background: var(--error-bg); color: var(--error-text); }
.checkline[data-state="ok"] { background: var(--surface); border: 1.5px solid var(--accent); color: var(--text); }
.checkline[data-state="ok"] .icon { stroke: var(--accent); }
[data-theme="bw"] .checkline[data-state="ok"], [data-theme="bw"] .checkline[data-state="fail"] { border: 2px solid var(--text); }
[data-theme="bw"] .checkline[data-state="fail"] { border-style: dashed; }

/* Fingerprint: 32 pairs in a fixed grid (8 by 4) so lines can be compared. */
.fp { display: grid; grid-template-columns: repeat(8, auto); justify-content: start; gap: 4px 10px; margin: 0; padding: 10px 12px; background: var(--background); border-radius: var(--radius-card); font-size: var(--fs-event-title); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
[data-theme="bw"] .fp { border: 2px solid var(--text); }
/* An address or name the family must read exactly. */
.addr { font-size: var(--fs-person-name); font-weight: 700; overflow-wrap: anywhere; }
.secret.grouped { word-spacing: 0.4em; letter-spacing: 0.06em; }

/* Recovery codes: numbered, two columns, readable and printable. */
ol.codes { list-style: none; counter-reset: code; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px var(--gap); }
ol.codes li { counter-increment: code; display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; background: var(--background); border-radius: var(--radius-card); font-size: var(--fs-person-name); font-weight: 700; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
ol.codes li::before { content: counter(code) "."; min-width: 1.6em; font-size: var(--fs-meta); font-weight: 400; color: var(--text-secondary); letter-spacing: 0; }
@media (max-width: 479px) { ol.codes { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
[data-theme="bw"] ol.codes li { border: 1.5px solid var(--text); background: var(--surface); }
.confirm { display: flex; align-items: flex-start; gap: 12px; min-height: var(--touch-target); font-size: var(--fs-body); color: var(--text); grid-template-columns: none; }
.confirm input { flex: none; width: 24px; height: 24px; min-height: 0; margin: 2px 0 0; accent-color: var(--accent); }

/* Password with a "Show" button in words. */
.pw { display: flex; gap: 8px; }
.pw input { flex: 1; min-width: 0; }
.pw .button { flex: none; padding: 10px 14px; }
.f .hint { margin: 0; }

/* First steps on the start page after the wizard. */
.firststeps { max-width: 600px; margin: 0 0 var(--gap-section); }
.firststeps h2 { margin: 0; font-size: var(--fs-person-name); }
.firststeps > p { margin: 0; color: var(--text-secondary); }
.firststeps .done-who { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--text-secondary); font-size: var(--fs-label); }
.firststeps .done-who span { display: inline-flex; align-items: center; gap: 6px; }
.firststeps .later { justify-self: start; font-size: var(--fs-label); }
[data-theme="bw"] .firststeps .done-who .marker { width: 12px; height: 12px; }

@media print {
  body { background: white; padding: 0; }
  .wizard > header, .wsteps, .no-print { display: none !important; }
  ol.codes li { border: 1px solid black; background: white; color: black; }
}

/* Added while building #133: a column of blocks inside the wizard's single
   column (the name check keeps its parts together for the page script), and the
   Actalis account keys that only show while Actalis is the chosen issuer. */
.stack { display: grid; gap: var(--gap); min-width: 0; }
.when-actalis { display: none; }
form:has(input[name="issuer"][value="actalis"]:checked) .when-actalis { display: grid; gap: 12px; }
.devnav { display: grid; gap: 6px; min-width: 0; }
button.link { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; cursor: pointer; }
.firststeps form { justify-self: start; margin: 0; }
/* A legend that only screen readers see must not stretch the page (the choice legend floats at full width). */
fieldset.choice legend.sr { float: none; width: 1px; margin: -1px; }
/* Tomorrow tile (ticket 6.7, design pass): label row with the reminder in
   words, a bin icon before each collection, the note set apart below. */
.fv-footer .tile-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 2px; }
.fv-footer .flag { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-text); border-radius: var(--radius-chip); padding: 3px 12px; font-size: var(--fs-label); font-weight: 700; }
.fv-footer .ln { overflow-wrap: anywhere; }
.fv-footer .ln.waste { display: flex; gap: 8px; align-items: flex-start; }
.fv-footer .ln.waste .icon { flex: none; margin-top: 1px; }
.fv-footer .tile.alert .ln.waste .icon { stroke: var(--notice-text); }
.fv-footer .ln.note { font-weight: 400; }
.fv-footer .ln.waste + .ln.note { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
.fv-footer .tile.alert .ln.waste + .ln.note { border-top-color: currentColor; }
.fv-footer .ln.note .day { font-weight: 700; margin-right: 6px; }
[data-theme="bw"] .fv-footer .tile.alert { border-width: 3px; padding: calc(var(--pad-column) - 3px); }
.quiet.night .night-item .ln.waste { display: flex; gap: 8px; align-items: center; font-size: var(--fs-event-title); font-weight: var(--fw-event-title); }
/* Day note card on Home (ticket 6.7, design pass). */
.note-day .hint { margin: 0; }
.note-day:not(:has(input[value="other"]:checked)) .other-day { display: none; }
.seg label small { display: block; font-size: var(--fs-meta); font-weight: 400; }
.seg label { flex-direction: column; }
.counter { font-size: var(--fs-meta); color: var(--text-secondary); justify-self: end; font-variant-numeric: tabular-nums; }
.cards a.note-row { color: var(--text); font-weight: 400; }
.note-row { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); min-height: var(--touch-target); }
.note-row .t { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.note-row .t b { font-size: var(--fs-label); color: var(--text-secondary); font-weight: 700; }
.note-row .go { margin-left: auto; flex: none; color: var(--accent); font-weight: 600; }
.waste-next { font-size: var(--fs-label); }
.waste-next b { font-weight: 700; }

/* Visually hidden text that screen readers still read; language switcher in the brand bar (ticket 134). */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.frame-tools { display: flex; align-items: center; gap: var(--gap-cards); margin-left: auto; }
.lang .flag { display: block; flex: none; width: 24px; height: 16px; object-fit: cover; border-radius: 3px; outline: 1px solid var(--border); outline-offset: -1px; }
[data-theme="bw"] .lang .flag { filter: grayscale(1); outline: 1px solid var(--text); }
.lang { position: relative; }
.lang > summary { display: flex; align-items: center; gap: 8px; min-height: var(--touch-target); min-width: var(--touch-target); padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-chip); background: var(--surface); color: var(--text); font-size: var(--fs-label-large); font-weight: 600; cursor: pointer; list-style: none; }
.lang > summary::-webkit-details-marker { display: none; }
.lang > summary .chev { flex: none; width: 14px; height: 14px; }
.lang[open] > summary { border-color: var(--accent); }
.lang[open] > summary .chev { transform: rotate(180deg); }
.lang > summary:focus-visible, .lang-menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-theme="bw"] .lang > summary { border: 2px solid var(--text); }
.lang-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 200px; margin: 0; padding: 6px; display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); }
[data-theme="bw"] .lang-menu { border: 2px solid var(--text); }
.lang-menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--touch-target); padding: 8px 12px; border: 0; border-radius: var(--radius-field); background: none; color: var(--text); font: inherit; font-size: var(--fs-body); text-align: left; cursor: pointer; }
.lang-menu button:hover { background: var(--background); }
[data-theme="bw"] .lang-menu button:hover { text-decoration: underline; }
/* Next to "Sign out" a narrow bar drops the visible name; flag and chevron stay and the name stays in the accessible name. */
@media (max-width: 479px) {
  .frame-tools:has(.signout) .lang-name { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
}

/* ---- Design pass 6.6: tasks on the display (ticket 6.6, preview-37) ---- */
/* Family view: progress block anchored at the column bottom (ADR 0016), in words, tappable. */
.pbar { flex: none; display: grid; gap: 6px; margin-top: var(--gap-cards); padding-top: var(--gap-cards); border-top: 1px solid var(--border); min-height: var(--touch-target); align-content: center; color: inherit; text-decoration: none; }
.pbar .progress { width: 100%; }
.pbar .count { display: flex; align-items: flex-start; gap: 6px; font-size: var(--fs-label); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pbar[data-all-done] .count { font-weight: 700; }
.pbar .icon, .tasks-head .icon { flex: none; stroke: var(--pc); stroke-width: 2.4; }
[data-theme="bw"] .pbar .icon, [data-theme="bw"] .tasks-head .icon { stroke: var(--text); }
/* Long German words wrap inside event cards instead of being cut at the column edge. */
.fv .events > *, .pv-day > * { min-width: 0; }
.event .title { overflow-wrap: anywhere; hyphens: auto; }

/* Personal view: tasks first and as wide as the week, progress in words on top. */
.pv-header { justify-content: flex-start; flex-wrap: wrap; }
.pv-header h1 { margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.pv-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.pv-tasks { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.tasks-head { flex: none; display: grid; gap: 8px; padding: var(--pad-column) var(--pad-column) 12px; border-bottom: 1px solid var(--border); }
.tasks-head .count { display: flex; gap: 8px; align-items: center; font-size: var(--fs-key-figure); font-weight: var(--fw-key-figure); font-variant-numeric: tabular-nums; }
.tasks-head .msg { margin: 0; max-width: none; font-size: var(--fs-event-title); font-weight: 700; }
.tasks-head .msg .icon { stroke: var(--accent); }
.pv-tasks .list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px var(--pad-column) var(--pad-column); display: grid; gap: 14px; align-content: start; }
.pv-tasks .part { display: grid; gap: var(--gap-cards); }
.pv-tasks .part > .lab { font-size: var(--fs-label); color: var(--text-secondary); font-weight: 700; }
.pv-tasks ul { gap: var(--gap-cards); }
.pv-tasks li { display: grid; gap: 6px; }
.big-check { gap: 12px; min-height: 64px; padding: 8px 12px 8px 8px; border: 1.5px solid var(--border); border-radius: var(--radius-card); background: var(--surface); font-weight: 600; }
[data-theme="bw"] .big-check { border: 2px solid var(--text); }
.big-check .box { border-radius: var(--radius-field); }
.big-check .box svg { display: none; }
[data-done="true"] .big-check .box { background: var(--pc); border-color: var(--pc); }
[data-theme="bw"] [data-done="true"] .big-check .box { background: var(--text); border-color: var(--text); }
[data-done="true"] .big-check .box::after { content: none; }
[data-done="true"] .big-check .box svg { display: block; stroke: var(--surface); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.big-check .emoji { flex: none; width: 36px; font-size: 30px; line-height: 1; text-align: center; }
.big-check .title { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
[data-done="true"] .big-check .title { font-weight: 400; }
[data-done="true"] .big-check { background: transparent; }
.pv-tasks .ferr { margin-left: 4px; }
.pv-body[data-no-tasks] { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.pv-body[data-no-tasks] .tasks-head { border-bottom: 0; padding-bottom: 0; }
.pv-tasks .none { margin: 0; padding: 16px; border: 1.5px dashed var(--border); border-radius: var(--radius-card); color: var(--text-secondary); }
@media (max-width: 599px) {
  .pv-header h1 { font-size: var(--fs-key-figure); }
  .pv-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); }
}

/* ---- Design pass by Opus on #133 (product owner feedback 15/11/2026) ---- */
/* The language switcher (.vh, .frame-tools, .lang) comes from #134 and is not repeated here. */
/* Navigation wraps on phones, nothing is cut (approved in #86 design pass 2). */
.frame-nav ul { flex-wrap: wrap; overflow-x: visible; }
/* The step count leaves the brand bar (room for the switcher) and heads the progress. */
.wsteps .wiz-count { margin: 0 0 8px; text-align: left; font-size: var(--fs-label); color: var(--text-secondary); }
/* Links to outside pages: always an underlined link with the "opens elsewhere" icon. */
a.ext { color: var(--accent); font-weight: 600; text-decoration: underline; white-space: normal; }
a.ext .icon { width: 14px; height: 14px; margin-left: 3px; vertical-align: -1px; }
.copyrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.copyrow .addr { margin: 0; min-width: 0; }
/* Home location picker: suggestions while typing, confirmed state, not found. Data source open (#86). */
.place-pick { display: grid; gap: 6px; min-width: 0; }
.place-pick .lab { margin: 0; font-size: var(--fs-label); color: var(--text-secondary); }
.place-q { margin: 0; font-size: var(--fs-label); color: var(--text); font-weight: 700; }
.place-list { list-style: none; margin: 0; padding: 4px; display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); }
.place-list li { display: grid; gap: 1px; min-height: var(--touch-target); align-content: center; padding: 6px 10px; border-radius: var(--radius-field); cursor: pointer; min-width: 0; }
.place-list li b { font-size: var(--fs-event-title); font-weight: 600; overflow-wrap: anywhere; }
.place-list li small { font-size: var(--fs-meta); color: var(--text-secondary); overflow-wrap: anywhere; }
.place-list li[aria-selected="true"] { background: var(--background); outline: 2px solid var(--accent); outline-offset: -2px; }
[data-theme="bw"] .place-list { border: 2px solid var(--text); }
[data-theme="bw"] .place-list li[aria-selected="true"] { outline-color: var(--text); text-decoration: underline; }
.place-status { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius-card); min-width: 0; }
.place-status > div { display: grid; gap: 2px; min-width: 0; flex: 1; }
.place-status b { font-size: var(--fs-event-title); font-weight: 700; overflow-wrap: anywhere; }
.place-status small { font-size: var(--fs-meta); color: var(--text-secondary); overflow-wrap: anywhere; }
.place-status .icon { flex: none; align-self: flex-start; margin-top: 2px; }
.place-status.ok { border: 1.5px solid var(--accent); background: var(--surface); }
.place-status .button { flex: none; }
[data-theme="bw"] .place-status.ok { border: 2px solid var(--text); }
.place-pick.invalid input { border: 2px solid var(--error-text); }
/* First steps: six steps, state in words, skippable. */
.firststeps .fs-progress { display: grid; gap: 6px; }
.fs-bar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.fs-bar span { height: var(--progress-height); border-radius: var(--radius-progress); background: var(--border); }
.fs-bar span[data-state="done"] { background: var(--accent); }
.fs-bar span[data-state="skipped"] { background: none; border: 1.5px dashed var(--text-secondary); }
[data-theme="bw"] .fs-bar span { background: var(--progress-track); }
[data-theme="bw"] .fs-bar span[data-state="done"] { background: var(--progress-fill); }
[data-theme="bw"] .fs-bar span[data-state="skipped"] { background: none; border: 2px dashed var(--text); }
.fs-count { font-size: var(--fs-label); font-weight: 700; }
.fs-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0; }
.fs-head b { font-size: var(--fs-event-title); font-weight: 700; }
.fs-state { font-size: var(--fs-meta); font-weight: 600; padding: 1px 8px; border-radius: var(--radius-chip); border: 1px solid var(--border); color: var(--text-secondary); }
.fs-state[data-state="done"] { border-color: var(--accent); color: var(--accent); }
.fs-state[data-state="skipped"] { border-style: dashed; }
[data-theme="bw"] .fs-state { border: 1.5px solid var(--text); color: var(--text); }
[data-theme="bw"] .fs-state[data-state="skipped"] { border-style: dashed; }
ol.howto > li[data-skipped]::before { content: "\\2013"; border-style: dashed; border-color: var(--text-secondary); color: var(--text-secondary); }
[data-theme="bw"] ol.howto > li[data-skipped]::before { border-color: var(--text); color: var(--text); }
.fs-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
.fs-acts form { margin: 0; flex-basis: 100%; }
.link.quiet { color: var(--text-secondary); font-weight: 400; text-decoration: underline; }
.fs-foot { display: grid; gap: 2px; justify-items: start; border-top: 1px solid var(--border); padding-top: 6px; }
.fs-foot form { margin: 0; }
.fs-foot .hint { margin: 0; }
.firststeps.done .fs-foot { border: 0; gap: 8px; }
.firststeps .msg { margin: 0; }
.who-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.who-chips li { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border: 1px solid var(--border); border-radius: var(--radius-chip); font-size: var(--fs-label); overflow-wrap: anywhere; }
[data-theme="bw"] .who-chips li { border: 1.5px solid var(--text); }
.fs-sub, .fs-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--fs-label); }
.fs-sub li { display: flex; gap: 8px; align-items: flex-start; }
.fs-sub .icon { flex: none; width: 18px; height: 18px; margin-top: 1px; }
.fs-sub .dot { flex: none; width: 12px; height: 12px; margin: 4px 3px 0; border-radius: 50%; border: 2px solid var(--text-secondary); }
[data-theme="bw"] .fs-sub .dot { border-color: var(--text); }
.fs-rows li { display: flex; flex-wrap: wrap; gap: 0 6px; padding: 4px 0; border-top: 1px solid var(--border); }
.fs-rows li:first-child { border-top: 0; }
.fs-rows .src { color: var(--text-secondary); }
.fs-rows .for { flex-basis: 100%; color: var(--text-secondary); }
/* Home: today. */
.today { background: var(--surface); border-radius: var(--radius-tile); padding: var(--pad-column); display: grid; gap: 12px; max-width: 900px; margin: 0 0 var(--gap-section); min-width: 0; }
.today-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 12px; }
.today-head h2 { margin: 0; font-size: var(--fs-person-name); }
.today .empty { margin: 0; max-width: none; }
.today-fam, .today-people, .today .tev { list-style: none; margin: 0; padding: 0; }
.today-fam li { display: flex; gap: 10px; padding: var(--pad-card); border-radius: var(--radius-card); background: var(--notice-bg); color: var(--notice-text); }
.today-fam li > span:last-child { display: grid; min-width: 0; }
.today .who { font-size: var(--fs-meta); }
.today .tm { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.2em; }
.today-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--gap-cards); }
.today-people > li { display: grid; gap: 6px; align-content: start; padding: 10px 12px; border-radius: var(--radius-card); background: var(--pc-tint); color: var(--pc-text); min-width: 0; }
[data-theme="bw"] .today-people > li { background: var(--surface); border: 2px solid var(--text); }
.today-people h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: var(--fs-event-title); overflow-wrap: anywhere; }
.today .tev { display: grid; gap: 2px; font-size: var(--fs-label); }
.today-people .progress, .today.child .progress { background: var(--surface); }
[data-theme="bw"] .today-people .progress, [data-theme="bw"] .today.child .progress { background: var(--progress-track); }
.today .tev li { display: flex; gap: 8px; overflow-wrap: anywhere; }
.today .tev .none { color: inherit; opacity: 1; font-style: italic; }
.today .pbar { display: grid; gap: 4px; color: inherit; text-decoration: none; min-height: var(--touch-target); align-content: center; }
.today .pbar .count { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: var(--fs-label); font-weight: 600; }
.icon.star { width: 16px; height: 16px; fill: currentColor; stroke: currentColor; stroke-width: 1; }
.today-meal { margin: 0; font-size: var(--fs-label); }
.child-h { display: flex; align-items: center; gap: 12px; }
.child-h .marker { width: 28px; height: 28px; }
.today.child { max-width: 600px; background: var(--pc-tint); color: var(--pc-text); }
[data-theme="bw"] .today.child { background: var(--surface); border: 2px solid var(--text); }
.today.child h3 { margin: 6px 0 0; font-size: var(--fs-event-title); }
.today .tev.big { font-size: var(--fs-body); gap: 6px; }
.ctasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ctasks li { display: flex; align-items: center; gap: 12px; min-height: var(--touch-target); padding: 4px 10px; border-radius: var(--radius-card); background: var(--surface); color: var(--text); font-size: var(--fs-event-title); }
.ctasks .box { flex: none; width: 28px; height: 28px; border: 2px solid var(--text); border-radius: 8px; display: grid; place-items: center; }
.ctasks li[data-done] .box { background: var(--text); }
.ctasks li[data-done] .box .icon { stroke: var(--surface); }
.ctasks li[data-done] .t { text-decoration: line-through; color: var(--text-secondary); }
.ctasks .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ctasks .stars { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; }
/* A hub row that posts (Settings: show the first steps again) looks like the link rows. */
button.hub-row { width: 100%; padding: 0; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
/* ---- Invite a second parent (ticket 145) ---- */
/* The person an invitation is for: marker and name as on the display. */
.invitee, .steps p.invitee { display: flex; align-items: center; gap: 10px; margin: 0; font-size: var(--fs-person-name); font-weight: var(--fw-person-name); overflow-wrap: anywhere; }
.invitee .marker { flex: none; }
/* Validity line: clock icon and the date in words, never a countdown. */
.valid { display: flex; align-items: flex-start; gap: 8px; margin: 0; }
.valid .icon { flex: none; margin-top: 2px; stroke: var(--accent); }
[data-theme="bw"] .valid .icon { stroke: var(--text); }
/* A link shown once: wraps anywhere so a long address fits 375 px. */
.once .secret.link { overflow-wrap: anywhere; word-break: break-all; font-size: var(--fs-label-large); letter-spacing: 0; }
.once .pair-qr { margin: 0; justify-self: start; }
[data-theme="bw"] .once .pair-qr { border: 2px solid var(--text); }
/* Neutral state pill (open invitation), next to .flag.warn and .flag.problem. */
.flag.open { background: var(--background); color: var(--text); border: 1px solid var(--border); }
/* The wizard step bar with two or three steps (invitation) instead of four. */
