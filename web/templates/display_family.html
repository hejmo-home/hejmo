{{template "head" (dict "Lang" .Lang "Title" (t "display.family.title"))}}
  <div class="display family" data-display data-state="paired" data-display-type="{{.Display.Type}}" data-poll-seconds="{{.PollSeconds}}">
    <h1>{{.Display.Name}}</h1>
    {{if .Display.Room}}<p class="hint">{{.Display.Room}}</p>{{end}}
    <p class="lead">{{t "display.family.placeholder"}}</p>
  </div>
  <script src="/static/display.js" defer></script>
{{template "foot"}}
